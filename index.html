  if(e.stun>0)return;
  {const S=DATA.enemies[e.type].spit;
    if(S&&d>S.range[0]&&d<S.range[1]&&e.cd3<=0&&lineOfSight(w.map,e.x,e.y,p.x,p.y)&&RNG.next()<0.5){
      e.state='windup';e.action='spit';e.timer=S.wind;e.atkAngle=ang;e.facing=ang;e.cd3=rand(S.cd[0],S.cd[1]);
      addTelegraph(w,{shape:'rect',x:e.x,y:e.y,angle:ang,len:S.range[1],width:16,total:S.wind,dmg:0,owner:e.id,small:true});
      return;
    }}
  if(d>90&&d<300&&e.cd2<=0&&lineOfSight(w.map,e.x,e.y,p.x,p.y)){
    e.state='windup';e.action='dash';e.timer=D.wind;e.atkAngle=ang;e.facing=ang;
    addTelegraph(w,{shape:'rect',x:e.x,y:e.y,angle:ang,len:D.dist+e.r,width:e.r*2+6,total:D.wind,dmg:0,owner:e.id,small:true});
    return;
  }
  if(d<e.r+p.r+16&&e.cd<=0&&!D.dashOnly){
    e.state='windup';e.action='bite';e.timer=0.35;e.atkAngle=ang;e.facing=ang;
    addTelegraph(w,{shape:'sector',x:e.x,y:e.y,angle:ang,r:e.r+30,arc:Math.PI*0.5,total:0.35,dmg:e.atk,owner:e.id,small:true});
    return;
  }
  if(d>e.r+p.r+6)steerTo(w,e,p,e.speed,dt);else e.facing=ang;
}
/** グリーンスライム：跳ねながら近づく。近いと大きく跳び、着地点の周りを攻撃する */
function updateSlime(w,e,p,d,dt){
  if(e.state==='hop'){
    e.timer-=dt;const k=clamp(1-e.timer/e.hopT,0,1);e.z=Math.sin(Math.PI*k)*(e.attackHop?30:14);
    moveEntity(w.map,e,Math.cos(e.atkAngle)*e.hopSp*dt,Math.sin(e.atkAngle)*e.hopSp*dt);
    if(e.timer<=0){e.z=0;e.state='rest';e.timer=e.attackHop?0.9:rand(0.35,0.6);if(e.attackHop)emit(w,{type:'slimeLand',x:e.x,y:e.y});}
    return;
  }
  if(e.state==='rest'){e.timer-=dt;if(e.timer>0)return;}
  e.state='chase';
  if(e.stun>0)return;
  const los=lineOfSight(w.map,e.x,e.y,p.x,p.y);
  if(los&&d<150&&e.cd<=0){
    const dist=Math.min(d,110),ang=Math.atan2(p.y-e.y,p.x-e.x);
    e.state='hop';e.attackHop=true;e.hopT=0.7;e.timer=e.hopT;e.hopSp=dist/e.hopT;e.atkAngle=ang;e.facing=ang;e.cd=rand(1.6,2.2);
    addTelegraph(w,{shape:'circle',x:e.x+Math.cos(ang)*dist,y:e.y+Math.sin(ang)*dist,r:58,total:e.hopT+0.05,dmg:e.atk,owner:e.id,small:true});
    return;
  }
  const ang=steerAngle(w,e,p);
  e.state='hop';e.attackHop=false;e.hopT=0.45;e.timer=e.hopT;e.hopSp=e.speed;e.atkAngle=ang;e.facing=ang;
}
/** 森甲虫：ゆっくり向きを変える。正面に捉えたら殴る（正面からの攻撃は弾く） */
function updateBeetle(w,e,p,d,dt){
  const def=DATA.enemies[e.type],ang=Math.atan2(p.y-e.y,p.x-e.x);
  const turnTo=a=>{const df=angDiff(a,e.facing),mx=def.turn*dt;e.facing+=clamp(df,-mx,mx);};
  if(e.state==='windup'){e.timer-=dt;if(e.timer<=0){e.state='recover';e.timer=0.6;e.cd=rand(1.4,1.8);}return;}
  if(e.state==='recover'){e.timer-=dt;if(e.timer<=0)e.state='chase';return;}
  e.state='chase';
  if(e.stun>0)return;
  if(d<e.r+p.r+22&&e.cd<=0&&Math.abs(angDiff(ang,e.facing))<0.5){
    e.state='windup';e.timer=0.5;e.atkAngle=e.facing;
    addTelegraph(w,{shape:'sector',x:e.x,y:e.y,angle:e.facing,r:e.r+38,arc:Math.PI*0.55,total:0.5,dmg:e.atk,owner:e.id,small:true});
    return;
  }
  const sa=d<e.r+p.r+20?ang:steerAngle(w,e,p);
  turnTo(sa);
  if(d>e.r+p.r+6){const k=Math.max(0,Math.cos(angDiff(sa,e.facing)));moveEntity(w.map,e,Math.cos(e.facing)*e.speed*k*dt,Math.sin(e.facing)*e.speed*k*dt);}
}
/** 毒胞子キノコ：ほとんど動かない。近づくと周りに毒の雲を出す */
function updateSpore(w,e,p,d,dt){
  const S=DATA.enemies[e.type].spore;

    e.timer-=dt;

      w.hazards.push({id:w.nextId++,kind:'poison',x:e.x,y:e.y,r:S.r,t:0,life:S.life,tick:S.tick,acc:0,dmg:e.atk});
      emit(w,{type:'spore',x:e.x,y:e.y,r:S.r});

  if(e.stun>0)return;

  }
  if(d>S.near)steerTo(w,e,p,e.speed,dt); // ゆっくり這い寄る
}
/** 迷い霊：ふわふわと追いかけ、触れた相手の動きを鈍らせる */
function updateGhost(w,e,p,d,dt){

    return;
  }
  if(e.state==='recover'){e.timer-=dt;if(e.timer<=0)e.state='chase';return;}

  if(e.stun>0)return;
  if(d<e.r+p.r+20&&e.cd<=0){
    e.state='windup';e.timer=0.45;e.atkAngle=ang;e.facing=ang;
    addTelegraph(w,{shape:'circle',x:e.x+Math.cos(ang)*10,y:e.y+Math.sin(ang)*10,r:e.r+26,total:0.45,dmg:e.atk,owner:e.id,small:true,slow:def.slow,kind:'curse'});

  }
  // 横にゆらゆらしながら近づく

}
/** 呪われた騎士：大剣で広く薙ぎ払う／鋭く突く。振り終わりに大きな隙 */
function updateKnight(w,e,p,d,dt){

/** 墓地の呪術師：距離を取り、周りの魔物を強化したり、倒れた魔物をよみがえらせたりする。詠唱中に攻撃を当てると中断 */
function updateShaman(w,e,p,d,dt){
  const def=DATA.enemies[e.type],ang=Math.atan2(p.y-e.y,p.x-e.x);
  if(e.state==='channel'){
    if(e.stun>0){ // 詠唱の中断
      e.state='move';e.cast=null;w.telegraphs=w.telegraphs.filter(t=>t.owner!==e.id);
      e.cd2=Math.max(e.cd2,2.5);e.cd3=Math.max(e.cd3,2.5);
      emit(w,{type:'interrupt',x:e.x,y:e.y-e.r-10});
      return;
    }
    e.timer-=dt;
    if(e.timer<=0){
      const c=e.cast;e.cast=null;e.state='recover';e.timer=0.5;
      if(c&&c.kind==='buff'){
        const E=def.empower;
        for(const o of w.enemies){
          if(o.dead||o.boss||o===e||DATA.enemies[o.type].ai==='shaman'||Math.hypot(o.x-e.x,o.y-e.y)>E.range)continue;
          o.empowerT=E.time;o.atk=o.baseAtk*E.atk;o.speed=o.baseSpeed*E.speed;
          emit(w,{type:'empower',x:o.x,y:o.y-o.r-8});
        }
        e.cd2=rand(E.cd[0],E.cd[1]);
      }else if(c&&c.kind==='revive'&&!c.corpse.used){
        const R=def.revive,o=spawnEnemy(w,c.corpse.type,c.corpse.x,c.corpse.y,{elite:c.corpse.elite,revived:true});
        o.hp=Math.round(o.maxHp*R.hp);o.aggro=true;c.corpse.used=true;e.revives=(e.revives||0)+1;w.quest.total++;
        emit(w,{type:'revived',x:o.x,y:o.y,name:DATA.enemies[o.type].name});
        e.cd3=rand(R.cd[0],R.cd[1]);
      }
    }
    return;
  }
  if(e.state==='recover'){e.timer-=dt;if(e.timer<=0)e.state='move';return;}
  e.state='move';e.facing=ang;
  if(e.stun>0)return;
  // 詠唱：よみがえらせる亡骸があれば優先、なければ近くの仲間を強化
  const R=def.revive,E=def.empower;
  if(e.cd3<=0&&(e.revives||0)<R.max){
    const c=w.corpses.find(c=>!c.used&&w.time-c.t<R.age&&Math.hypot(c.x-e.x,c.y-e.y)<R.range);
    if(c){
      e.state='channel';e.timer=1.4;e.cast={kind:'revive',corpse:c};
      addTelegraph(w,{shape:'circle',x:c.x,y:c.y,r:26,total:1.4,dmg:0,owner:e.id,kind:'curse'});
      return;
    }
  }
  if(e.cd2<=0&&w.enemies.some(o=>!o.dead&&!o.boss&&o!==e&&!(o.empowerT>0)&&DATA.enemies[o.type].ai!=='shaman'&&Math.hypot(o.x-e.x,o.y-e.y)<E.range)){
    e.state='channel';e.timer=1.0;e.cast={kind:'buff'};
    addTelegraph(w,{shape:'circle',x:e.x,y:e.y,r:E.range,total:1.0,dmg:0,owner:e.id,kind:'curse'});
    return;
  }
  // 距離を保って立ち回る
  const los=lineOfSight(w.map,e.x,e.y,p.x,p.y);
  if(!los||d>300)steerTo(w,e,p,e.speed,dt);
  else if(d<200){moveEntity(w.map,e,-Math.cos(ang)*e.speed*dt,-Math.sin(ang)*e.speed*dt);e.facing=ang;}
  else{
    const sa=ang+Math.PI/2*e.strafeDir;
    moveEntity(w.map,e,Math.cos(sa)*e.speed*0.5*dt,Math.sin(sa)*e.speed*0.5*dt);e.facing=ang;
    e.strafeT-=dt;if(e.strafeT<=0){e.strafeDir*=-1;e.strafeT=rand(1,2);}
  }
}
/** 冥府の骨竜：薙ぎ払い・霊魂弾（追尾）・咆哮・骸骨召喚。体力が半分を切ると覚醒して激しくなる */
function updateDragon(w,e,p,dt){
  const def=DATA.enemies[e.type];
  for(const k in e.cds)e.cds[k]-=dt;
  if(e.state==='sleep')return;
  if(e.state==='stunned'){e.timer-=dt;if(e.timer<=0){e.state='recover';e.timer=0.3;}return;}
  if(e.phase===1&&e.hp<=e.maxHp*0.5&&e.state!=='roar'){
    e.phase=2;e.state='roar';e.timer=1.4;e.speed=def.speed*1.2;
    w.telegraphs=w.telegraphs.filter(t=>t.owner!==e.id);
    emit(w,{type:'enrage',x:e.x,y:e.y,name:def.name,awaken:true});
    return;
  }
  const ph2=e.phase===2,dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy),ang=Math.atan2(dy,dx);
  switch(e.state){
    case 'roar':e.timer-=dt;if(e.timer<=0)e.state='chase';break;
    case 'chase':{
      e.facing=ang;
      const reach=e.r+p.r+70,live=w.enemies.filter(o=>o.summoned&&!o.dead).length;
      if(d<reach&&e.cds.sweep<=0){
        e.state='windup';e.action='sweep';e.timer=ph2?0.65:0.9;e.atkAngle=ang;
        addTelegraph(w,{shape:'sector',x:e.x,y:e.y,angle:ang,r:e.r+120,arc:Math.PI*1.22,total:e.timer,dmg:e.atk*1.1,owner:e.id});
      }else if(d<230&&e.cds.roar<=0){
        e.state='windup';e.action='roar';e.timer=ph2?0.8:1.0;
        addTelegraph(w,{shape:'circle',x:e.x,y:e.y,r:210,total:e.timer,dmg:e.atk*0.85,owner:e.id});
      }else if(e.cds.summon<=0&&live<(ph2?5:3)){
        e.state='windup';e.action='summon';e.timer=1.3;e.spots=[];
        const R=w.map.rooms.boss;
        for(let i=0,n=ph2?3:2;i<n;i++){
          for(let t=0;t<20;t++){
            const a=rand(0,TAU),rr=rand(90,170),x=p.x+Math.cos(a)*rr,y=p.y+Math.sin(a)*rr;
            if(R&&(x<(R[0]+1)*TILE||x>(R[2])*TILE||y<(R[1]+1)*TILE||y>R[3]*TILE))continue;
            if(circleHitsWall(w.map,x,y,16))continue;
            e.spots.push({x,y});
            addTelegraph(w,{shape:'circle',x,y,r:30,total:1.3,dmg:e.atk*0.5,owner:e.id,kind:'curse',small:true});
            break;
          }
        }
      }else if(e.cds.orb<=0&&d>110&&lineOfSight(w.map,e.x,e.y,p.x,p.y)){
        e.state='windup';e.action='orb';e.timer=0.75;e.atkAngle=ang;
      }else if(d>reach*0.7)steerTo(w,e,p,e.speed,dt);
      break;
    }
    case 'windup':
      e.timer-=dt;
      if(e.action==='orb')e.facing=e.atkAngle=ang;
      if(e.timer<=0){
        e.state='recover';e.timer=ph2?0.5:0.75;
        if(e.action==='sweep'){e.cds.sweep=ph2?1.6:2.4;moveEntity(w.map,e,Math.cos(e.atkAngle)*14,Math.sin(e.atkAngle)*14);}
        else if(e.action==='roar'){e.cds.roar=ph2?6:9;emit(w,{type:'roarWave',x:e.x,y:e.y,r:210});}
        else if(e.action==='summon'){
          for(const s of e.spots||[]){const o=spawnEnemy(w,def.summon,s.x,s.y,{summoned:true});o.aggro=true;o.cd=0.8;emit(w,{type:'summon',x:s.x,y:s.y});}
          e.cds.summon=ph2?11:15;
        }else if(e.action==='orb'){
          const n=ph2?5:3,spread=ph2?0.9:0.6;
          for(let i=0;i<n;i++){
            const a=e.atkAngle+(n>1?(i/(n-1)-0.5)*spread:0),sp=175;
            w.projectiles.push({id:w.nextId++,kind:'soul',owner:'enemy',x:e.x+Math.cos(a)*(e.r+6),y:e.y+Math.sin(a)*(e.r+6),
              vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,speed:sp,r:9,life:5,dmg:e.atk*0.7,angle:a,homing:1.7,el:bossAtkEl(e,'orb'),src:e.type,inflict:bossAtkSt(e,'orb')});
          }
          emit(w,{type:'shoot',x:e.x,y:e.y});
          e.cds.orb=ph2?3.2:4.5;
        }
      }
      break;
    case 'recover':e.timer-=dt;if(e.timer<=0)e.state='chase';break;
  }
}

/** 炎翼竜：扇状の火炎ブレス、または直線の滑空。空を旋回しながら距離を保つ */
function updateWyvern(w,e,p,d,dt){
  const D=DATA.enemies[e.type],ang=Math.atan2(p.y-e.y,p.x-e.x);
  if(e.state==='windup'){
    e.timer-=dt;e.facing=e.atkAngle;
    if(e.timer<=0){
      if(e.action==='breath'){
        const B=D.breath;
        for(let i=0;i<B.n;i++){const a=e.atkAngle+(i-(B.n-1)/2)*B.spread/(B.n-1);
          w.projectiles.push({id:w.nextId++,kind:'fire',owner:'enemy',x:e.x+Math.cos(a)*(e.r+6),y:e.y+Math.sin(a)*(e.r+6),vx:Math.cos(a)*B.speed,vy:Math.sin(a)*B.speed,r:7,life:2,dmg:e.atk*B.dmg,angle:a});}
        emit(w,{type:'shoot',x:e.x,y:e.y});e.state='recover';e.timer=0.6;e.cd=rand(B.cd[0],B.cd[1]);
      }else{e.state='glide';e.glideLeft=D.glide.dist;e.hitSet=new Set();}
    }
    return;
  }
  if(e.state==='glide'){
    const sp=D.glide.speed*dt;
    const blocked=moveEntity(w.map,e,Math.cos(e.atkAngle)*sp,Math.sin(e.atkAngle)*sp);
    e.glideLeft-=sp;
    for(const id in w.players){const q=w.players[id];if(q.dead||e.hitSet.has(q.id))continue;
      if(Math.hypot(q.x-e.x,q.y-e.y)<e.r+q.r+4){e.hitSet.add(q.id);hitPlayer(w,q,e.atk,e.x,e.y);}}
    if(blocked||e.glideLeft<=0){e.state='recover';e.timer=0.7;e.cd=rand(D.glide.cd[0],D.glide.cd[1]);}
    return;
  }
  if(e.state==='recover'){e.timer-=dt;if(e.timer<=0)e.state='chase';return;}
  e.state='chase';
  if(e.stun>0)return;
  const los=lineOfSight(w.map,e.x,e.y,p.x,p.y);
  if(e.cd<=0&&los&&d<440){
    const act=d>170?'glide':'breath';
    e.state='windup';e.action=act;e.atkAngle=ang;e.facing=ang;
    if(act==='breath'){e.timer=D.breath.wind;addTelegraph(w,{shape:'sector',x:e.x,y:e.y,angle:ang,r:150,arc:D.breath.spread+0.3,total:e.timer,dmg:0,owner:e.id});}
    else{e.timer=D.glide.wind;addTelegraph(w,{shape:'rect',x:e.x,y:e.y,angle:ang,len:D.glide.dist+e.r,width:e.r*2+8,total:e.timer,dmg:0,owner:e.id});}
    return;
  }
  const sa=ang+Math.PI/2*(e.strafeDir||1);
  if(d>260||!los)steerTo(w,e,p,e.speed,dt);
  else{moveEntity(w.map,e,Math.cos(sa)*e.speed*0.6*dt,Math.sin(sa)*e.speed*0.6*dt);e.facing=ang;}
}

const ENEMY_AI={turret:updateTurret,goblin:updateGoblin,archer:updateArcher,dasher:updateDasher,slime:updateSlime,beetle:updateBeetle,
  spore:updateSpore,ghost:updateGhost,knight:updateKnight,shaman:updateShaman,bull:updateBull,wolf:updateWolf,dragon:updateDragon,pattern:updateBossPattern,wyvern:updateWyvern,bomb:updateBomb,molten:updateMolten,twin:updateTwin,iceBeetle:updateIceBeetle,owl:updateOwl,fox:updateFox};
function separateBodies(w){
  const es=w.enemies;
  for(let i=0;i<es.length;i++){
    const a=es[i];if(a.dead)continue;
    for(let j=i+1;j<es.length;j++){
      const b=es[j];if(b.dead)continue;
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;
      if(d>0.01&&d<m){
        const push=(m-d)/2,nx=dx/d,ny=dy/d;
        // 動かない花（砲台型）は押しのけられない（重なった相手だけが離れる）
        const fixA=!!(DATA.enemies[a.type]&&DATA.enemies[a.type].turret),fixB=!!(DATA.enemies[b.type]&&DATA.enemies[b.type].turret);
        if(!a.boss&&!fixA)moveEntity(w.map,a,-nx*push*(b.boss?2:1),-ny*push*(b.boss?2:1));
        if(!b.boss&&!fixB)moveEntity(w.map,b,nx*push*(a.boss?2:1),ny*push*(a.boss?2:1));
      }
    }
  }
  for(const id in w.players){
    const p=w.players[id];if(p.dead||p.dodgeTime>0)continue;
    for(const e of es){
      if(e.dead)continue;
      const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy),m=p.r+e.r;
      if(d>0.01&&d<m)moveEntity(w.map,p,dx/d*(m-d),dy/d*(m-d));
    }
  }
}

/* ---------- 飛び道具・予兆・ドロップ・宝箱・ボス部屋 ---------- */
function updateProjectiles(w,dt){
  const keep=[];
  for(const pr of w.projectiles){
    if(pr.homing&&pr.life>1.6){
      const t=nearestPlayer(w,pr);
      if(t){const want=Math.atan2(t.y-pr.y,t.x-pr.x),mx=pr.homing*dt;pr.angle+=clamp(angDiff(want,pr.angle),-mx,mx);pr.vx=Math.cos(pr.angle)*pr.speed;pr.vy=Math.sin(pr.angle)*pr.speed;}
    }
    pr.life-=dt;pr.x+=pr.vx*dt;pr.y+=pr.vy*dt;
    let alive=pr.life>0;
    if(alive&&isWall(w.map,Math.floor(pr.x/TILE),Math.floor(pr.y/TILE))){alive=false;emit(w,{type:'projEnd',x:pr.x,y:pr.y,kind:pr.kind});}
    if(alive&&pr.owner==='enemy'){
      for(const id in w.players){
        const p=w.players[id];if(p.dead)continue;
        // ダメージのない弾（花粉）は、当たっても状態異常だけ
        if(Math.hypot(p.x-pr.x,p.y-pr.y)<p.r+pr.r&&(pr.dmg>0?hitPlayer(w,p,pr.dmg,pr.x-pr.vx*0.05,pr.y-pr.vy*0.05,pr.src,pr.el):true)){if(pr.inflict&&(pr.inflictChance==null||RNG.next()<pr.inflictChance))inflictPlayer(w,p,pr.inflict);if(pr.slow)slowPlayer(w,p,pr.slow);alive=false;break;}
      }
    }else if(alive&&(pr.kind==='playerArrow'||pr.kind==='playerShuriken')){
      const p=w.players[pr.pid];
      if(p)for(const e of w.enemies){
        if(e.dead||e.hidden||pr.hit.has(e.id))continue;
        const hit=projPart(e,pr.x,pr.y,pr.r,pr.x-pr.vx*dt,pr.y-pr.vy*dt);if(hit){pr.hit.add(e.id);damageEnemy(w,p,e,pr.mult||1,{arrow:true,hit});if(pr.status)applyStatus(w,e,pr.status);alive=false;break;}
      }
    }else if(alive&&pr.kind==='wave'){
      const p=w.players[pr.pid];
      if(p)for(const e of w.enemies){
        if(e.dead||e.hidden||pr.hit.has(e.id))continue;
        const hit=projPart(e,pr.x,pr.y,pr.r,pr.x-pr.vx*dt,pr.y-pr.vy*dt);if(hit){pr.hit.add(e.id);damageEnemy(w,p,e,pr.mult,{skill:true,hit});}
      }
    }
    if(alive)keep.push(pr);
  }
  w.projectiles=keep;
}
function updateTelegraphs(w,dt){
  const keep=[];
  for(const t of w.telegraphs){
    t.t+=dt;
    if(t.t>=t.total){
      if(t.dmg>0){w._atkEnt=w.enemies.find(e=>e.id===t.owner)||null;
        for(const id in w.players){const p=w.players[id];if(!p.dead&&inTelegraph(t,p.x,p.y,p.r)&&hitPlayer(w,p,t.dmg,t.x,t.y,(w.enemies.find(e=>e.id===t.owner)||{}).type,t.el,t.st)&&t.slow)slowPlayer(w,p,t.slow);}
        w._atkEnt=null;emit(w,{type:'tgResolve',shape:t.shape,x:t.x,y:t.y,r:t.r,angle:t.angle,arc:t.arc,small:!!t.small});
      }
    }else keep.push(t);
  }
  w.telegraphs=keep;
}
function updateDrops(w,dt){
  const keep=[];
  for(const d of w.drops){
    d.t+=dt;
    if(d.vx||d.vy){moveEntity(w.map,d,d.vx*dt,d.vy*dt);d.vx*=0.9;d.vy*=0.9;if(Math.abs(d.vx)+Math.abs(d.vy)<4)d.vx=d.vy=0;}
    let taken=false;
    if(d.t>0.35){
      let best=null,bd=Infinity;
      for(const id in w.players){const p=w.players[id];if(p.dead)continue;const dd=Math.hypot(p.x-d.x,p.y-d.y);if(dd<bd){bd=dd;best=p;}}
      if(best){
        if(bd<CONFIG.pickupRadius){emit(w,{type:'loot',pid:best.id,loot:d.loot,x:d.x,y:d.y});taken=true;}
        else if(bd<CONFIG.magnetRadius){const k=Math.min(1,dt*6);moveEntity(w.map,d,(best.x-d.x)*k,(best.y-d.y)*k);}
      }
    }
    if(!taken)keep.push(d);
  }
  w.drops=keep;
}
function updateChests(w){
  for(const c of w.chests){
    if(c.opened)continue;
    for(const id in w.players){
      const p=w.players[id];
      if(!p.dead&&Math.hypot(p.x-c.x,p.y-c.y)<34){
        c.opened=true;w.quest.chests++;
        emit(w,{type:'chest',x:c.x,y:c.y,table:c.table||'chest'});
        if(w.quest.goal.type==='chest')questProgress(w,1);
        break;
      }
    }
  }
}
/** 採取ポイント：近づくと採取（宝箱と同じく、全員がそれぞれ受け取る） */
function updateGathers(w){
  for(const g of (w.gathers||[])){
    if(g.used)continue;
    for(const id in w.players){
      const p=w.players[id];
      if(!p.dead&&Math.hypot(p.x-g.x,p.y-g.y)<30){g.used=true;emit(w,{type:'gather',x:g.x,y:g.y,kind:g.kind,table:g.table});break;}
    }
  }
}
/** 灼熱の火山：常設のマグマ溜まり（通路は塞がず、スタート部屋には置かない） */
function placeMagma(w){
  const m=w.map,keys=Object.keys(m.rooms||{}).filter(k=>k!=='start'&&k!=='entrance');
  for(const k of shuffle(keys).slice(0,Math.min(keys.length,4))){
    const room=m.rooms[k];if(!room)continue;
    const p=randomFloor(m,room,3);if(!p)continue;
    w.hazards.push({id:w.nextId++,kind:'magma',x:p.x,y:p.y,r:rand(34,46),t:0,life:1e9,tick:0.6,acc:0,dmg:9,delay:0});
  }
}
/** 沼地の毒池：小さく常設。乗ると毒になり、出てからも毒の状態は2秒続く */
function placeToxPools(w){
  const m=w.map,keys=Object.keys(m.rooms||{}).filter(k=>k!=='start'&&k!=='entrance');
  for(const k of shuffle(keys).slice(0,Math.min(keys.length,4))){
    const room=m.rooms[k];if(!room)continue;
    const p=randomFloor(m,room,3);if(!p)continue;
    w.hazards.push({id:w.nextId++,kind:'toxpool',x:p.x,y:p.y,r:20,t:0,life:1e9,tick:0.5,acc:0,dmg:6,delay:0});
  }
}
/** 毒の雲：中にいる間、一定間隔でダメージ */
/** 氷雪地帯の吹雪：時々だけ発生する（通常時は視界も速度も変えない）。開始は全員に見えるよう知らせる */
function updateBlizzard(w,dt){
  const B=w.blizzard;if(!B)return;
  B.t-=dt;if(B.t>0)return;
  B.on=!B.on;
  if(B.on){B.t=rand(7,9);for(const id in w.players){const q=w.players[id];if(!q.dead)emit(w,{type:'status',x:q.x,y:q.y-q.r-18,text:'吹雪が来た…',color:'#cfefff'});}}
  else B.t=rand(40,55);
}
function updateHazards(w,dt){
  if(!w.hazards||!w.hazards.length)return;
  const hit=new Set(); // 炎・マグマ：同じ瞬間に複数の炎に触れても、ダメージは一度だけ
  for(const hz of w.hazards){
    if(hz.delay>0){hz.delay-=dt;continue;}
    hz.t+=dt;hz.acc+=dt;
    let inside=Object.values(w.players).filter(p=>!p.dead&&Math.hypot(p.x-hz.x,p.y-hz.y)<hz.r+p.r*0.5);
    const heat=hz.kind==='fire'||hz.kind==='magma';
    if(heat)inside=inside.filter(p=>!hit.has(p.id));else for(const p of inside)p.poisoned=hz.kind==='toxpool'?2:0.3; // 沼の毒池は出てから2秒間毒が残る
    if(hz.acc>=hz.tick){hz.acc-=hz.tick;for(const p of inside){if(heat)hit.add(p.id);dotPlayer(w,p,hz.dmg,hz.el);if(hz.st&&hz.st!=='none')inflictPlayer(w,p,hz.st);}}
  }
  w.hazards=w.hazards.filter(hz=>hz.t<hz.life);
}
/** ボスの技ごとの属性・状態異常（enemies の atkEl / atkSt）*/
function bossAtkEl(e,k){const d=DATA.enemies[e.type];return d&&d.atkEl?d.atkEl[k]:undefined;}
function bossAtkSt(e,k){const d=DATA.enemies[e.type];return d&&d.atkSt?d.atkSt[k]:undefined;}
function bossOf(w){for(const e of w.enemies)if(e.id===w.bossId)return e;return null;}
function triggerBoss(w){
  const b=bossOf(w);if(!b||b.state!=='sleep')return;
  b.state='roar';b.timer=1.5;b.aggro=true;w.quest.boss='fighting';
  emit(w,{type:'bossStart',x:b.x,y:b.y,name:DATA.enemies[b.type].name});
}
function updateBossRoom(w){
  const b=bossOf(w);if(!b)return;
  const ps=Object.values(w.players).filter(p=>!p.dead);
  const bx=w.map.bossX1||61;
  if(b.state==='sleep'&&ps.some(p=>p.x>(bx+2)*TILE))triggerBoss(w);
  // ドアは閉めない：外からいつでもボス部屋に入れる（扉に重なって動けなくなる問題も起きない）
}
/** 同じ画面で遊ぶとき、プレイヤー同士が離れすぎないようにする。
    上限を超えた分だけ相手の方へ引き戻す（離れる成分だけを打ち消すので、横方向には動ける） */
function enforceLeash(w,before){
  if(!w.leash)return;
  const ps=Object.values(w.players);
  for(const p of ps){
    if(p.dead)continue;
    for(const q of ps){
      if(q===p||(q.dead&&q.out))continue; // 幽霊は仲間を引っぱらない
      const dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy);
      if(d<=w.leash)continue;
      const b=before[p.id],qb=before[q.id];
      if(Math.hypot(b.x-qb.x,b.y-qb.y)>=d)continue; // 近づく動きは止めない
      const k=(d-w.leash)/d;
      moveEntity(w.map,p,-dx*k,-dy*k);
    }
  }
}
/** 倒れた仲間に重なって5秒動かずにいると助け起こせる（30秒以内） */
function updateRevive(w,dt){
  const ps=Object.values(w.players);
  if(ps.length<2)return;
  for(const p of ps){
    if(!p.dead||p.out||p.ai)continue;
    // 仲間が重なった状態で動かずにいると助け起こせる（動いたり離れたりすると最初から）
    const helper=ps.find(q=>!q.dead&&!q.moving&&!(q.dodgeTime>0)&&Math.hypot(q.x-p.x,q.y-p.y)<CONFIG.coop.reviveRadius);
    p.reviveNeed=Math.max(1.5,CONFIG.coop.reviveTime-(helper?helper.stats.reviveCut||0:0)-(helper&&wsActive(helper,'medic')?2:0)); // 片手剣の「医療の心得」で2秒短縮 // 防具スキル「救命」で短くなる
    if(helper)p.revive+=dt;
    else{p.revive=0;p.downT-=dt;} // 助け起こし中は待ち時間が止まる
    if(p.downT<=0){p.out=true;p.revive=0;p.downT=0;emit(w,{type:'playerOut',pid:p.id,x:p.x,y:p.y});continue;} // 力尽きた：もう助け起こせない
    if(p.revive>=p.reviveNeed){
      p.dead=false;p.revive=0;p.downT=0;
      p.hp=Math.max(1,Math.round(p.stats.maxHp*CONFIG.coop.reviveHpRatio));
      p.hitInv=1.5;p.dodgeTime=0;p.swing=0;
      emit(w,{type:'revive',pid:p.id,by:helper.id,x:p.x,y:p.y});
    }
  }
}
/** ワールドを1ステップ進める。inputs = {playerId: 入力} */
function updateWorld(w,dt,inputs){
  if(w.status!=='playing')return;
  w.time+=dt;
  if(w.questId==='training')trainingTick(w,dt);
  if(!questById(w.questId).explore&&w.time>=CONFIG.questTimeLimit){w.failReason='time';w.status='gameover';return;}
  w.flowTimer-=dt;if(w.flowTimer<=0){computeFlow(w);w.flowTimer=0.25;}
  const before={};
  for(const id in w.players){const p=w.players[id];before[id]={x:p.x,y:p.y};}
  Companion.tick(w,dt);
  for(const id in w.players){const p=w.players[id];updatePlayer(w,p,p.ai?Companion.decide(w,p):(inputs[id]||EMPTY_INPUT),dt);}
  // 手裏剣の2枚目以降：少し間をあけて投げる
  if(w.pendingShots&&w.pendingShots.length){
    for(const q of w.pendingShots)q.t-=dt;
    const due=w.pendingShots.filter(q=>q.t<=0);
    w.pendingShots=w.pendingShots.filter(q=>q.t>0);
    for(const q of due){const p=w.players[q.pid];if(p&&!p.dead)spawnShurikenShot(w,p,q.a,q.off,q.mult);}
  }
  enforceLeash(w,before);
  // 挑発中のランス使いは、ボスのヘイトが常に高まる
  // ランスの挑発中は、ボスのヘイトを常に最大にする（スキルが切れたら元に戻す）
  for(const id in w.players){const p=w.players[id];
    for(const e of w.enemies){
      if(!e.boss||e.dead)continue;
      if(!e.hate)e.hate={};
      if(wsActive(p,'taunt'))e.hate[p.id]=HATE_MAX;
      else if(e.hate[p.id]>=HATE_MAX)e.hate[p.id]=0;
    }}
  // 誰かが最初の部屋から出たら、敵に見つかるようになる
  if(!w.leftStart)for(const id in w.players){const p=w.players[id];if(!p.dead&&!playerHidden(w,p)){w.leftStart=true;break;}}
  if(w.leftStart)w.map.startLocked=true; // 一度出たら、最初の部屋には戻れない
  updateRevive(w,dt);
  updateBossRoom(w);
  // w._atk：今動いている魔物の種類（攻撃が当たったときの状態異常に使う）。新しく撃った飛び道具にも覚えさせる
  for(const e of w.enemies)if(!e.dead){w._atk=e.type;const n0=w.projectiles.length;w._atkEnt=e;updateEnemy(w,e,dt);w._atkEnt=null;for(let i=n0;i<w.projectiles.length;i++)if(w.projectiles[i].owner==='enemy'&&!w.projectiles[i].src)w.projectiles[i].src=e.type;}
  w._atk=null;
  separateBodies(w);
  updateAttacks(w,dt);
  updateProjectiles(w,dt);
  updateTelegraphs(w,dt);
  updateDrops(w,dt);
  updateChests(w);
  updateGathers(w);
  updateBlizzard(w,dt);updateHazards(w,dt);
  updatePlaced(w,dt);
  w.enemies=w.enemies.filter(e=>!e.dead);
  if(w.clearTimer>0){w.clearTimer-=dt;if(w.clearTimer<=0)w.status='clear';}
  const anyAlive=Object.values(w.players).some(p=>!p.dead);
  if(!anyAlive&&w.clearTimer<0){
    if(w.deadTimer<0)w.deadTimer=1.4;
    w.deadTimer-=dt;if(w.deadTimer<=0)w.status='gameover';
  }
}

   G：描画の情報（ctx, r=体の半径, step=歩きの上下, f=向き, fx/fy=前方向, px/py=右方向, tm=時間, hx/hy/hr=頭の位置と半径） */
function genArt(kind){ // 生き物の防具の描き方：兜・胴・腕・足に、生き物の特徴（角・甲殻・ひれ・花・水晶・炎・骨など）を付ける
  return{
    head(G,l){const {ctx,hx,hy,hr,fx,fy,px,py}=G;
      ctx.fillStyle=l.main;ctx.strokeStyle=l.dark;ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(hx,hy,hr+2,0,TAU);ctx.fill();ctx.stroke();
      ctx.fillStyle=l.light;ctx.beginPath();ctx.arc(hx-fx*hr*0.3,hy-fy*hr*0.3,hr*0.5,0,TAU);ctx.fill();
      ctx.fillStyle=l.accent;
      if(kind==='horn'||kind==='antler'){for(const s of [-1,1]){const bx=hx+px*s*hr*0.7,by=hy+py*s*hr*0.7;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+fx*hr*1.2+px*s*hr*0.3,by+fy*hr*1.2+py*s*hr*0.3);ctx.lineTo(bx+fx*hr*0.3,by+fy*hr*0.3);ctx.closePath();ctx.fill();}}
      else if(kind==='fin'||kind==='crystal'||kind==='petal'||kind==='flame'){for(const s of [-1,1]){const bx=hx-fx*hr*0.4+px*s*hr*0.7,by=hy-fy*hr*0.4+py*s*hr*0.7;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx-fx*hr*1.1,by-fy*hr*1.1+py*s*hr*0.2);ctx.lineTo(bx-fx*hr*0.2+px*s*hr*0.5,by-fy*hr*0.2+py*s*hr*0.5);ctx.closePath();ctx.fill();}}
      else if(kind==='skull'){ctx.fillStyle=l.eye;for(const s of [-1,1]){ctx.beginPath();ctx.arc(hx+fx*hr*0.4+px*s*hr*0.45,hy+fy*hr*0.4+py*s*hr*0.45,hr*0.2,0,TAU);ctx.fill();}}
      else if(kind==='fur'){ctx.strokeStyle=l.accent;ctx.lineWidth=2;ctx.beginPath();ctx.arc(hx,hy,hr+4,0,TAU);ctx.stroke();}
      ctx.fillStyle=l.eye;ctx.beginPath();ctx.arc(hx+fx*hr*0.5,hy+fy*hr*0.1,1.8,0,TAU);ctx.fill();},
    body(G,l){const {ctx,r,step,f,fx,fy,px,py}=G;

      if(kind==='shell'){ctx.beginPath();ctx.ellipse(-fx*r*0.3,-fy*r*0.3+step,r*0.72,r*0.52,f+Math.PI,0,TAU);ctx.fill();ctx.stroke();}
      ctx.fillStyle=l.accent;for(const [a,b] of [[0.3,0.35],[-0.2,-0.3],[0.1,0.1]]){ctx.beginPath();ctx.arc(fx*a*r+px*b*r,fy*a*r+py*b*r+step,r*0.09,0,TAU);ctx.fill();}},
    arm(G,l,sd,ax,ay){const {ctx,r}=G;ctx.fillStyle=l.main;ctx.strokeStyle=l.dark;ctx.lineWidth=1;ctx.beginPath();ctx.arc(ax+sd*r*0.25,ay,r*0.22,0,TAU);ctx.fill();ctx.stroke();

      else{ctx.beginPath();ctx.arc(ax+sd*r*0.25,ay+r*0.2,r*0.07,0,TAU);ctx.fill();}},
    foot(G,l,lx,ly){const {ctx,r}=G;ctx.fillStyle=l.dark;ctx.beginPath();ctx.moveTo(lx-r*0.2,ly+r*0.1);ctx.lineTo(lx,ly+r*0.36);ctx.lineTo(lx+r*0.2,ly+r*0.1);ctx.closePath();ctx.fill();

  };
}

/* 武器の飾り：GEAR_LOOKS の w（例：['fang']）に名前を並べると、武器の上に描き足す。
   g.along(t)：刃（ランスはランスの線、弓は弓の弧）に沿った位置。t=0 が根元、t=1 が先端。a＝その場所の向き、hw＝刃の半分の太さ */
function weaponGeom(wtype,r){
  const blade=(x0,x1,hw,gx)=>({kind:'blade',x0,x1,hw,gx,along:t=>({x:x0+(x1-x0)*t,y:0,a:0})});
  switch(wtype){
    case 'greatsword':return blade(r*0.4+13,r+58,6,r*0.4+11);
    case 'tachi':return blade(r*0.4+14,r+56,2.2,r*0.4+12);
    case 'dual':return blade(r*0.5+7,r+14,2,r*0.5+6);
    case 'hammer':{const g=blade(r*0.4,r+12,2,r*0.4+5);g.kind='hammer';g.head={x0:r+12,x1:r+26,hy:10};return g;}
    case 'bow':{const cx=r+4,R=22;return {kind:'bow',hw:2,gx:cx+R,along:t=>{const a=-1.2+2.4*t;return {x:cx+Math.cos(a)*R,y:Math.sin(a)*R,a:a+Math.PI/2};}};}
    case 'lance':return blade(r*0.4+10,r+66,2.2,r*0.4+8);
    default:return blade(r*0.5+9,r+17,2.5,r*0.5+7);
  }
}

  resetForWorld(){this.particles=[];this.floaters=[];this.rings=[];this.shake=0;this.banner=null;this.camInit=false;this.mapCanvas=null;this.mapRef=null;this.explored=null;this.vis=null;this.exVer=0;this.mmCanvas=null;this.mmVer=-1;this.mmRef=null;},
  /* ---------- 視野（フォグ・オブ・ウォー） ----------

  explored:null,vis:null,fogCanvas:null,
  /** 光線を放射状に飛ばして、壁に遮られるまでの見える範囲（多角形）を求める */
  castVision(map,x,y){
    const V=CONFIG.vision,R=V.radius*(this.visMul||1),N=V.rays,pts=[];
    const ex=this.explored;
    for(let i=0;i<N;i++){
      const a=i/N*TAU,c=Math.cos(a),s=Math.sin(a);
      let d=0,hit=false;
      while(d<R){
        d+=6;
        const tx=Math.floor((x+c*d)/TILE),ty=Math.floor((y+s*d)/TILE);
        if(tx<0||ty<0||tx>=map.W||ty>=map.H){hit=true;break;}
        const ti=ty*map.W+tx;if(!ex[ti]){ex[ti]=1;this.exVer=(this.exVer||0)+1;}
        if(blocksSight(map,tx,ty)){hit=true;break;} // 障害物は透けて見え、壁で止まる

  updateVision(w){

  /** その位置が誰かの視野に入っているか（体の端が見えていれば見える扱い） */
  isVisible(w,x,y,r){

    const R=CONFIG.vision.radius;
    for(const v of this.vis){
      const dx=x-v.x,dy=y-v.y,d=Math.hypot(dx,dy);
      if(d>R+r)continue;
      if(sightLine(w.map,v.x,v.y,x,y))return true;
      if(r>8&&d>0){
        const nx=-dy/d*r*0.8,ny=dx/d*r*0.8;
        if(sightLine(w.map,v.x,v.y,x+nx,y+ny)||sightLine(w.map,v.x,v.y,x-nx,y-ny))return true;
      }

    return false;

  /** 左下のミニマップ：通ったことのある場所だけ地形が出る。自分・仲間・見つけたボスも点で出す */
  drawMinimap(ctx,w,hk){

        if(!ex[i])continue; // 未探索は透明（真っ黒のまま）
        const tx=i%W,ty=(i/W)|0,c=isWall(map,tx,ty)?[62,54,86]:[118,138,108];
        d[i*4]=c[0];d[i*4+1]=c[1];d[i*4+2]=c[2];d[i*4+3]=235;

  update(dt){
    this.time+=dt;

    this.particles=this.particles.filter(p=>p.t<p.life);
    for(const f of this.floaters){f.t+=dt;f.y-=40*dt;}
    this.floaters=this.floaters.filter(f=>f.t<f.life);
    for(const r of this.rings)r.t+=dt;
    this.rings=this.rings.filter(r=>r.t<r.life);

  buildMapCanvas(map){

  // ステージごとの床・壁の見た目（forest・crypt は専用の描き方、ほかはこの表で描く）

  draw(w,localId,app){
    const ctx=this.ctx,dpr=this.dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle='#0b0a10';ctx.fillRect(0,0,this.w,this.h);
    if(!w){this.drawTitleBg();return;}
    const ps=Object.values(w.players);if(!ps.length)return;
    this.multi=ps.length>1;
    // カメラ：同じ画面で遊ぶときは全員が収まるように、オンラインでは自分のキャラだけを追う
    const focus=this.focusId&&w.players[this.focusId]?[w.players[this.focusId]]:ps;
    let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
    for(const q of focus){x0=Math.min(x0,q.x);x1=Math.max(x1,q.x);y0=Math.min(y0,q.y);y1=Math.max(y1,q.y);}
    const base=this.scale*(this.zoomMul||1); // 戦闘画面の拡大（設定の「戦闘画面の大きさ」）
    let want=base;
    if(focus.length>1)want=Math.max(base*0.55,Math.min(base,this.w/(x1-x0+320),this.h/(y1-y0+280)));
    this.viewScale=this.camInit?lerp(this.viewScale,want,0.08):want;
    const sc=this.viewScale,vw=this.w/sc,vh=this.h/sc,mw=w.map.W*TILE,mh=w.map.H*TILE;
    const fx=(x0+x1)/2,fy=(y0+y1)/2;
    const tx=mw<vw?(mw-vw)/2:clamp(fx-vw/2,0,mw-vw),ty=mh<vh?(mh-vh)/2:clamp(fy-vh/2,0,mh-vh);
    if(!this.camInit){this.cam.x=tx;this.cam.y=ty;this.camInit=true;}
    else{this.cam.x=lerp(this.cam.x,tx,0.2);this.cam.y=lerp(this.cam.y,ty,0.2);}
    const sh=app.settings().screenShake?this.shake:0,shx=rand(-sh,sh),shy=rand(-sh,sh);
    ctx.setTransform(dpr*sc,0,0,dpr*sc,(-this.cam.x+shx)*sc*dpr,(-this.cam.y+shy)*sc*dpr);
    if(this.mapRef!==w.map||this.mapVersion!==w.map.version){this.mapCanvas=this.buildMapCanvas(w.map);this.mapVersion=w.map.version;this.mapRef=w.map;}
    const sx=clamp(Math.floor(this.cam.x),0,mw-1),sy=clamp(Math.floor(this.cam.y),0,mh-1);
    const sw=Math.min(Math.ceil(vw)+2,mw-sx),shh=Math.min(Math.ceil(vh)+2,mh-sy);
    if(sw>0&&shh>0)ctx.drawImage(this.mapCanvas,sx,sy,sw,shh,sx,sy,sw,shh);
    const fog=!!app.settings().vision;
    this.updateVision(w);if(!fog)this.vis=null; // 探索の記録はミニマップのため常に取る
    const seen=(x,y,r)=>!fog||this.isVisible(w,x,y,r);
    for(const z of (w.hazards||[]))if(!(z.delay>0)&&seen(z.x,z.y,z.r))this.drawHazard(ctx,z);
    for(const t of w.telegraphs)this.drawTelegraph(ctx,t);
    for(const o of (w.placed||[]))if(seen(o.x,o.y,20))this.drawPlaced(ctx,o);
    for(const gt of (w.gathers||[]))if(!fog||this.isExplored(w,gt.x,gt.y))this.drawGather(ctx,gt);
    for(const c of w.chests)if(!fog||this.isExplored(w,c.x,c.y))this.drawChest(ctx,c);
    for(const d of w.drops)if(seen(d.x,d.y,6))this.drawDrop(ctx,d);
    const ents=[...w.enemies.map(e=>({k:'e',o:e,y:e.y})),...Object.values(w.players).map(q=>({k:'p',o:q,y:q.y}))].sort((a,b)=>a.y-b.y);
    // 水溜まりの中を歩くと、足元に波紋（見た目だけ。移動の速さは別の処理で決まる）

    for(const pr of w.projectiles)if(pr.owner!=='enemy'||seen(pr.x,pr.y,4))this.drawProjectile(ctx,pr);
    for(const r of this.rings){const k=r.t/r.life;ctx.strokeStyle=r.color;ctx.globalAlpha=1-k;ctx.lineWidth=r.width;ctx.beginPath();ctx.arc(r.x,r.y,lerp(r.r0,r.r1,k),0,TAU);ctx.stroke();}

    ctx.globalAlpha=1;
    if(fog){

      if(w.blizzard&&w.blizzard.on)this.drawSnowfall(ctx);
      ctx.setTransform(dpr*sc,0,0,dpr*sc,(-this.cam.x+shx)*sc*dpr,(-this.cam.y+shy)*sc*dpr);
      // 1P/2P の名前と復活ゲージは暗がりでも見えるよう、フォグの上に描き直す
      if(this.multi)for(const q of Object.values(w.players))this.drawPlayerLabel(ctx,q);
    }
    ctx.textAlign='center';ctx.textBaseline='middle';
    for(const f of this.floaters){
      ctx.globalAlpha=1-Math.max(0,(f.t/f.life-0.6)/0.4);
      ctx.font=`bold ${f.size}px ${FONT}`;ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.8)';
      ctx.strokeText(f.text,f.x,f.y);ctx.fillStyle=f.color;ctx.fillText(f.text,f.x,f.y);
    }
    ctx.globalAlpha=1;
    ctx.setTransform(dpr,0,0,dpr,0,0);

      const x=(i*137.5+t*12*(1+i%3))%this.w,y=this.h-((i*91+t*(20+i%5*6))%this.h);

  drawTelegraph(ctx,t){
    const k=clamp(t.t/t.total,0,1);
    const C=t.kind==='poison'?'120,220,60':t.kind==='curse'?'190,90,255':'255,60,40',C2=t.kind==='poison'?'150,240,90':t.kind==='curse'?'210,130,255':'255,90,60';
    ctx.save();
    ctx.fillStyle=`rgba(${C},0.16)`;ctx.strokeStyle=`rgba(${C2},${0.5+0.4*k})`;ctx.lineWidth=2;
    const prog=`rgba(${C},${0.25+0.2*k})`;
    if(t.shape==='circle'){
      ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,TAU);ctx.fill();ctx.stroke();
      ctx.fillStyle=prog;ctx.beginPath();ctx.arc(t.x,t.y,t.r*k,0,TAU);ctx.fill();
    }else if(t.shape==='sector'){
      ctx.beginPath();ctx.moveTo(t.x,t.y);ctx.arc(t.x,t.y,t.r,t.angle-t.arc/2,t.angle+t.arc/2);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle=prog;ctx.beginPath();ctx.moveTo(t.x,t.y);ctx.arc(t.x,t.y,t.r*k,t.angle-t.arc/2,t.angle+t.arc/2);ctx.closePath();ctx.fill();
    }else if(t.shape==='rect'){
      ctx.translate(t.x,t.y);ctx.rotate(t.angle);
      ctx.fillRect(0,-t.width/2,t.len,t.width);ctx.strokeRect(0,-t.width/2,t.len,t.width);
      ctx.fillStyle=prog;ctx.fillRect(0,-t.width/2,t.len*k,t.width);
      ctx.fillStyle=`rgba(255,200,180,${0.4+0.4*k})`;
      for(let x=40;x<t.len;x+=60){ctx.beginPath();ctx.moveTo(x,-10);ctx.lineTo(x+14,0);ctx.lineTo(x,10);ctx.closePath();ctx.fill();}
    }
    ctx.restore();
  },
  /** 設置物：落とし穴・シビレ罠・大タル爆弾 */
  /** 状態異常の画面効果：発生の瞬間は状態の色で一度光り、続いている間は画面の縁を状態の色で染める */
  drawStatusFx(ctx,W,H){
    const v=this.statusView||{},fx=this.statusFx,t=this.time||0;
    const kinds=[['poison','#8cff4a'],['para','#ffe040'],['sleep','#8a7cff'],['curse','#c070ff']].filter(([k])=>v[k]);
    if(kinds.length){
      kinds.forEach(([k,c],i)=>{
        const a=k==='para'?0.2+0.14*Math.abs(Math.sin(t*10)):k==='sleep'?0.32:0.2+0.06*Math.sin(t*3+i);
        const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.72);
        g.addColorStop(0,hexA(c,0));g.addColorStop(1,hexA(c,a));
        ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      });
    }
    if(fx){
      const k=(Date.now()-fx.start)/1000/fx.life;
      if(k<1){
        const a=1-k;
        ctx.fillStyle=hexA(fx.color,0.45*a);ctx.fillRect(0,0,W,H);
      }else this.statusFx=null;
    }
  },
  drawPlaced(ctx,o){

    }else if(o.kind==='shock'){
      ctx.globalAlpha=armed?1:0.5;

    }else if(o.kind==='heal'){
      // 薄いピンクの範囲と残り時間

      ctx.globalAlpha=0.2+0.08*pulse;ctx.fillStyle='#ffb6d6';ctx.beginPath();ctx.arc(0,0,o.r,0,TAU);ctx.fill();

  drawDrop(ctx,d){

    ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,6,6,2.5,0,0,TAU);ctx.fill();

    if(rar>=2){
      ctx.globalAlpha=0.25+0.15*Math.sin(this.time*5);ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,14,0,TAU);ctx.fill();ctx.globalAlpha=1;
    }
    if(rar>=3){
      const g=ctx.createLinearGradient(0,-60,0,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,col);

  drawGoblin(ctx,e,hurt,pal){

  drawFrog(ctx,e,hurt,pal){

  drawLeech(ctx,e,hurt,pal){

  drawPlant(ctx,e,hurt,pal){

  drawBloat(ctx,e,hurt,pal){

  drawCroc(ctx,e,hurt,pal){

  /** 疾風怪鳥：大きな翼を羽ばたかせる。急降下中は翼をたたむ */
  drawGaleBird(ctx,e,hurt,pal){
    const r=e.r,ph2=e.phase===2,b=hurt?'#ffffff':(ph2?pal.rage:pal.body),d=ph2?pal.rageDark:pal.dark;
    const diving=e.state==='charge',flap=diving?0.25:0.75+Math.sin(e.anim*(ph2?16:11))*0.35;
    ctx.save();ctx.rotate(e.facing);
    // 尾羽
    ctx.fillStyle=d;for(let i=-2;i<=2;i++){ctx.save();ctx.rotate(Math.PI+i*0.22);ctx.beginPath();ctx.ellipse(r*1.0,0,r*0.6,r*0.14,0,0,TAU);ctx.fill();ctx.restore();}
    // 翼（羽根を重ねる）
    for(const s of [-1,1]){
      for(let i=0;i<5;i++){
        const span=r*(1.0+i*0.32)*flap+r*0.4,a=s*(Math.PI/2+0.15-i*0.08);

    ctx.fillStyle=b;ctx.strokeStyle=d;ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(0,0,r*0.75,r*0.48,0,0,TAU);ctx.fill();ctx.stroke();
    ctx.fillStyle=pal.wing;ctx.beginPath();ctx.ellipse(r*0.1,0,r*0.4,r*0.24,0,0,TAU);ctx.fill();
    ctx.fillStyle=b;ctx.beginPath();ctx.arc(r*0.75,0,r*0.36,0,TAU);ctx.fill();ctx.stroke();
    ctx.fillStyle=d;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(r*0.55,i*r*0.08);ctx.lineTo(r*0.15,i*r*0.2);ctx.lineTo(r*0.55,i*r*0.08+r*0.08);ctx.fill();} // 冠羽
    ctx.fillStyle=pal.beak;ctx.beginPath();ctx.moveTo(r*1.0,-r*0.14);ctx.lineTo(r*1.45,0);ctx.lineTo(r*1.0,r*0.14);ctx.closePath();ctx.fill();
    ctx.fillStyle=ph2?pal.rageEye:pal.eye;for(const s of [-1,1]){ctx.beginPath();ctx.arc(r*0.85,s*r*0.17,r*0.07,0,TAU);ctx.fill();}
    ctx.restore();
  },
  /** 岩肌の大蜥蜴：太い胴と長い尻尾、背中に棘の列 */
  drawRockLizard(ctx,e,hurt,pal){
    const r=e.r,ph2=e.phase===2,b=hurt?'#ffffff':(ph2?pal.rage:pal.body),d=ph2?pal.rageDark:pal.dark,w=Math.sin(e.anim*8);
    ctx.save();ctx.rotate(e.facing);
    // 尻尾（S字に揺れる）
    ctx.strokeStyle=d;ctx.lineCap='round';ctx.lineWidth=r*0.42;ctx.beginPath();ctx.moveTo(-r*0.6,0);ctx.quadraticCurveTo(-r*1.3,w*r*0.5,-r*2.0,-w*r*0.3);ctx.stroke();
    ctx.strokeStyle=b;ctx.lineWidth=r*0.3;ctx.beginPath();ctx.moveTo(-r*0.6,0);ctx.quadraticCurveTo(-r*1.3,w*r*0.5,-r*2.0,-w*r*0.3);ctx.stroke();ctx.lineCap='butt';
    // 脚
    ctx.fillStyle=d;for(const [x,s,k] of [[r*0.45,-1,1],[r*0.45,1,-1],[-r*0.45,-1,-1],[-r*0.45,1,1]]){const st=w*k*r*0.12;ctx.beginPath();ctx.ellipse(x+st,s*r*0.72,r*0.2,r*0.14,0,0,TAU);ctx.fill();
      ctx.strokeStyle=pal.spine;ctx.lineWidth=1.5;for(const c of [-0.3,0,0.3]){ctx.beginPath();ctx.moveTo(x+st,s*r*0.8);ctx.lineTo(x+st+Math.cos(s*Math.PI/2+c)*r*0.22,s*r*0.8+Math.sin(s*Math.PI/2+c)*r*0.22);ctx.stroke();}}
    // 胴
    ctx.fillStyle=b;ctx.strokeStyle=d;ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(0,0,r*0.95,r*0.58,0,0,TAU);ctx.fill();ctx.stroke();
    ctx.fillStyle=pal.belly;for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(-r*0.6+i*r*0.24,(i%2?1:-1)*r*0.28,r*0.1,0,TAU);ctx.fill();}
    ctx.fillStyle=pal.spine;for(let i=0;i<6;i++){const x=-r*0.75+i*r*0.28;ctx.beginPath();ctx.moveTo(x-r*0.1,0);ctx.lineTo(x+r*0.04,-r*0.16);ctx.lineTo(x+r*0.12,0);ctx.lineTo(x+r*0.04,r*0.16);ctx.closePath();ctx.fill();}
    // 頭
    const open=e.state==='windup'&&e.action==='sweep'?0.3:0.05;
    ctx.fillStyle=b;ctx.strokeStyle=d;ctx.beginPath();ctx.moveTo(r*0.75,-r*0.32);ctx.quadraticCurveTo(r*1.6,-r*0.3-open*r,r*1.7,0);ctx.quadraticCurveTo(r*1.6,r*0.3+open*r,r*0.75,r*0.32);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle=ph2?pal.rageEye:pal.eye;for(const s of [-1,1]){ctx.beginPath();ctx.ellipse(r*1.05,s*r*0.22,r*0.08,r*0.04,0,0,TAU);ctx.fill();}
    ctx.restore();
  },
  /** 大顎クワガタ：つやのある甲殻と、前に突き出た大きな大顎（正面の攻撃を弾く） */
  drawGenBoss(ctx,e,hurt,ed){ // 生き物の共通の描き方（胴・脚・頭・飾り・腕の形を、生き物ごとに変える）
    const pal=ed.pal||{body:'#777',dark:'#333',spot:'#ccc',eye:'#ff0'},T=ed.gen||{},r=e.r,an=e.anim||0;
    const b=hurt?'#ffffff':pal.body,d=pal.dark;
    ctx.save();ctx.rotate(e.facing||0);ctx.lineCap='round';ctx.lineJoin='round';
    if(T.wings){ctx.fillStyle=pal.spot;ctx.globalAlpha=0.75;for(const s of [-1,1]){ctx.beginPath();ctx.moveTo(-r*0.2,0);ctx.quadraticCurveTo(-r*0.6,s*r*1.7,-r*1.3,s*(r*1.0+Math.sin(an*5)*r*0.15));ctx.quadraticCurveTo(-r*0.5,s*r*0.6,-r*0.2,0);ctx.fill();}ctx.globalAlpha=1;}
    if(T.tail){ctx.strokeStyle=d;ctx.lineWidth=r*0.22;ctx.beginPath();ctx.moveTo(-r*0.6,0);ctx.quadraticCurveTo(-r*1.2,Math.sin(an*3)*r*0.5,-r*1.7,Math.sin(an*3+1)*r*0.4);ctx.stroke();}
    const n=T.legs||0;
    if(n){ctx.strokeStyle=d;ctx.lineWidth=Math.max(2,r*0.1);for(let i=0;i<n;i++){const sd=i%2?1:-1,x=((i>>1)-(n/2-1)/2)*r*0.55,ph=Math.sin(an*6+i)*r*0.1;ctx.beginPath();ctx.moveTo(x,sd*r*0.5);ctx.lineTo(x+ph,sd*r*1.05);ctx.stroke();}}
    ctx.fillStyle=b;ctx.strokeStyle=d;ctx.lineWidth=2;ctx.beginPath();
    if(T.body==='round')ctx.arc(0,0,r*0.85,0,TAU);else if(T.body==='long')ctx.ellipse(-r*0.1,0,r*1.05,r*0.62,0,0,TAU);else ctx.ellipse(0,0,r*0.9,r*0.75,0,0,TAU);
    ctx.fill();ctx.stroke();
    if(T.body==='shell'){ctx.beginPath();ctx.moveTo(-r*0.7,0);ctx.lineTo(r*0.6,0);ctx.moveTo(0,-r*0.55);ctx.lineTo(0,r*0.55);ctx.stroke();}
    if(T.cloak){ctx.fillStyle=d;ctx.globalAlpha=0.6;ctx.beginPath();ctx.moveTo(-r*0.4,-r*0.7);ctx.lineTo(-r*1.4+Math.sin(an*3)*r*0.2,0);ctx.lineTo(-r*0.4,r*0.7);ctx.fill();ctx.globalAlpha=1;}
    ctx.fillStyle=pal.spot;for(const [x,y] of [[-0.2,-0.3],[0.2,0.3],[0.3,-0.1]]){ctx.beginPath();ctx.arc(x*r,y*r,r*0.09,0,TAU);ctx.fill();}
    const hx=r*0.7;
    ctx.fillStyle=b;ctx.strokeStyle=d;ctx.lineWidth=2;ctx.beginPath();ctx.arc(hx,0,r*0.48,0,TAU);ctx.fill();ctx.stroke();
    ctx.fillStyle=pal.eye;for(const sd of [-1,1]){ctx.beginPath();ctx.arc(hx+r*0.2,sd*r*0.2,r*0.1,0,TAU);ctx.fill();}
    ctx.strokeStyle=d;ctx.fillStyle=pal.spot;ctx.lineWidth=2;
    for(const sd of [-1,1]){
      if(T.head==='horn'||T.head==='tusk'){ctx.beginPath();ctx.moveTo(hx+r*0.1,sd*r*0.3);ctx.lineTo(hx+r*0.6,sd*r*0.7);ctx.lineTo(hx+r*0.3,sd*r*0.1);ctx.closePath();ctx.fill();}
      else if(T.head==='antler'){ctx.beginPath();ctx.moveTo(hx-r*0.1,sd*r*0.3);ctx.lineTo(hx-r*0.4,sd*r*1.0);ctx.stroke();ctx.beginPath();ctx.moveTo(hx-r*0.3,sd*r*0.7);ctx.lineTo(hx,sd*r*0.9);ctx.stroke();}

  drawWolf(ctx,e,hurt,pal){

        for(const k of [-1,0,1]){const a=f+k*0.35,bx=ax+Math.cos(a)*r*0.3,by=ay+Math.sin(a)*r*0.3,nx=-Math.sin(a),ny=Math.cos(a);
          ctx.beginPath();ctx.moveTo(bx+nx*1.5,by+ny*1.5);ctx.lineTo(bx+Math.cos(a)*r*0.38,by+Math.sin(a)*r*0.38);ctx.lineTo(bx-nx*1.5,by-ny*1.5);ctx.closePath();ctx.fill();}
      }else{ctx.fillStyle=arms.accent;ctx.beginPath();ctx.arc(ax,ay-r*0.08,r*0.12,0,TAU);ctx.fill();}
    }
    // 頭（顔は向いている方へ）
    const hx=fx*r*0.35,hy=fy*r*0.35+step,hr=r*0.5;
    ctx.fillStyle='#f0d8b8';ctx.beginPath();ctx.arc(hx,hy,hr,0,TAU);ctx.fill();
    ctx.fillStyle='#202840';
    for(const sd of [-1,1]){ctx.beginPath();ctx.arc(fx*r*0.55+px*sd*3,fy*r*0.55+py*sd*3+step,1.6,0,TAU);ctx.fill();}
    if(A(head)&&A(head).head){A(head).head(G,head);}
    else if(head&&head.orn==='wolf'){ // 狼の頭のかぶり物：頭全体を覆い、鼻先が前に突き出る。大きな耳・光る目・牙
      const sx=hx+fx*hr*1.5,sy=hy+fy*hr*1.5; // 鼻先
      // 耳（後ろ寄りの左右に大きく尖る）
      for(const sd of [-1,1]){
        const a=f+Math.PI+sd*Math.PI*0.58,bx=hx+Math.cos(a)*hr*0.8,by=hy+Math.sin(a)*hr*0.8,o=a-sd*0.15,q=a+Math.PI/2;
        ctx.fillStyle=head.dark;ctx.beginPath();ctx.moveTo(bx+Math.cos(q)*hr*0.42,by+Math.sin(q)*hr*0.42);
        ctx.lineTo(bx+Math.cos(o)*hr*1.15,by+Math.sin(o)*hr*1.15);ctx.lineTo(bx-Math.cos(q)*hr*0.42,by-Math.sin(q)*hr*0.42);ctx.closePath();ctx.fill();
        ctx.fillStyle=head.light;ctx.beginPath();ctx.moveTo(bx+Math.cos(q)*hr*0.2,by+Math.sin(q)*hr*0.2);
        ctx.lineTo(bx+Math.cos(o)*hr*0.8,by+Math.sin(o)*hr*0.8);ctx.lineTo(bx-Math.cos(q)*hr*0.2,by-Math.sin(q)*hr*0.2);ctx.closePath();ctx.fill();
      }
      // 頭と鼻づら
      ctx.fillStyle=head.main;ctx.strokeStyle=head.dark;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(hx,hy,hr+2,0,TAU);ctx.fill();ctx.stroke();
      ctx.save();ctx.translate((hx+sx)/2,(hy+sy)/2);ctx.rotate(f);
      ctx.beginPath();ctx.ellipse(0,0,hr*0.95,hr*0.55,0,0,TAU);ctx.fill();ctx.stroke();
      ctx.fillStyle=head.light;ctx.beginPath();ctx.ellipse(hr*0.15,0,hr*0.6,hr*0.3,0,0,TAU);ctx.fill();
      // 牙（鼻づらの左右に白く）
      ctx.fillStyle=head.accent;for(const sd of [-1,1]){ctx.beginPath();ctx.moveTo(hr*0.35,sd*hr*0.42);ctx.lineTo(hr*0.55,sd*hr*0.72);ctx.lineTo(hr*0.7,sd*hr*0.4);ctx.closePath();ctx.fill();}
      ctx.restore();
      ctx.fillStyle='#181418';ctx.beginPath();ctx.arc(sx,sy,hr*0.22,0,TAU);ctx.fill(); // 鼻
      // 光る目
      ctx.fillStyle=head.eye;for(const sd of [-1,1]){ctx.beginPath();ctx.ellipse(hx+fx*hr*0.45+px*sd*hr*0.45,hy+fy*hr*0.45+py*sd*hr*0.45,1.9,1.2,f+sd*0.5,0,TAU);ctx.fill();}
    }else if(head&&head.orn==='bull'){ // 暴角獣の頭のかぶり物：左右に張り出して前へ反る大きな角、幅広の鼻づら、鼻輪
      const mx=hx+fx*hr*1.15,my=hy+fy*hr*1.15; // 鼻づら
      // 耳（角の下で横向き）
      ctx.fillStyle=head.dark;
      for(const sd of [-1,1]){const ex=hx+px*sd*hr*1.05-fx*hr*0.1,ey=hy+py*sd*hr*1.05-fy*hr*0.1;ctx.beginPath();ctx.ellipse(ex,ey,hr*0.45,hr*0.22,f+Math.PI/2,0,TAU);ctx.fill();}
      // 頭
      ctx.fillStyle=head.main;ctx.strokeStyle=head.dark;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(hx,hy,hr+2,0,TAU);ctx.fill();ctx.stroke();
      ctx.fillStyle=head.dark;ctx.beginPath();ctx.arc(hx-fx*hr*0.3,hy-fy*hr*0.3,hr*0.55,0,TAU);ctx.fill(); // 頭のてっぺんの縮れ毛
      // 角：根元は太く、横に張り出してから前へ反り、先は細く尖る
      for(const sd of [-1,1]){
        const bx=hx+px*sd*hr*0.75,by=hy+py*sd*hr*0.75,ox=px*sd,oy=py*sd;
        const tx=bx+ox*hr*1.5+fx*hr*1.35,ty=by+oy*hr*1.5+fy*hr*1.35;
        ctx.fillStyle=head.accent;ctx.strokeStyle='#8a7a5a';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(bx-fx*hr*0.32,by-fy*hr*0.32);
        ctx.quadraticCurveTo(bx+ox*hr*1.6-fx*hr*0.2,by+oy*hr*1.6-fy*hr*0.2,tx,ty);
        ctx.quadraticCurveTo(bx+ox*hr*1.05+fx*hr*0.3,by+oy*hr*1.05+fy*hr*0.3,bx+fx*hr*0.3,by+fy*hr*0.3);ctx.closePath();ctx.fill();ctx.stroke();
      }
      // 鼻づら・鼻の穴・鼻輪
      ctx.fillStyle=head.light;ctx.strokeStyle=head.dark;ctx.lineWidth=1.2;
      ctx.beginPath();ctx.ellipse(mx,my,hr*0.55,hr*0.85,f,0,TAU);ctx.fill();ctx.stroke();
      ctx.fillStyle='#3a2a1a';for(const sd of [-1,1]){ctx.beginPath();ctx.arc(mx+fx*hr*0.22+px*sd*hr*0.32,my+fy*hr*0.22+py*sd*hr*0.32,hr*0.12,0,TAU);ctx.fill();}
      ctx.strokeStyle='#ffd23a';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(mx+fx*hr*0.55,my+fy*hr*0.55,hr*0.24,f-1.4,f+1.4);ctx.stroke();
      // 怒った目
      ctx.fillStyle=head.eye;for(const sd of [-1,1]){ctx.beginPath();ctx.ellipse(hx+fx*hr*0.25+px*sd*hr*0.55,hy+fy*hr*0.25+py*sd*hr*0.55,1.8,1.1,f-sd*0.6,0,TAU);ctx.fill();}
    }else if(head){ // 兜：頭の後ろ半分を覆い、シリーズの飾りを付ける
      ctx.fillStyle=head.main;ctx.strokeStyle=head.dark;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(hx,hy,hr+1.5,f+Math.PI*0.42,f+Math.PI*1.58);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.fillStyle=head.accent;ctx.beginPath();ctx.arc(hx-fx*hr*0.55,hy-fy*hr*0.55,hr*0.22,0,TAU);ctx.fill();
      if(head.orn==='ears'){ // 獣の耳
        for(const sd of [-1,1]){
          const a=f+Math.PI+sd*Math.PI*0.62,bx=hx+Math.cos(a)*hr,by=hy+Math.sin(a)*hr,o=a+sd*0.25;
          ctx.fillStyle=head.dark;ctx.beginPath();ctx.moveTo(bx+Math.cos(a+Math.PI/2)*3.5,by+Math.sin(a+Math.PI/2)*3.5);
          ctx.lineTo(bx+Math.cos(o)*hr*0.85,by+Math.sin(o)*hr*0.85);ctx.lineTo(bx-Math.cos(a+Math.PI/2)*3.5,by-Math.sin(a+Math.PI/2)*3.5);ctx.closePath();ctx.fill();
        }
      }else if(head.orn==='horns'){ // 前に反った角
        ctx.strokeStyle=head.accent;ctx.lineWidth=3;ctx.lineCap='round';
        for(const sd of [-1,1]){
          const bx=hx+px*sd*hr*0.9,by=hy+py*sd*hr*0.9;
          ctx.beginPath();ctx.moveTo(bx,by);ctx.quadraticCurveTo(bx+px*sd*hr*0.9,by+py*sd*hr*0.9,bx+px*sd*hr*0.5+fx*hr*1.1,by+py*sd*hr*0.5+fy*hr*1.1);ctx.stroke();
        }
        ctx.lineCap='butt';
      }else if(head.orn==='skull'){ // 骨の兜：目のくぼみ模様
        ctx.fillStyle=head.dark;for(const sd of [-1,1]){ctx.beginPath();ctx.arc(hx-fx*hr*0.2+px*sd*hr*0.35,hy-fy*hr*0.2+py*sd*hr*0.35,1.4,0,TAU);ctx.fill();}
      }
    }
  },
  drawPlayerLabel(ctx,p){
    const r=p.r,pc=PLAYER_COLORS[p.slot%PLAYER_COLORS.length];
    {
      ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`bold 12px ${FONT}`;
      const nm=playerName(p);
      ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.strokeText(nm,p.x,p.y-r-14);
      ctx.fillStyle=pc.label;ctx.fillText(nm,p.x,p.y-r-14);
      if(p.dead){
        if(p.out){ctx.fillStyle='#ff8080';ctx.font=`bold 11px ${FONT}`;ctx.strokeText('幽霊',p.x,p.y+r+18);ctx.fillText('幽霊',p.x,p.y+r+18);}
        else{
          const need=p.reviveNeed||CONFIG.coop.reviveTime,k=clamp(p.revive/need,0,1),left=Math.ceil(p.downT||0);
          ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=5;ctx.beginPath();ctx.arc(p.x,p.y,r+10,0,TAU);ctx.stroke();
          ctx.strokeStyle='#5fe08a';ctx.beginPath();ctx.arc(p.x,p.y,r+10,-Math.PI/2,-Math.PI/2+TAU*k);ctx.stroke();
          const tx=k>0?`助け起こし中… ${Math.ceil(need*(1-k))}秒`:`重なって5秒止まると復活`;
          ctx.font=`bold 11px ${FONT}`;ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.strokeText(tx,p.x,p.y+r+18);ctx.fillStyle='#fff';ctx.fillText(tx,p.x,p.y+r+18);
          const lt=`あと${left}秒`;ctx.strokeText(lt,p.x,p.y+r+32);ctx.fillStyle=left<=10?'#ff8060':'#ffd23a';ctx.fillText(lt,p.x,p.y+r+32);
        }
      }
      ctx.restore();

  },
  drawProjectile(ctx,pr){
    ctx.save();ctx.translate(pr.x,pr.y);ctx.rotate(pr.angle);
    if(pr.kind==='playerShuriken'){ // 手裏剣：くるくる回る四つ又の刃
      ctx.rotate(this.time*22+pr.id);
      ctx.fillStyle='#c8d2dc';ctx.beginPath();
      for(let k=0;k<4;k++){const a=k*Math.PI/2;ctx.moveTo(Math.cos(a)*8,Math.sin(a)*8);ctx.lineTo(Math.cos(a+Math.PI/4)*2.5,Math.sin(a+Math.PI/4)*2.5);ctx.lineTo(Math.cos(a+Math.PI/2)*0.5,Math.sin(a+Math.PI/2)*0.5);}
      ctx.closePath();ctx.fill();
      ctx.fillStyle='#303840';ctx.beginPath();ctx.arc(0,0,1.8,0,TAU);ctx.fill();
    }else if(pr.kind==='arrow'||pr.kind==='playerArrow'){
      ctx.strokeStyle='#d8d0b8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(4,0);ctx.stroke();
      ctx.fillStyle='#e8e8f0';ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(2,-4);ctx.lineTo(2,4);ctx.closePath();ctx.fill();
      ctx.fillStyle=pr.status?({poison:'#a8e040',paralysis:'#ffe040',sleep:'#b898ff'})[pr.status]:'#c04040';ctx.fillRect(-14,-3,4,6);
    }else if(pr.kind==='mucus'){ // 大山椒魚の粘液：水属性の塊
      ctx.fillStyle='rgba(120,210,200,.4)';ctx.beginPath();ctx.arc(0,0,pr.r+3,0,TAU);ctx.fill();
      ctx.fillStyle='#8ee0d0';ctx.beginPath();ctx.arc(0,0,pr.r,0,TAU);ctx.fill();
    }else if(pr.kind==='soul'){
      ctx.shadowColor='#a070ff';ctx.shadowBlur=16;
      ctx.fillStyle='rgba(150,120,255,.35)';ctx.beginPath();ctx.ellipse(-10,0,14,6,0,0,TAU);ctx.fill();
      ctx.fillStyle='#d8c8ff';ctx.beginPath();ctx.arc(0,0,pr.r,0,TAU);ctx.fill();
      ctx.fillStyle='#8a60ff';ctx.beginPath();ctx.arc(0,0,pr.r*0.55,0,TAU);ctx.fill();
    }else if(pr.kind==='spit'){ // 毒吐き：緑の毒の玉としずく
      ctx.fillStyle='rgba(150,220,60,.45)';ctx.beginPath();ctx.ellipse(-8,0,10,4,0,0,TAU);ctx.fill();
      ctx.fillStyle=pr.color||'#a8e040';ctx.beginPath();ctx.arc(0,0,pr.r,0,TAU);ctx.fill();
      ctx.fillStyle='#e8ff90';ctx.beginPath();ctx.arc(-2,-2,pr.r*0.35,0,TAU);ctx.fill();
    }else if(pr.kind==='fire'){ // 晶炎の弾（百足）
      ctx.shadowColor='#ff8030';ctx.shadowBlur=14;
      ctx.fillStyle='rgba(255,140,60,.35)';ctx.beginPath();ctx.ellipse(-10,0,12,5,0,0,TAU);ctx.fill();
      ctx.fillStyle='#ffb070';ctx.beginPath();ctx.arc(0,0,pr.r,0,TAU);ctx.fill();
      ctx.fillStyle='#ff5a20';ctx.beginPath();ctx.arc(0,0,pr.r*0.55,0,TAU);ctx.fill();
    }else if(pr.kind==='ice'||pr.kind==='shard'){ // 氷の弾・氷の破片
      ctx.shadowColor='#8ad8ff';ctx.shadowBlur=10;
      ctx.fillStyle='rgba(180,235,255,.4)';ctx.beginPath();ctx.ellipse(-8,0,10,4,0,0,TAU);ctx.fill();
      ctx.fillStyle=pr.kind==='ice'?'#d8f4ff':'#9ae8ff';ctx.beginPath();ctx.moveTo(pr.r*1.6,0);ctx.lineTo(0,-pr.r);ctx.lineTo(-pr.r,0);ctx.lineTo(0,pr.r);ctx.closePath();ctx.fill();
    }else if(pr.kind==='feather'){ // 疾風怪鳥の羽根
      ctx.fillStyle='#a8d0f0';ctx.beginPath();ctx.ellipse(-2,0,10,3.2,0,0,TAU);ctx.fill();
      ctx.strokeStyle='#2a4a7a';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-12,0);ctx.lineTo(8,0);ctx.stroke();
    }else if(pr.kind==='rock'){ // 大蜥蜴の吐き出す岩
      ctx.rotate(-pr.angle+pr.life*8);
      ctx.fillStyle='#8a8070';ctx.strokeStyle='#4a4238';ctx.lineWidth=1.5;ctx.beginPath();
      for(let i=0;i<7;i++){const a=i/7*TAU,rr=pr.r*(i%2?0.85:1.15);i?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);}
      ctx.closePath();ctx.fill();ctx.stroke();
    }else if(pr.kind==='wave'){
      const a=clamp(pr.life/0.6,0,1);
      ctx.globalAlpha=0.4+0.6*a;ctx.shadowColor='#7fe0ff';ctx.shadowBlur=14;
      ctx.strokeStyle='#bff0ff';ctx.lineWidth=6;ctx.beginPath();ctx.arc(-10,0,pr.r+6,-1.1,1.1);ctx.stroke();
      ctx.strokeStyle='#7fe0ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(-18,0,pr.r+2,-1.0,1.0);ctx.stroke();
    }
    ctx.restore();
  },
  panel(ctx,x,y,w,h){
    ctx.fillStyle='rgba(12,10,20,.78)';ctx.strokeStyle='rgba(120,100,170,.45)';ctx.lineWidth=1;
    ctx.beginPath();const r=6;ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();ctx.fill();ctx.stroke();
  },
  /** プレイヤー1人分の情報パネル（名前・HP・能力・武器） */
  drawPlayerPanel(ctx,x,y,p,multi){
    const s=p.stats,pc=PLAYER_COLORS[p.slot%PLAYER_COLORS.length];
    if(!multi){ // 1人プレイ：左上はHPだけ（状態異常は付いているときだけ小さく出す）
      const hk=clamp(p.hp/s.maxHp,0,1),bx=x+44,bw=266,by=y+8;
      const sts=[];if(p.slowT>0)sts.push(['鈍足','#9ad8ff']);if(p.poisoned>0||p.poisonT>0)sts.push(['毒','#a8e060']);if(p.paraT>0)sts.push(['麻痺','#ffe040']);if(p.sleepT>0)sts.push(['睡眠','#b898ff']);if(p.curseT>0)sts.push(['呪い','#c070ff']);
      this.panel(ctx,x,y,310,sts.length?58:36);
      ctx.textAlign='left';ctx.font=`bold 15px ${FONT}`;ctx.fillStyle='#ffd23a';ctx.fillText('HP',x+10,y+18);
      ctx.fillStyle='#3a1d22';ctx.fillRect(bx,by,bw,18);
      ctx.fillStyle=p.dead?'#555':(hk>0.5?'#46c46a':(hk>0.25?'#e0b030':'#e04848'));ctx.fillRect(bx,by,bw*hk,18);
      ctx.strokeStyle='rgba(255,255,255,.3)';ctx.strokeRect(bx,by,bw,18);
      ctx.fillStyle='#fff';ctx.font=`bold 12px ${FONT}`;ctx.textAlign='center';
      ctx.fillText(p.dead?(p.out?'幽霊':'戦闘不能'):`HP ${Math.ceil(p.hp)} / ${s.maxHp}`,bx+bw/2,by+9);
      if(sts.length){ctx.textAlign='left';ctx.font=`bold 12px ${FONT}`;let xx=x+10;for(const [t,c] of sts){ctx.fillStyle=c;ctx.fillText(t,xx,y+46);xx+=ctx.measureText(t).width+10;}}
      return;
    }
    this.panel(ctx,x,y,310,100);
    if(multi){ctx.fillStyle=pc.body;ctx.fillRect(x,y+6,4,88);}
    ctx.textAlign='left';ctx.font=`bold 15px ${FONT}`;ctx.fillStyle=multi?pc.label:'#ffd23a';
    ctx.fillText(multi?playerName(p).slice(0,6):'HP',x+10,y+20);
    const hk=clamp(p.hp/s.maxHp,0,1),bx=x+82,bw=218;
    ctx.fillStyle='#3a1d22';ctx.fillRect(bx,y+10,bw,18);
    ctx.fillStyle=p.dead?'#555':(hk>0.5?'#46c46a':(hk>0.25?'#e0b030':'#e04848'));ctx.fillRect(bx,y+10,bw*hk,18);
    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.strokeRect(bx,y+10,bw,18);
    ctx.fillStyle='#fff';ctx.font=`bold 12px ${FONT}`;ctx.textAlign='center';
    ctx.fillText(p.dead?(p.out?'幽霊':'戦闘不能'):`HP ${Math.ceil(p.hp)} / ${s.maxHp}`,bx+bw/2,y+19);
    ctx.textAlign='left';ctx.fillStyle='#cfc7e6';ctx.font=`12px ${FONT}`;
    ctx.fillText(`攻撃 ${s.atk}  防御 ${s.def}  会心 ${s.crit}%  ${(1/s.attackInterval).toFixed(1)}回/秒`,x+10,y+46);
    ctx.fillStyle='#8a82a2';ctx.font=`11px ${FONT}`;
    ctx.fillText(`移動 ${s.moveSpd>=0?'+':''}${s.moveSpd}%　回避後無敵 ${s.dodgeIframe.toFixed(2)}秒${s.drainChance?'　吸血 '+s.drainChance+'%':''}`,x+10,y+64);
    ctx.fillStyle='#8a82a2';ctx.font=`11px ${FONT}`;ctx.fillText(DATA.weaponTypes[s.weaponType].name+'：',x+10,y+84);
    ctx.fillStyle=rarColor(s.weaponRarity);ctx.font=`bold 13px ${FONT}`;ctx.fillText(s.weaponName,x+56,y+84);
    const st=[];if(p.slowT>0)st.push(['鈍足','#9ad8ff']);if(p.poisoned>0||p.poisonT>0)st.push(['毒','#a8e060']);if(p.paraT>0)st.push(['麻痺','#ffe040']);if(p.sleepT>0)st.push(['睡眠','#b898ff']);if(p.curseT>0)st.push(['呪い','#c070ff']);
    if(st.length){ctx.textAlign='right';ctx.font=`bold 12px ${FONT}`;let xx=x+300;for(const [t,c] of st.reverse()){ctx.fillStyle=c;ctx.fillText(t,xx,y+84);xx-=ctx.measureText(t).width+8;}ctx.textAlign='left';}
  },
  /** 下の枠の中身を作る。1人プレイは「回避（左下）・武器状態と回復（中央）・スキル名（右下）」 */
  boxData(p,keys,multi){
    const s=p.stats,wt=DATA.weaponTypes[s.weaponType]||{},bag=p.bag||{},sel=ITEM_ORDER[p.sel||0],ci=DATA.consumables[sel];
    // 武器の状態：チャージ段階／見切りの残り時間
    let wlabel=wt.name||'',wsub='',wfill=0,wcol='#ffd23a';
    if(wt.charge){
      const lv=p.charging?chargeLevel(wt.charge,p.charge):0,mx=wt.charge.levels.length;
      wlabel=p.charging?`チャージ${lv}/${mx}`:'チャージ';
      wsub='攻撃長押し';wfill=p.charging?clamp(p.charge/wt.charge.levels[mx-1],0,1):0;
      wcol=lv>=mx?'#ff6040':'#ffd23a';
    }else if(wt.flow){
      wlabel=`勢い ${p.flow||0}/${wt.flow.max}`;wsub=p.flow?`威力+${(p.flow||0)*wt.flow.pct}%`:'当て続けて上げる';
      wfill=(p.flow||0)/wt.flow.max;wcol=(p.flow||0)>=wt.flow.max?'#ff6040':'#ffd23a';
    }else if(wt.perfect){
      wlabel=p.buffT>0?`見切り ${Math.ceil(p.buffT)}秒`:'見切り';wsub='ギリギリ回避';wfill=p.buffT>0?p.buffT/wt.perfect.time:0;wcol='#ff6a6a';
    }else{wlabel=wt.name||'';wsub='アイテム発動が早い';}

  /** 枠1つの描画（名前・キー・クールタイム・効果時間） */
  drawBox(ctx,p,b,x,by,bw,bh){
    const ready=b.cd<=0&&!b.empty&&!p.dead;

    ctx.fillStyle=ready?b.col:'#6a6480';ctx.font=`bold 11px ${FONT}`;ctx.fillText(b.label,x+bw/2,by+bh*(sub?0.36:0.5));

      const k=clamp(b.cd/b.max,0,1);

    // 仲間（AI）の回避・武器・回復の枠は出さない。下の枠は人間のプレイヤーだけで決める
    const humans=all.filter(q=>!q.ai),ps=me?[me]:all,multi=humans.length>1;

    const hk=(settings.hudScale||CONFIG.hud.scale)*(touchUi?0.72:1);

    if(me)all.filter(p=>p!==me).forEach((p,i)=>this.drawMiniPanel(ctx,0,108+i*40,p));

    // 下：左＝回避、中央＝武器の状態・回復、右＝スキル名（1人プレイ）。複数人は従来どおり一列
    if(hb.length>1){
      const bw=84,bh=50,gw=bw*3+16,sp=30,total=gw*hb.length+sp*(hb.length-1);
      ctx.save();ctx.translate(W/2,H-14);ctx.scale(hk,hk);

      ctx.restore();

      ctx.save();ctx.translate(W/2,H-14);ctx.scale(hk,hk);

      ctx.restore();
      if(d.skill){ctx.save();ctx.translate(W-12,H-14);ctx.scale(hk,hk);this.drawBox(ctx,p,d.skill,-bw,-bh,bw,bh);ctx.restore();}
    }
    this.drawMinimap(ctx,w,hk);
    // ボスHPバー
    const b=bossOf(w);
    // ボス：体力は見せず、名前と様子だけを出す
    if(b&&b.state!=='sleep'){
      const conds=[];
      if(b.phase===2)conds.push(['怒り','#ff6060']);
      if(b.weakNoticed)conds.push(['弱っている','#ffb070']);
      if(b.trapT>0)conds.push([b.trapKind==='pit'?'落とし穴':'しびれ','#ffe040']);
      if(b.blindT>0)conds.push(['目がくらんでいる','#fff6a0']);
      if(b.state==='stunned')conds.push(['スタン','#ffe060']);
      const text=DATA.enemies[b.type].name,sub=conds.map(c=>c[0]).join('・');
      ctx.font=`bold 15px ${FONT}`;const tw=Math.max(ctx.measureText(text).width,ctx.measureText(sub).width*0.85)+40;
      const bx=W/2-tw/2,byy=W>980?18:H-120;
      this.panel(ctx,bx,byy,tw,sub?44:30);
      ctx.textAlign='center';ctx.fillStyle='#f3d48a';ctx.fillText(text,W/2,byy+15);
      if(sub){ctx.font=`bold 12px ${FONT}`;let x=W/2-ctx.measureText(sub).width/2;ctx.textAlign='left';
        conds.forEach((c,i)=>{const s=(i?'・':'')+c[0];ctx.fillStyle=c[1];ctx.fillText(s,x,byy+33);x+=ctx.measureText(s).width;});}
    }
    this.drawStatusFx(ctx,W,H);
    // 中央バナー
    if(this.flashT>0){ctx.globalAlpha=clamp(this.flashT/0.5,0,1)*0.6;ctx.fillStyle='#fffbe0';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
    if(this.banner){
      const bn=this.banner,a=bn.t<0.3?bn.t/0.3:(bn.t>bn.life-0.5?(bn.life-bn.t)/0.5:1);
      ctx.globalAlpha=clamp(a,0,1);ctx.textAlign='center';ctx.font=`bold 30px ${FONT}`;
      ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.8)';ctx.strokeText(bn.text,W/2,H*0.3);
      ctx.fillStyle=bn.color;ctx.fillText(bn.text,W/2,H*0.3);ctx.globalAlpha=1;
    }
    this.drawItemWheel(ctx,w);
  },
  /** 持ち物ホイール（RB長押し）：11種類を円に並べ、右スティックの向きで選ぶ */
  drawItemWheel(ctx,w){
    const wh=Input.wheel;if(!wh||!wh.open)return;
    const W=this.w,H=this.h,cx=W/2,cy=H/2,R=Math.min(W,H)*0.2,ri=R*0.42;
    const p=w.players[wh.pid]||null,bag=(p&&p.bag)||{};
    const ids=ownedItemIds(bag),NW=Math.max(1,ids.length),stepW=2*Math.PI/NW;
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,W,H);
    for(let i=0;i<ids.length;i++){
      const id=ids[i],c=DATA.consumables[id],n=bag[id]||0,on=wh.sel===i,has=true;
      const a0=-Math.PI/2+(i-0.5)*stepW,a1=a0+stepW,am=a0+stepW/2;
      ctx.beginPath();ctx.arc(cx,cy,R,a0,a1);ctx.arc(cx,cy,ri,a1,a0,true);ctx.closePath();
      ctx.fillStyle=on?'rgba(255,210,58,.9)':(has?'rgba(30,26,40,.9)':'rgba(30,26,40,.5)');ctx.fill();
      ctx.strokeStyle=c.color;ctx.lineWidth=on?4:2;ctx.stroke();
      const tx=cx+Math.cos(am)*(R+ri)/2,ty=cy+Math.sin(am)*(R+ri)/2;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=on?'#1a1420':(has?'#fff':'#777');ctx.font='bold 13px sans-serif';ctx.fillText(c.short||c.name,tx,ty-7);
      ctx.fillStyle=on?'#1a1420':(has?c.color:'#666');ctx.font='12px sans-serif';ctx.fillText('×'+n,tx,ty+9);
    }
    const cur=ITEM_ORDER[(p&&p.sel)||0],sid=(wh.sel!=null&&ids[wh.sel])?ids[wh.sel]:(ids.includes(cur)?cur:ids[0]),sc=DATA.consumables[sid];
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.fillText(sc.name,cx,cy-6);
    ctx.fillStyle='#ccc';ctx.font='11px sans-serif';ctx.fillText('右スティックで選び、離すと決定',cx,cy+10);
    ctx.restore();
  },
};

    size=size||40;const k=id+'|'+(silhouette?1:0)+'|'+size;

/* ===================== 6.5 音（BGM・効果音） =====================
   音声ファイルは使わず、Web Audio でその場で合成する（オフラインでも鳴る）。
   ・BGM：曲は BGM_DATA のデータ（コード進行・メロディ・リズム）から、小節ごとに先読みして鳴らす。
   ・効果音：ゲームの出来事（イベント）に合わせて Sound.onEvent が鳴らす。ホストでも参加者でも同じ。
   ・ブラウザの決まりで、最初にキー・クリックなどの操作があるまで音は出ない。 */
const NOTE_INDEX={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function noteMidi(n){
  const m=/^([A-G])([#b]?)(-?\d)$/.exec(n);if(!m)return null;
  return NOTE_INDEX[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+(parseInt(m[3],10)+1)*12;
}
const midiFreq=m=>440*Math.pow(2,(m-69)/12);
function chordOf(sym){
  const m=/^([A-G])([#b]?)(m?)$/.exec(sym);
  const root=(NOTE_INDEX[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+12)%12;
  return {root,iv:[0,m[3]?3:4,7]};
}
/** 'D4:1.5 A4:.5 r:1|...' を小節ごとの [{m:midi|null,d:拍}] に */
function parseMelody(s){
  if(!s)return null;
  return s.split('|').map(bar=>bar.trim().split(/\s+/).filter(Boolean).map(tok=>{const [n,d]=tok.split(':');return {m:n==='r'?null:noteMidi(n),d:parseFloat(d)};}));
}

const Sound={
  ctx:null,ready:false,bgmVol:0.7,sfxVol:0.8,cur:null,last:{},lx:0,ly:0,
  init(){
    if(this.ctx)return;
    const AC=typeof window!=='undefined'&&(window.AudioContext||window.webkitAudioContext);if(!AC)return;
    try{
      const c=this.ctx=new AC();
      this.comp=c.createDynamicsCompressor();this.comp.threshold.value=-14;this.comp.ratio.value=4;this.comp.connect(c.destination);
      this.master=c.createGain();this.master.connect(this.comp);
      this.music=c.createGain();this.music.connect(this.master);
      this.sfx=c.createGain();this.sfx.connect(this.master);
      // 残響（ホールのような響き）：減衰するノイズをインパルス応答にする
      this.rev=c.createConvolver();const len=Math.floor(c.sampleRate*2.4),ir=c.createBuffer(2,len,c.sampleRate);
      for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}
      this.rev.buffer=ir;this.revOut=c.createGain();this.revOut.gain.value=0.9;this.rev.connect(this.revOut);this.revOut.connect(this.master);
      this.musicRev=c.createGain();this.musicRev.gain.value=0.32;this.music.connect(this.musicRev);this.musicRev.connect(this.rev);
      this.sfxRev=c.createGain();this.sfxRev.gain.value=0.12;this.sfx.connect(this.sfxRev);this.sfxRev.connect(this.rev);
      const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
      this.noiseBuf=nb;
      this.applyVolumes();
      this.ready=true;
    }catch(e){console.warn('音を初期化できませんでした',e);this.ctx=null;}
  },
  /** 最初の操作で音を出せるようにする（ブラウザの自動再生の決まり） */
  unlock(){this.init();if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  setVolumes(bgm,sfx){this.bgmVol=bgm;this.sfxVol=sfx;this.applyVolumes();},
  /* 設定の音量はすべて半分の大きさで鳴らす（スライダーの最大が、実際の半分の音量になる） */
  applyVolumes(){if(!this.ctx)return;const t=this.ctx.currentTime;this.music.gain.setTargetAtTime(this.bgmVol*0.9*VOL_SCALE,t,0.05);this.sfx.gain.setTargetAtTime(this.sfxVol*VOL_SCALE,t,0.05);},
  now(){return this.ctx?this.ctx.currentTime:0;},

  /* ---------- 音を作る部品 ---------- */
  /** 楽器の1音 */
  voice(dest,inst,t,midi,dur,vel){
    const c=this.ctx,I=INSTRUMENTS[inst],f=midiFreq(midi),peak=I.vol*(vel==null?1:vel),a=I.a,r=I.r;
    const g=c.createGain();g.connect(dest);
    let tgt=g;
    if(I.lp){
      const fl=c.createBiquadFilter();fl.type='lowpass';fl.Q.value=I.q||0.7;fl.frequency.setValueAtTime(I.lp,t);
      if(I.lpEnv){fl.frequency.linearRampToValueAtTime(I.lpEnv,t+a+0.02);fl.frequency.setTargetAtTime(I.lp*1.3,t+a+0.03,Math.max(0.05,dur*0.5));}
      fl.connect(g);tgt=fl;
    }
    const end=t+dur+r*2;
    for(const [type,mul,det,v] of I.osc){
      const o=c.createOscillator();o.type=type;o.frequency.value=f*mul;o.detune.value=det||0;
      if(I.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=I.vib[0];lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(I.vib[1],t+Math.min(0.4,dur*0.6));l.connect(lg);lg.connect(o.detune);l.start(t);l.stop(end);}
      const og=c.createGain();og.gain.value=v;o.connect(og);og.connect(tgt);o.start(t);o.stop(end);
    }
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+a);
    g.gain.setTargetAtTime(peak*I.s+0.0001,t+a,Math.max(0.01,I.d/3));
    g.gain.setTargetAtTime(0.0001,t+Math.max(a,dur),r/3);
  },
  /** 単音（効果音用）。slide で音程が動く */
  tone(dest,t,f,dur,o){
    o=o||{};const c=this.ctx,osc=c.createOscillator(),g=c.createGain();
    osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);
    if(o.to)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+(o.slide||dur));
    let tgt=g;
    if(o.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;fl.connect(g);tgt=fl;}
    osc.connect(tgt);g.connect(dest);
    const a=o.a||0.004,v=o.vol||0.2;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    osc.start(t);osc.stop(t+dur+0.05);
  },
  /** ノイズ（打撃・風切り・爆発など）。bp/lp/hp でフィルター、sweep で周波数を動かす */
  noise(dest,t,dur,o){
    o=o||{};const c=this.ctx,src=c.createBufferSource(),g=c.createGain();
    src.buffer=this.noiseBuf;src.loop=true;
    const fl=c.createBiquadFilter();fl.type=o.hp?'highpass':o.lp?'lowpass':'bandpass';
    const f0=o.hp||o.lp||o.bp||1000;fl.frequency.setValueAtTime(f0,t);fl.Q.value=o.q||(o.bp?1.2:0.7);
    if(o.to)fl.frequency.exponentialRampToValueAtTime(Math.max(30,o.to),t+(o.slide||dur));
    src.connect(fl);fl.connect(g);g.connect(dest);
    const a=o.a||0.003,v=o.vol||0.2;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.start(t,Math.random()*1.5);src.stop(t+dur+0.05);
  },

  timpani(dest,t,midi,vel){const f=midiFreq(midi);this.tone(dest,t,f*1.25,0.9,{to:f,slide:0.06,vol:0.42*vel});this.tone(dest,t,f*1.5,0.5,{to:f*1.48,vol:0.08*vel});this.noise(dest,t,0.12,{lp:500,vol:0.15*vel});},
  taiko(dest,t,vel){this.tone(dest,t,95,0.55,{to:42,slide:0.25,vol:0.6*vel});this.noise(dest,t,0.18,{bp:180,q:0.8,vol:0.3*vel});},
  snare(dest,t,vel){this.noise(dest,t,0.16,{bp:1900,q:0.7,vol:0.2*vel});this.tone(dest,t,210,0.08,{to:150,vol:0.1*vel,type:'triangle'});},
  hat(dest,t,vel){this.noise(dest,t,0.045,{hp:7000,vol:0.06*vel});},
  crash(dest,t,vel){this.noise(dest,t,1.8,{hp:4200,vol:0.13*vel});this.noise(dest,t,0.6,{bp:6000,vol:0.06*vel});},

  /* ---------- BGM ---------- */
  /** 曲を切り替える（同じ曲なら何もしない）。null で止める */
  playMusic(id,fade){
    if(!this.ready)return;
    if(this.cur&&this.cur.id===id)return;
    fade=fade==null?1.0:fade;
    const t=this.now();
    if(this.cur){
      const old=this.cur;old.stopped=true;clearInterval(old.timer);
      old.gain.gain.cancelScheduledValues(t);old.gain.gain.setValueAtTime(old.gain.gain.value,t);old.gain.gain.linearRampToValueAtTime(0.0001,t+fade);
      setTimeout(()=>{try{old.gain.disconnect();}catch(e){}},(fade+3)*1000);
    }
    this.cur=null;
    if(!id||!BGM_DATA[id])return;
    const T=BGM_DATA[id],g=this.ctx.createGain();g.connect(this.music);
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(T.vol,t+Math.min(0.6,fade));
    const inst={id,T,gain:g,seq:0,bar:0,next:t+0.08,stopped:false};
    inst.timer=setInterval(()=>this.pump(inst),40);
    this.cur=inst;this.pump(inst);
  },
  /** 先読みして、もうすぐ鳴らす小節を予約する */
  pump(inst){
    if(inst.stopped||!this.ctx)return;
    const now=this.now();
    if(inst.next<now-0.5)inst.next=now+0.05; // タブが裏に回って遅れたときは追いつかせる
    while(inst.next<now+0.35){
      const T=inst.T,key=T.seq[inst.seq],P=T.parts[key];
      this.scheduleBar(inst,P,inst.bar,inst.next);
      inst.next+=4*60/T.bpm;
      inst.bar++;
      if(inst.bar>=P._ch.length){inst.bar=0;inst.seq++;if(inst.seq>=T.seq.length)inst.seq=T.loopFrom;}
    }
  },
  scheduleBar(inst,P,bi,t0){
    const T=inst.T,beat=60/T.bpm,step=beat/4,out=inst.gain,ch=P._ch[bi],R=ch.root;
    const last=bi===P._ch.length-1;
    // 和音（伸ばす）
    if(P.pad)for(const iv of ch.iv){let m=(iv===0?48:60)+R+iv;if(m>74)m-=12;this.voice(out,P.pad,t0,m,beat*4*0.98,iv===0?0.8:1);}
    // 分散和音
    if(P.arp){
      const tones=[60+R,60+R+ch.iv[1],60+R+7,72+R].map(m=>m>79?m-12:m);
      if(P.arp==='pizz8')[0,1,2,3,2,1,2,1].forEach((k,i)=>this.voice(out,'pizz',t0+i*beat/2,tones[k],beat*0.45,i%2?0.75:1));
      else [0,2,0,1].forEach((k,i)=>this.voice(out,'pizz',t0+i*beat,tones[k]-12,beat*0.8,1));
    }
    // 16分音符の刻み（緊張感）
    if(P.ost){const pat=[0,0,12,0,0,0,12,7,0,0,12,0,0,7,12,7];pat.forEach((o,i)=>this.voice(out,'ost',t0+i*step,48+R+o,step*0.9,i%4===0?1:0.7));}
    // 低音
    if(P.bass){let b=36+R;if(b>43)b-=12;
      if(P.bass==='8')for(let i=0;i<8;i++)this.voice(out,'bass',t0+i*beat/2,b+(i%2?12:0),beat*0.45,i%2?0.7:1);
      else for(let i=0;i<4;i++)this.voice(out,'bass',t0+i*beat,b,beat*0.9,1);}
    // 和音の刻み（金管）
    if(P.stab)for(let i=0;i<16;i++)if(P.stab[i]==='x')for(const iv of ch.iv)this.voice(out,'stab',t0+i*step,60+R+iv>74?48+R+iv:60+R+iv,step*1.5,1);
    // 旋律
    const mel=P._mel||(P.melFrom?inst.T.parts[P.melFrom]._mel:null);
    if(mel&&mel[bi]){
      let tt=t0;const oct=(P.oct||0)*12;
      for(const n of mel[bi]){
        if(n.m!=null){
          this.voice(out,P.inst,tt,n.m+oct,n.d*beat*0.95,1);
          if(P.mel2)this.voice(out,P.mel2[0],tt,n.m+oct+P.mel2[1]*12,n.d*beat*0.95,0.7);
        }
        tt+=n.d*beat;
      }
    }
    if(P.bell&&bi%2===0)this.voice(out,'bell',t0,72+R,beat*3,1);
    // 打楽器
    const D=DRUMS[P.drums]||{};
    let tm=36+R;if(tm<41)tm+=12;
    for(let i=0;i<16;i++){
      const t=t0+i*step,acc=i%4===0?1:0.7;
      if(D.timp&&D.timp[i]==='x')this.timpani(out,t,tm,acc);
      if(D.taiko&&D.taiko[i]==='x')this.taiko(out,t,acc);
      if(D.snare&&D.snare[i]==='x')this.snare(out,t,acc);
      if(D.hat&&D.hat[i]==='x')this.hat(out,t,acc);
    }
    if((D.crash&&bi===0)||(P.crash&&bi%P.crash===0))this.crash(out,t0,1);
    if(P.fill&&last)for(let i=12;i<16;i++)for(let k=0;k<2;k++)this.snare(out,t0+i*step+k*step/2,0.4+0.15*(i-12));
  },

  /* ---------- 短い曲（クリア・討伐・失敗） ---------- */
  jingle(kind){
    if(!this.ready)return;
    this.playMusic(null,0.4);
    const t=this.now()+0.1,o=this.music,b=60/120;
    const mel=(notes,inst,t0)=>{let tt=t0;for(const [n,d] of notes){if(n)this.voice(o,inst,tt,noteMidi(n),d*b*0.95,1);tt+=d*b;}};
    if(kind==='clear'){
      mel([['C5',0.5],['C5',0.25],['C5',0.25],['G5',1],['E5',0.5],['G5',0.5],['C6',2.5]],'horn',t);
      mel([['C4',0.5],['C4',0.25],['C4',0.25],['E4',1],['C4',0.5],['E4',0.5],['G4',2.5]],'horn',t);
      for(const m of [48,64,67,72])this.voice(o,'pad',t+3*b,m,b*2.5,1.4);
      this.timpani(o,t,48,1);this.timpani(o,t+b,48,0.8);this.timpani(o,t+2*b,43,0.9);this.timpani(o,t+3*b,48,1.2);this.crash(o,t+3*b,1.2);
    }else if(kind==='hunt'){
      mel([['G4',0.25],['C5',0.25],['E5',0.25],['G5',1.5]],'horn',t);
      for(let i=0;i<8;i++)this.timpani(o,t+i*b/8,43,0.5+i*0.06);
      this.timpani(o,t+b,48,1.3);this.crash(o,t+b,1.2);
      for(const m of [48,60,64,67])this.voice(o,'strings',t+b,m,b*2,1.2);
    }else if(kind==='fail'){
      mel([['G4',1],['Eb4',1],['D4',1],['C4',3]],'horn',t);
      for(const m of [36,48,51,55])this.voice(o,'pad',t+3*b,m,b*3,1.3);
      this.timpani(o,t+3*b,36,1.2);
    }
  },

  /** ガチャの溜め：太鼓がだんだん速くなる */
  gachaRoll(sec){
    if(!this.ready||this.ctx.state!=='running')return;
    const t0=this.now()+0.02,end=t0+(sec||1);
    let tt=t0,iv=0.09,i=0;
    while(tt<end){this.timpani(this.sfx,tt,43,Math.min(1.2,0.35+i*0.03));tt+=iv;iv=Math.max(0.035,iv-0.004);i++;}
    this.timpani(this.sfx,end,48,1.1);
  },
  /** ガチャの結果。レア度が高いほど派手な音 */
  gachaResult(rar){
    if(!this.ready||this.ctx.state!=='running')return;
    const t=this.now()+0.01,d=this.sfx;
    const note=(m,tt,dur,v)=>this.voice(d,'horn',tt,m,dur,v==null?1:v);
    if(rar==='N'){
      this.tone(d,t,midiFreq(72),0.18,{type:'triangle',vol:0.3});
    }else if(rar==='R'){
      note(72,t,0.2,0.9);note(76,t+0.12,0.3,0.9);
    }else if(rar==='SR'){
      [72,76,79,84].forEach((m,i)=>note(m,t+i*0.07,0.35,1));
      this.voice(d,'strings',t+0.3,60,1,0.9);this.crash(d,t+0.28,0.5);
    }else{
      // SSR（ペット含む）：ファンファーレ
      let tt=t;
      for(const [m,dd] of [[72,0.2],[76,0.2],[79,0.2],[84,0.5],[83,0.2],[84,0.8]]){note(m,tt,dd*0.95,1);tt+=dd;}
      for(const m of [48,60,64,67])this.voice(d,'pad',t+1.0,m,1.2,1.0);
      this.timpani(d,t,48,1);this.crash(d,t+0.9,1.1);
    }
  },

  /* ---------- 効果音 ---------- */
  /** 画面の中心（自分のキャラ）から遠い音は小さく。同じ音の連打は間引く */
  sfxGain(key,x,y,gap){
    const t=this.now();
    if(gap&&this.last[key]&&t-this.last[key]<gap)return 0;
    this.last[key]=t;
    if(x==null)return 1;
    const d=Math.hypot(x-this.lx,y-this.ly);
    return clamp(1.15-d/700,0,1);
  },
  play(name,x,y,opt){
    if(!this.ready||this.ctx.state!=='running')return;
    const fx=SFX[name];if(!fx)return;
    const k=this.sfxGain(name,x,y,fx.gap);if(k<=0.02)return;
    fx.play(this,this.sfx,this.now()+0.005,k,opt||{});
  },
  /** ゲームの出来事に合わせて効果音を鳴らす */
  onEvent(ev){
    if(!this.ready)return;
    const x=ev.x,y=ev.y;
    switch(ev.type){
      case 'swing':this.play(ev.level>0?'swingHeavy':'swing',x,y,{w:ev.w,level:ev.level});break;
      case 'damage':
        if(ev.target==='player')this.play(ev.dot?'dot':'hurt',x,y);
        else this.play(ev.guard?'guard':ev.crit?'crit':'hit',x,y,{head:ev.head});
        break;
      case 'kill':if(!ev.noCount)this.play(ev.boss?'bossKill':'kill',x,y);else this.play('crumble',x,y);break;
      case 'dodge':this.play('dodge',x,y);break;
      case 'perfectDodge':this.play('perfect',x,y);break;
      case 'justDodge':this.play('perfect',x,y);break;
      case 'chest':this.play('chest',x,y);break;
      case 'gather':this.play('gather',x,y);break;
      case 'loot':this.play('loot',x,y);break;
      case 'itemStart':this.play('itemStart',x,y);break;
      case 'heal':if(!ev.drain)this.play('heal',x,y);break;
      case 'buff':this.play('horn',x,y);break;
      case 'flash':this.play('flash',x,y);break;
      case 'explode':this.play('explode',x,y);break;
      case 'trapped':this.play(ev.kind==='pit'?'pit':'shock',x,y);break;
      case 'placed':this.play('placed',x,y);break;
      case 'shoot':this.play('shoot',x,y);break;
      case 'tgResolve':if(ev.shape==='circle'&&!ev.small)this.play('slam',x,y);else if(!ev.small)this.play('heavySwing',x,y);break;
      case 'bump':this.play('slam',x,y);break;
      case 'bossStart':this.play('roar',null,null,{big:false});break;
      case 'enrage':this.play('roar',null,null,{big:true});break;
      case 'roarWave':this.play('roar',x,y,{short:true});break;
      case 'bossStun':this.play('stun',x,y);break;
      case 'doorClose':this.play('door');break;
      case 'playerDead':this.play('down',x,y);break;
      case 'revive':this.play('revive',x,y);break;
      case 'flowMax':this.play('powerUp',x,y);break;
      case 'draw':this.play('draw',x,y);break;
      case 'sheathe':this.play('sheathe',x,y);break;
      case 'itemFail':this.play('fail',x,y);break;
      case 'itemCancel':this.play('cancel',x,y);break;
      case 'slowed':this.play('slowed',x,y);break;
      case 'spore':this.play('spore',x,y);break;
      case 'slimeLand':this.play('squish',x,y);break;
      case 'heavySwing':this.play('heavySwing',x,y);break;
      case 'empower':this.play('empower',x,y);break;
      case 'revived':this.play('revived',x,y);break;
      case 'interrupt':this.play('interrupt',x,y);break;
      case 'summon':this.play('summon',x,y);break;
      case 'skill':this.play('swingHeavy',x,y,{w:'sword',level:1});break;
      case 'bossDefeated':this.jingle('hunt');break;
    }
  },
  ui(kind){this.play(kind==='move'?'uiMove':kind==='back'?'uiBack':'uiClick');},
};
