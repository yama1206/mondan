  revived:{gap:0.3,play(S,o,t,k){for(const m of [52,55,59])S.voice(o,'choir',t,m,0.8,1.2*k);}},
  interrupt:{gap:0.2,play(S,o,t,k){S.noise(o,t,0.15,{hp:3000,vol:0.2*k});S.tone(o,t,2000,0.12,{to:900,vol:0.08*k});}},
  summon:{gap:0.3,play(S,o,t,k){S.tone(o,t,80,0.9,{to:58,vol:0.2*k,type:'sawtooth',lp:320});S.noise(o,t,0.7,{lp:420,vol:0.15*k});}},
  chargeTick:{gap:0.05,play(S,o,t,k,p){const f=[660,880,1180][Math.max(0,(p.level||1)-1)]||1180;S.tone(o,t,f,0.12,{vol:0.1*k,type:'triangle'});S.tone(o,t,f*2,0.1,{vol:0.03*k});}},
  chargeOver:{gap:0.2,play(S,o,t,k){S.tone(o,t,300,0.15,{to:200,vol:0.07*k,type:'square',lp:900});}},
  uiClick:{gap:0.03,play(S,o,t){S.tone(o,t,880,0.05,{vol:0.05,type:'triangle'});}},
  uiMove:{gap:0.03,play(S,o,t){S.tone(o,t,660,0.03,{vol:0.03,type:'triangle'});}},
  uiBack:{gap:0.03,play(S,o,t){S.tone(o,t,520,0.06,{to:400,vol:0.05,type:'triangle'});}},
};

/* ===================== 7. 入力 ===================== */
/* 入力はプレイヤーID（'p1','p2'）ごとにまとめ、ワールドへは {p1:入力, p2:入力} の形で渡す。
   オンライン化時はこの入力を通信で送受信すればよい。 */
const newEdges=()=>({dodge:false,skill:false,heal:false,cycle:0,pick:-1,sheathe:false,cure:false});
const Input={
  keys:Object.create(null),mouse:{x:0,y:0,down:false},
  edges:{p1:newEdges(),p2:newEdges()},
  coop:false,                       // 2人プレイ中か
  assign:{p1:null,p2:null},         // 各プレイヤーに割り当てたコントローラー番号（null=キーボード）
  aimMode:{p1:'mouse',p2:'move'},   // 'mouse' | 'pad' | 'move'（移動方向を向く）
  lastAim:{p1:0,p2:0},
  uiPad:false,                      // メニューをコントローラーで操作中か（フォーカス枠の表示用）
  padState:{},                      // コントローラー番号ごとの状態
  navDir:null,navT:0,
  init(cv){
    const block=new Set(['Space','KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE','KeyR','KeyI','Escape','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab','Slash','Period','Comma','Enter','NumpadEnter','ShiftRight','KeyF']);
    window.addEventListener('keydown',e=>{
      const tg=e.target&&e.target.tagName;
      if(tg==='INPUT'||tg==='TEXTAREA'){if(e.code==='Escape')App.onKey('Escape');return;} // 名前やコードの入力中はゲーム操作にしない
      if(block.has(e.code))e.preventDefault();
      this.keys[e.code]=true;
      if(!e.repeat)App.onKey(e.code);
    });
    window.addEventListener('keyup',e=>{this.keys[e.code]=false;});
    window.addEventListener('mousemove',e=>{this.mouse.x=e.clientX;this.mouse.y=e.clientY;this.onMouse();});
    cv.addEventListener('mousedown',e=>{if(e.button===2&&!this.isTouch)this.mouse.rdown=true;if(e.button===0&&!this.isTouch){this.mouse.down=true;this.mouse.x=e.clientX;this.mouse.y=e.clientY;this.onMouse();}});
    window.addEventListener('mouseup',e=>{if(e.button===0)this.mouse.down=false;if(e.button===2)this.mouse.rdown=false;});
    cv.addEventListener('contextmenu',e=>e.preventDefault());
    // マウスホイールで持ち物を切り替え
    cv.addEventListener('wheel',e=>{if(App.state==='playing'){e.preventDefault();this.edges.p1.cycle=e.deltaY<0?-1:1;}},{passive:false});
    window.addEventListener('blur',()=>{this.reset();App.onBlur();});
    window.addEventListener('gamepadconnected',e=>this.onConnect(e.gamepad));
    window.addEventListener('gamepaddisconnected',e=>this.onDisconnect(e.gamepad));
  },
  reset(){this.keys=Object.create(null);this.mouse.down=false;this.mouse.rdown=false;this.touch.mx=0;this.touch.my=0;this.touch.attack=false;this.touch.guard=false;this.consumeEdges();},
  /* ---------- スマホ・タブレット（画面の左にスティック、右にボタン） ---------- */
  touch:{mx:0,my:0,attack:false,guard:false,swipeAng:null,sx:0,sy:0},
  isTouch:false,touchRoot:null,
  /** 画面の操作は、このPCで操作する人（オンラインの参加者なら自分）に送る */
  // 自分の端末の操作は、ホストでも参加者でも常に 'p1' として読み取る（参加者の sample も 'p1' で呼ぶため。ここを参加者のpidにすると、スマホのスティックやボタンが届かない）
  touchPid(){return 'p1';},
  touchEdge(k){
    const pid=this.touchPid(),E=this.edges[pid]||(this.edges[pid]=newEdges());
    if(k==='dodge')E.dodge=true;else if(k==='skill')E.skill=true;else if(k==='heal')E.heal=true;
    else if(k==='cycle')E.cycle=1;else if(k==='sheathe')E.sheathe=true;
  },
  initTouch(){
    this.touchRoot=document.getElementById('touch');
    if(!this.touchRoot)return;
    this.applyTouchLayout();
    // 配置の編集中：ボタンをドラッグして動かす（操作はしない）
    const root0=this.touchRoot;let drag=null;
    const bindBar=(id,fn)=>{const b=document.getElementById(id);if(b)b.addEventListener('click',fn);};
    bindBar('teMinus',()=>this.setTouchScale(this.editSel,-0.1));
    bindBar('tePlus',()=>this.setTouchScale(this.editSel,0.1));
    root0.addEventListener('pointerdown',e=>{
      if(!document.body.classList.contains('touch-edit'))return;
      const el=e.target.closest('.tb,.stick');if(!el)return;
      e.preventDefault();e.stopPropagation();
      const r=el.getBoundingClientRect();
      const key=el.classList.contains('stick')?'stick':el.dataset.tk;
      this.selectTouchEdit(key);
      drag={el,key,dx:e.clientX-r.left,dy:e.clientY-r.top,w:r.width,h:r.height,id:e.pointerId};
      try{el.setPointerCapture(e.pointerId);}catch(err){}
    },true);
    root0.addEventListener('pointermove',e=>{
      if(!drag||e.pointerId!==drag.id)return;
      const left=clamp(e.clientX-drag.dx,0,innerWidth-drag.w),top=clamp(e.clientY-drag.dy,0,innerHeight-drag.h);
      if(drag.key==='stick'){drag.el.style.left=left+'px';drag.el.style.bottom=(innerHeight-top-drag.h)+'px';}
      else{drag.el.style.right=(innerWidth-left-drag.w)+'px';drag.el.style.bottom=(innerHeight-top-drag.h)+'px';}
    });
    const endDrag=e=>{
      if(!drag||e.pointerId!==drag.id)return;
      const pos=this.touchPos();
      if(drag.key==='stick')pos.stick={...(pos.stick||{}),l:parseFloat(drag.el.style.left),b:parseFloat(drag.el.style.bottom)};
      else pos[drag.key]={...(pos[drag.key]||{}),r:parseFloat(drag.el.style.right),b:parseFloat(drag.el.style.bottom)};
      this.saveTouchPos(pos);drag=null;
    };
    root0.addEventListener('pointerup',endDrag);root0.addEventListener('pointercancel',endDrag);
    // 実際に画面をタッチしたときだけ、スマホ向けの操作を出す（タッチ対応のPCでは、マウスで遊ぶ限り出さない）
    const enable=()=>{if(this.isTouch)return;this.isTouch=true;document.body.classList.add('touch');this.syncTouchUi(App.state==='playing');
      try{if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{});}catch(e){}};
    window.addEventListener('touchstart',enable,{passive:true,capture:true});
    const root=this.touchRoot,stick=root.querySelector('.stick'),knob=root.querySelector('.knob');
    let sid=null;
    const moveStick=e=>{
      const r=stick.getBoundingClientRect(),R=r.width/2-14;
      let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
      const m=Math.hypot(dx,dy);if(m>R){dx*=R/m;dy*=R/m;}
      knob.style.transform=`translate(${dx}px,${dy}px)`;
      const n=Math.hypot(dx,dy)/R;
      this.touch.mx=n<0.15?0:dx/R;this.touch.my=n<0.15?0:dy/R;
    };
    stick.addEventListener('pointerdown',e=>{e.preventDefault();sid=e.pointerId;stick.setPointerCapture(sid);this.aimMode[this.touchPid()]='pad';moveStick(e);});
    stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)moveStick(e);});
    const stickEnd=e=>{if(e.pointerId!==sid)return;sid=null;knob.style.transform='';this.touch.mx=0;this.touch.my=0;};
    stick.addEventListener('pointerup',stickEnd);stick.addEventListener('pointercancel',stickEnd);
    root.querySelectorAll('.tb').forEach(b=>{
      const k=b.dataset.tk;
      b.addEventListener('pointerdown',e=>{
        e.preventDefault();b.classList.add('on');
        if(k==='menu'){App.onKey('Escape');return;}
        this.aimMode[this.touchPid()]='pad';
        if(k==='attack'){this.touch.attack=true;this.touch.sx=e.clientX;this.touch.sy=e.clientY;b.setPointerCapture(e.pointerId);}
        else if(k==='guard'){this.touch.guard=true;b.setPointerCapture(e.pointerId);}
        else this.touchEdge(k);
      });
      // 攻撃ボタンを押したまま指を動かすと、押した位置からの向きで攻撃方向を決める
      if(k==='attack')b.addEventListener('pointermove',e=>{if(!this.touch.attack)return;const dx=e.clientX-this.touch.sx,dy=e.clientY-this.touch.sy;if(Math.hypot(dx,dy)>=18)this.touch.swipeAng=Math.atan2(dy,dx);});
      const up=()=>{b.classList.remove('on');if(k==='attack')this.touch.attack=false;if(k==='guard')this.touch.guard=false;};
      b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);
    });
  },
  /** プレイ中だけ画面のボタンを表示する */
  syncTouchUi(playing){if(this.touchRoot)this.touchRoot.classList.toggle('on',!!playing&&this.isTouch);},
  dropTouch(){this.isTouch=false;document.body.classList.remove('touch');this.syncTouchUi(false);},
  /** ボタンの位置（端末ごとに保存）。ボタン名 → {r,b}（スティックは {l,b}） */
  touchPos(){try{return JSON.parse(localStorage.getItem('kourou_touch_pos')||'{}')||{};}catch(e){return {};}},
  saveTouchPos(pos){try{localStorage.setItem('kourou_touch_pos',JSON.stringify(pos));}catch(e){}},
  /** 編集中に選んだボタン（キー）。選んでいないときは null */
  editSel:null,
  selectTouchEdit(key){
    this.editSel=key;
    document.querySelectorAll('#touch .sel').forEach(el=>el.classList.remove('sel'));
    const el=key==='stick'?this.touchRoot&&this.touchRoot.querySelector('.stick'):this.touchRoot&&this.touchRoot.querySelector(`.tb[data-tk="${key}"]`);
    if(el)el.classList.add('sel');
    this.updateEditBar();
  },
  /** 選んだボタンの大きさ（50%〜200%）を、0.1ずつ変える */
  setTouchScale(key,delta){
    if(!key)return;
    const pos=this.touchPos(),q=pos[key]||{};
    q.s=clamp(Math.round(((q.s||1)+delta)*10)/10,0.5,2);
    pos[key]=q;this.saveTouchPos(pos);this.applyTouchLayout();
  },
  updateEditBar(){
    const bar=document.getElementById('touchEditBar');if(!bar)return;
    const key=this.editSel,names={attack:'攻撃',dodge:'回避',skill:'スキル',heal:'回復',cycle:'持ち物',sheathe:'納刀',guard:'ガード',menu:'メニュー',stick:'移動スティック'};
    bar.classList.toggle('te-on',!!key);
    if(!key)return;
    const q=this.touchPos()[key]||{};
    document.getElementById('teSel').textContent=names[key]||key;
    document.getElementById('teVal').textContent=Math.round((q.s||1)*100)+'%';
  },
  /** 設定の大きさ・透過度と、保存された位置をボタンに反映する */
  applyTouchLayout(){
    const root=this.touchRoot;if(!root)return;
    const s=(App.profile&&App.profile.settings)||{};
    root.style.setProperty('--ts',String(s.touchSize||1));
    root.style.setProperty('--to',String(s.touchAlpha!=null?s.touchAlpha:0.85));
    const pos=this.touchPos();
    root.querySelectorAll('.tb').forEach(el=>{const q=pos[el.dataset.tk];el.style.right=q?q.r+'px':'';el.style.bottom=q?q.b+'px':'';
      el.style.transformOrigin='100% 100%';el.style.transform=q&&q.s&&q.s!==1?`scale(${q.s})`:'';});
    const st=root.querySelector('.stick');
    if(st){if(pos.stick){st.style.left=pos.stick.l+'px';st.style.bottom=pos.stick.b+'px';}else{st.style.left='';st.style.bottom='';}
      st.style.transformOrigin='0 100%';st.style.transform=pos.stick&&pos.stick.s&&pos.stick.s!==1?`scale(${pos.stick.s})`:'';}
    this.updateEditBar();
  },
  consumeEdges(){this.edges.p1=newEdges();this.edges.p2=newEdges();},
  onMouse(){
    if(this.isTouch)return; // 画面をタッチしたときのマウス扱いは無視する
    this.setUiPad(false);
    this.aimMode.p1='mouse'; // マウスは常に1P
  },
  setUiPad(v){
    if(this.uiPad===v)return;
    this.uiPad=v;
    if(document.body&&document.body.classList)document.body.classList.toggle('pad',v);
    if(!v)UI.clearFocus();else UI.restoreFocus();
  },
  /* ---------- ゲームパッド（Gamepad API・標準配列） ----------
     0:A/× 1:B/○ 2:X/□ 3:Y/△ 4:LB/L1 5:RB/R1 6:LT/L2 7:RT/R2 8:BACK 9:START 12-15:十字キー */
  getPads(){
    try{
      const pads=navigator.getGamepads?navigator.getGamepads():[];
      return [...pads].filter(g=>g&&g.connected).sort((a,b)=>a.index-b.index);
    }catch(e){return [];}
  },
  anyPad(){return this.getPads().length>0;},
  /** このコントローラーで操作するプレイヤー。1人プレイ中はどのコントローラーでも1P */
  /** ホイールに並べる持ち物（そのプレイヤーが持っている消耗品だけ） */
  wheelIds(pid){
    const w=App.world,p=w&&w.players[pid];
    return ownedItemIds(p?p.bag:{});
  },
  ownerOf(index){
    if(!this.coop)return 'p1';
    if(this.assign.p1===index)return 'p1';
    if(this.assign.p2===index)return 'p2';
    return null;
  },
  /** そのプレイヤーの操作デバイス：'kbm'（キーボード＋マウス）| 'pad' | 'kb2'（2P用キーボード） */
  deviceOf(pid){
    if(pid==='p1'){
      const hasPad=this.coop?this.assign.p1!==null:true;
      return hasPad&&this.aimMode.p1==='pad'?'pad':'kbm';
    }
    return this.assign.p2!==null?'pad':'kb2';
  },
  showAimFor(pid){return this.aimMode[pid]!=='mouse';},
  /** 出撃時に操作の割り当てを決める。コントローラー2台→1P/2Pとも、1台→2Pに、0台→2Pはキーボード */
  setupPlayers(n){
    this.coop=n>1;
    const list=this.getPads().map(g=>g.index);
    this.assign={p1:null,p2:null};
    if(this.coop){
      if(list.length>=2){this.assign.p1=list[0];this.assign.p2=list[1];}
      else if(list.length===1)this.assign.p2=list[0];
    }
    this.aimMode={p1:(this.coop&&this.assign.p1!==null)?'pad':(this.uiPad&&!this.coop&&list.length?'pad':'mouse'),p2:this.assign.p2!==null?'pad':'move'};
    this.lastAim={p1:0,p2:0};
    this.consumeEdges();
  },
  describe(pid){return {kbm:'キーボード＆マウス',pad:'コントローラー',kb2:'キーボード（矢印キー）'}[this.deviceOf(pid)];},
  onConnect(gp){
    UI.notify('コントローラーを接続しました','#7fe0ff',3);
    if(!this.coop)return;
    if(this.assign.p2===null){this.assign.p2=gp.index;this.aimMode.p2='pad';UI.notify('2P をコントローラー操作に切り替えました','#ffb070',3);}
    else if(this.assign.p1===null){this.assign.p1=gp.index;this.aimMode.p1='pad';UI.notify('1P をコントローラー操作に切り替えました','#8fb8ff',3);}
  },
  onDisconnect(gp){
    UI.notify('コントローラーが切断されました','#ff8060',3);
    delete this.padState[gp.index];
    for(const pid of ['p1','p2'])if(this.assign[pid]===gp.index){
      this.assign[pid]=null;
      this.aimMode[pid]=pid==='p1'?'mouse':'move';
      UI.notify(`${pid==='p1'?'1P':'2P'} はキーボード操作に戻りました`,'#ff8060',4);
    }
    if(App.state==='playing')App.goto('pause');
  },
  pollPads(dt){
    const pads=this.getPads(),seen=new Set(),PB=getBinds().pad;
    let navDir=null;
    for(const gp of pads){
      seen.add(gp.index);
      const S=this.padState[gp.index]||(this.padState[gp.index]={prev:[],move:{x:0,y:0},attack:false,aim:null,aimT:0});
      const cur=[];
      for(let i=0;i<17;i++){const b=gp.buttons[i];cur[i]=!!b&&(b.pressed||b.value>0.5);}
      // 割り当て変更中：新しく押したボタンを登録する
      if(App.rebind&&App.rebind.kind==='pad'){const i=cur.findIndex((v,j)=>v&&!(S.prev&&S.prev[j]));if(i>=0)App.finishRebind(i);}
      // コントローラーを使ったら、スマホ用の操作パネルは消す（画面をタッチすれば再び出る）
      if(this.isTouch&&(cur.some(Boolean)||Math.hypot(gp.axes[0]||0,gp.axes[1]||0)>0.5))this.dropTouch();
      // 円形デッドゾーン（軸ごとに切らないので、浅い斜め入力も素直に反映される）
      const stick=(ix,iy)=>{
        const x=gp.axes[ix]||0,y=gp.axes[iy]||0,m=Math.hypot(x,y),DZ=0.2;
        if(m<DZ)return [0,0];
        const k=Math.min(1,(m-DZ)/(1-DZ))/m;
        return [x*k,y*k];
      };
      let [lx,ly]=stick(0,1);
      if(cur[14])lx=-1;if(cur[15])lx=1;if(cur[12])ly=-1;if(cur[13])ly=1;
      const [rx,ry]=stick(2,3);
      // 右スティックの上下：ゲーム中は向きに使うので、メニューを開いているときだけスクロールする
      if(App.state!=='playing'&&Math.abs(ry)>0.01)UI.scrollPad(ry*dt*900);
      const used=cur.some(Boolean)||Math.hypot(lx,ly)>0.3||Math.hypot(rx,ry)>0.3;
      if(used){
        this.setUiPad(true);
        const owner=this.ownerOf(gp.index);
        if(owner)this.aimMode[owner]='pad';
      }
      // RB：短く押すと持ち物を次へ、0.3秒以上押すとホイールを開く（右スティックで選び、離すと決定）
      const owner=this.ownerOf(gp.index);
      const rbHeld=!!cur[PB.cycle]&&App.state==='playing'&&!!owner;
      if(rbHeld&&!(S.prev&&S.prev[PB.cycle])){S.rbT=0;S.rbOpen=false;}
      if(rbHeld){
        S.rbT=(S.rbT||0)+dt;
        if(!S.rbOpen&&S.rbT>=0.3&&owner){const ids=this.wheelIds(owner);if(ids.length){S.rbOpen=true;this.wheel={pid:owner,open:true,sel:null,ids};}}
        if(S.rbOpen&&Math.hypot(rx,ry)>0.5){ // 上から時計回りに並ぶ。スティックの向きの枠を選ぶ（持っている消耗品だけ）
          const N=Math.max(1,this.wheel.ids.length),step=2*Math.PI/N;
          let a=Math.atan2(ry,rx)+Math.PI/2;a=((a%(2*Math.PI))+2*Math.PI)%(2*Math.PI);
          this.wheel.sel=Math.round(a/step)%N;
        }
      }
      if(!cur[PB.cycle]&&S.prev&&S.prev[PB.cycle]){
        if(S.rbOpen){
          if(this.wheel&&this.wheel.sel!=null&&this.wheel.ids[this.wheel.sel]&&owner&&this.edges[owner])this.edges[owner].pick=ITEM_ORDER.indexOf(this.wheel.ids[this.wheel.sel]);
          this.wheel=null;S.rbOpen=false;
        }else if(owner&&App.state==='playing'&&this.edges[owner]&&(S.rbT||0)<0.3)this.edges[owner].cycle=1;
        S.rbT=0;
      }
      if(S.rbOpen){S.move={x:lx,y:ly};S.attack=false;S.guard=false;} // ホイールを開いていても左スティックで移動できる
      else{S.move={x:lx,y:ly};S.attack=!!cur[PB.attack];S.guard=!!cur[PB.guard];} // 攻撃・ガードは割り当てたボタンを押し続ける
      // 右スティックで向きを指定。倒していないときは移動方向を向く（攻撃中は向きを維持）
      if(S.rbOpen){/* ホイールを開いている間は向きを変えない */}
      else if(Math.hypot(rx,ry)>0.35){S.aim=Math.atan2(ry,rx);S.aimT=performance.now();}
      else if(Math.hypot(lx,ly)>0.3&&!S.attack){S.aim=Math.atan2(ly,lx);S.aimT=performance.now();}
      for(let i=0;i<cur.length;i++)if(cur[i]&&!S.prev[i])App.onPad(i,gp.index);
      S.prev=cur;
      if(!navDir&&(Math.abs(lx)>0.5||Math.abs(ly)>0.5))navDir=Math.abs(lx)>Math.abs(ly)?(lx>0?'right':'left'):(ly>0?'down':'up');
    }
    for(const k in this.padState)if(!seen.has(Number(k)))delete this.padState[k];
    // メニュー操作用の方向入力（どのコントローラーでも可。押しっぱなしでリピート）
    if(navDir!==this.navDir){this.navDir=navDir;this.navT=0.35;if(navDir)App.onPadNav(navDir);}
    else if(navDir){this.navT-=dt;if(this.navT<=0){this.navT=0.12;App.onPadNav(navDir);}}
  },
  /** そのプレイヤーのコントローラーを振動させる（振動対応のブラウザ・機種のみ） */
  rumble(ms,strength,pid){
    if(!this.uiPad&&!this.coop)return;
    const pads=this.getPads();
    let gp=null;
    if(this.coop){const idx=this.assign[pid||'p1'];if(idx===null||idx===undefined)return;gp=pads.find(g=>g.index===idx);}
    else gp=pads[0];
    try{
      if(gp&&gp.vibrationActuator&&gp.vibrationActuator.playEffect){
        const r=gp.vibrationActuator.playEffect('dual-rumble',{duration:ms,strongMagnitude:strength,weakMagnitude:strength*0.6});
        if(r&&r.catch)r.catch(()=>{});
      }
    }catch(e){}
  },
  /** キーボードの単発入力（回避・スキル・回復）。2Pキーボードは2人プレイかつ2Pにコントローラーが無いときだけ有効 */
  keyEdge(code){
    const E1=this.edges.p1,E2=this.edges.p2,kb2=this.coop&&this.assign.p2===null;
    // 割り当てた操作（設定で変えられる）
    const kbA=getBinds().kb,act=Object.keys(kbA).find(a=>kbA[a]===code);
    if(act==='dodge')E1.dodge=true;
    else if(act==='skill')E1.skill=true;
    else if(act==='heal')E1.heal=true;
    else if(act==='cycle')E1.cycle=1;
    else if(act==='sheathe')E1.sheathe=true;
    else if(kb2&&code==='Slash')E2.sheathe=true;
    else if(/^Digit[1-9]$/.test(code)&&+code.slice(5)<=ITEM_ORDER.length)E1.pick=+code.slice(5)-1;
    else if(kb2&&code==='Comma')E2.cycle=1;
    else if(kb2&&code==='ShiftRight')E2.dodge=true;
    else if(kb2&&code==='Numpad1')E2.skill=true;
    else if(kb2&&(code==='Period'||code==='Numpad2'))E2.heal=true;
    else return false;
    return true;
  },
  sample(pid,p){
    const k=this.keys,isP1=pid==='p1',kb2=this.coop&&this.assign.p2===null;
    let mx=0,my=0,attack=false,guard=false;
    if(isP1){
      mx=(k.KeyD?1:0)-(k.KeyA?1:0);my=(k.KeyS?1:0)-(k.KeyW?1:0);
      if(!kb2&&mx===0&&my===0){mx=(k.ArrowRight?1:0)-(k.ArrowLeft?1:0);my=(k.ArrowDown?1:0)-(k.ArrowUp?1:0);}
      const kbA=getBinds().kb;
      attack=this.mouse.down||!!k[kbA.attack];
      guard=!!(k[kbA.guard]||this.mouse.rdown);
    }else if(kb2){
      mx=(k.ArrowRight?1:0)-(k.ArrowLeft?1:0);my=(k.ArrowDown?1:0)-(k.ArrowUp?1:0);
      attack=!!(k.Enter||k.NumpadEnter||k.Numpad0);
    }
    let aim=null,aimT=-1;
    for(const idx in this.padState){
      if(this.ownerOf(Number(idx))!==pid)continue;
      const S=this.padState[idx];
      if(mx===0&&my===0&&(S.move.x||S.move.y)){mx=S.move.x;my=S.move.y;} // スティックはアナログ（倒し具合で速度が変わる）
      attack=attack||S.attack;
      guard=guard||!!S.guard;
      if(S.aim!==null&&S.aimT>aimT){aim=S.aim;aimT=S.aimT;}
    }
    const holdAim=!!(p&&DATA.weaponTypes[p.stats.weaponType]&&DATA.weaponTypes[p.stats.weaponType].holdAim); // 弓・手裏剣：攻撃を押したまま狙いを変えられる
    if(this.isTouch&&pid===this.touchPid()){if(mx===0&&my===0){mx=this.touch.mx;my=this.touch.my;}attack=attack||this.touch.attack;guard=guard||!!this.touch.guard;if(this.touch.swipeAng!=null&&holdAim)aim=this.touch.swipeAng;}
    const E=this.edges[pid]||newEdges();
    const inp={mx,my,attack,guard,dodge:E.dodge,skill:E.skill,heal:E.heal,cycle:E.cycle,pick:E.pick,sheathe:E.sheathe,cure:!!E.cure};
    if(p){
      if(isP1&&this.aimMode.p1==='mouse'){const wp=Renderer.screenToWorld(this.mouse.x,this.mouse.y);inp.aim=Math.atan2(wp.y-p.y,wp.x-p.x);}
      else if(this.aimMode[pid]==='pad'&&aim!==null)inp.aim=aim;
      else{
        // 攻撃を押しているあいだは、移動してもこの向きを変えない（押し始めた向きで攻撃する）
        const followMove=holdAim?this.aimMode[pid]==='move':!attack; // 弓・手裏剣は移動では向きを変えない（移動で狙う設定の2Pを除く）
        if((mx||my)&&followMove)this.lastAim[pid]=Math.atan2(my,mx);
        inp.aim=this.lastAim[pid];
      }
    }
    return inp;
  },
};

const UI={
  overlay:null,modal:null,notes:null,modalCb:null,
  init(){
    this.overlay=$('#overlay');this.modal=$('#modal');this.notes=$('#notify');
    // 押し始めた項目を覚えておく（スマホでは、画面が切り替わった直後に「押したつもりのない」クリックが新しい画面に届くため）
    this.overlay.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-act]');this.pressKey=el?this.padKey(el):null;},true);
    this.overlay.addEventListener('click',e=>{
      const el=e.target.closest('[data-act]');
      if(!el||el.disabled)return;
      // 指で押したのと同じ項目でないクリックは無視する（画面の切り替え直後に、次の画面のボタンが押される誤操作を防ぐ）
      if(e.detail>0&&this.pressKey!==this.padKey(el)){this.pressKey=undefined;return;}
      this.pressKey=undefined;
      if(el.tagName==='BUTTON'||el.dataset.act==='selItem'||el.dataset.act==='pickQuest')Sound.ui('click');
      App.action(el.dataset.act,el.dataset,el);
    });
    this.modal.addEventListener('click',e=>{
      const el=e.target.closest('[data-m]');if(!el)return;
      const cb=this.modalCb;this.closeModal();
      if(el.dataset.m==='yes'&&cb)cb();
    });
  },
  show(html){
    const scrolls={};
    this.overlay.querySelectorAll('[data-scroll]').forEach(el=>{scrolls[el.dataset.scroll]=el.scrollTop;});
    this.overlay.innerHTML=html;this.overlay.classList.remove('hidden');
    this.overlay.querySelectorAll('[data-scroll]').forEach(el=>{if(scrolls[el.dataset.scroll])el.scrollTop=scrolls[el.dataset.scroll];});
    if(Input.uiPad)this.restoreFocus();
  },
  hide(){this.overlay.classList.add('hidden');this.overlay.innerHTML='';},
  /* ---------- コントローラーでのメニュー操作（フォーカス移動） ---------- */
  focusKey:'',
  padKey(el){
    if(!el)return '';
    const d=el.dataset;
    // どの欄にあるか（左の装備欄と中央の一覧で同じ項目でも、別物として覚える）
    const col=el.closest?el.closest('[data-scroll]'):null; // 合成したキー（dataset だけのもの）にも対応
    return [d.act||d.m||'',d.uid||'',d.tab||'',d.f||'',d.id||'',d.key||'',d.deco||'',d.idx||'',d.c||'',d.s||'',col?col.dataset.scroll:''].join('|');
  },
  focusRoot(){
    if(this.modalOpen())return this.modal;
    return this.overlay.classList.contains('hidden')?null:this.overlay;
  },
  focusables(){
    const r=this.focusRoot();if(!r)return [];
    // 押せない（素材不足などの）ボタンにもカーソルは止まれるようにする。止まっても決定では何も起きない
    return [...r.querySelectorAll('[data-act],[data-m]')].filter(el=>el.offsetParent!==null);
  },
  current(){const r=this.focusRoot();return r?r.querySelector('.padfocus'):null;},
  clearFocus(){document.querySelectorAll('.padfocus').forEach(o=>o.classList.remove('padfocus'));},
  setFocus(el){
    this.clearFocus();if(!el)return;
    el.classList.add('padfocus');this.focusKey=this.padKey(el);
    try{el.scrollIntoView({block:'nearest',inline:'nearest'});}catch(e){}
  },
  restoreFocus(preferKey){
    const els=this.focusables();if(!els.length)return;
    const key=preferKey||this.focusKey;
    this.setFocus(els.find(e=>this.padKey(e)===key)||els[0]);
  },
  /** コントローラーの右スティックで、開いている画面（装備・図鑑・依頼など）をスクロールする */
  scrollPad(dy){
    const root=this.overlay;if(!root)return;
    let best=null;
    for(const el of [root,...root.querySelectorAll('*')]){
      const cs=getComputedStyle(el);
      if(/(auto|scroll)/.test(cs.overflowY)&&el.scrollHeight>el.clientHeight+2&&(!best||el.clientHeight>best.clientHeight))best=el;
    }
    if(best)best.scrollTop+=dy;
  },
  padNav(dir){
    const els=this.focusables();if(!els.length)return;
    Sound.ui('move');
    const cur=this.current();
    if(!cur||!els.includes(cur)){this.restoreFocus();return;}
    const a=cur.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2,horiz=dir==='right'||dir==='left';
    // 押した方向で一番近いボタンへ。縦横のずれは「中心の差」ではなく「重なっていない幅」で測る
    // （幅の広いボタンから、下にある半分幅のボタンを飛ばさないように）
    const gap=(a1,a2,b1,b2)=>Math.max(0,b1-a2,a1-b2);
    let best=null,bs=Infinity;
    for(const el of els){
      if(el===cur)continue;
      const b=el.getBoundingClientRect(),dx=b.left+b.width/2-ax,dy=b.top+b.height/2-ay;
      const center=dir==='right'?dx:dir==='left'?-dx:dir==='down'?dy:-dy;
      if(center<=4)continue;
      // 押した方向に「完全に先にある」ものだけ（同じ段の隣のボタンへ上下で動かない）
      const ahead=dir==='right'?b.left>=a.right-4:dir==='left'?b.right<=a.left+4:dir==='down'?b.top>=a.bottom-4:b.bottom<=a.top+4;
      if(!ahead)continue;
      const edge=Math.max(0,dir==='right'?b.left-a.right:dir==='left'?a.left-b.right:dir==='down'?b.top-a.bottom:a.top-b.bottom);
      const cross=horiz?gap(a.top,a.bottom,b.top,b.bottom):gap(a.left,a.right,b.left,b.right);
      const off=Math.abs(horiz?dy:dx); // 同じくらい近いときは、まっすぐ先にあるものを優先
      // 下に動くときは左側のボタンを優先する（右にずれた候補には少し余計な差をつける）
      const leftBias=dir==='down'&&dx>0?dx*0.5:0;
      const s=edge+cross*2.5+off*0.05+leftBias;
      if(s<bs){bs=s;best=el;}
    }
    if(best)this.setFocus(best);
  },
  padClick(){
    const cur=this.current();
    if(cur&&this.focusables().includes(cur))cur.click();else this.restoreFocus();
  },
  notify(text,color,dur){
    const el=document.createElement('div');el.className='note';el.style.borderLeftColor=color||'#888';el.innerHTML=text;
    this.notes.appendChild(el);
    while(this.notes.children.length>7)this.notes.removeChild(this.notes.firstChild);
    setTimeout(()=>{el.style.opacity='0';setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);},500);},(dur||3.2)*1000);
  },
  /** 確認ダイアログ。opt で ボタン名（yes/no）・はいボタンの色（yesClass）・初期選択（focusYes）を変えられる */
  confirm(msg,onYes,opt){
    opt=opt||{};
    this.modal.innerHTML=`<div class="panel modalbox"><div>${msg}</div><div class="row"><button class="${opt.yesClass||'danger'}" data-m="yes">${opt.yes||'はい'}</button><button data-m="no">${opt.no||'いいえ'}</button></div></div>`;
    this.modal.classList.remove('hidden');this.modalCb=onYes;
    this.overlayKey=this.focusKey;
    // コントローラー操作時の初期選択。危険な操作は誤操作防止で「いいえ」側
    if(Input.uiPad){const b=this.modal.querySelector(opt.focusYes?'[data-m="yes"]':'[data-m="no"]');if(b)this.setFocus(b);}
  },
  modalOpen(){return !this.modal.classList.contains('hidden');},
  closeModal(){
    this.modal.classList.add('hidden');this.modal.innerHTML='';this.modalCb=null;
    if(Input.uiPad)this.restoreFocus(this.overlayKey);
  },
};

/** データの参照ミスを見つける（魔物・素材・地図・依頼・レシピ・ショップの名前が実在するか） */
function validateData(){
  const E=DATA.enemies,M=DATA.materials,T=DATA.dropTables,L=DATA.layouts,S=DATA.stages,Q=DATA.quests,errs=[];
  const bad=(c,msg)=>{if(!c)errs.push(msg);};
  const eqOk=id=>!!DATA.equipment[id];
  S.forEach((s,i)=>{
    bad(s.id===i+1,`ステージ「${s.name}」：id は ${i+1} にしてください`);
    for(const k of ['melee','ranged','boss'])bad(E[(s.enemySet||{})[k]],`ステージ「${s.name}」：enemySet.${k} の魔物がありません`);
    bad(L[s.layout],`ステージ「${s.name}」：layout「${s.layout}」がありません`);
    bad(T[s.chest],`ステージ「${s.name}」：chest の表「${s.chest}」がありません`);
    bad(BGM_DATA[s.bgm],`ステージ「${s.name}」：bgm「${s.bgm}」がありません`);
  });
  for(const id in E){const e=E[id];
    bad(ENEMY_AI[e.ai],`魔物「${id}」：ai「${e.ai}」がありません`);
    bad(T[e.drops],`魔物「${id}」：drops「${e.drops}」の落とし物表がありません`);
    bad(DATA.bestiary[id],`魔物「${id}」：図鑑（bestiary）がありません`);
  }
  for(const id in T)for(const r of (T[id].rolls||[]))
    if(r.type==='mat')bad(M[r.id],`落とし物表「${id}」：素材「${r.id}」がありません`);
  for(const id in L){const l=L[id];
    const spawns=[...(l.wander||[]).map(x=>[x]),...(l.main||[]).flatMap(r=>r.spawn||[]),...(l.side||[]).flatMap(r=>r.spawn||[]),...((l.boss||{}).spawn||[])];
    for(const sp of spawns)bad(E[sp[0]],`地図「${id}」：魔物「${sp[0]}」がありません`);
  }
  for(const q of Q){
    bad(S.some(s=>s.id===q.stage),`依頼「${q.name}」：stage ${q.stage} がありません`);
    if(q.goal&&q.goal.type==='kill')bad(q.goal.target==='any'||QUEST_GROUPS[q.goal.target]||E[q.goal.target],`依頼「${q.name}」：討伐対象「${q.goal.target}」がありません`);
    if(q.boss)bad(E[q.boss],`依頼「${q.name}」：ボス「${q.boss}」がありません`);
    if(q.after)bad(Q.some(x=>x.id===q.after),`依頼「${q.name}」：前提の依頼「${q.after}」がありません`);
    for(const m in ((q.reward||{}).mats||{}))bad(M[m],`依頼「${q.name}」：報酬の素材「${m}」がありません`);
  }
  for(const r of DATA.recipes){
    if(r.out.type==='equip')bad(eqOk(r.out.id),`レシピ「${r.id}」：装備「${r.out.id}」がありません`);
    for(const m in r.cost)bad(M[m],`レシピ「${r.id}」：素材「${m}」がありません`);
    bad(!r.stage||S.some(s=>s.id===r.stage),`レシピ「${r.id}」：stage ${r.stage} がありません`);
  }
  for(const k in DATA.enemyElem){const d=DATA.enemyElem[k];bad(E[k],`属性：魔物「${k}」がありません`);for(const x of [d.atk,...(d.weak||[]),...(d.strong||[])].filter(Boolean))bad(DATA.elements[x],`属性：「${x}」がありません`);}
  for(const id in DATA.equipment){const b=DATA.equipment[id];if(b.el)bad(DATA.elements[b.el.k],`装備「${id}」：属性「${b.el.k}」がありません`);}
  for(const k in DATA.enemyStatus){bad(E[k],`状態異常：魔物「${k}」がありません`);bad(DATA.playerStatus[DATA.enemyStatus[k].k],`状態異常：「${DATA.enemyStatus[k].k}」がありません`);}
  for(const it of DATA.shop)if(it.type==='mat')bad(M[it.mat],`ショップ「${it.id}」：素材「${it.mat}」がありません`);
  for(const k in DATA.armorSets)for(const sl in DATA.armorSets[k].pieces)bad(eqOk(DATA.armorSets[k].pieces[sl]),`防具一式「${k}」：装備「${DATA.armorSets[k].pieces[sl]}」がありません`);
  return errs;
}

function matSellPrice(id){
  if(id==='reinforce_orb'||id.startsWith('enchant_orb'))return 0;
  if(MAT_TIER.boss.has(id))return MAT_TIER.mob.has(id)?15:30;
  if(MAT_TIER.mob.has(id))return 6;
  return 5;
}
/** 手紙ガチャの区切り（3ステージごと）。end：その区切りの最後のステージ（レア度の上限）。price：1回のゴールド。10連は1回の9倍 */
const LETTER_BANDS=[{start:1,end:3,price:200},{start:4,end:6,price:300},{start:7,end:8,price:400}];
const LETTER_TEN_MUL=9;
/** 装飾品ガチャ：持っている装飾品を3個使って1個もらう。出るレア度の最低保証は、使った3個のうち一番低いレア度 */
const DECO_GACHA={need:3};
/** 指定の区切りの手紙ガチャが使えるか（そのステージまで進んでいれば区切りを返す） */
function letterBandOf(p,a){
  const start=Number(a.stage)||LETTER_BANDS[0].start;
  const band=LETTER_BANDS.find(b=>b.start===start);
  return band&&QuestRules.stage(p)>=band.start?band:null;
}
const Ops={
  /** 素材を売る（n個。all で持っている分すべて） */
  sellMat(p,who,a){
    const id=a.id,price=matSellPrice(id),have=p.materials[id]||0;
    if(!price||!have)return {msg:'売れません',color:'#888'};
    const n=a.n==='all'?have:clamp(Number(a.n)||1,1,have);
    p.materials[id]-=n;if(p.materials[id]<=0)delete p.materials[id];
    p.gold=(p.gold||0)+price*n;
    return {msg:`${DATA.materials[id].name}を${n}個売って${price*n}G`,color:'#ffd23a'};
  },
  equip(p,who,a){
    const it=Profile.getItem(p,a.uid);if(!it)return {};
    const owner=Profile.equippedBy(p,a.uid);
    if(owner===who)return {};
    if(owner>=0)charOf(p,owner).equipped[it.slot]=null; // 他のキャラが使っていたら付け替える
    charOf(p,who).equipped[it.slot]=it.uid;
    return {changed:true,msg:`<span style="color:${eqColor(it)}">${itemName(it)}</span> を装備しました`,color:eqColor(it)};
  },
  unequip(p,who,a){
    const it=Profile.getItem(p,a.uid);if(!it)return {};
    const owner=Profile.equippedBy(p,a.uid);if(owner<0)return {};
    if(it.slot==='weapon')return {msg:'武器は外せません（別の武器を装備してください）',color:'#ff8060'};
    charOf(p,owner).equipped[it.slot]=null;
    return {changed:true};
  },
  /** 装備品の売却（装着していた装飾品は外れて手元に残る） */
  sell(p,who,a){
    const it=Profile.getItem(p,a.uid);if(!it)return {};
    if(it.slot==='weapon'&&Profile.isEquipped(p,a.uid))return {msg:'装備中の武器は売却できません',color:'#ff8060'};
    const price=sellPrice(it);
    Profile.removeItem(p,a.uid);p.gold=(p.gold||0)+price;
    return {changed:true,cleared:a.uid,msg:`${itemName(it)} を売却しました（+${price}G）`,color:'#ffd23a'};
  },
  /** まとめて売却：選んだ装備のうち、装備中でないものを売る */
  sellMany(p,who,a){
    let n=0,gold=0;
    for(const u of (a.uids||[])){
      const it=Profile.getItem(p,u);if(!it||Profile.equippedBy(p,u)>=0)continue;
      const price=sellPrice(it);Profile.removeItem(p,u);p.gold=(p.gold||0)+price;n++;gold+=price;
    }
    if(!n)return {msg:'売れる装備がありません',color:'#888'};
    return {changed:true,msg:`${n}件を売却しました（+${gold}G）`,color:'#ffd23a'};
  },
  deco(p,who,a){
    Profile.attachDeco(p,a.uid,Number(a.idx)|0,a.deco||null);
    return {changed:true};
  },
  /** プレゼントの受け取り（1つ1回）。持ち物があふれるときは受け取らない */
  claimGift(p,who,a){
    const g=DATA.gifts.find(x=>x.id===a.id);
    if(!g)return {};
    if(p.giftsGot[g.id])return {msg:'このプレゼントはもう受け取り済みです',color:'#888'};
    for(const it of g.items)if(it.type==='item'){const c=DATA.consumables[it.id];if((p.bag[it.id]||0)+it.n>c.max)return {msg:`${c.name}は${c.max}個までしか持てません`,color:'#ff8060'};}
    for(const it of g.items){
      const n=Math.max(1,it.n|0);
      if(it.type==='coin')p.coins=(p.coins||0)+n;
      else if(it.type==='gold')p.gold=(p.gold||0)+n;
      else if(it.type==='item')p.bag[it.id]=(p.bag[it.id]||0)+n;
      else if(it.type==='mat'){p.materials[it.id]=(p.materials[it.id]||0)+n;(p.matSeen=p.matSeen||{})[it.id]=1;}
      else if(it.type==='equip'){for(let i=0;i<n;i++)Profile.addItem(p,Items.createEquipment(it.id));}
      else if(it.type==='deco'){Profile.addDeco(p,Items.createDeco(it.id,it.rarity||0));}
    }
    p.giftsGot[g.id]=true;
    return {changed:true,msg:`プレゼントを受け取りました（${g.reason}）`,color:'#ffd23a'};
  },
  /** 10連：1回ずつ回した結果をまとめる（コインが足りなくなったところで止まる） */
  gacha10(p,who,a){
    if((p.coins||0)<30)return {msg:'コインが足りません（10連は30コイン必要）',color:'#ff8060'};
    const rs=[];
    for(let i=0;i<10&&(p.coins||0)>=3;i++){const r=Ops.gacha(p,who,a)||{};if(r.fx)rs.push(r.fx);}
    if(!rs.length)return {msg:'コインが足りません（10連は30コイン必要）',color:'#ff8060'};
    const rank={N:0,R:1,SR:2,SSR:3};
    const best=rs.reduce((b,f)=>rank[f.rar]>rank[b.rar]?f:b,rs[0]);
    const names=rs.map(f=>f.text).join(' ／ ');
    return {changed:true,msg:`10連：${rs.length}回回した（${names}）`,color:RARITY[best.rar].color,
      fx:{rar:best.rar,text:`10連結果（${rs.length}回）：${names}`,look:(rs.find(f=>f.look)||{}).look,lookV:(rs.find(f=>f.look)||{}).lookV}};
  },
  /** 手紙を1通抽選して手に入れる（レア度はいまのステージの上限まで。演出はペットと同じ3段階の表示） */
  letterPull(p,cap){
    const tier=Items.rollLetterTier(1,cap);
    Profile.addItem(p,Items.createLetter(tier));
    const r=DATA.rarities[tier],name=DATA.letters[tier].name;
    const rar=['N','R','SR','SR','SR'][tier];
    return {rar,color:r.color,name,label:`${r.name}：${name}`};
  },
  /** ステージごとの手紙ガチャ：そのステージまで進んだら使える。レア度はそのステージの上限まで */
  /** 装飾品を使って、装飾品を1つ抽選して手に入れる（使った3個の一番低いレア度以上が出る） */
  decoGacha(p,who,a){
    const uids=[...new Set(a.uids||[])];
    if(uids.length!==DECO_GACHA.need)return {msg:`装飾品を${DECO_GACHA.need}個選んでください`,color:'#888'};
    const used=uids.map(u=>Profile.getDeco(p,u));
    if(used.some(d=>!d||Profile.decoOwner(p,d.uid)))return {msg:'装着中の装飾品は使えません',color:'#ff8060'};
    const minR=Math.min(...used.map(d=>d.rarity)),maxR=Math.max(...used.map(d=>d.rarity));
    p.decos=p.decos.filter(d=>!uids.includes(d.uid));
    // 出るレア度は、使った中で一番低い以上・一番高い以下
    const rarity=weightedPick(DATA.rarities.map((r,i)=>({w:(i<minR||i>maxR)?0:r.dropW*Math.pow(1.3,i),v:i})));
    const d=Profile.addDeco(p,Items.createDeco(pick(Object.keys(DATA.decorations)),rarity));
    const r=DATA.rarities[rarity],dd=DATA.decorations[d.decoId];
    const rar=['N','R','SR','SR','SSR'][rarity];
    const label=`${r.name}：${dd.name}`;
    return {changed:true,msg:`${label}を手に入れた！（使った${DECO_GACHA.need}個の ${DATA.rarities[minR].name}〜${DATA.rarities[maxR].name} の範囲）`,color:r.color,fx:{rar,text:label}};
  },
  letterGacha(p,who,a){
    const band=letterBandOf(p,a);if(!band)return {msg:'まだ解放されていません',color:'#888'};
    if((p.gold||0)<band.price)return {msg:`ゴールドが足りません（${band.price}G必要）`,color:'#ff8060'};
    p.gold-=band.price;
    const f=Ops.letterPull(p,DATA.letterCap(band.end));
    return {changed:true,msg:`${f.label}を手に入れた！`,color:f.color,fx:{rar:f.rar,text:f.label}};
  },
  letterGacha10(p,who,a){
    const band=letterBandOf(p,a);if(!band)return {msg:'まだ解放されていません',color:'#888'};
    const cost=band.price*LETTER_TEN_MUL;
    if((p.gold||0)<cost)return {msg:`ゴールドが足りません（10連は${cost}G必要）`,color:'#ff8060'};
    p.gold-=cost;
    const rs=[];for(let i=0;i<10;i++)rs.push(Ops.letterPull(p,DATA.letterCap(band.end)));
    const rank={N:0,R:1,SR:2};
    const best=rs.reduce((b,f)=>rank[f.rar]>rank[b.rar]?f:b,rs[0]);
    const names=rs.map(f=>f.name).join(' ／ ');
    return {changed:true,msg:`手紙10連：${names}`,color:best.color,fx:{rar:best.rar,text:`手紙10連結果：${names}`}};
  },
  /** ペットガチャ（3コイン）：見た目と色を抽選。同じ見た目の同じ色がかぶったらコイン1枚 */
  gacha(p,who,a){
    if((p.coins||0)<3)return {msg:'コインが足りません（3コイン必要）',color:'#ff8060'};
    p.coins-=3;
    p.gachaN=(p.gachaN||0)+1;
    const lk=pick(LOOKS),v=randInt(0,LOOK_VARIANTS.length-1),vn=LOOK_VARIANTS[v].name;
    const have=p.looks[lk.id]||[];
    if(!have.includes(v)){
      p.looks[lk.id]=[...have,v].sort();
      return {changed:true,msg:`${lk.name}（${vn}）が仲間になった！`,color:RARITY.SSR.color,fx:{rar:'SSR',text:`${lk.name}（${vn}）が仲間になった！`,look:lk.id,lookV:v}};
    }
    p.coins=(p.coins||0)+1;
    return {changed:true,msg:`${lk.name}（${vn}）がかぶった → コイン +1`,color:'#ffd23a',fx:{rar:'N',text:`${lk.name}（${vn}）がかぶった → コイン +1`}};
  },
  /** 首輪ガチャ（1コイン）：レア度で抽選してから種類を選ぶ。かぶったらコイン1枚戻る */
  collarGacha(p,who,a){
    if((p.coins||0)<1)return {msg:'コインが足りません（1コイン必要）',color:'#ff8060'};
    p.coins-=1;
    let roll=RNG.next()*100,tier='N';
    for(const k of ['N','R','SR']){roll-=RARITY[k].w;if(roll<0){tier=k;break;}}
    const pt=pick(PETS.filter(x=>x.rar===tier));
    if(p.pets[pt.id]){p.coins=(p.coins||0)+1;return {changed:true,msg:`${RARITY[tier].name}の${pt.name}の首輪がダブり → コイン +1`,color:'#ffd23a',fx:{rar:tier,text:`${pt.name}の首輪（ダブり）→ コイン +1`}};}
    p.pets[pt.id]={level:1};
    return {changed:true,msg:`${RARITY[tier].name}：${pt.name}の首輪を手に入れた！`,color:RARITY[tier].color,fx:{rar:tier,text:`${pt.name}の首輪`}};
  },
  petEquip(p,who,a){
    if(!p.pets[a.id])return {};
    p.equipped.pet=p.equipped.pet===a.id?null:a.id;
    return {changed:true};
  },
  /** 重ね着：部位ごとに持っている装備の見た目を設定（base を空にすると外す、all で全部外す） */
  costume(p,who,a){
    const ch=charOf(p,who);if(!ch)return {};
    ch.costume=ch.costume||{};
    if(a.all){ch.costume={};return {changed:true,msg:'重ね着をすべて外しました',color:'#ffd23a'};}
    const sl=a.slot;if(!SLOTS.includes(sl)||sl==='charm')return {};
    if(!a.base){delete ch.costume[sl];return {changed:true,msg:`${SLOT_NAMES[sl]}の重ね着を外しました`,color:'#ffd23a'};}
    const b=DATA.equipment[a.base];
    if(!b||b.slot!==sl||!p.items.some(i=>i.baseId===a.base))return {msg:'持っている装備だけ重ね着できます',color:'#888'};
    ch.costume[sl]=a.base;
    return {changed:true,msg:`${b.name}を重ね着に設定しました`,color:'#ffd23a'};
  },
  lookEquip(p,who,a){
    const v=a.v|0;
    if(!(p.looks[a.id]||[]).includes(v))return {};
    const same=p.equipped.look===a.id&&(p.equipped.lookV|0)===v;
    p.equipped.look=same?null:a.id;p.equipped.lookV=same?0:v;
    return {changed:true};
  },
  buy(p,who,a){
    const s=DATA.shop.find(x=>x.id===a.id);if(!s)return {};
    if(s.stage&&QuestRules.stage(p)<s.stage)return {msg:'まだ購入できません',color:'#888'};
    if(s.once&&(p.shopOnce||{})[s.id])return {msg:`${s.name}は購入済みです`,color:'#888'};
    const n=s.type==='equip'?1:clamp(Number(a.n)||1,1,10);
    if(s.type==='item'){const c=DATA.consumables[s.item];if((p.bag[s.item]||0)+n>c.max)return {msg:`${c.name}は${c.max}個までしか持てません`,color:'#888'};}
    if((p.gold||0)<s.price*n)return {msg:'ゴールドが足りません',color:'#ff8060'};
    p.gold-=s.price*n;
    let extra='';
    if(s.type==='equip'){
      const it=Items.createEquipment(s.item,0);it.atk=DATA.equipment[s.item].atk;it.crit=DATA.equipment[s.item].crit;it.affixes=[];it.effects=[];it.slots=[];
      Profile.addItem(p,it);(p.shopOnce=p.shopOnce||{})[s.id]=1;
    }
    else if(s.type==='item')p.bag[s.item]=(p.bag[s.item]||0)+n;
    else if(s.type==='mat'){p.materials[s.mat]=(p.materials[s.mat]||0)+n;(p.matSeen=p.matSeen||{})[s.mat]=1;}
    else if(s.type==='deco'){
      const got=[];
      for(let i=0;i<n;i++){const d=Profile.addDeco(p,Items.createDeco(pick(Object.keys(DATA.decorations)),Items.rollRarity(1.2+0.3*QuestRules.stage(p))));got.push(lootLabel({type:'deco',item:d}));}
      extra='：'+got.map(l=>`<span style="color:${l.color}">${l.text}</span>`).join('、');
    }
    return {changed:true,msg:`${s.name} ×${n} を購入しました（-${s.price*n}G）${extra}`,color:'#ffd23a'};
  },
  craft(p,who,a){
    const r=DATA.recipes.find(x=>x.id===a.id);if(!r)return {};
    if(r.stage&&QuestRules.stage(p)<r.stage)return {msg:'まだ製作できません',color:'#888'};
    if(!Profile.hasMats(p,r.cost))return {msg:'素材が足りません',color:'#ff8060'};
    const gold=craftGold(r);if((p.gold||0)<gold)return {msg:'お金が足りません（'+gold+'G 必要）',color:'#ff8060'};
    if(r.out.type==='item'){const c=DATA.consumables[r.out.id];if((p.bag[r.out.id]||0)>=c.max)return {msg:c.name+'は上限まで持っています',color:'#888'};}
    Profile.spendMats(p,r.cost);p.gold-=gold;
    let label,sel=null;
    if(r.out.type==='equip'){
      const it=Items.createEquipment(r.out.id);
      Profile.addItem(p,it);label=lootLabel({type:'equip',item:it});sel=it.uid;
    }else if(r.out.type==='deco'){
      // 種類は鍛冶屋で選んだもの（指定が無いときはランダム）。レアリティはレア以下
      const kind=(a.deco&&DATA.decorations[a.deco])?a.deco:pick(Object.keys(DATA.decorations));
      const d=Items.createDeco(kind,Items.rollRarityMax(1.3,2));
      Profile.addDeco(p,d);label=lootLabel({type:'deco',item:d});
    }else if(r.out.type==='collar'){
      const pt=PETS.find(x=>x.id===r.out.id);
      if(p.pets[pt.id]){p.coins=(p.coins||0)+1;label={text:pt.name+'の首輪（ダブり→コイン +1）',color:'#ffd23a'};}
      else{p.pets[pt.id]={level:1};label={text:pt.name+'の首輪',color:'#9fe0ff'};}
    }else{
      const c=DATA.consumables[r.out.id];
      p.bag[r.out.id]=Math.min(c.max,(p.bag[r.out.id]||0)+r.out.n);
      label={text:c.name+' ×'+r.out.n,color:c.color};
    }
    return {changed:true,sel,msg:`製作完了：<span style="color:${label.color}">${label.text}</span>`,color:label.color};
  },
  /** 防具を強化：強化玉とお金を使って防御力を +1（最大 REINFORCE_MAX 段階） */
  reinforce(p,who,a){
    const it=p.items.find(x=>x.uid===a.uid);
    if(!it||it.kind!=='equip'||it.slot==='weapon')return {msg:'強化できない防具です',color:'#888'};
    const lv=it.reinforce||0;
    if(lv>=REINFORCE_MAX)return {msg:'これ以上強化できません',color:'#888'};
    const orbs=lv+1,gold=REINFORCE_GOLD*(lv+1);
    if((p.materials.reinforce_orb||0)<orbs)return {msg:'強化玉が足りません（'+orbs+'個必要）',color:'#ff8060'};
    if((p.gold||0)<gold)return {msg:'お金が足りません（'+gold+'G 必要）',color:'#ff8060'};
    Profile.spendMats(p,{reinforce_orb:orbs});p.gold-=gold;
    it.reinforce=lv+1;it.def+=1;
    return {changed:true,msg:`${DATA.equipment[it.baseId].name} を強化！ 防御力 +1（${lv+1}/${REINFORCE_MAX}）`,color:'#ffd23a'};
  },
  /** 付与：防具に玉（段階1〜3）で付与スキルを抽選する。付与済みなら作り直し（今の付与を消して抽選し直す）。玉は1個 */
  enchant(p,who,a){
    const it=p.items.find(x=>x.uid===a.uid),t=clamp(Number(a.t)|0,1,3);
    if(!it||it.kind!=='equip'||it.slot==='weapon'||it.slot==='charm')return {msg:'付与できる防具ではありません',color:'#888'};
    const id=t===1?'enchant_orb':'enchant_orb'+t;
    if((p.materials[id]||0)<1)return {msg:DATA.materials[id].name+'が足りません',color:'#ff8060'};
    const again=!!(it.enchant&&it.enchant.skills&&Object.keys(it.enchant.skills).length);
    Profile.spendMats(p,{[id]:1});
    it.enchant={t,skills:Items.rollEnchant(t)};
    return {changed:true,msg:`${DATA.equipment[it.baseId].name} に${DATA.enchantTiers[t-1].name}の付与${again?'（作り直し）':''}`,color:'#ffd23a'};
  },
};

/* ===================== 10. オンライン協力（ホスト権威型） =====================
   ・セーブデータは持ち寄り式：参加者は自分のPCのセーブデータを持って参加し、
     ホストはそれを検証してから使う。入手したものや装備の変更はホストが反映し、参加者に送り返す（参加者のPCに保存）。
   ・ホスト：ゲームの処理（updateWorld）をすべて実行する。
            参加者から届いた「入力」と「装備・製作の操作」を反映し、状態を毎秒20回送る。
   ・参加者：入力を送り、届いた状態を補間して表示するだけ（ダメージ計算やアイテム入手はしない）。
   ・接続の仲介には PeerJS（無料の仲介サーバー）を使い、接続後はPC同士が直接通信する（WebRTC）。
   オンライン機能を使うときだけライブラリを読み込むので、ひとり用はオフラインでも遊べる。 */
const NET={
  VERSION:2,PREFIX:'kourou-dungeon-',MAX:5,SNAP_HZ:20,INPUT_HZ:30,
  LIBS:['https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js','https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js'],
};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const r1=v=>Math.round(v*10)/10,r3=v=>Math.round(v*1000)/1000;
const slotOfPid=pid=>Math.max(0,(parseInt(String(pid).slice(1),10)||1)-1);

/** 通信の大きさの上限：ブラウザによっては数万バイトでも「message-too-big」になるため、小さく分けて送る */
const WIRE_CHUNK=4000; // 1通は約12KB（日本語でも）以下に。出発の合図(約19KB)でも弾かれたため小さめにする
let wireSeq=0;
const wireParts=new Map();
/** 1通のメッセージを、必要なら小分けにして送る */
let lastSent='';
function sendWire(conn,msg){
  const str=JSON.stringify(msg);
  lastSent=(msg&&msg.t||'?')+' '+str.length+'字';
  if(str.length<=WIRE_CHUNK){conn.send(msg);return;}
  const id=(++wireSeq)+'_'+Date.now(),n=Math.ceil(str.length/WIRE_CHUNK);
  for(let i=0;i<n;i++)conn.send({t:'chunk',id,i,n,d:str.slice(i*WIRE_CHUNK,(i+1)*WIRE_CHUNK)});
}
/** 受け取ったものを元の1通に戻す（まだ途中なら null） */
function unwire(d){
  if(!d||d.t!=='chunk')return d;
  let e=wireParts.get(d.id);
  if(!e){e={n:d.n,got:0,parts:[]};wireParts.set(d.id,e);}
  if(e.parts[d.i]===undefined){e.parts[d.i]=d.d;e.got++;}
  if(e.got<e.n)return null;
  wireParts.delete(d.id);
  try{return JSON.parse(e.parts.join(''));}catch(err){console.warn('通信の組み立てに失敗',err);return null;}
}

const Net={
  role:null,          // null | 'host' | 'guest'
  peer:null,code:'',myPid:'p1',
  members:[],         // ホスト：[{pid,name,guestId,host,conn,profile}]／参加者：ロビー表示用の一覧
  conn:null,          // 参加者：ホストとの接続
  inputs:{},edges:{},outEvents:[],profDirty:new Set(),
  snapT:0,sendT:0,profT:0,joinTimer:null,busy:false,
  init(){this.guestId=this.loadId();},
  loadId(){
    try{
      let id=localStorage.getItem('kourou_guest_id');
      if(!id){id='g'+Math.random().toString(36).slice(2,12)+Date.now().toString(36);localStorage.setItem('kourou_guest_id',id);}
      return id;
    }catch(e){return 'g'+Math.random().toString(36).slice(2,12);}
  },
  savedName(){try{return localStorage.getItem('kourou_net_name')||'';}catch(e){return '';}},
  saveName(n){try{localStorage.setItem('kourou_net_name',n);}catch(e){}},
  status(text,color){const el=document.getElementById('netStatus');if(el){el.textContent=text;el.style.color=color||'';}},
  loadLib(){
    if(window.Peer)return Promise.resolve(window.Peer);
    return new Promise((res,rej)=>{
      let i=0;
      const next=()=>{
        if(i>=NET.LIBS.length){rej(new Error('通信ライブラリを読み込めませんでした。インターネット接続を確認してください'));return;}
        const s=document.createElement('script');s.src=NET.LIBS[i++];
        s.onload=()=>window.Peer?res(window.Peer):next();
        s.onerror=()=>next();
        document.head.appendChild(s);
      };
      next();
    });
  },
  makeCode(){const C='0123456789';let s='';for(let i=0;i<6;i++)s+=C[Math.floor(Math.random()*C.length)];return s;},
  errText(err){
    const t=err&&err.type;
    return ({
      'peer-unavailable':'部屋が見つかりません。部屋コードを確認してください',
      'unavailable-id':'部屋コードが重複しました。もう一度お試しください',
      'network':'仲介サーバーに接続できません。インターネット接続を確認してください',
      'server-error':'仲介サーバーでエラーが起きました。少し待ってからお試しください',
      'socket-error':'仲介サーバーとの通信に失敗しました',
      'socket-closed':'仲介サーバーとの接続が閉じられました',
      'browser-incompatible':'このブラウザはオンライン通信（WebRTC）に対応していません',
      'webrtc':'PC同士の接続に失敗しました（ネットワーク環境によってはつながらない場合があります）',
      'disconnected':'仲介サーバーとの接続が切れました',
    })[t]||('通信エラー：'+((err&&err.message)||t||'不明'));
  },
  onPeerError(err){
    const text=this.errText(err);
    if(!this.role){this.status(text,'#ff6b6b');this.cleanup();this.busy=false;}
    else UI.notify(text,'#ff6b6b',5);
  },
  isOpen(c){return c&&c.open!==false;},
  send(msg){if(this.conn&&this.isOpen(this.conn)){try{sendWire(this.conn,msg);}catch(e){console.warn('送信失敗',e);}}},
  sendTo(pid,msg){const m=this.members.find(x=>x.pid===pid);if(m&&m.conn&&this.isOpen(m.conn)){try{sendWire(m.conn,msg);}catch(e){console.warn('送信失敗',e);}}},
  broadcast(msg){for(const m of this.members)if(!m.host)this.sendTo(m.pid,msg);},
  member(pid){return this.members.find(x=>x.pid===pid)||null;},
  lobbyList(){
    if(this.role==='host')return this.members.map(m=>{const st=computeStats(m.profile,null,0);return {pid:m.pid,name:m.name,host:!!m.host,ready:!!m.host||!!m.ready,atk:st.atk,def:st.def,weapon:st.weaponName};});
    return this.members;
  },
  cleanup(){
    clearTimeout(this.joinTimer);this.joinTimer=null;
    for(const m of this.members)if(m.conn){try{m.conn.close();}catch(e){}}
    if(this.conn){try{this.conn.close();}catch(e){}}
    if(this.peer){try{this.peer.destroy();}catch(e){}}
    this.role=null;this.peer=null;this.conn=null;this.members=[];this.inputs={};this.edges={};this.outEvents=[];this.profDirty.clear();this.code='';this.myPid='p1';
  },

  /* ---------- ホスト ---------- */
  async host(name){
    if(this.busy||this.role)return;
    this.busy=true;this.status('準備中…');
    let PeerCls;
    try{PeerCls=await this.loadLib();}catch(e){this.status(e.message,'#ff6b6b');this.busy=false;return;}
    const open=attempt=>{
      const code=this.makeCode();
      const peer=new PeerCls(NET.PREFIX+code,{debug:0});
      this.peer=peer;
      peer.on('open',()=>{
        this.busy=false;this.role='host';this.code=code;this.myPid='p1';
        this.members=[{pid:'p1',name,host:true,profile:App.profile}];
        App.onHosted();
      });
      peer.on('connection',conn=>this.onIncoming(conn));
      peer.on('error',err=>{
        if(err&&err.type==='unavailable-id'&&!this.role&&attempt<3){try{peer.destroy();}catch(e){}open(attempt+1);return;}
        this.onPeerError(err);
      });
      peer.on('disconnected',()=>{
        if(this.role!=='host')return;
        UI.notify('仲介サーバーとの接続が切れました。参加中のメンバーはそのまま遊べますが、新しい参加はできません。再接続を試みます','#ff8060',5);
        try{peer.reconnect();}catch(e){}
      });
    };
    open(0);
  },
  onIncoming(conn){
    conn.on('data',d=>{const full=unwire(d);if(full)this.onHostData(conn,full);});
    conn.on('close',()=>this.dropMember(conn,'接続が閉じました'));
    conn.on('error',e=>{console.error('参加者との接続エラー',e,'直前に送ったもの：',lastSent);this.dropMember(conn,'通信エラー'+(e&&(e.type||e.message)?'：'+(e.type||e.message):'')+' / 直前：'+lastSent);});
  },
  onHostData(conn,d){
    if(!d||typeof d!=='object')return;
    if(d.t==='hello'){
      const reject=reason=>{try{conn.send({t:'reject',reason});}catch(e){}setTimeout(()=>{try{conn.close();}catch(e){}},500);};
      if(d.v!==NET.VERSION){reject('ゲームのバージョンが違います。ホストと同じHTMLファイルを使ってください');return;}
      const gid=String(d.guestId||'').slice(0,40);
      const name=String(d.name||'').trim().slice(0,12)||'ゲスト';
      if(!gid){reject('参加者IDが不正です');return;}
      // 持ち寄ったセーブデータを検証（ありえない値や存在しないアイテムは取り除く）
      let profile;
      try{
        if(!d.profile||typeof d.profile!=='object')throw new Error('no profile');
        profile=Save.sanitize(Save.migrate(d.profile,clamp(d.saveVersion|0,0,Save.VERSION)));
        Net.clampProfile(profile);
      }catch(e){console.warn('参加者のセーブデータを読み込めませんでした',e);reject('セーブデータを読み込めませんでした');return;}
      let m=this.members.find(x=>x.guestId===gid);
      if(m){ // 同じ人の再接続：持ってきた最新のデータで置き換える
        if(m.conn&&m.conn!==conn){const old=m.conn;m.conn=null;try{old.close();}catch(e){}}
        m.conn=conn;m.name=name;m.profile=profile;
        if(App.world&&App.world.players[m.pid])setPlayerStats(App.world,m.pid,computeStats(profile,null,0));
      }else{
        if(this.members.length>=NET.MAX){reject('部屋が満員です（最大'+NET.MAX+'人）');return;}
        const pid=['p2','p3','p4','p5'].find(p=>!this.members.some(x=>x.pid===p));
        m={pid,name,guestId:gid,host:false,conn,profile};
        this.members.push(m);
      }
      sendWire(conn,{t:'welcome',pid:m.pid,code:this.code,profile:m.profile});
      UI.notify(`${esc(name)} が参加しました`,'#7fe0ff',3);
      this.broadcastLobby();
      if(App.inGame&&App.world)App.addLateJoiner(m);
      return;
    }
    const m=this.members.find(x=>x.conn===conn);if(!m)return;
    if(d.t==='ready'){m.ready=!!d.ready;this.broadcastLobby();return;}
    if(d.t==='resend'){ // 参加者がロビーのまま取り残されたとき：出発の合図を送り直す
      if(App.inGame&&App.world){
        this.sendTo(m.pid,this.startMessage(App.world,m.pid));
        this.sendTo(m.pid,{t:'profile',profile:m.profile});
        this.sendTo(m.pid,this.snapshot(App.world,true));
      }
      return;
    }
    if(d.t==='i'){
      this.inputs[m.pid]=d;
      const e=this.edges[m.pid]||(this.edges[m.pid]=newEdges());
      if(d.dodge)e.dodge=true;if(d.skill)e.skill=true;if(d.heal)e.heal=true;
      if(d.cycle)e.cycle=d.cycle<0?-1:1;
      if(d.sheathe)e.sheathe=true;
      if(d.cure)e.cure=true;
      if(typeof d.pick==='number'&&d.pick>=0&&d.pick<ITEM_ORDER.length)e.pick=d.pick|0;
    }else if(d.t==='cmd')App.hostCmd(m.pid,d);
  },
  dropMember(conn,why){
    if(this.role!=='host')return;
    const m=this.members.find(x=>x.conn===conn);if(!m)return;
    this.members=this.members.filter(x=>x!==m);
    delete this.inputs[m.pid];delete this.edges[m.pid];
    if(App.world&&App.world.players[m.pid])delete App.world.players[m.pid];
    UI.notify(`${esc(m.name)} が退出しました（${esc(why||'不明')}）`,'#ff8060',6);
    App.save();this.broadcastLobby();
  },
  /** 参加者：準備OK／取り消しをホストに伝える */
  setReady(v){if(this.role!=='guest'||!this.conn)return;this.send({t:'ready',ready:!!v});},
  broadcastLobby(){
    if(this.role!=='host')return;
    const q=App.questSel?questById(App.questSel):null;
    this.broadcast({t:'lobby',members:this.lobbyList(),inGame:App.inGame,quest:q?{name:q.name,goal:questGoalText(q.goal),reward:QuestRules.rewardText(q),stage:stageById(q.stage).name}:null});
    if(App.state==='lobby')App.goto('lobby');
  },
  /** 参加者の入力を1ステップ分取り出す（回避などの単発入力は1回だけ使う） */
  takeInput(pid){
    const d=this.inputs[pid];if(!d)return EMPTY_INPUT;
    const e=this.edges[pid]||{};
    const num=v=>clamp(Number(v)||0,-1,1);
    const r={mx:num(d.mx),my:num(d.my),attack:!!d.attack,guard:!!d.guard,dodge:!!e.dodge,skill:!!e.skill,heal:!!e.heal,cycle:e.cycle||0,pick:typeof e.pick==='number'?e.pick:-1,sheathe:!!e.sheathe,cure:!!e.cure};
    if(typeof d.aim==='number'&&isFinite(d.aim))r.aim=d.aim;
    this.edges[pid]=newEdges();
    return r;
  },
  /** 持ち寄りデータのゆるい上限チェック（内輪向け。極端な値だけ抑える） */
  clampProfile(p){
    p.gold=clamp(p.gold|0,0,9999999);
    if(p.items.length>400)p.items=p.items.slice(0,400);
    if(p.decos.length>400)p.decos=p.decos.slice(0,400);
    for(const it of p.items){
      const base=DATA.equipment[it.baseId];
      if(base.slot==='weapon'){it.atk=Math.min(it.atk,Math.ceil(base.atk*1.1*1.25)+1);it.crit=Math.min(it.crit,base.crit+3);}
      else it.def=Math.min(it.def,Math.ceil(base.def*1.12*1.25)+1);
      it.slots=it.slots.slice(0,Items.maxSlots(it));it.effects=it.effects.slice(0,2);it.affixes=it.affixes.slice(0,3).map(a=>({id:a.id,v:Math.min(a.v,Math.ceil(DATA.affixes[a.id].max*1.25))}));
    }
    for(const k in p.materials)p.materials[k]=Math.min(p.materials[k],9999);
  },
  markProfile(pid){if(this.role==='host'&&pid!=='p1')this.profDirty.add(pid);},
  flushProfiles(){for(const pid of this.profDirty){const m=this.member(pid);if(m)this.sendTo(pid,{t:'profile',profile:m.profile});}this.profDirty.clear();},
  hostFrame(dt){
    this.snapT+=dt;
    if(this.snapT>=1/NET.SNAP_HZ&&App.world){this.snapT=0;this.broadcast(this.snapshot(App.world));this.outEvents=[];}
    this.profT+=dt;
    if(this.profT>=1){this.profT=0;this.flushProfiles();}
  },
  liteLoot(l){
    if(l.type==='equip')return {type:'equip',item:{baseId:l.item.baseId,slot:l.item.slot,rarity:l.item.rarity}};
    if(l.type==='deco')return {type:'deco',item:{decoId:l.item.decoId,rarity:l.item.rarity}};
    if(l.type==='mat')return {type:'mat',id:l.id};
    return {type:l.type};
  },
  statCache:{},statT:0,
  /** ステータスと名前は変わったときだけ送る（通信量を減らす。2秒ごとには念のため全部送る） */
  changedOnly(p,full){
    const key=JSON.stringify([p.stats,p.info]);
    if(!full&&this.statCache[p.id]===key)return null;
    this.statCache[p.id]=key;return true;
  },
  snapshot(w,full){
    this.statT+=1/NET.SNAP_HZ;
    if(this.statT>=2){this.statT=0;full=true;}
    const s={t:'s',time:r1(w.time),status:w.status,quest:w.quest,pc:w.playerCount,door:w.map.doorClosed,
      players:Object.values(w.players).map(p=>({id:p.id,slot:p.slot,look:p.petLook||null,lookV:p.petLookV||0,collar:p.petCollar||null,x:r1(p.x),y:r1(p.y),r:p.r,hp:Math.ceil(p.hp),facing:r3(p.facing),
        swing:r3(p.swing),swingTotal:r3(p.swingTotal),swingAngle:r3(p.swingAngle),swingDir:p.swingDir,dodgeTime:r3(p.dodgeTime),dodgeInv:r3(p.dodgeInv),
        hitInv:r3(p.hitInv),hurt:r3(p.hurt),dead:p.dead,revive:r3(p.revive),reviveNeed:r1(p.reviveNeed||CONFIG.coop.reviveTime),downT:r1(p.downT||0),out:!!p.out,bag:p.bag,sel:p.sel,potionCd:r3(p.potionCd),skillCd:r3(p.skillCd),
        using:p.using?{item:p.using.item,t:r3(p.using.t),total:p.using.total}:null,ws:p.ws?{id:p.ws.id,t:r1(p.ws.t)}:null,charging:p.charging,charge:r3(p.charge),buffT:r3(p.buffT),buffs:p.buffs,drawn:p.drawn,flow:p.flow,
        sheathing:p.sheathing?{t:r3(p.sheathing.t),total:p.sheathing.total}:null,slowT:r3(p.slowT||0),poisoned:r3(p.poisoned||0),poisonT:r3(p.poisonT||0),paraT:r3(p.paraT||0),sleepT:r3(p.sleepT||0),curseT:r3(p.curseT||0),
        dodgeCd:r3(p.dodgeCd),moving:p.moving,walk:r1(p.walk),...(this.changedOnly(p,full)?{stats:p.stats,info:p.info}:{})})),
      enemies:w.enemies.map(e=>({id:e.id,type:e.type,x:r1(e.x),y:r1(e.y),r:e.r,hp:Math.ceil(e.hp),maxHp:e.maxHp,state:e.state,facing:r3(e.facing),
        atkAngle:r3(e.atkAngle),timer:r3(e.timer),phase:e.phase,hurt:r3(e.hurt),anim:r1(e.anim),boss:e.boss,
        trapT:r3(e.trapT||0),trapKind:e.trapKind||null,blindT:r3(e.blindT||0),weakNoticed:!!e.weakNoticed,
        elite:e.elite,mid:e.mid,emp:e.empowerT>0,z:r1(e.z||0),action:e.action||null,summoned:e.summoned})),
      projectiles:w.projectiles.map(p=>({id:p.id,kind:p.kind,owner:p.owner,x:r1(p.x),y:r1(p.y),angle:r3(p.angle),r:p.r,life:r3(p.life)})),
      telegraphs:w.telegraphs.map(t=>({id:t.id,shape:t.shape,x:r1(t.x),y:r1(t.y),r:t.r,angle:t.angle,arc:t.arc,len:t.len,width:t.width,t:r3(t.t),total:t.total,dmg:t.dmg>0?1:0,small:!!t.small,kind:t.kind||null})),
      hazards:(w.hazards||[]).map(z=>({id:z.id,kind:z.kind,x:r1(z.x),y:r1(z.y),r:z.r,t:r3(z.t),life:z.life,delay:r3(z.delay||0)})),
      blizzard:w.blizzard?{on:!!w.blizzard.on}:null,narrowVision:!!w.narrowVision,
      gathers:(w.gathers||[]).map(g=>({id:g.id,x:g.x,y:g.y,kind:g.kind,used:g.used})),
      drops:w.drops.map(d=>({id:d.id,x:r1(d.x),y:r1(d.y),loot:this.liteLoot(d.loot)})),
      chests:w.chests.map(c=>({id:c.id,x:c.x,y:c.y,opened:c.opened})),
      placed:(w.placed||[]).map(o=>({id:o.id,kind:o.kind,item:o.item,x:r1(o.x),y:r1(o.y),t:r3(o.t),r:o.r})),
      ev:this.outEvents};
    return s;
  },
  startMessage(w,pid){
    return {t:'start',pid,map:{W:w.map.W,H:w.map.H,tiles:Array.from(w.map.tiles),doorTiles:w.map.doorTiles,doorClosed:w.map.doorClosed,theme:w.map.theme||'cave'},
      quest:w.quest,questId:w.questId,diff:w.diff,bossId:w.bossId,pc:w.playerCount};
  },
  broadcastStart(w){
    for(const m of this.members)if(!m.host){this.sendTo(m.pid,this.startMessage(w,m.pid));this.sendTo(m.pid,{t:'profile',profile:m.profile});}
    this.broadcast(this.snapshot(w,true));this.outEvents=[];
  },

  /* ---------- 参加者 ---------- */
  async join(code,name){
    if(this.busy||this.role)return;
    code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(code.length!==6){this.status('部屋コードは6文字です','#ff6b6b');return;}
    this.busy=true;this.status('接続中…');
    let PeerCls;
    try{PeerCls=await this.loadLib();}catch(e){this.status(e.message,'#ff6b6b');this.busy=false;return;}
    const peer=new PeerCls({debug:0});this.peer=peer;
    this.joinTimer=setTimeout(()=>{
      if(this.role!=='guest'){this.status('接続できませんでした（タイムアウト）。部屋コードを確認してください。ネットワーク環境によってはつながらない場合があります','#ff6b6b');this.cleanup();this.busy=false;}
    },15000);
    peer.on('open',()=>{
      const conn=peer.connect(NET.PREFIX+code,{reliable:true,serialization:'json'});
      this.conn=conn;
      conn.on('open',()=>sendWire(conn,{t:'hello',v:NET.VERSION,guestId:this.guestId,name,saveVersion:Save.VERSION,profile:App.profile}));
      conn.on('data',d=>{const full=unwire(d);if(full)this.onGuestData(full);});
      conn.on('close',()=>this.onHostLost());
      conn.on('error',()=>this.onHostLost());
    });
    peer.on('error',err=>this.onPeerError(err));
  },
  onGuestData(d){
    if(!d||typeof d!=='object')return;
    switch(d.t){
      case 'welcome':
        clearTimeout(this.joinTimer);this.busy=false;
        this.role='guest';this.myPid=d.pid;this.code=d.code;
        App.enterGuest(d.profile);
        UI.notify('部屋に参加しました','#7fe0ff',3);
        App.goto('lobby');
        break;
      case 'reject':this.status(d.reason,'#ff6b6b');UI.notify(esc(d.reason),'#ff6b6b',5);this.cleanup();this.busy=false;break;
      case 'lobby':this.members=Array.isArray(d.members)?d.members:[];this.lobbyQuest=d.quest||null;
        if(App.state==='lobby'&&d.inGame){ // 出発しているのにロビーのままなら、合図を送り直してもらう（3秒に1回まで）
          const now=Date.now();if(now-(this.resendAt||0)>3000){this.resendAt=now;this.send({t:'resend'});}
        }
        if(App.state==='lobby')App.goto('lobby');break;
      case 'profile':App.applyHostProfile(d.profile);break;
      case 'sel':App.inv.sel=d.uid;App.refreshPanel();if(App.state==='smith')App.askEquip(d.uid);break;
      case 'notify':UI.notify(String(d.text||''),d.color||'#888',d.dur||2.5);break;
      case 'start':try{App.guestStart(d);}catch(e){console.error('出発の反映に失敗',e);UI.notify('出発の反映に失敗しました（'+e.message+'）。ホストと同じHTMLか確認してください','#ff6060',6);}break;
      case 's':if(App.world&&App.world.mirror)this.applySnap(App.world,d);break;
      case 'end':App.guestEnd(d);break;
      case 'closed':this.onHostLost('ホストが部屋を閉じました');break;
    }

  onHostLost(reason){

/** ボスの個性（起動時に一度だけ）。速いボスは体力が少なく攻撃が鋭い、攻撃が高く遅いボスは体力も攻撃も高め。
    技の威力は、そのボスで一番強い技をさらに強く、一番弱い技をさらに弱くして、技ごとの差を広げる */
function applyBossStyles(){
  for(const d of Object.values(DATA.enemies)){
    if(!d.boss||d._styled)continue;d._styled=true;
    let hm=1,am=1;
    if(d.speed>=125){hm=0.85;am=1.15;}                    // 俊敏
    else if(d.atk>=30&&d.speed<=100){hm=1.1;am=1.2;}      // 豪腕
    d.hp=Math.round(d.hp*hm);d.atk=Math.round(d.atk*am*10)/10;
    const ms=(d.pattern||[]).filter(m=>m.dmg!=null).sort((a,b)=>b.dmg-a.dmg);
    if(ms.length>=2){ms[0].dmg=Math.round(ms[0].dmg*1.15*100)/100;ms[ms.length-1].dmg=Math.round(ms[ms.length-1].dmg*0.85*100)/100;}
  }
}

        for(let i=0;i<nl;i++)list.push({type:'equip',item:Items.createLetter(Items.rollLetterTier(bst,DATA.letterCap(q.stage)))});}
      for(const l of list)res[pid].rewards.push(this.grantLoot(l,pid));
      // 進行の記録とステージ解放
      const pr=this.profileFor(pid),pg=pr.progress||(pr.progress={stage:1,done:{}});
      const keysBefore=QuestRules.urgentOpen(pr,q.stage),minBefore=QuestRules.minionsOpen(pr,q.stage);
      pg.done[q.id]=(pg.done[q.id]||0)+1;
      if(!minBefore&&QuestRules.minionsOpen(pr,q.stage))res[pid].notes.push('雑魚の依頼を2つ達成！ 強敵ボスに挑めるようになりました');
      pr.stats.clears++;
      if(!keysBefore&&QuestRules.urgentOpen(pr,q.stage)){const u=DATA.quests.find(x=>x.stage===q.stage&&x.urgent);if(u)res[pid].notes.push(`緊急依頼「${u.name}」が出現しました！`);}
      if(pg.done[q.id]===1)for(const nq of DATA.quests.filter(x=>x.after===q.id))res[pid].notes.push(`強敵依頼「${nq.name}」が出現しました！`);
      if(q.unlocks&&pg.stage<q.unlocks){pg.stage=q.unlocks;res[pid].notes.push(`新しいステージ「${stageById(q.unlocks).name}」が解放されました！`);}
      else if(q.urgent&&!q.unlocks&&pg.done[q.id]===1)res[pid].notes.push('全ステージの緊急依頼を達成しました！ おめでとうございます！');
    }
    for(const pid in this.bossRewards)if(res[pid])for(const l of this.bossRewards[pid])res[pid].rewards.push(this.grantLoot(l,pid));
    w.drops=[];this.bossRewards={};
    // ボスへの与ダメージ（全員分・多い順）。参加者の画面にも同じ内容を送る
    const bossDmg=pids.map(pid=>({name:w.players[pid]?playerName(w.players[pid]):String(pid),dmg:(w.bossDmg&&w.bossDmg[pid])||0})).sort((a,b)=>b.dmg-a.dmg);
    const base={time:w.time,kills:w.quest.killed,total:w.quest.total,chests:w.quest.chests,chestsTotal:w.quest.chestsTotal,questName:q.name,goal:questGoalText(q.goal,w.playerCount),explore:!!q.explore,bossDmg};
    const mineIds=Net.role?['p1']:pids;
    this.lastResult=Object.assign({},base,{
      rewards:[].concat(...mineIds.map(pid=>res[pid]?res[pid].rewards:[])),
      left:[].concat(...mineIds.map(pid=>res[pid]?res[pid].left:[])),
      notes:[...new Set([].concat(...mineIds.map(pid=>res[pid]?res[pid].notes:[])))],
      count:mineIds.reduce((a,pid)=>a+(this.sessionCounts[pid]||0),0)});
    if(Net.role==='host'){
      for(const pid of pids)if(pid!=='p1'&&res[pid])Net.sendTo(pid,{t:'end',kind:'clear',result:Object.assign({},base,res[pid],{count:this.sessionCounts[pid]||0})});
      for(const pid of pids)Net.markProfile(pid);
      Net.flushProfiles();Net.broadcastLobby();
    }
    this.save();this.goto('clear');
  },
  /** どの画面からでも押せる「更新を確認」（タイトル・拠点・一時停止の中に常に出す） */
  updateBarHTML(){return `<div class="updbar"><button data-act="checkUpdate">更新を確認</button> <span id="updateMsg" class="small muted"></span></div>`;},
  /** 公開中のページの版を確かめる。新しければ「今すぐ更新」を出す（キャッシュを避けて取り直す） */
  async checkUpdate(){
    const el=document.getElementById('updateMsg');if(!el)return;
    const show=(html,color)=>{el.innerHTML=html;el.style.color=color||'';};
    show('確認中…');
    try{
      const res=await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'});
      const text=await res.text();
      const m=text.match(/GAME_VERSION=\{no:'([^']+)'/);
      if(!m){show('確認できませんでした（このファイルでは確認できないことがあります）','#ff8a6a');return;}
      if(m[1]===GAME_VERSION.no){show(`最新です（ver ${GAME_VERSION.no}）`,'#5fe08a');return;}
      show(`新しいバージョン ver ${m[1]} があります　<button class="primary" data-act="reloadNow">今すぐ更新</button>`,'#ffd23a');
    }catch(e){show('確認できませんでした（通信を確かめてください）','#ff8a6a');}
  },
  /** 画面通知・振動など、ホストでも参加者でも同じように出す演出 */
  eventUI(ev){
    const mine=ev.pid?this.localInputPid(ev.pid):null;
    switch(ev.type){
      case 'damage':if(ev.target==='player'&&mine&&!ev.dot)Input.rumble(140,0.7,mine);break;
      case 'tgResolve':if(ev.shape==='circle')Input.rumble(200,0.5,Net.role?'p1':undefined);break;
      case 'playerDead':
        if(mine)Input.rumble(400,1.0,mine);
        if(this.world&&this.world.playerCount>1&&Object.values(this.world.players).some(q=>!q.dead))
          UI.notify(`${this.label(ev.pid)} が倒れた！ 30秒以内に重なって5秒動かずにいると助け起こせます`,'#ff6060',4);
        break;
      case 'playerOut':UI.notify(`${this.label(ev.pid)} は力尽きた……`,'#ff8080',3);break;
      case 'revive':UI.notify(`${this.label(ev.by)} が ${this.label(ev.pid)} を助け起こした！`,'#5fe08a',3);Renderer.ring(ev.x,ev.y,10,70,'#5fe08a',0.6,4);break;
      case 'bossStart':Input.rumble(350,0.8,Net.role?'p1':undefined);if(!Net.role&&this.playerIds().length>1)Input.rumble(350,0.8,'p2');UI.notify((ev.name||'ボス')+'が目を覚ました！ 赤い範囲は攻撃の予兆です','#ff9a6a',4);break;
      case 'doorClose':UI.notify('退路が閉ざされた……','#ff6060',3);break;
      case 'enrage':Input.rumble(400,0.9,Net.role?'p1':undefined);UI.notify((ev.name||'ボス')+(ev.awaken?'が覚醒した！ 攻撃が激しくなる':'が怒り状態になった！ 攻撃が激しくなる'),'#ff5050',4);break;
      case 'revived':UI.notify(esc(ev.name||'魔物')+'がよみがえった！ 呪術師を先に倒そう','#c070ff',3);break;
      case 'slowed':if(mine)Input.rumble(120,0.4,mine);break;
      case 'bossDefeated':Renderer.showBanner((ev.name||'ボス')+'を討伐した！','#5fe08a');break;
      case 'bossWeak':UI.notify(esc(ev.name||'ボス')+'が足を引きずっている…弱っているようだ','#ffb070',4);break;
      case 'trapped':if(ev.boss)UI.notify(esc(ev.name)+'が'+(ev.kind==='pit'?'落とし穴':'シビレ罠')+'にかかった！（'+ev.sec+'秒）','#ffe040',3);break;
      case 'questComplete':Renderer.showBanner('クエスト達成！','#5fe08a');UI.notify('依頼の目標を達成しました！','#5fe08a',3);break;
    }
  },
  /** ホスト（とひとり／同じ画面）での処理。アイテム入手はここで各プレイヤーのデータに反映する */
  processEvents(){
    const w=this.world;if(!w)return;
    const evs=w.events;w.events=[];
    const host=Net.role==='host';
    for(const ev of evs){
      Renderer.onEvent(ev,this.settings());
      Sound.onEvent(ev);
      this.eventUI(ev);
      let out=ev;
      switch(ev.type){
        case 'loot':{
          const lb=this.grantLoot(ev.loot,ev.pid);
          const text=`入手：<span style="color:${lb.color}">${lb.text}</span>`;
          if(this.localInputPid(ev.pid))UI.notify(text,lb.color);
          else if(host)Net.sendTo(ev.pid,{t:'notify',text,color:lb.color});
          out={type:'loot',pid:ev.pid,x:ev.x,y:ev.y};
          break;
        }
        case 'kill':
          if(!ev.noCount){
            this.profile.stats.kills++;this.dirty=true;
            this.registerKill(ev.enemy);
          }
          if(ev.boss)this.rollBossRewards(ev.table);
          else if(ev.table){
            this.giveRewards(ev.table,'');
            if(ev.elite)for(let i=0;i<CONFIG.elite.bonusRolls;i++)this.giveRewards(ev.table,'強敵：',null,i===0&&(Items.lootStage||1)>=5?[{type:'mat',id:'enchant_orb',n:1}]:null); // ステージ5以降は付与の玉を確定
            if(ev.mid){for(let i=0;i<CONFIG.midBoss.bonusRolls;i++)this.giveRewards(ev.table,'中ボス：');this.giveRewards('midboss','中ボス：');}
          }
          break;
        case 'gather':this.giveRewards(ev.table,'採取：','gather');break;
        case 'chest':this.giveRewards(ev.table,'宝箱：');break;
        case 'itemUsed':{
          const pr=(Companion.isId(ev.pid)||this.training)?null:this.profileFor(ev.pid); // 仲間の消耗品は仲間自身の持ち物から減る／訓練場では減らない
          if(pr){pr.bag[ev.item]=Math.max(0,(pr.bag[ev.item]||0)-1);this.syncPotions(ev.pid);Net.markProfile(ev.pid);}
          this.dirty=true;out=null;break;
        }
        case 'info':
          if(this.localInputPid(ev.pid))UI.notify(ev.text,'#888',1.5);
          else if(host)Net.sendTo(ev.pid,{t:'notify',text:ev.text,color:'#888',dur:1.5});
          out=null;break;
      }
      if(host&&out)Net.outEvents.push(out);
    }
  },
  /** 参加者側：ホストから届いた出来事を演出として再生する */
  guestEvent(ev){
    Renderer.onEvent(ev,this.settings());
    Sound.onEvent(ev);
    this.eventUI(ev);
  },
  /** モンスター図鑑に討伐を記録する（受け取る人それぞれのデータに）。初めて倒した魔物は通知 */
  registerKill(type){
    if(!DATA.enemies[type])return;
    for(const pid of this.rewardReceivers()){
      const pr=this.profileFor(pid);if(!pr)continue;
      const b=pr.bestiary||(pr.bestiary={});
      const first=!b[type];b[type]=(b[type]||0)+1;
      if(first){
        const text=`📖 図鑑に「${DATA.enemies[type].name}」が登録されました`;
        if(this.localInputPid(pid)||!Net.role)UI.notify(text,'#9ad8ff',2.6);
        else if(Net.role==='host')Net.sendTo(pid,{t:'notify',text,color:'#9ad8ff',dur:2.6});
      }
      Net.markProfile(pid);
    }
    this.dirty=true;
  },
  /** 報酬を受け取る相手。オンラインは全員がそれぞれ受け取り、同じ画面では共有の倉庫に1回だけ入る */
  rewardReceivers(){
    const seen=new Set(),out=[];
    for(const pid of this.playerIds()){const pr=this.profileFor(pid);if(pr&&!seen.has(pr)){seen.add(pr);out.push(pid);}}
    return out;
  },
  /** 敵を倒した・宝箱を開けた瞬間に、素材・装飾品・ゴールドを直接渡し、1行にまとめて通知する */
  giveRewards(table,prefix,kind,extra){
    for(const pid of this.rewardReceivers()){
      const st=this.skillStatsFor(pid);
      const loot=Items.rollLoot(table,st.rareBonus);
      if(extra)loot.push(...extra.map(x=>({...x}))); // 確定の報酬（強敵の付与の玉）
      if(kind==='gather'&&st.gatherBonus>0&&RNG.next()*100<st.gatherBonus)loot.push(...Items.rollLoot(table,st.rareBonus)); // 採取強化
      if(!loot.length)continue;
      const labels=loot.map(l=>this.grantLoot(l,pid));
      const text=prefix+labels.map(lb=>`<span style="color:${lb.color}">${lb.text}</span>`).join('　');
      const color=labels.some(lb=>lb.color!=='#ffd23a'&&loot.some(l=>l.type==='deco'))?'#c06bff':'#d8d0c0';
      if(this.localInputPid(pid)||(!Net.role))UI.notify(text,color,2.6);
      else if(Net.role==='host')Net.sendTo(pid,{t:'notify',text,color,dur:2.6});
    }
  },
  /** ボス報酬はその場で抽選し、クリア画面でまとめて渡す（プレイヤーごとに個別抽選） */
  rollBossRewards(table){
    for(const pid of this.rewardReceivers()){
      this.bossRewards[pid]=Items.rollLoot(table,this.skillStatsFor(pid).rareBonus);
      const pr=this.profileFor(pid);
      if(pr){pr.coins=(pr.coins||0)+1;(this.runCoins=this.runCoins||{})[pid]=((this.runCoins||{})[pid]||0)+1;Net.markProfile(pid);}
      if(this.localInputPid(pid)||!Net.role)UI.notify('ボスを倒した！ コインを1つ獲得','#ffd23a',2.5);
    }
  },
  /** 報酬に関わる防具スキル（採取強化・レア素材率アップ）の値。
      オンラインは参加者それぞれのスキル、同じ画面の2人は倉庫が共有なので2人のうち高い方 */
  skillStatsFor(pid){
    const w=this.world,out={gatherBonus:0,rareBonus:0};
    if(!w)return out;
    const ps=Net.role?[w.players[pid]]:Object.values(w.players);
    for(const p of ps)if(p&&p.stats){out.gatherBonus=Math.max(out.gatherBonus,p.stats.gatherBonus||0);out.rareBonus=Math.max(out.rareBonus,p.stats.rareBonus||0);}
    return out;
  },
  grantLoot(loot,pid){
    pid=pid||'p1';
    const p=this.profileFor(pid)||this.profile;
    // 探索中に手に入れた素材・装備・装飾品・お金は runGains に記録（全滅したら取り消す）
    const g=this.inGame&&this.runGains?(this.runGains[pid]=this.runGains[pid]||{mats:{},items:[],decos:[],gold:0}):null;
    if(loot.type==='mat'){p.materials[loot.id]=(p.materials[loot.id]||0)+loot.n;(p.matSeen=p.matSeen||{})[loot.id]=1;if(g)g.mats[loot.id]=(g.mats[loot.id]||0)+loot.n;}
    else if(loot.type==='equip'){Profile.addItem(p,loot.item);if(g)g.items.push(loot.item.uid);}
    else if(loot.type==='deco'){Profile.addDeco(p,loot.item);if(g)g.decos.push(loot.item.uid);}
    else if(loot.type==='gold'){p.gold=(p.gold||0)+loot.n;if(g)g.gold+=loot.n;}
    else if(loot.type==='item'){
      const c=DATA.consumables[loot.id],before=p.bag[loot.id]||0;p.bag[loot.id]=Math.min(c.max,before+loot.n);
      this.syncPotions(pid);
      if(p.bag[loot.id]===before&&this.localInputPid(pid))UI.notify(c.name+'は上限（'+c.max+'個）です','#888',2);
    }
    const lb=lootLabel(loot);
    if(this.localInputPid(pid))this.sessionLoot.push(lb);
    this.sessionCounts[pid]=(this.sessionCounts[pid]||0)+1;
    Net.markProfile(pid);
    this.dirty=true;
    return lb;
  },
  /* ---------- オンライン：ホスト側の処理 ---------- */
  onHosted(){
    UI.notify(`部屋を作りました。部屋コード：<b>${Net.code}</b>`,'#7fe0ff',6);
    this.goto('lobby');
  },
  /** 参加者から届いた装備・製作の操作を、その人のデータに対して実行する */
  hostCmd(pid,d){
    const m=Net.member(pid);
    const allowed=['equip','unequip','sell','deco','craft','buy','sellMat','reinforce','enchant','sellMany','costume'];
    if(!m||!allowed.includes(d.act))return;
    const args=(d.args&&typeof d.args==='object')?d.args:{};
    let r={};
    try{r=Ops[d.act](m.profile,0,args)||{};}catch(e){console.warn('操作の処理に失敗',e);r={msg:'操作に失敗しました',color:'#ff6060'};}
    if(r.changed&&this.world&&this.world.players[pid]){
      setPlayerStats(this.world,pid,computeStats(m.profile,null,0));
      this.world.players[pid].bag=Object.assign(emptyBag(),m.profile.bag);
    }
    Net.sendTo(pid,{t:'profile',profile:m.profile});
    if(r.sel)Net.sendTo(pid,{t:'sel',uid:r.sel});
    if(r.msg)Net.sendTo(pid,{t:'notify',text:r.msg,color:r.color||'#888'});
    this.save();Net.broadcastLobby();
  },
  /** ホスト：全員でロビーに戻る（探索の中断・クリア後） */
  hostToLobby(){
    if(this.inGame){Net.broadcast({t:'end',kind:'abort'});}

  /* ---------- オンライン：参加者側の処理 ---------- */
  /** ホストが検証・更新した自分のデータを受け取り、自分のPCに保存する（設定だけは手元のものを使う） */
  applyHostProfile(pr){
    if(!pr||typeof pr!=='object')return;
    try{
      const clean=Save.sanitize(pr);
      clean.settings=this.profile.settings;
      this.profile=clean;
      this.save();
    }catch(e){console.warn('ホストから届いたデータを反映できませんでした',e);return;}
    this.refreshPanel();
  },
  /** 装備画面・鍛冶屋・ショップを開いていれば描き直す */
  /** 状態異常になった時、解毒薬を持っていれば2秒だけ「解毒薬を使う」を出す */
  cureWatch(){
    const w=this.world,me=w&&w.players[this.myPid];
    const live=!!(me&&!me.dead);
    const now={poison:live&&me.poisonT>0,curse:live&&me.curseT>0,para:live&&me.paraT>0,sleep:live&&me.sleepT>0};
    const has=now.poison||now.curse||now.para||now.sleep;
    // 新しくかかった状態は閃光と状態名で知らせる
    const names={poison:['毒！','#8cff4a'],para:['麻痺！','#ffe040'],sleep:['睡眠！','#8a7cff'],curse:['呪い！','#c070ff']};
    const prev=this.statusPrev||{};
    for(const k in names)if(now[k]&&!prev[k])Renderer.statusFx={text:names[k][0],color:names[k][1],start:Date.now(),life:1.2};
    this.statusPrev=now;
    Renderer.statusView=now;
    if(has&&!this.cureHad&&((me.bag&&me.bag.antidote)||0)>0)this.showCurePop();
    if(!has&&this.cureHad)this.hideCurePop();
    this.cureHad=has;
  },
  showCurePop(){
    let el=document.getElementById('curePop');
    if(!el){
      el=document.createElement('button');el.id='curePop';el.textContent='解毒薬を使う';
      el.style.cssText='position:fixed;left:50%;top:40%;transform:translateX(-50%);z-index:60;padding:3px 10px;font-size:12px;border-radius:12px;border:1px solid #9ff0d0;background:rgba(16,36,32,.9);color:#c8fff0;display:none;touch-action:manipulation';
      el.onclick=()=>{this.hideCurePop();const e=this.edges[this.myPid]||(this.edges[this.myPid]=newEdges());e.cure=true;};
      document.body.appendChild(el);
    }
    el.style.display='block';clearTimeout(this.curePopT);this.curePopT=setTimeout(()=>this.hideCurePop(),2000);
  },
  hideCurePop(){const el=document.getElementById('curePop');if(el)el.style.display='none';clearTimeout(this.curePopT);},
  refreshPanel(){
    if(this.state==='inventory')this.renderInventory();
    else if(this.state==='smith'||this.state==='shop')this.goto(this.state);
    else if(this.state==='gifts')UI.show(this.giftsHTML());
