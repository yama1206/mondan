  /* ---------- 入力・画面遷移 ---------- */
  /** 割り当ての登録：押したキー・ボタンを操作に入れる（すでに別の操作にあれば入れ替える） */
  finishRebind(v){
    const r=this.rebind;if(!r)return;this.rebind=null;
    const st=this.settings(),B=getBinds(),cur=B[r.kind];
    const other=Object.keys(cur).find(a=>a!==r.act&&cur[a]===v);
    const old=cur[r.act];
    st.binds=st.binds||{};st.binds[r.kind]=Object.assign({},DEFAULT_BINDS[r.kind],st.binds[r.kind]||{},{[r.act]:v});
    if(other!==undefined)st.binds[r.kind][other]=old;
    this.save();this.goto('settings');
  },
  bindHTML(){
    const B=getBinds(),r=this.rebind,type=padTypeNow();
    const rows=BIND_ACTS.map(([a,n])=>{
      const kbWait=r&&r.kind==='kb'&&r.act===a,padWait=r&&r.kind==='pad'&&r.act===a;
      return `<div style="display:grid;grid-template-columns:120px 1fr 1fr;gap:6px;align-items:center;margin:3px 0"><span>${n}</span>
        <button class="${kbWait?'primary':''}" data-act="bindKb" data-a="${a}">${kbWait?'キーを押して…（Escで取消）':'キー：'+keyLabel(B.kb[a])}</button>
        <button class="${padWait?'primary':''}" data-act="bindPad" data-a="${a}">${padWait?'ボタンを押して…':PAD_TYPE_NAMES[type]+'：'+PAD_NAMES[type][B.pad[a]]}</button></div>`;}).join('');
    return `<div class="setting" style="display:block"><b>操作の割り当て</b>（変えたい操作のボタンを押して、次に押したキー・ボタンを登録）
      <div class="small muted" style="margin:4px 0">割り当ては、ほかの操作と同じものを選ぶと入れ替わります。攻撃の左クリック・右クリック、メニュー（Esc／START）と持ち物（I／BACK）は変わりません。</div>
      ${rows}
      <div class="filters" style="margin-top:6px">${r?'<button data-act="bindCancel">割り当ての変更を取消</button>':''}<button data-act="bindReset">割り当てを初期設定に戻す</button></div></div>`;
  },
  onKey(code){
    // 割り当て変更中のキー（Esc は取消）
    if(this.rebind&&this.rebind.kind==='kb'){if(code==='Escape')this.rebind=null;else this.finishRebind(code);this.goto('settings');return;}
    if(UI.modalOpen()){if(code==='Escape')UI.closeModal();return;}
    switch(this.state){
      case 'playing':
        if(Input.keyEdge(code))break;
        if(code==='KeyI')this.openInventory('playing');
        else if(code==='Escape')this.goto('pause');
        break;
      case 'pause':if(code==='Escape')this.goto('playing');else if(code==='KeyI')this.openInventory('pause');break;
      case 'inventory':
        if(code==='Escape'&&this.inv.decoPick){this.inv.decoPick=null;this.renderInventory();}
        else if(code==='Escape'||code==='KeyI')this.goto(this.returnState);
        break;
      case 'settings':if(code==='Escape')this.goto(this.settingsReturn);break;
      case 'camp':case 'lobby':if(code==='KeyI')this.openInventory(this.state);break;
      case 'online':if(code==='Escape')this.goto('camp');break;
      case 'board':if(code==='Escape')this.goto(this.boardFrom);break;
      case 'smith':case 'shop':if(code==='Escape')this.goto(this.facilityFrom);break;
      case 'bestiary':if(code==='Escape')this.goto(this.bestiaryFrom||'camp');break;
      case 'help':if(code==='Escape')this.goto(this.helpFrom||'camp');break;
      case 'gifts':if(code==='Escape')this.goto(this.giftFrom||'camp');break;
    }
  },
  onBlur(){if(this.state==='playing')this.goto('pause');},
  /** コントローラーのボタンが押された瞬間に呼ばれる（番号は標準配列） */
  onPad(i,padIndex){
    // メニューの決定・戻る：通常は下(0)で決定・右(1)で戻る。Switch式は右(1)で決定・下(0)で戻る
    Sound.unlock();
    const okB=this.settings().padSwitch?1:0,backB=1-okB;
    if(i===backB&&this.state!=='playing')Sound.ui('back');
    if(UI.modalOpen()){if(i===okB)UI.padClick();else if(i===backB)UI.closeModal();return;}
    if(this.state==='playing'){
      const pid=Input.ownerOf(padIndex);
      if(i===9){this.onKey('Escape');return;}       // START：メニュー（誰が押してもよい）
      if(i===8){                                    // BACK：押した人の装備画面を開く
        this.openInventory('playing');return;
      }
      if(!pid)return;                               // 割り当てのないコントローラー
      const E=Input.edges[pid];
      // 割り当てた操作（攻撃・ガード・持ち物の切り替えは Input.pollPads で判定）
      const PBm=getBinds().pad,act=Object.keys(PBm).find(a=>PBm[a]===i);
      if(act==='dodge')E.dodge=true;
      else if(act==='sheathe')E.sheathe=true;
      else if(act==='skill')E.skill=true;
      else if(act==='heal')E.heal=true;
      return;
    }
    if(i===okB)UI.padClick();
    else if(i===backB)this.onKey('Escape');
    else if(i===9){if(this.state==='pause')this.onKey('Escape');}
    else if(i===8)this.onKey('KeyI');
    else if((i===4||i===5)&&this.state==='inventory'){
      const tabs=this.inv.mode==='items'?['items','craft','mats']:['equip','decos'];
      const n=(tabs.indexOf(this.inv.tab)+(i===5?1:-1)+tabs.length)%tabs.length;
      this.inv.tab=tabs[n];this.inv.decoPick=null;this.renderInventory();
      UI.restoreFocus('tab||'+tabs[n]+'|||||');
    }
  },
  onPadNav(dir){if(this.state!=='playing')UI.padNav(dir);},
  /** mode：'equip'（装備・装飾品）か 'items'（アイテム・素材）。省略時は装備 */
  openInventory(from,mode){this.returnState=from;this.inv.decoPick=null;this.inv.mode=mode==='items'?'items':'equip';this.inv.tab=this.inv.mode==='items'?'items':'equip';this.goto('inventory');},
  goto(st){
    const was=this.state;
    this.state=st;
    switch(st){
      case 'camp':this.world=null;this.inGame=false;UI.notes.style.top='';UI.show(this.campHTML());break;
      case 'online':UI.show(this.onlineHTML());break;
      case 'board':UI.show(this.boardHTML());break;
      case 'smith':
        if(was!=='smith'){this.smithCat='weapon';this.smithSub='all';} // 入るたびに武器から
        UI.show(this.smithHTML());
        if(was!=='smith'&&Input.uiPad)UI.restoreFocus(UI.padKey({dataset:{act:'smithCat',c:'weapon'}}));
        break;
      case 'bestiary':UI.show(this.bestiaryHTML());break;
      case 'help':UI.show(this.helpHTML());break;
      case 'gifts':UI.show(this.giftsHTML());break;
      case 'shop':
        if(was!=='shop')this.shopCart={buy:{},sell:{}};
        UI.show(this.shopHTML());
        // コントローラーで入ったときは、先頭の「装備画面へ」ではなく最初の商品に合わせる（押しっぱなしで装備が開くのを防ぐ）
        if(was!=='shop'&&Input.uiPad){const el=document.querySelector('.inv-body [data-act="cartAdd"]:not([disabled])')||document.querySelector('[data-act="facilityBack"]');UI.setFocus(el);}
        break;
      case 'lobby':if(!this.inGame)this.world=null;UI.notes.style.top='';UI.show(this.lobbyHTML());break;
      case 'playing':UI.hide();Input.reset();this.acc=0;break;
      case 'pause':UI.show(this.pauseHTML());break;
      case 'inventory':this.renderInventory();break;
      case 'settings':UI.show(this.settingsHTML());break;
      case 'gameover':UI.show(this.gameoverHTML());Sound.jingle('fail');break;
      case 'clear':UI.show(this.clearHTML());Sound.jingle('clear');break;
    }
  },
  readNetName(){
    const el=document.getElementById('netName');
    const name=String((el&&el.value)||'').trim().slice(0,12)||'プレイヤー';
    Net.saveName(name);return name;
  },
  action(act,ds,el){
    switch(act){
      case 'start':this.startSortie(Number(ds.n)||1);break;
      case 'board':this.boardFrom=this.state==='lobby'?'lobby':'camp';this.boardStage=questById(this.questSel).stage;this.goto('board');break;
      case 'boardStage':this.boardStage=Number(ds.s)||1;this.goto('board');break;
      case 'pickQuest':this.questSel=ds.id;this.goto('board');break;
      case 'boardBack':this.goto(this.boardFrom);break;
      case 'smith':case 'shop':this.facilityFrom=this.state==='lobby'?'lobby':'camp';this.goto(act);break;
      case 'facilityBack':this.goto(this.facilityFrom||'camp');break;
      case 'bestiary':if(this.state!=='bestiary')this.bestiaryFrom=this.state==='lobby'?'lobby':'camp';this.goto('bestiary');break;
      case 'help':if(this.state!=='help')this.helpFrom=this.state;this.helpTab='basic';this.helpWeapon=this.helpWeapon||'sword';this.goto('help');break;
      case 'bindKb':this.rebind={kind:'kb',act:ds.a};this.goto('settings');break;
      case 'bindPad':this.rebind={kind:'pad',act:ds.a};this.goto('settings');break;
      case 'bindCancel':this.rebind=null;this.goto('settings');break;
      case 'bindReset':{const st=this.settings();delete st.binds;this.rebind=null;this.save();this.goto('settings');break;}
      case 'helpBack':this.goto(this.helpFrom||'camp');break;
      case 'gifts':this.giftFrom=this.state;this.goto('gifts');break;
      case 'giftBack':this.goto(this.giftFrom||'camp');break;
      case 'giftClaim':this.doOp('claimGift',{id:ds.id});break;
      case 'helpTab':this.helpTab=ds.t;this.goto('help');break;
      case 'helpWeapon':this.helpWeapon=ds.w;this.goto('help');break;
      case 'helpPad':this.settings().padLabel=ds.v;this.save();this.goto('help');break;
      case 'bestSel':this.bestSel=ds.id;this.goto('bestiary');break;
      case 'bestStage':this.bestStage=Number(ds.s)||1;this.bestSel=null;this.goto('bestiary');break;
      case 'bestiaryBack':this.goto(this.bestiaryFrom||'camp');break;
      case 'smithCat':this.smithCat=ds.c;this.smithSub='all';this.goto('smith');break;
      case 'smithSub':this.smithSub=ds.s;this.goto('smith');break;
      case 'reinforce':this.doOp('reinforce',{uid:ds.uid});break;
      case 'enchant':this.doOp('enchant',{uid:ds.uid,t:Number(ds.t)});break;
      case 'chooseQuest':this.questSel=ds.id;this.goto('lobby');Net.broadcastLobby();break;
      case 'retry':if(Net.role==='host')this.startOnline();else this.startSortie(this.lastPlayers||1);break;
      case 'openEquip':this.openInventory(this.state,'equip');break;
      case 'openItems':this.openInventory(this.state,'items');break;
      case 'inventory':this.openInventory(this.state);break; // 鍛冶屋・ショップから開いた場合は閉じると施設に戻る
      case 'settings':this.settingsReturn=this.state;this.goto('settings');break;
      case 'reset':UI.confirm('セーブデータをすべて削除して最初からやり直します。<br><b>この操作は取り消せません。</b>よろしいですか？',()=>this.resetSave());break;
      case 'resume':this.goto('playing');break;
      case 'checkUpdate':this.checkUpdate();break;
      case 'reloadNow':location.href=location.pathname+'?v='+Date.now();break; // 別の読み込みとして開き直し（キャッシュを使わない）
      case 'trainExit':this.trainingExit();break;
      case 'training':this.questSel='training';this.startSortie(1);break;
      case 'exploreReturn':UI.confirm('探索を終えて帰りますか？<br><small>（この探索で手に入れたものは持ち帰れます）</small>',()=>{const w=this.world;if(w&&w.status==='playing'){w.status='clear';this.checkStatus();}});break;
      case 'retreat':UI.confirm('探索を中断して拠点に戻りますか？<br><small>（入手済みのアイテムは保持されます）</small>',()=>{this.save();this.goto('camp');});break;
      case 'camp':this.save();this.goto('camp');break;
      case 'online':this.goto('online');break;
      case 'netHost':this.questSel=null;Net.host(this.readNetName());break;
      case 'netJoin':{const c=document.getElementById('netCode');Net.join(c&&c.value,this.readNetName());break;}
      case 'padDigit':case 'padBack':case 'padClear':{ // コントローラー用の数字入力（部屋のコード）
        const el=document.getElementById('netCode');let v=el?el.value:(this.netCodeDraft||'');
        v=ds.act==='padClear'?'':ds.act==='padBack'?v.slice(0,-1):(v+ds.id).replace(/\D/g,'').slice(0,6);
        this.netCodeDraft=v;this.goto('online');break;}
      case 'netStart':this.startOnline();break;
      case 'netReady':{const me=Net.lobbyList().find(m=>m.pid===Net.myPid);Net.setReady(!(me&&me.ready));break;}
      case 'toLobby':
        if(Net.role==='host'){
          if(this.inGame)UI.confirm('探索を中断して、全員でロビーに戻りますか？',()=>this.hostToLobby());else this.hostToLobby();
        }else{this.world=null;this.goto('lobby');}
        break;
      case 'netLeave':
        UI.confirm(Net.role==='host'?'部屋を閉じますか？<br><small>参加者のデータは、それぞれのPCに保存されています</small>':'部屋を抜けますか？<br><small>ここまでの入手物はあなたのPCに保存されています</small>',()=>{
          if(Net.role==='host'){this.inGame=false;this.world=null;this.save();}
          Net.leave();this.goto('camp');
        });
        break;
      case 'back':this.goto(this.returnState);break;
      case 'backSettings':this.goto(this.settingsReturn);break;
      case 'tab':this.inv.tab=ds.tab;this.inv.decoPick=null;this.renderInventory();break;
      case 'filter':this.inv.filter=ds.f;this.inv.skill=null;this.inv.worn=false;this.renderInventory();break;
      case 'worn':this.inv.worn=!this.inv.worn;this.renderInventory();break;
      case 'skillFilter':this.inv.skill=ds.k||null;this.renderInventory();break;
      case 'invWho':this.inv.who=+ds.who||0;this.inv.sel=null;this.renderInventory();break;
      case 'petSel':this.inv.petSel=ds.id;this.renderInventory();break;
      case 'gacha':this.gachaRoll();break;
      case 'letterGacha':this.doOp('letterGacha',{stage:+ds.stage});break;
      case 'letterGacha10':this.doOp('letterGacha10',{stage:+ds.stage});break;
      case 'gachaDecoRar':this.gachaDecoRar=ds.r===''?null:+ds.r;this.refreshPanel();break;
      case 'gachaDecoSort':this.gachaDecoSort=ds.s;this.refreshPanel();break;
      case 'decoGachaAdd':{const cur=this.decoGachaSel||[];const [id,r]=String(ds.key).split('|');const p=this.profile;
        if(cur.length<DECO_GACHA.need){const next=(p.decos||[]).find(d=>d.decoId===id&&String(d.rarity)===r&&!cur.includes(d.uid)&&!Profile.decoOwner(p,d.uid));if(next)this.decoGachaSel=[...cur,next.uid];}
        this.refreshPanel();break;}
      case 'decoGachaDel':this.decoGachaSel=(this.decoGachaSel||[]).filter(x=>x!==ds.uid);this.refreshPanel();break;
      case 'decoGachaPick':{const u=ds.uid,cur=this.decoGachaSel||[];this.decoGachaSel=cur.includes(u)?cur.filter(x=>x!==u):(cur.length<DECO_GACHA.need?[...cur,u]:cur);this.refreshPanel();break;}
      case 'decoGacha':this.doOp('decoGacha',{uids:[...(this.decoGachaSel||[])]});this.decoGachaSel=[];break;
      case 'gacha10':this.gachaRoll10();break;
      case 'shopCat':this.shopCat=ds.cat;this.refreshPanel();break;
      case 'decoRarFilter':this.inv.decoRar=ds.r===''?null:+ds.r;this.renderInventory();break;
      case 'decoSort':this.inv.decoSort=ds.s;this.renderInventory();break;
      case 'gachaTab':this.gachaSub=ds.t;this.refreshPanel();break;
      case 'collarGacha':this.doOp('collarGacha',{});break;
      case 'petEquip':this.doOp('petEquip',{id:ds.id});break;
      case 'lookSel':this.inv.lookAsk=ds.id;this.inv.petSel=ds.id;this.renderInventory();break;
      case 'lookAskNo':this.inv.lookAsk=null;this.renderInventory();break;
      case 'costumeSet':this.doOp('costume',{slot:ds.slot,base:ds.base||null});break;
      case 'costumeClear':this.doOp('costume',{all:true});break;
      case 'lookEquip':this.inv.lookAsk=null;this.doOp('lookEquip',{id:ds.id,v:+ds.v});break;
      case 'bulkMode':this.inv.bulk=!this.inv.bulk;this.inv.bulkSel=[];this.renderInventory();break;
      case 'bulkTog':{const p=this.profile,u=ds.uid;
        if(Profile.equippedBy(p,u)>=0){UI.notify('装備中のものは選べません','#ff8060',2);break;}
        const L=this.inv.bulkSel=this.inv.bulkSel||[],k=L.indexOf(u);if(k>=0)L.splice(k,1);else L.push(u);
        this.renderInventory();break;}
      case 'bulkRarity':{const p=this.profile,r=Number(ds.r),L=this.inv.bulkSel=this.inv.bulkSel||[];
        const ids=p.items.filter(it=>it.rarity===r&&Profile.equippedBy(p,it.uid)<0).map(it=>it.uid);
        const all=ids.length>0&&ids.every(u=>L.includes(u));
        if(all)this.inv.bulkSel=L.filter(u=>!ids.includes(u));else ids.forEach(u=>{if(!L.includes(u))L.push(u);});
        this.renderInventory();break;}
      case 'bulkClear':this.inv.bulkSel=[];this.renderInventory();break;
      case 'bulkSell':this.bulkSell();break;
      case 'selItem':this.inv.sel=ds.uid;this.inv.decoPick=null;this.renderInventory();this.askEquip(ds.uid);break;
      case 'equip':this.doOp('equip',{uid:ds.uid});break;
      case 'unequip':this.doOp('unequip',{uid:ds.uid});break;
      case 'sell':this.sell(ds.uid);break;
      case 'sellMat':this.doOp('sellMat',{id:ds.id,n:Number(ds.n)||1});break;
      case 'sellMatAll':{const n=(this.profile.materials[ds.id]||0);UI.confirm(`${DATA.materials[ds.id].name}を${n}個 まとめて売りますか？（${matSellPrice(ds.id)*n}G）`,()=>this.doOp('sellMat',{id:ds.id,n:'all'}));break;}
      case 'decoSlot':this.inv.decoPick={uid:ds.uid,idx:Number(ds.idx)};this.renderInventory();break;
      case 'pickDeco':{
        const pk=this.inv.decoPick;this.inv.decoPick=null;
        if(pk)this.doOp('deco',{uid:pk.uid,idx:pk.idx,deco:ds.deco||null});else this.renderInventory();
        break;
      }
      case 'cancelPick':this.inv.decoPick=null;this.renderInventory();break;
      case 'craft':this.doOp('craft',{id:ds.id,deco:ds.deco||null});break;
      case 'buy':this.doOp('buy',{id:ds.id,n:Number(ds.n)||1});break;
      case 'cartAdd':this.cartAdd(ds.kind,ds.id,ds.n);break;
      case 'cartRemove':this.cartRemove(ds.kind,ds.id);break;
      case 'cartClear':this.cartClear();break;
      case 'cartCommit':this.cartCommit();break;
      case 'toggleSetting':this.settings()[ds.key]=!!el.checked;this.save();break;
      case 'vol':
        if(ds.key==='bgmVol'||ds.key==='sfxVol'){this.settings()[ds.key]=clamp(Number(ds.id),0,1);this.save();Sound.setVolumes(this.settings().bgmVol,this.settings().sfxVol);Sound.ui('click');}
        this.goto('settings');UI.restoreFocus();break;
      case 'touchSize':this.settings().touchSize=clamp(Number(ds.id)||1,0.6,1.5);this.save();Input.applyTouchLayout();this.goto('settings');UI.restoreFocus();break;
      case 'touchAlpha':this.settings().touchAlpha=clamp(Number(ds.id)||0.85,0.2,1);this.save();Input.applyTouchLayout();this.goto('settings');UI.restoreFocus();break;
      case 'touchEdit':document.body.classList.add('touch-edit');Input.editSel=null;Input.applyTouchLayout();break;
      case 'touchEditDone':document.body.classList.remove('touch-edit');this.goto('settings');break;
      case 'touchReset':try{localStorage.removeItem('kourou_touch_pos');}catch(e){}Input.applyTouchLayout();this.goto('settings');break;
      case 'mapZoom':
        this.settings().mapZoom=clamp(Number(ds.id)||1,0.7,1.6);this.save();Renderer.zoomMul=this.settings().mapZoom;
        this.goto('settings');UI.restoreFocus();break;
      case 'hudScale':
        this.settings().hudScale=clamp(Number(ds.id)||CONFIG.hud.scale,CONFIG.hud.min,CONFIG.hud.max);this.save();
        if(this.inGame&&this.world)this.placeNotes(Object.keys(this.world.players).length);
        this.goto('settings');UI.restoreFocus();break;
    }
  },
  resetSave(){
    Save.reset();this.profile=Profile.create();this.save();
    this.inv={tab:'equip',filter:'weapon',sel:null,decoPick:null};
    this.goto('camp');UI.notify('セーブデータをリセットしました','#ff8060');
  },

  /* ---------- 装備操作 ---------- */
  /** 装備・製作の操作を実行する。オンライン参加者はホストに依頼し、結果のデータが届いたら画面を更新する */
  /** ガチャを回す。溜めの太鼓を鳴らしてから結果を出す（ソロで足りない時は溜めなし） */
  gachaRoll(){
    if(this.gachaBusy)return;
    if(Net.role==='guest'){
      // 結果はホストから届くので、ここでは溜めの太鼓だけ鳴らす
      this.gachaBusy=true;Sound.gachaRoll(1);setTimeout(()=>{this.gachaBusy=false;},1000);
    }
    this.doOp('gacha',{});
  },
  /** 10連ガチャ。結果はまとめて出す（最高レアなら溜めは3秒） */
  gachaRoll10(){
    if(this.gachaBusy)return;
    if(Net.role==='guest'){
      this.gachaBusy=true;Sound.gachaRoll(1);setTimeout(()=>{this.gachaBusy=false;},1000);
    }
    this.doOp('gacha10',{});
  },
  /** ガチャの演出。レア度が高いほど大きく・長く出す */
  gachaFx(rar,text,look,lookV){
    try{
      const el=document.createElement('div');
      el.className='gfx gfx-'+rar;
      el.innerHTML=`<div class="gfx-in"><div class="gfx-r">${RARITY[rar].name}</div><div class="gfx-t">${esc(text)}</div><div class="gfx-hint">タップして閉じる</div></div>`;
      if(look){
        // 出たペットの見た目を、ペットと同じ描き方でそのまま見せる
        try{
          const cv=document.createElement('canvas');cv.width=240;cv.height=160;cv.className='gfx-pet';
          const cx=cv.getContext('2d');
          Renderer.drawPet(cx,{id:'__gacha',x:240,y:64,r:80,facing:0,petLook:look,petLookV:lookV|0,preview:true});
          el.querySelector('.gfx-in').insertBefore(cv,el.querySelector('.gfx-r'));
        }catch(e){}
      }
      // 前の結果が残っていたら消してから出す。クリック（タップ）するまで消えない
      document.querySelectorAll('.gfx').forEach(x=>x.remove());
      el.addEventListener('click',()=>el.remove());
      document.body.appendChild(el);
    }catch(e){}
  },
  doOp(act,args){
    if(Net.role==='guest'){Net.send({t:'cmd',act,args});this.refreshPanel();return;}
    if(this.training&&!['equip','unequip','petEquip','lookEquip'].includes(act)){UI.notify('訓練場では装備の付け替えだけできます','#888',2);return;}
    const r=Ops[act](this.profile,this.inv.who||0,args)||{};
    // ガチャの結果は、レア度に応じた溜めのあとで出す（最高レアは3秒）
    const show=()=>{
      if(r.msg)UI.notify(r.msg,r.color||'#888',2.5);

  /** 依頼ボード：ステージごとの依頼一覧と、選んだ依頼の詳細 */
  boardHTML(){
    const p=this.profile,maxSt=QuestRules.stage(p),st=clamp(this.boardStage,1,maxSt),stage=stageById(st);
    const online=this.boardFrom==='lobby';
    let sel=questById(this.questSel);
    if(sel.stage!==st||!QuestRules.available(p,sel)){sel=DATA.quests.find(q=>q.stage===st&&QuestRules.available(p,q));if(!online)this.questSel=sel.id;}
    const tabs=DATA.stages.map(s=>s.id<=maxSt?`<button class="tab ${s.id===st?'on':''}" data-act="boardStage" data-s="${s.id}">ステージ${s.id}</button>`:`<button class="tab" disabled>🔒 ステージ${s.id}</button>`).join('');
    const mins=QuestRules.minions(st),md=QuestRules.minionsDone(p,st),mOpen=QuestRules.minionsOpen(p,st);

    const rankQ=q=>q.explore?0:q.urgent?3:(q.goal&&q.goal.type==='kill')?1:2;
    const rows=DATA.quests.filter(q=>q.stage===st).sort((a,b)=>rankQ(a)-rankQ(b)).map(q=>{
      const ok=QuestRules.available(p,q),n=QuestRules.done(p,q.id);
      if(!ok)return ''; // 緊急・強敵は条件を満たすまで一覧に出さない
      if(!ok&&q.after)return `<div class="itemrow" style="opacity:.55;cursor:default"><span class="nm">？？？　<small class="muted">「${esc(questById(q.after).name)}」を達成すると出現</small></span><span class="tag" style="background:#6a3a9a">強敵</span></div>`;
      if(!ok)return `<div class="itemrow" style="opacity:.55;cursor:default"><span class="nm">？？？　<small class="muted">${q.urgent?'強敵ボスをすべて倒すと出現':'雑魚の依頼を2つ達成すると出現'}</small></span><span class="tag" style="background:#8a2a2a">緊急</span></div>`;
      return `<div class="itemrow ${q.id===sel.id?'sel':''}" data-act="pickQuest" data-id="${q.id}">
        <span class="nm" style="color:${q.urgent?'#ff8a6a':q.after?'#d0a0ff':'#f0ead8'}">${q.name}</span>
        ${q.explore?'<span class="tag" style="background:#2a7a9a">探索</span>':''}${q.urgent?'<span class="tag" style="background:#c03030">緊急</span>':''}${q.after?'<span class="tag" style="background:#6a3a9a">強敵</span>':''}
        ${n?`<span class="tag" style="background:#2d8a5a">達成 ${n}</span>`:'<small class="muted">未達成</small>'}</div>`;}).join('');
    const btns=online
      ?`<button class="primary" data-act="chooseQuest" data-id="${sel.id}">この依頼に決める</button>`
      :`<button class="primary" data-act="start" data-n="1">出発する</button>`;
    return `<div class="panel inv-panel"><div class="inv-top"><div class="tabs">${tabs}</div>
      <div class="inv-meta">${esc(stage.name)}　雑魚の依頼 ${md}/${mins.length} 達成${mOpen?'（強敵に挑戦可）':'（2つで強敵に挑戦可）'}${urgentNow?'　<span style="color:#ff8a6a">緊急依頼 出現中！</span>':''}</div>
      <button data-act="boardBack">戻る（Esc）</button></div>
      <div class="inv-body board-body"><div class="col col-mid" data-scroll="board"><div class="col-t">依頼一覧</div>
        ${online?'<button class="primary" data-act="chooseQuest" data-id="training" style="width:100%;margin-bottom:8px">🏋 訓練場（報酬なし・時間制限なし・みんなで試せる）</button>':''}${rows}</div>
      <div class="col col-right" data-scroll="qdetail" style="width:400px">
        <div class="iname" style="display:flex;align-items:center;justify-content:space-between;gap:12px"><span style="color:${sel.urgent?'#ff8a6a':'#f3d48a'}">${sel.name}</span><span style="white-space:nowrap">${btns}</span></div>
        <div class="isub">ステージ${sel.stage}「${esc(stage.name)}」${sel.explore?'・自由探索':''}${sel.urgent?'・緊急依頼':''}</div>
        <p style="margin:10px 0;line-height:1.7">${esc(questDesc(sel,partySize()))}</p>
        ${sec('目標',`<div class="eff"><b>${questGoalText(sel.goal)}</b></div>`)}
        ${sec('報酬',`<div class="eff">${QuestRules.rewardText(sel)}</div><div class="small muted">ほかに、倒した魔物や開けた宝箱からも素材・ゴールドが手に入ります</div>`)}
        ${sel.unlocks?sec('クリアすると',`<div class="eff" style="color:#7fe09a">ステージ${sel.unlocks}「${esc(stageById(sel.unlocks).name)}」が解放</div>`):''}
        ${sec('出現する魔物（図鑑で討伐したものだけ表示）',stageRoster(stage).concat((sel.goal.type==='boss'||sel.explore)?[sel.boss||stage.enemySet.boss]:[]).map(t=>(this.profile.bestiary||{})[t]>0?DATA.enemies[t].name:'？？？').join('、'))}

  /** ショップのカート：クリックで入るだけで、購入・売却ボタンを押すまで確定しない */
  cartHTML(){
    const p=this.profile,c=this.shopCart||{buy:{},sell:{}};
    const bl=Object.entries(c.buy).filter(([,n])=>n>0),sl=Object.entries(c.sell).filter(([,n])=>n>0);
    if(!bl.length&&!sl.length)return '<div class="recipe cart"><div class="muted small">カートは空です。商品をクリックするとカートに入ります。購入・売却ボタンを押すまで確定しません。</div></div>';
    const buyTotal=bl.reduce((t,[id,n])=>{const s=DATA.shop.find(x=>x.id===id);return t+(s?s.price*n:0);},0);
    const sellTotal=sl.reduce((t,[id,n])=>t+matSellPrice(id)*n,0);
    const gold=p.gold||0,canCommit=gold+sellTotal>=buyTotal;
    const bLines=bl.map(([id,n])=>{const s=DATA.shop.find(x=>x.id===id);if(!s)return '';
      return `<div class="small">${s.name}　${s.type==='equip'?'1本':n+'個'}　${s.price*n?s.price*n+'G':'無料'}　<button data-act="cartRemove" data-kind="buy" data-id="${id}">×</button></div>`;}).join('');
    const sLines=sl.map(([id,n])=>`<div class="small">${DATA.materials[id].name}を売却 ${n}個　+${matSellPrice(id)*n}G　<button data-act="cartRemove" data-kind="sell" data-id="${id}">×</button></div>`).join('');
    return `<div class="recipe cart"><div class="rn">カート</div>${bLines}${sLines}
      <div class="small" style="margin:6px 0">購入 ${buyTotal}G ／ 売却 +${sellTotal}G ／ 所持 ${gold}G</div>
      <div class="btnrow"><button class="${canCommit?'primary':''}" data-act="cartCommit" ${canCommit?'':'disabled'}>購入・売却を確定する</button><button data-act="cartClear">カートを空にする</button></div>
      ${canCommit?'':'<div class="small" style="color:#ff8060">ゴールドが足りません</div>'}</div>`;
  },
  cartAdd(kind,id,n){
    const p=this.profile;this.shopCart=this.shopCart||{buy:{},sell:{}};const c=this.shopCart;
    if(kind==='sell'){
      const have=p.materials[id]||0,cur=c.sell[id]||0,left=have-cur;
      if(!matSellPrice(id)||left<=0)return UI.notify('これ以上カートに入れられません','#888',1.5);
      c.sell[id]=cur+(n==='all'?left:Math.min(left,Number(n)||1));
    }else{
      const s=DATA.shop.find(x=>x.id===id);if(!s)return;
      if(s.once&&(p.shopOnce||{})[s.id])return UI.notify('購入済みです','#888',1.5);
      const cur=c.buy[id]||0;
      if(s.type==='equip'){if(cur>0)return UI.notify('すでにカートに入っています','#888',1.5);c.buy[id]=1;}
      else{
        const cap=s.type==='item'?DATA.consumables[s.item].max-(p.bag[s.item]||0):10;
        const add=Math.min(Number(n)||1,cap-cur,10-cur);
        if(add<=0)return UI.notify('これ以上カートに入れられません','#888',1.5);
        c.buy[id]=cur+add;
      }
    }
    Sound.ui('click');this.refreshPanel();
  },
  cartRemove(kind,id){if(this.shopCart)delete this.shopCart[kind][id];this.refreshPanel();},
  cartClear(){this.shopCart={buy:{},sell:{}};this.refreshPanel();},
  cartCommit(){
    const c=this.shopCart||{buy:{},sell:{}};
    const sells=Object.entries(c.sell).filter(([,n])=>n>0),buys=Object.entries(c.buy).filter(([,n])=>n>0);
    if(!sells.length&&!buys.length)return;
    this.shopCart={buy:{},sell:{}};
    // 売却を先に行い、そのゴールドで購入できるようにする
    sells.forEach(([id,n])=>this.doOp('sellMat',{id,n}));
    buys.forEach(([id,n])=>this.doOp('buy',{id,n}));
    this.refreshPanel();
  },

  /** 防具スキル：合計ポイント・発動中の段階・次の段階までの残り */

  /** 装備中の表示：左＝装備中の防具、真ん中＝ステータス、右＝合計スキルポイントと発動中のスキル */
  wornViewHTML(p,who,ch,st){

  equipTabHTML(){
    const p=this.profile,who=this.inv.who||0,ch=charOf(p,who),st=computeStats(p,null,who),f=(who!==0&&this.inv.filter==='pet')?'weapon':this.inv.filter;
    if(this.inv.worn)return this.wornViewHTML(p,who,ch,st);
    const left=`<div class="col col-left" data-scroll="left"><div class="col-t">装備中</div>${SLOTS.map(sl=>{
      const it=Profile.getItem(p,ch.equipped[sl]);
      const sk=it&&sl!=='weapon'?skillPtsText(DATA.equipment[it.baseId].skills):'';
      return it?`<div class="eqslot ${it.uid===this.inv.sel?'sel':''}" data-act="selItem" data-uid="${it.uid}"><span class="sl">${SLOT_NAMES[sl]}</span><span class="sdots">${slotDotsColored(it)}</span><span style="color:${eqColor(it)}">${itemName(it)}</span>${sk?`<div class="small" style="width:100%;color:#9ad8ff;padding-left:2.6em">${sk}</div>`:''}</div>`
        :`<div class="eqslot" data-act="filter" data-f="${sl}"><span class="sl">${SLOT_NAMES[sl]}</span><span class="muted">なし</span></div>`;
    }).join('')}${who===0?this.petSlotHTML():''}<div class="col-t">ステータス</div>${this.statsBlockHTML(st)}</div>`;
    const order={weapon:0,head:1,body:2,arms:3,waist:4,legs:5};
    const isArm=['head','body','arms','waist','legs'].includes(f),sk=this.inv.skill||null;
    const skOf=it=>it.skills||((DATA.equipment[it.baseId]||{}).skills)||{};
    const items=(f==='pet'||f==='look'?[]:p.items.filter(i=>(f==='all'||i.slot===f)&&(!sk||(skOf(i)[sk]||0)>0))).sort((a,b)=>{
      // 武器は攻撃力順、防具は防御力順（同じ値なら高レア順）
      if(f==='weapon')return (b.atk||0)-(a.atk||0)||b.rarity-a.rarity;
      if(isArm)return (b.def||0)-(a.def||0)||b.rarity-a.rarity;
      const rank=u=>{const o=Profile.equippedBy(p,u);return o===who?0:(o<0?1:2);};
      const ea=rank(a.uid),eb=rank(b.uid);
      return ea-eb||order[a.slot]-order[b.slot]||b.rarity-a.rarity||(b.atk+b.def)-(a.atk+a.def);
    });
    const bulk=!!this.inv.bulk,bsel=this.inv.bulkSel||[];
    const filters=SLOTS.map(s=>[s,SLOT_NAMES[s]]).concat([['costume','重ね着']]).concat(who===0?[['pet','首輪'],['look','ペット']]:[]);
    // 防具・手紙はスキルで絞り込めるように、持ち物にあるスキルだけ並べる
    const skillKeys=(f==='pet'||f==='look'||f==='all'||f==='weapon')?[]:[...new Set(p.items.filter(i=>i.slot===f).flatMap(i=>Object.keys(skOf(i)).filter(k=>DATA.armorSkills[k])))];
    const skillBar=skillKeys.length?`<div class="filters skillfilters"><button class="${sk?'':'on'}" data-act="skillFilter" data-k="">スキル：すべて</button>${skillKeys.map(k=>`<button class="${sk===k?'on':''}" data-act="skillFilter" data-k="${k}">${DATA.armorSkills[k].name}</button>`).join('')}</div>`:'';
    const mid=`<div class="col col-mid" data-scroll="mid"><div class="filters"><button data-act="worn" style="background:#2d4a6a;border-color:#6a9ad0">装備中（防具・ステータス・スキル）</button></div><div class="filters">${filters.map(([k,n])=>`<button class="${f===k?'on':''}" data-act="filter" data-f="${k}">${n}</button>`).join('')}</div>${skillBar}
      <div class="small muted" style="margin-bottom:6px">所持装備 ${p.items.length}件　◇=空きスロット ◆=装飾品</div>
      ${this.bulkBarHTML(bulk)}${items.map(it=>`<div class="itemrow ${bulk?(bsel.includes(it.uid)?'sel':''):(it.uid===this.inv.sel?'sel':'')}" data-act="${bulk?'bulkTog':'selItem'}" data-uid="${it.uid}">${bulk?`<span class="bx">${bsel.includes(it.uid)?'☑':'☐'}</span>`:''}
        <span class="sl">${SLOT_NAMES[it.slot]}</span><span class="nm" style="color:${eqColor(it)}">${itemName(it)}</span>
        ${it.effects.length?'<span title="特殊効果あり" style="color:#ffcf6a">★</span>':''}
        <small>${it.slot==='weapon'?'攻'+it.atk+' 会'+it.crit+'%':it.slot==='charm'?skillPtsText(it.skills||{}):'防'+it.def}</small><small class="muted">${slotDots(it)}</small>
        ${this.equipTag(it.uid)}</div>`).join('')||(f==='pet'?this.petListHTML():f==='look'?this.lookListHTML():f==='costume'?this.costumeListHTML(p,who):'<div class="muted">該当する装備がありません</div>')}</div>`;
    const sel=Profile.getItem(p,this.inv.sel);
    const right=`<div class="col col-right" data-scroll="right">${this.inv.decoPick?this.decoPickHTML():f==='costume'?this.costumeDetailHTML(p,who):f==='pet'?this.petDetailHTML():f==='look'?this.lookDetailHTML():(sel?this.itemDetailHTML(sel):'<div class="muted">装備を選択すると詳細と性能比較が表示されます。</div>')}</div>`;
    return left+mid+right;
  },
  /** 装備画面で、まだ装備していない装備品を選んだら「装備しますか？」と性能差を出して確認する */
  askEquip(uid){
    const p=this.profile,it=Profile.getItem(p,uid);if(!it)return;
    const who=this.inv.who||0,owner=Profile.equippedBy(p,uid);
    if(owner===who)return;                       // すでに装備中
    if(owner>=0&&owner!==who&&it.slot==='weapon')return; // 相手が使っている武器は取れない（詳細欄に表示）
    const rar=eqRarity(it);
    const cmp=this.compareHTML(computeStats(p,null,who),computeStats(p,{[it.slot]:it},who),true);
    const effs=it.effects.map(e=>`<div class="eff"><b>${DATA.effects[e].name}</b>：${DATA.effects[e].desc}</div>`).join('');
    UI.confirm(`<div class="iname" style="color:${rar.color}">${itemName(it)}</div>
      <div class="isub">${rar.name?rar.name+'・':''}${SLOT_NAMES[it.slot]}　スロット ${slotDots(it)||'なし'}</div>
      <div style="text-align:left;margin:10px 0">${cmp||'<div class="muted small">ステータスは変わりません</div>'}${effs}</div>
      <div>装備しますか？</div>`,
      ()=>this.doOp('equip',{uid}),{yes:'装備する',no:'やめる',yesClass:'primary',focusYes:true});
  },
  compareHTML(cur,nxt,changedOnly){
    const keys=['maxHp','atk','def','crit','critDmg','moveSpd','atkSpd','dodgeIframe'];
    let h='';
    for(const k of keys){
      const a=cur[k],b=nxt[k],d=b-a;
      if(Math.abs(d)<1e-6&&(changedOnly||!['maxHp','atk','def','crit'].includes(k)))continue;
      const cls=d>1e-6?'up':(d<-1e-6?'down':'');

  /** 鍛冶屋：素材から装備・装飾品を作る */
  smithHTML(){
    const cat=(!this.smithCat||this.smithCat==='item')?'weapon':this.smithCat; // 薬（調合）はアイテム・インベントリへ移動
    const cats=[['weapon','武器'],['armor','防具'],['deco','装飾品'],['reinforce','強化']];
    // 防具は「シリーズ」ごとに見る（シリーズに属さない防具は「その他」）
    const seriesOf=id=>Object.keys(DATA.armorSets).find(k=>Object.values(DATA.armorSets[k].pieces).includes(id));
    const SLOT_ORDER_ARMOR=()=>Object.keys(SLOT_NAMES).filter(k=>k!=='weapon'&&k!=='charm');
    // 防具：部位ごとの絞り込みと、いま作れるシリーズの絞り込みの両方（作れないシリーズは出さない）
    const availR=r=>(!r.stage||QuestRules.stage(this.profile)>=r.stage)&&this.recipeKnown(r);
    const availEq=DATA.recipes.filter(r=>r.out.type==='equip'&&availR(r)).map(r=>r.out.id);
    const partTabs=SLOT_ORDER_ARMOR().map(k=>['slot:'+k,SLOT_NAMES[k]]);
    const setTabs=Object.keys(DATA.armorSets).filter(k=>availEq.some(id=>seriesOf(id)===k)).map(k=>['set:'+k,`${DATA.armorSets[k].name}「${DATA.armorSets[k].bonus}」`]);
    if(availEq.some(id=>DATA.equipment[id].slot!=='weapon'&&!seriesOf(id)))setTabs.push(['misc','その他']);
    const subs=cat==='weapon'?[['all','すべて'],...Object.keys(DATA.weaponTypes).map(k=>[k,DATA.weaponTypes[k].name])]
      :cat==='armor'?[...partTabs,...setTabs]:[];
    let sub=this.smithSub||'all';
    if(cat==='armor'&&!subs.some(([k])=>k===sub))sub=subs[0][0];
    const match=r=>{
      if(cat==='reinforce')return false; // 強化の画面にはレシピを出さない
      if(cat==='item')return r.out.type==='item';
      if(cat==='deco')return r.out.type==='deco';
      if(r.out.type!=='equip')return false;
      const b=DATA.equipment[r.out.id];
      if(cat==='weapon')return b.slot==='weapon'&&(sub==='all'||b.wtype===sub);
      if(b.slot==='weapon'||b.slot==='charm')return false;
      if(sub.startsWith('slot:'))return b.slot===sub.slice(5);
      const se=seriesOf(r.out.id);
      return sub==='misc'?!se:se===sub.slice(4);
    };
    const catTabs=`<div class="tabs" style="margin-bottom:6px">${cats.map(([k,n])=>`<button class="tab ${cat===k?'on':''}" data-act="smithCat" data-c="${k}">${n}</button>`).join('')}</div>`;
    const subTabs=subs.length?`<div class="filters" style="margin-bottom:8px">${subs.map(([k,n])=>`<button class="${sub===k?'on':''}" data-act="smithSub" data-s="${k}">${n}</button>`).join('')}</div>`:'';
    const wt=DATA.weaponTypes[sub];
    const wtInfo=cat==='weapon'&&wt?`<div class="small" style="margin-bottom:8px;color:#ffd23a">${wt.name}：移動${wt.marks.move} 振り${wt.marks.speed} 威力${wt.marks.power} リーチ${wt.marks.reach}　納刀${wt.sheathe}秒　${wt.feature}</div>`:'';

    // シリーズのタブを開いた時だけ、そのシリーズの一式効果を出す
    const setDetail=cat==='armor'&&sub.startsWith('set:')&&DATA.armorSets[sub.slice(4)]?(()=>{const S=DATA.armorSets[sub.slice(4)];return `<div class="small" style="margin-bottom:8px;color:#7fe09a">一式効果（頭・胴・腕・腰・脚のうち4部位をそろえると発動）：${S.name}「${S.bonus}」${S.desc}</div>`;})():'';
    const reinf=cat==='reinforce'?this.reinforceHTML()+this.enchantHTML():'';
    return this.facilityHTML('⚒ 鍛冶屋','素材を持ってくれば装備を打つぜ。性能（数値・付加ステータス・スロット数・特殊効果）は打ってみてのお楽しみだ。',
      `<div class="col full" data-scroll="smith">${catTabs}${subTabs}${wtInfo}${setInfo}${setDetail}${reinf}${this.recipeListHTML(match,cat==='weapon'||cat==='armor').replace('class="col full" data-scroll="craft"','')}</div>`);
  },

  /** モンスター図鑑：倒した魔物が登録される。ステージごとに一覧、選ぶと姿・特徴・攻略のヒント・素材 */
  /** 操作説明：基本操作（キーボード・コントローラー）と、武器ごとの性能・スキル */

    let body='';
    if(tab==='basic'){
      const head=`<div style="display:grid;grid-template-columns:150px 1fr 110px;gap:4px 10px;font-size:13px;color:#8a82a2;margin-bottom:4px"><span>操作</span><span>キーボード</span><span>${PAD_TYPE_NAMES[type]}</span></div>`;
      const B=getBinds();
      const rows=HELP_BASIC.map(r=>{
        let kb=r.kb,pad=r.padText||(r.pad==null?'−':PAD_NAMES[type][r.pad]);
        if(r.act){
          const k=B.kb[r.act];pad=PAD_NAMES[type][B.pad[r.act]];
          kb=keyLabel(k);
          if(r.act==='attack'&&k!=='Mouse0')kb+=' ／ 左クリック';
          if(r.act==='guard')kb+=' ／ 右クリック';
          if(r.act==='cycle')kb+='（短く押す＝次へ、長く押す＝一覧）';
        }
        return `<div style="display:grid;grid-template-columns:150px 1fr 110px;gap:4px 10px;align-items:center;padding:4px 0;border-bottom:1px solid #2a2440"><span>${r.name}</span><span>${kb}</span><span style="color:#f3d48a">${pad}</span></div>`;}).join('');
      body=`<div class="col full">${head}${rows}<div class="small muted" style="margin-top:8px">コントローラーの表示は、つないだ機器から自動で判定します。違うときは上のボタンで選んでください。</div></div>`;
    }else{
      const list=Object.keys(DATA.weaponTypes).map(k=>`<button class="${k===wk?'on':''}" data-act="helpWeapon" data-w="${k}">${DATA.weaponTypes[k].name}</button>`).join('');
      const w=DATA.weaponTypes[wk],sk=DATA.weaponSkills[w.ws],m=w.marks||{};
      body=`<div class="col full"><div class="filters">${list}</div>
        <div class="recipe" style="margin-top:8px"><div class="rn">${w.name}</div><div class="muted">${w.feature||''}</div>
        <div class="small" style="margin:6px 0">性能：移動 ${m.move||'−'}　攻撃速度 ${m.speed||'−'}　威力 ${m.power||'−'}　リーチ ${m.reach||'−'}　／　攻撃の間隔 約${w.interval}秒</div>
        <div><b style="color:#f3d48a">スキル「${sk.name}」</b>（${PAD_NAMES[type][getBinds().pad.skill]}／${keyLabel(getBinds().kb.skill)}）</div>
        <div class="small">${HELP_WS[w.ws]||''}</div>
        <div class="small muted">効果は${sk.duration}秒間、使ったあと${sk.cd}秒は再使用できません</div></div></div>`;
    }
    return `<div class="panel inv-panel"><div class="inv-top"><button data-act="helpBack">戻る（Esc）</button><h2 style="margin:0">操作説明</h2><div class="inv-meta">表示：${PAD_TYPE_NAMES[type]}${sel==='auto'?'（自動）':''}</div></div>
      <div class="small muted" style="margin:-4px 0 6px">コントローラーの表示：${padBtns}</div>
      ${tabs}
      <div class="inv-body">${body}</div></div>`;
  },
  bestiaryHTML(){
    const p=this.profile,b=p.bestiary||{},st=clamp(this.bestStage||1,1,maxStageId());
    // まだ解放していないステージは、名前も中身も出さない（ネタバレ防止）
    const maxSt=clamp((p.progress&&p.progress.stage)||1,1,maxStageId());
    const stName=id=>id<=maxSt?esc(stageById(id).name):'？？？';
    const ids=st>maxSt?[]:Object.keys(DATA.bestiary).filter(id=>DATA.bestiary[id].stage.includes(st)&&DATA.enemies[id]);
    const order=id=>(DATA.enemies[id].boss?1:0);
    ids.sort((a,c)=>order(a)-order(c));
    const all=Object.keys(DATA.bestiary).filter(id=>DATA.enemies[id]),got=all.filter(id=>b[id]>0).length;
    let sel=this.bestSel&&ids.includes(this.bestSel)?this.bestSel:(ids.find(id=>b[id]>0)||ids[0]);
    const tabs=DATA.stages.map(s=>s.id<=maxSt?`<button class="tab ${s.id===st?'on':''}" data-act="bestStage" data-s="${s.id}">${esc(s.name)}</button>`:`<button class="tab" disabled>🔒 ？？？</button>`).join('');
    const rows=ids.map(id=>{
      const known=b[id]>0,E=DATA.enemies[id];
      return `<div class="itemrow ${id===sel?'sel':''}" data-act="bestSel" data-id="${id}">
        <img src="${Portraits.get(id,!known)}" width="40" height="40" style="margin-right:8px;image-rendering:auto">
        <span class="nm" style="color:${known?(E.boss?'#ff8a6a':'#f0ead8'):'#777'}">${known?esc(E.name):'？？？'}</span>
        ${E.boss?'<span class="tag" style="background:#c03030">ボス</span>':''}${known?`<small class="muted">討伐 ${b[id]}</small>`:''}</div>`;}).join('');
    const E=DATA.enemies[sel],B=DATA.bestiary[sel],known=b[sel]>0;
    let detail;
    if(!sel)detail=`<div class="muted">このステージはまだ解放されていません。先の依頼をクリアすると、ここに魔物が載ります。</div>`;
    else if(!known)detail=`<div class="iname" style="color:#888">？？？</div><img src="${Portraits.get(sel,true,128)}" width="128" height="128" style="display:block;margin:10px auto">
      <p class="muted">まだ倒したことのない魔物です。一度倒すと図鑑に登録されます。</p>
      <div class="small muted">出現：${B.stage.map(stName).join('、')}</div>`;
    else{
      const mats=[];
      for(const r of ((DATA.dropTables[E.drops]||{}).rolls||[]))if(r.type==='mat'&&!mats.includes(r.id))mats.push(r.id);
      const hasDeco=((DATA.dropTables[E.drops]||{}).rolls||[]).some(r=>r.type==='deco');
      const feats=[];
      {let bp=DATA.bossParts[sel];if(typeof bp==='string')bp=DATA.bossParts[bp];
        if(bp){const wk=[...new Set(bp.filter(x=>x.weak).map(x=>x.name))];if(wk.length)feats.push('弱点：'+wk.join('・')+'（弓の矢は弱点に当たると大ダメージ）');
          const hd=[...new Set(bp.filter(x=>(x.mult||1)<0.9||x.guard).map(x=>x.name))];if(hd.length)feats.push('硬い部位：'+hd.join('・'));}}
      {const ee=DATA.enemyElem[sel],EL=DATA.elements,c=k=>`<span style="color:${EL[k].color}">${EL[k].name}</span>`;
        if(ee){if(ee.atk)feats.push('攻撃の属性：'+c(ee.atk));
          if(ee.weak&&ee.weak.length)feats.push('弱点属性：'+ee.weak.map((k,i)=>c(k)+(i?'○':'◎')).join(' '));
          const st=[...(ee.strong||[]),...(ee.atk?[ee.atk]:[])];if(st.length)feats.push('効きにくい属性：'+[...new Set(st)].map(c).join(' '));}}
      {const es=DATA.enemyStatus[sel];if(es)feats.push('攻撃が当たると、ときどき'+DATA.playerStatus[es.k].name+(es.k==='poison'?'（少しずつHPが減る）':es.k==='paralysis'?'（しばらく動けない）':'（受けるダメージが増える）'));}
      if(E.guard)feats.push('正面からの攻撃を弾く');
      if(E.heavy)feats.push('攻撃でのけぞらない');
      if(E.slow)feats.push('攻撃が当たると鈍足');
      if(E.spore)feats.push('毒の雲（中にいると継続ダメージ）');
      if(E.empower)feats.push('仲間を強化・よみがえらせる');
      if(E.stunMax)feats.push('ハンマーで頭を叩くとスタン');
      const hpRank=E.hp>=2000?'★★★★★':E.hp>=200?'★★★★':E.hp>=100?'★★★':E.hp>=45?'★★':'★';
      detail=`<div class="iname" style="color:${E.boss?'#ff8a6a':'#f3d48a'}">${esc(E.name)}</div>
        <div class="isub">${esc(B.role)}　出現：${B.stage.map(stName).join('、')}</div>
        <img src="${Portraits.get(sel,false,128)}" width="128" height="128" style="display:block;margin:10px auto">
        <p style="margin:8px 0;line-height:1.7">${esc(B.desc)}</p>
        ${sec('攻略のヒント',`<div class="eff">${esc(B.tip)}</div>`)}
        ${sec('特徴',`<div class="eff">打たれ強さ ${hpRank}${feats.length?'<br>'+feats.map(esc).join('<br>'):''}</div>`)}
        ${sec('手に入る素材',`<div class="eff">${mats.map(k=>`<span style="color:${DATA.materials[k].color}">${esc(DATA.materials[k].name)}</span>`).join('、')||'なし'}${hasDeco?'<br><span style="color:#c06bff">装飾品（低確率）</span>':''}</div>`)}
        <div class="small muted">討伐数 ${b[sel]}</div>`;
    }
    return `<div class="panel inv-panel"><div class="inv-top"><h2 style="margin:0">📖 モンスター図鑑</h2><div class="tabs">${tabs}</div>
      <div class="inv-meta">登録 ${got} / ${all.length}</div><button data-act="bestiaryBack">戻る（Esc）</button></div>
      <div class="inv-body"><div class="col col-mid" data-scroll="best"><div class="col-t">魔物一覧</div>${rows}</div>
      <div class="col col-right" data-scroll="bestd" style="width:400px">${detail}</div></div></div>`;
  },
  /** ショップ：ゴールドで買い物。回復薬の調合もここ */
  shopHTML(){
    return this.facilityHTML('🛒 ショップ','ゴールドは敵を倒したり宝箱を開けたりすると手に入ります。いらない装備は装備画面で選んで売却できます。',
      this.shopTabHTML());
  },
  /** レシピが鍛冶屋に並ぶか：ステージに届いていて、必要な素材をすべて一度は手に入れたことがある（ボス装備はボス素材を入手してから） */
  recipeKnown(r){
    const p=this.profile;
    return (!r.stage||QuestRules.stage(p)>=r.stage)&&Object.keys(r.cost).every(k=>(p.materials[k]||0)>0||(p.matSeen&&p.matSeen[k]));
  },
  recipeListHTML(filter,sortEquip){
    const p=this.profile;
    const known=r=>this.recipeKnown(r);
    const list=DATA.recipes.filter(r=>(!r.stage||QuestRules.stage(p)>=r.stage)&&known(r)&&filter(r));
    // 武器は攻撃力の高い順、防具は防御力の高い順（鍛冶屋の武器・防具の画面）
    if(sortEquip){const key=r=>{const b=DATA.equipment[r.out.id];return b.slot==='weapon'?(b.atk||0):(b.def||0);};list.sort((a,b)=>key(b)-key(a));}
    return `<div class="col full" data-scroll="craft"><div class="recipes">${list.map(r=>{
      let name,info='';
      if(r.out.type==='equip'){
        const b=DATA.equipment[r.out.id];name=isBossWeapon(r.out.id)?`<span style="color:${BOSS_WEAPON_COLOR}">${b.name}</span>`:b.name;
        const set=b.slot!=='weapon'?Object.values(DATA.armorSets).find(s=>s.pieces[b.slot]===r.out.id):null;
        info=`${b.slot==='weapon'?DATA.weaponTypes[b.wtype].name:SLOT_NAMES[b.slot]}　${b.slot==='weapon'?`攻撃力 ${b.atk} / 会心率 ${b.crit}%${b.el?` / ${DATA.elements[b.el.k].name}属性 ${b.el.v}`:''}${b.st?` / ${DATA.playerStatus[b.st.k].name}（状態異常・蓄積 ${b.st.buildup}）`:''}`:`防御力 ${b.def} / 装飾品スロット ${b.slots||0}`}${b.skills?`<br><span style="color:#9ad8ff">${skillPtsText(b.skills)}</span>`:''}${set?`<br><span style="color:#7fe09a">${set.name}（一式で「${set.bonus}」）</span>`:''}`;
      }else if(r.out.type==='deco'){
        // 装飾品は種類ごとに選んで作る（レアリティはレア以下の中からランダム）
        const g0=craftGold(r),can0=Profile.hasMats(p,r.cost)&&(p.gold||0)>=g0;
        const cost0=Object.keys(r.cost).map(k=>{const have=p.materials[k]||0;return `<span class="${have>=r.cost[k]?'ok':'ng'}">${DATA.materials[k].name} ${have}/${r.cost[k]}</span>`;}).join('');
        return Object.keys(DATA.decorations).map(id=>{const dd=DATA.decorations[id],sk=DATA.armorSkills[dd.skill];
          return `<div class="recipe"><div class="rn"><span class="gem" style="background:${dd.color};color:${dd.color}"></span>${dd.name}</div><div class="muted">${sk?sk.name:dd.skill}の装飾品（レア以下のどれかが出る）</div><div class="cost">${cost0}${g0?`<span class="${(p.gold||0)>=g0?'ok':'ng'}">${g0}G</span>`:''}</div>
          <div class="btnrow"><button class="${can0?'primary':''}" data-act="craft" data-id="${r.id}" data-deco="${id}" ${can0?'':'disabled'}>製作する</button></div></div>`;}).join('');
      }
      else if(r.out.type==='collar'){const x=PETS.find(q=>q.id===r.out.id);name=x.name+'の首輪';info='首輪（性能）。マルチプレイで連れ歩くと効果';}
      else{const c=DATA.consumables[r.out.id];name=c.name+' ×'+r.out.n+'（調合）';info=c.desc+'。所持 '+(p.bag[r.out.id]||0)+' / '+c.max+'個';}
      const gold=craftGold(r),can=Profile.hasMats(p,r.cost)&&(p.gold||0)>=gold&&!(r.out.type==='item'&&(p.bag[r.out.id]||0)>=DATA.consumables[r.out.id].max);
      const cost=Object.keys(r.cost).map(k=>{const have=p.materials[k]||0;return `<span class="${have>=r.cost[k]?'ok':'ng'}">${DATA.materials[k].name} ${have}/${r.cost[k]}</span>`;}).join('');
      const goldTxt=gold?`<span class="${(p.gold||0)>=gold?'ok':'ng'}">${gold}G</span>`:'';
      return `<div class="recipe"><div class="rn">${name}</div><div class="muted">${info}</div><div class="cost">${cost}${goldTxt}</div>
        <div class="btnrow"><button class="${can?'primary':''}" data-act="craft" data-id="${r.id}" ${can?'':'disabled'}>${r.out.type==='item'?'調合する':'製作する'}</button></div></div>`;
    }).join('')}</div></div>`;
  },
};

window.addEventListener('load',()=>{
  try{App.init();}
  catch(e){console.error(e);document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#f88">起動に失敗しました：'+String(e.message)+'</div>');}
});
</script>
</body>
</html>
