<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>モンスターダンジョンズ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0a10;color:#e8e6f0;
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;font-size:14px}
/* 画面いっぱいの表示は見えている範囲（innerWidth/innerHeight）に合わせる。100vh だとスマホでアドレスバーの分だけ縦に引き伸ばされ、タップの位置がずれる */
#game{display:block;position:fixed;left:0;top:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
/* iPhoneで指の動きをブラウザのピンチ・スクロール・ダブルタップ拡大に取られないように（取られると指の位置とゲーム上の位置がずれる） */
html,body{touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none}
#notify{position:fixed;left:14px;top:104px;display:flex;flex-direction:column;gap:5px;pointer-events:none;z-index:5;max-width:360px}
.note{background:rgba(14,12,22,.88);border-left:4px solid #888;padding:6px 10px;border-radius:4px;font-size:13px;transition:opacity .5s;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#overlay,#modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#overlay{background:rgba(5,4,10,.72);z-index:10}
#modal{background:rgba(0,0,0,.55);z-index:20}
.hidden{display:none!important}
.panel{background:#17141f;border:1px solid #3a3350;border-radius:10px;padding:20px;max-width:96vw;max-height:94vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.6)}
h1{font-size:34px;letter-spacing:.12em;color:#f3d48a;text-shadow:0 2px 0 #5a3d10}
h2{font-size:22px;margin-bottom:10px;color:#f3d48a}
.sub{color:#a99fc0;margin:4px 0 14px}
button{font:inherit;color:#ece8f6;background:#2a2438;border:1px solid #4a4062;border-radius:6px;padding:8px 14px;cursor:pointer;transition:background .12s}
button:hover:not(:disabled){background:#3a3250}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:#3c5fd0;border-color:#6d8cf0}
button.primary:hover{background:#4a6ee0}
button.danger{background:#5a2230;border-color:#8a3a4c}
button.danger:hover{background:#6e2a3a}
.menu-col{display:flex;flex-direction:column;gap:8px;min-width:280px;margin:12px 0}
.menu-col button{padding:11px 14px;font-size:15px}
.camp{width:min(560px,94vw);text-align:center}
.gver{position:fixed;top:8px;right:12px;font-size:12px;color:#8a8298;pointer-events:none;z-index:5;text-align:right}
.gver button{pointer-events:auto;font-size:12px;padding:3px 8px}
.gver>button,.gver .updbar button{width:112px;font-size:12px;text-align:center}
.gver .updbar{margin-top:4px;text-align:right}
.gver #updateMsg{display:block}
.gver button.gift-new{border-color:#ffd23a;color:#ffe9a0;font-weight:bold;animation:giftGlow 1.2s ease-in-out infinite}
@keyframes giftGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,210,58,0)}50%{box-shadow:0 0 12px 3px rgba(255,210,58,.85)}}
.updbar{margin-top:10px;text-align:center}
.updbar button{font-size:13px}
.campinfo{background:#100e17;border:1px solid #2e2840;border-radius:6px;padding:10px;color:#cfc7e6;line-height:1.7}
.howto{margin-top:12px;text-align:left;background:#100e17;border:1px solid #2e2840;border-radius:6px;padding:10px 14px;font-size:13px;line-height:1.8;color:#bdb5d6}
.howto b{display:inline-block;min-width:110px;color:#f0e6c0}
.small{font-size:12px}.muted{color:#8a82a2}
.row{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.modalbox{width:min(440px,92vw);text-align:center;line-height:1.7}
.inv-panel{width:min(1180px,97vw);height:min(720px,94vh);display:flex;flex-direction:column;padding:14px}
.inv-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.who-sel{display:flex;align-items:center;gap:6px;flex-wrap:wrap;width:100%}
.gfx{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;z-index:9000;background:rgba(0,0,0,.35)}
.gfx-hint{margin-top:8px;font-size:12px;color:#bdb5d6}
.gfx-pet{display:block;width:150px;height:auto;margin:0 auto 4px}
.gfx-in{text-align:center;padding:14px 22px;border-radius:12px;background:rgba(10,8,20,.82);animation:gfxPop .35s ease-out}
.gfx-r{font-weight:bold;font-size:18px;letter-spacing:.1em}
.gfx-t{font-size:15px;margin-top:4px}
.gfx-N .gfx-r{color:#c8c8c8}
.gfx-R .gfx-in{box-shadow:0 0 18px #5fb0ff}.gfx-R .gfx-r{color:#5fb0ff}
.gfx-SR{animation-duration:1.8s}.gfx-SR .gfx-in{box-shadow:0 0 28px #ffb040}.gfx-SR .gfx-r{color:#ffb040;font-size:22px}
.gfx-SSR{animation:gfxFade 2.6s ease-out forwards}
.gfx-SSR .gfx-in{box-shadow:0 0 36px #ff6ad5;background:linear-gradient(90deg,rgba(255,106,213,.35),rgba(120,200,255,.35),rgba(255,230,120,.35));animation:gfxPop .35s ease-out,gfxShine 1.2s linear infinite}
.gfx-SSR .gfx-r{color:#fff;font-size:26px}
/* 結果は消えずに残る（クリックで閉じる）ので、フェードアウトはしない */
.gfx,.gfx-SR,.gfx-SSR{animation:none}
@keyframes gfxPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes gfxFade{0%,80%{opacity:1}100%{opacity:0}}
@keyframes gfxShine{from{filter:hue-rotate(0deg)}to{filter:hue-rotate(360deg)}}
.who-sel button{padding:4px 10px}
.who-sel button.on{background:#2d8a5a;color:#fff}
.tabs{display:flex;gap:4px}
.tab.on{background:#4a3d6e;border-color:#8a7ac0}
.inv-meta{flex:1;text-align:right;color:#bdb5d6}
.inv-body{flex:1;display:flex;gap:10px;min-height:0}
.col{background:#100e17;border:1px solid #2e2840;border-radius:8px;padding:10px;overflow:auto;min-height:0}
.col-left{width:270px;flex-shrink:0}.col-mid{flex:1}.col-right{width:360px;flex-shrink:0}.col.full{flex:1}
.col-t{font-weight:bold;color:#f3d48a;margin:6px 0 6px;font-size:13px}
.eqslot,.itemrow{padding:6px 8px;border-radius:5px;border:1px solid transparent;cursor:pointer;margin-bottom:3px;display:flex;align-items:center;gap:6px}
.eqslot{flex-wrap:wrap}
.eqslot:hover,.itemrow:hover{background:#221d30}
.eqslot.sel,.itemrow.sel{border-color:#8a7ac0;background:#26203a}
.sl{display:inline-block;width:30px;color:#8a82a2;font-size:12px}
.sdots{font-size:11px;letter-spacing:1px;margin-right:4px;white-space:nowrap}
.itemrow .nm{flex:1}
.tag{font-size:11px;background:#3c5fd0;color:#fff;padding:1px 6px;border-radius:9px}
.filters{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.filters button{padding:4px 9px;font-size:12px}
.filters button.on{background:#4a3d6e;border-color:#8a7ac0}
.st-row{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dashed #262036;font-size:13px}
.st-row span:last-child{color:#f0ead8}
.sec{margin:10px 0}.sec-t{font-size:12px;color:#a99fc0;margin-bottom:4px;border-bottom:1px solid #2e2840;padding-bottom:2px}
.iname{font-size:20px;font-weight:bold}.isub{color:#a99fc0;font-size:12px;margin-top:2px}
.eff{font-size:13px;padding:3px 0}.eff b{color:#ffcf6a}
.slotbtn{display:block;width:100%;text-align:left;margin-bottom:4px;font-size:13px}
.up{color:#5fe08a}.down{color:#ff6b6b}
.ok{color:#5fe08a}.ng{color:#ff6b6b}
.btnrow{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.grid-mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.mat{background:#191524;border:1px solid #2e2840;border-radius:6px;padding:8px 10px}
.mat.zero{opacity:.45}.mat b{float:right;color:#f0ead8}
.gem{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;box-shadow:0 0 6px currentColor}
.decorow{display:block;width:100%;text-align:left;margin-bottom:4px}
.recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.recipe{background:#191524;border:1px solid #2e2840;border-radius:8px;padding:10px;font-size:13px;line-height:1.6}
.recipe .rn{font-weight:bold;font-size:15px}
/* ショップの商品一覧：カードを小さくして多く見せる */
.shop-items{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.shop-items .recipe{padding:6px 8px;font-size:12px;line-height:1.45}
.shop-items .recipe .rn{font-size:13px}
.shop-items .recipe button{padding:3px 6px;font-size:12px}
.sell-list{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px}
.sell-list .recipe{padding:4px 6px;font-size:12px;line-height:1.35}
.sell-list .recipe .rn{font-size:12px}
.sell-list .recipe button{padding:2px 5px;font-size:11px}
.cost span{display:inline-block;margin-right:10px}
[data-scroll="craft"] .rn,[data-scroll="smith"] .rn{color:#fff}
.recipes .cost .ok{color:#fff}
.recipes .cost .ng{color:#888}
.reward-list{text-align:left;background:#100e17;border:1px solid #2e2840;border-radius:6px;padding:10px 14px;max-height:280px;overflow:auto;line-height:1.8;margin-top:10px}
.setting{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #2a2438;cursor:pointer}
.setting input{width:18px;height:18px}
.field{display:block;text-align:left;margin:10px 0 4px;color:#cfc7e6}
.field input{display:block;width:100%;margin-top:4px;padding:9px;background:#100e17;border:1px solid #4a4062;color:#fff;border-radius:6px;font:inherit;font-size:16px}
.roomcode{font-size:40px;letter-spacing:.25em;color:#ffd23a;font-weight:bold;user-select:all}
.padfocus{outline:3px solid #ffd23a!important;outline-offset:2px;box-shadow:0 0 12px rgba(255,210,58,.5)}
.padfocus:disabled{outline-color:#a99a6a!important;box-shadow:none}
body.pad #game{cursor:none}
/* 装備画面の装備中一覧：デスクトップでは少し広く（スロットのダイヤを見やすくする） */
.eq-body>.col-left{width:340px;flex-shrink:0}
@media (max-width:900px){.inv-body{flex-direction:column}.col-left,.col-right{width:auto}.inv-panel{height:94vh}
/* 依頼選択：スマホでも左に一覧、右に説明を並べる */
.board-body{flex-direction:row}.board-body .col-mid{flex:0 0 42%;min-width:0}.board-body .col-right{width:auto!important;flex:1;min-width:0}
/* スマホ：画面の部分（装備中・一覧・詳細）をまとめて縦にスクロールする（それぞれが縮んで一覧が見えなくなるのを防ぐ） */
.inv-body:not(.board-body){overflow-y:auto}.inv-body:not(.board-body)>.col{flex:0 0 auto;min-height:auto;overflow:visible}
/* スマホの装備画面：左に装備中（そのまま）、右に所持装備を並べ、詳細は下に置く */
.eq-body{flex-direction:row;flex-wrap:wrap;align-items:flex-start}
.eq-body>.col-left{flex:0 0 44%;width:auto;min-width:0}
.eq-body>.col-mid{flex:1 1 0;width:auto;min-width:0}
.eq-body>.col-right{flex:0 0 100%;width:auto}}
/* スマホ・タブレット用の操作ボタン（プレイ中だけ表示） */
#touch{position:fixed;inset:0;display:none;pointer-events:none;z-index:6;-webkit-user-select:none;user-select:none}
#touch.on{display:block}
#touch .stick{position:absolute;left:14px;bottom:14px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07);border:2px solid rgba(255,235,180,.3);pointer-events:auto;touch-action:none}
#touch .tb{touch-action:none}
#touch .knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:rgba(255,220,140,.35);border:2px solid rgba(255,220,140,.7)}
#touch .tb{position:absolute;width:68px;height:68px;border-radius:50%;background:rgba(20,16,30,.6);border:2px solid rgba(255,230,160,.45);color:#f3e6c0;font:bold 12px/1.1 sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:auto;touch-action:none}
#touch .tb.on{background:rgba(255,190,80,.5)}
#touch .atk{right:18px;bottom:22px;width:92px;height:92px;font-size:16px;background:rgba(150,40,30,.55)}
#touch .dodge{right:128px;bottom:24px}
#touch .skill{right:18px;bottom:128px}
#touch .heal{right:128px;bottom:110px}
#touch .cycle{right:98px;bottom:206px;width:58px;height:58px;font-size:11px}
#touch .sheathe{right:18px;bottom:214px;width:58px;height:58px;font-size:11px}
#touch .guard{right:206px;bottom:24px}
#touch .menu{right:12px;top:12px;width:70px;height:36px;border-radius:10px;font-size:12px}
body.touch #game{cursor:default}
#touch{opacity:var(--to,0.85)}
#touchEditBar{display:none;position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:80;align-items:center;gap:12px;background:rgba(20,16,30,.94);border:1px solid #6a5a90;border-radius:10px;padding:8px 12px;font-size:13px;color:#f3e6c0}
body.touch-edit #touchEditBar{display:flex}
body.touch-edit #overlay,body.touch-edit #modal{display:none!important}
body.touch-edit #touch{display:block!important;z-index:70;pointer-events:auto;opacity:1}
body.touch-edit #touch .tb,body.touch-edit #touch .stick{pointer-events:auto;outline:2px dashed #ffd23a;outline-offset:2px}
body.touch-edit #touch .sel{outline:3px solid #7fe0ff!important}
#touchEditBar .te-hide{display:none}
#touchEditBar.te-on #teHint{display:none}
#touchEditBar.te-on .te-hide{display:inline-block}
#touchEditBar button{padding:4px 10px}
/* 縦向き（スマホ・タブレット）は横向きをお願いする。操作ボタンは横向きの画面に合わせて配置 */
#rotate{display:none;position:fixed;inset:0;z-index:50;background:#0b0a10;color:#f3e6c0;align-items:center;justify-content:center;text-align:center;padding:24px}
#rotate .rot-icon{font-size:52px;display:inline-block;transform:rotate(-90deg);margin-bottom:18px}
#rotate p{font-size:17px;line-height:1.7}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}#touch{display:none!important}}
@media (orientation:landscape) and (pointer:coarse){
  #touch{--u:calc(clamp(50px,15vh,78px) * var(--ts,1));--r:max(12px,env(safe-area-inset-right,0px));--b:max(12px,env(safe-area-inset-bottom,0px));--l:max(12px,env(safe-area-inset-left,0px))}
  #touch .stick{left:var(--l);bottom:var(--b);width:calc(var(--u)*2.2);height:calc(var(--u)*2.2)}
  #touch .knob{width:calc(var(--u)*0.9);height:calc(var(--u)*0.9);margin:calc(var(--u)*-0.45) 0 0 calc(var(--u)*-0.45)}
  #touch .tb{width:var(--u);height:var(--u);font-size:clamp(10px,2.4vh,13px)}
  #touch .atk{width:calc(var(--u)*1.6);height:calc(var(--u)*1.6);right:var(--r);bottom:var(--b);font-size:clamp(12px,3vh,16px)}
  #touch .dodge{right:calc(var(--r) + var(--u)*1.7);bottom:var(--b)}
  #touch .heal{right:calc(var(--r) + var(--u)*1.7);bottom:calc(var(--b) + var(--u)*1.1)}
  #touch .skill{right:var(--r);bottom:calc(var(--b) + var(--u)*1.7)}
  #touch .cycle{right:calc(var(--r) + var(--u)*1.7);bottom:calc(var(--b) + var(--u)*2.2);width:calc(var(--u)*0.85);height:calc(var(--u)*0.85)}
  #touch .sheathe{right:var(--r);bottom:calc(var(--b) + var(--u)*2.9);width:calc(var(--u)*0.85);height:calc(var(--u)*0.85)}
  #touch .guard{right:calc(var(--r) + var(--u)*2.8);bottom:var(--b)}
  #touch .menu{right:max(8px,env(safe-area-inset-right,0px));top:8px;width:64px;height:32px;border-radius:10px;font-size:12px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="touch"><div class="stick"><div class="knob"></div></div>
<div class="tb atk" data-tk="attack">攻撃</div><div class="tb dodge" data-tk="dodge">回避</div>
<div class="tb skill" data-tk="skill">スキル</div><div class="tb heal" data-tk="heal">回復</div><div class="tb guard" data-tk="guard">ガード</div>
<div class="tb cycle" data-tk="cycle">持ち物</div><div class="tb sheathe" data-tk="sheathe">納刀</div>
<div class="tb menu" data-tk="menu">メニュー</div></div>
<div id="rotate"><div><div class="rot-icon">📱</div><p>横向きにしてプレイしてください</p><p class="small">スマホを横にすると、ゲームが始まります</p></div></div>
<div id="touchEditBar"><span id="teHint">ボタンをドラッグして好きな位置に置いてください（タップで選ぶと大きさを変えられます）</span><span id="teSel" class="te-hide"></span><button id="teMinus" class="te-hide">－</button><span id="teVal" class="te-hide"></span><button id="tePlus" class="te-hide">＋</button><button data-act="touchEditDone">完了</button></div>
<div id="notify"></div>
<div id="overlay" class="hidden"></div>
<div id="modal" class="hidden"></div>
<script>
'use strict';
/* =====================================================================
   モンスターダンジョンズ（モンダン） — 見下ろし型ハック＆スラッシュ
   構成:
     1. ユーティリティ
     2. 設定・ゲームデータ（DATA）…ここを書き換えればバランス調整できます
     3. アイテム生成・ステータス計算（純粋関数）
     4. プロフィール（所持品）とセーブ
     5. ワールド（ゲームロジック：描画・DOMに依存しない）
     6. 描画（Renderer）
     7. 入力（Input）
     8. UI・アプリ制御（App）
   オンライン化時は 5 をサーバー側で動かし、players{} を複数にして
   inputs{playerId: input} を通信で受け取る想定です。
   ===================================================================== */

/* ===================== 1. ユーティリティ ===================== */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const RNG={next:()=>Math.random()}; // サーバー権威化時に差し替え可能
const rand=(a,b)=>a+RNG.next()*(b-a);
const randInt=(a,b)=>Math.floor(rand(a,b+1));
const pick=arr=>arr[Math.floor(RNG.next()*arr.length)];
function weightedPick(entries){
  let t=0;for(const e of entries)t+=Math.max(0,e.w);
  if(t<=0)return entries[0].v;
  let r=RNG.next()*t;
  for(const e of entries){r-=Math.max(0,e.w);if(r<0)return e.v;}
  return entries[entries.length-1].v;
}
function angDiff(a,b){let d=(a-b)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(RNG.next()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const $=sel=>document.querySelector(sel);

/* ===================== 2. 設定・ゲームデータ ===================== */
const TILE=32;
// 更新したら番号と日付を変える（最初の画面の右上に出る）
/* バージョンの付け方：1桁目＝大型アップデート、2桁目＝まあまあなアップデート、3桁目＝バグ修正 */
const GAME_VERSION={no:'1.5.8',date:'2026/10/31'};
const CONFIG={
  step:1/60,
  questTimeLimit:15*60, // 任務の制限時間（秒）。時間切れで強制ゲームオーバー。自由探索は対象外
  // レベルは無し。強さは装備と装飾品だけで決まる（素の能力は以前のLv3相当）
  player:{radius:12,baseSpeed:185,baseHp:125,baseAtk:10,baseDef:2,baseCrit:5,baseCritDmg:50,
    dodgeSpeed:520,dodgeTime:0.2,dodgeCd:1.0,baseDodgeIframe:0.08,skillCd:6,potionHealRatio:0.4,potionCd:0.8,
    startPotions:3,maxPotions:10,hitInvuln:0.35,

    {id:'ex_hermit_crab',stage:2,after:'ex_flower_dragon',boss:'hermit_crab',name:'【強敵】樹海の巨大ヤドカリ',desc:'大きな殻を背負ったヤドカリ。殻ごと突進し、大ハサミで挟む。泡を吐いて眠らせることもある。',goal:{type:'boss'},reward:{gold:1260,mats:{hard_shell:2,swamp_moss:2}}},
    {id:'s1_stag',stage:2,after:'s1_haro',boss:'stag_beetle',name:'【強敵】古森の大顎クワガタ',desc:'古森の奥に、巨大な大顎を持つクワガタが現れた。正面からの攻撃は硬い大顎に弾かれる。横や後ろに回り込め。',goal:{type:'boss'},reward:{gold:1400,mats:{stag_shell:2,reinforce_orb:2},decos:1}},
    {id:'s2_sanshou',stage:2,after:'s1_rabbit',boss:'salamander',name:'【強敵】樹海の大山椒魚',desc:'湿った森の奥に、長い舌と粘液を操る巨大な両生類が潜んでいる。粘液は水の力を帯びている。',goal:{type:'boss'},reward:{gold:1500,mats:{sanshou_mucus:2,reinforce_orb:2},decos:1}},
    {id:'s1_rabbit',stage:2,after:'s1_stag',boss:'forest_rabbit',name:'【強敵】古森の跳ね兎',desc:'森の奥で、白い毛並みの大きな兎が跳ね回っている。とても素早く、突進の前には足をためる。横へかわして背後から攻めろ。',goal:{type:'boss'},reward:{gold:1600,mats:{rabbit_fur:2,rabbit_tuft:2,reinforce_orb:2},decos:1}},
    {id:'s2_dragon',stage:8,after:'s2_boss',boss:'bone_dragon',name:'【強敵】冥府の骨竜',desc:'冥府の祭壇に封印されていた骨の竜が目を覚ました。追いかけてくる霊魂弾と、呼び出される骸骨兵に注意せよ。',goal:{type:'boss'},reward:{gold:2400,mats:{soul_shard:3,reinforce_orb:3},decos:2}},
    {id:'g_spider',stage:8,after:'s2_dragon',boss:'abyss_spider',name:'【強敵】冥府の大蜘蛛',desc:'冥府の闇から、大蜘蛛が糸を吐き出してくる。糸に絡まると動きが鈍る。',goal:{type:'boss'},reward:{gold:2700,mats:{spider_silk:3,curse_powder:2}}},
    {id:'g_moth',stage:8,after:'g_spider',boss:'ghost_moth',name:'【強敵】死霊の大蛾',desc:'亡霊の間を漂う大蛾が、鱗粉をまき散らす。鱗粉は眠気を誘う。',goal:{type:'boss'},reward:{gold:2800,mats:{soul_shard:2,curse_powder:2}}},

  /* モンスター図鑑の説明。stage：主に出現するステージ */
  bestiary:{
    kama_mantis:{stage:[1],role:'ボス',desc:'草原の草むらに潜む大きな蟷螂。大鎌で薙ぎ払い、雷をまとって突進する。',tip:'大鎌の薙ぎ払いは扇形。雷の突進は直線なので、横へ避けよう。'},
    armadillo:{stage:[1],role:'ボス',desc:'丸まって転がる大きなアルマジロ。突進は当たると足を鈍らせ、背中の棘を飛ばす。',tip:'丸まっている間は突進の前触れ。直線から外れて、突進後の隙を狙おう。'},
    flower_dragon:{stage:[2],role:'ボス',desc:'古森の奥で花を咲かせる竜。冥の力を帯びた花びらで薙ぎ払い、地面から根を突き出す。',tip:'根は直線の帯になって地面から伸びる。帯の外へ逃げよう。'},
    hermit_crab:{stage:[2],role:'ボス',desc:'大きな殻を背負ったヤドカリ。殻ごと突進し、大ハサミで挟む。泡を吐いて眠らせることもある。',tip:'泡は睡眠の危険がある。ハサミの薙ぎ払いは大きく避けよう。'},
    mud_whale:{stage:[3],role:'ボス',desc:'沼の底に潜む大きな鯨。冷たい潮を吹き、泥の尾で薙ぎ払い、大波を起こして着地する。',tip:'潮吹きは扇形の氷。大波は着弾の円を予告する。'},
    queen_bee:{stage:[3],role:'ボス',desc:'毒霧の沼に巣を作る巨大な蜂。毒針を直線に飛ばし、働き蜂を呼び、毒霧の溜まりを作る。',tip:'毒霧の溜まりは2秒ほど毒が残る。働き蜂は早めに倒そう。'},
    twin_shark:{stage:[4],role:'ボス',desc:'深い淵を泳ぐ二つの頭を持つ鮫。双頭で噛みつき、冥の力をまとって突進する。',tip:'噛みつきは扇形で、冥属性。突進の直線から外れよう。'},
    mola_fish:{stage:[4],role:'ボス',desc:'大きな体で海を漂うマンボウ。体当たりの突進のほか、水流を吹き出し、睡眠を誘う鱗粉を撒く。',tip:'鱗粉は扇形に広がる。体当たりは大きな円で予告される。'},
    crystal_guardian:{stage:[5],role:'ボス',desc:'洞窟の結晶を守る巨大な守護者。結晶の腕で薙ぎ払い、雷の光線を放ち、地面に結晶柱を生やす。',tip:'結晶柱は直線の帯。光線の狙いが固まったら横へ。'},
    quake_dragon:{stage:[5],role:'ボス',desc:'地底に棲む轟音の竜。咆哮で地鳴りを起こして足を鈍らせ、地面を割り、土砂を投げつける。',tip:'地鳴りは鈍足になる。亀裂の帯の外へ逃げよう。'},
    scarab:{stage:[6],role:'ボス',desc:'火山の岩場で暮らす大きな甲虫。甲殻を溶岩のように赤く光らせ、毒の吐息を放つ。',tip:'突進の前に甲殻が赤く光る。毒の吐息は扇形。'},
    fire_phoenix:{stage:[6],role:'ボス',desc:'焦土の空を舞う不死鳥。冥火の翼で薙ぎ払い、急降下し、冥火の球を放つ。',tip:'急降下の直線から外れよう。冥火の球は追いかけてくる。'},
    ice_bear:{stage:[7],role:'ボス',desc:'氷河の上に棲む大きな白熊。爪で薙ぎ払い、叩きつけ、火を吹いて突進する。',tip:'火を吹く突進は直線。叩きつけの円の外へ。'},
    ice_unicorn:{stage:[7],role:'ボス',desc:'雪原を駆ける氷の角を持つ獣。角の突進と薙ぎ払いで痺れを残し、電撃の直線を放つ。',tip:'痺れは行動を封じる。突進の直線から必ず外れよう。'},
    headless_knight:{stage:[8],role:'ボス',desc:'首のない騎士が大鎌を振るう。薙ぎ払いと突きで眠らせ、首を狙う斬撃を飛ばし、骸骨兵を呼ぶ。',tip:'大鎌の薙ぎ払いは眠りを誘う。振り終わりの隙を狙おう。'},
    yomi_samurai:{stage:[8],role:'ボス',desc:'黄泉の淵から這い出た怨霊の武者。水の刃で薙ぎ払い、突進し、怨霊を呼び出す。',tip:'水の刃は扇状に広がる。怨霊は時間で消えるので、呼ばれたら離れよう。'},
    giant_frog:{stage:[3],role:'ボス',desc:'沼の大きな蛙。跳んで着地の衝撃を広げ、毒液を吐き、舌で払う。',tip:'着地の前に体が縮む。その瞬間に離れよう。毒液は避けるか、解毒を用意しよう。'},
    bog_leech:{stage:[3],role:'ボス',desc:'沼底に潜み、足元から飛び出す吸血ヒル。吸い付かれると毒が続く。',tip:'泥が盛り上がったら要注意。吸い付かれたら素早く振りほどこう。'},
    deep_octopus:{stage:[4],role:'ボス',desc:'深い淵に棲む大蛸。触腕を振るい、地面を突き刺し、水流を四方へ噴き出す。',tip:'触腕の攻撃は間合いが広い。水流は全方向に飛ぶので、移動し続けよう。'},
    giant_bat:{stage:[5],role:'ボス',desc:'洞窟の天井に棲む大きな蝙蝠。急降下し、音波を直線や円形に放つ。',tip:'上空から襲いかかるので、降下の前兆を見て避けよう。'},
    crystal_scorpion:{stage:[5],role:'ボス',desc:'晶石の洞窟に棲む大蠍。鋏で薙ぎ、尾を振り下ろし、毒針を飛ばす。',tip:'毒針は直線に飛ぶ。尾の動きを見て、横へ避けよう。'},
    crimson_serpent:{stage:[6],role:'ボス',desc:'火山の岩場に棲む大蛇。炎を吐き、身をくねらせて薙ぎ払い、地を這う炎を走らせる。',tip:'地を這う炎は一直線。並ばないように避けよう。'},
    fire_griffon:{stage:[6],role:'ボス',desc:'火口に棲む翼の獅子。跳躍の着地で衝撃を生み、滑空突進し、炎を吐く。',tip:'滑空の直線から外れて、着地の衝撃は少し離れて受けよう。'},
    eternal_beast:{stage:[7],role:'ボス',desc:'永久凍土の巨大な象。牙で突進し、踏みつけ、冷気の扇を吐く。',tip:'突進の直線から外れ、冷気の扇は角度の外へ逃げよう。'},
    frost_cat:{stage:[7],role:'ボス',desc:'白霜をまとった大きな山猫。素早く飛びかかり、引っかき、氷の破片を飛ばす。',tip:'動きが速いので、飛びかかりの後の隙を狙おう。'},
    abyss_spider:{stage:[8],role:'ボス',desc:'冥府の闇に棲む大蜘蛛。糸で動きを鈍らせ、冥の糸を地面から噴き出させる。',tip:'糸に当たると鈍る。複数の糸は広がるので、大きく避けよう。'},
    ghost_moth:{stage:[8],role:'ボス',desc:'冥府に漂う大きな蛾。冥の鱗粉を撒き、羽ばたきで衝撃を生み、遠くへ直線に飛ばす。',tip:'鱗粉は扇状に広がる。羽ばたきの衝撃は近づかずに避けよう。'},
    grave_rat:{stage:[8],role:'ボス',desc:'墓穴に潜む大鼠。素早く突進し、噛みつき、地面から冥の力を帯びて飛び出す。',tip:'地面が盛り上がったら、すぐに離れよう。'},
    goblin:{stage:[1],role:'近接攻撃型',desc:'草原に住みつく小鬼。群れで近づき、こん棒で殴りかかってくる。この地では剣を持つ「ゴブリン剣士」と呼ばれることも。',tip:'振りかぶる動作（赤い扇形）が見えたら横へ。体力は低いので素早く倒そう。'},
    archer:{stage:[8],role:'遠距離攻撃型',desc:'骨の弓兵（骸骨弓兵）。距離を取り、狙いを定めて矢を放つ。',tip:'狙いの線が赤く固まった直後に矢が来る。柱や木を盾にしながら近づこう。'},
    goblin_archer:{stage:[1],role:'遠距離攻撃型',desc:'丘や野営地に陣取るゴブリンの射手。ほかの魔物と組むと厄介。',tip:'近接の魔物を引きつけつつ、先に弓兵を倒すと楽になる。'},
    forest_wolf:{stage:[2],role:'高速近接型',desc:'森を駆ける狼。獲物を追いかけ、少し離れた場所から一直線に突進してくる。',tip:'突進は直線だけ。地面の帯が見えたら横へ回避して、止まったところを攻撃。'},
    slime:{stage:[1],role:'低速・範囲攻撃型',desc:'跳ねながら近づいてくるスライム。近くでは大きく跳び、着地点の周りを押しつぶす。',tip:'着地点に赤い円が出る。円の外へ出てから反撃しよう。'},
    beetle:{stage:[2],role:'防御型',desc:'硬い甲殻に覆われた大きな甲虫。正面からの攻撃はほとんど弾いてしまう。',tip:'向きを変えるのが遅い。横や背後に回り込んで攻撃しよう。'},
    mushroom:{stage:[2],role:'範囲妨害型',desc:'近づいた者に毒胞子を浴びせるキノコ。胞子の雲の中にいると少しずつ体力が減る。',tip:'緑の円が出たら離れる。雲が消えてから近づき、一気に倒そう。'},
    forest_king:{stage:[2],role:'ボス',desc:'森林を支配する巨大な狼。突進・前方の薙ぎ払い・周囲への咆哮を使い分ける。',tip:'怒ると突進が何度も続く。帯の向きをよく見て横へ。咆哮は円の外へ。'},
    salamander:{stage:[2],role:'ボス',desc:'湿った森の奥に棲む巨大な両生類。長い舌で狙い、体をくねらせて突っ込み、水の粘液を飛ばす。',tip:'舌は細く長い直線。粘液は水の塊なので、横へよけながら攻めよう。'},
    rhino:{stage:[1],role:'ボス',desc:'硬い装甲をまとった大型のサイ。正面からの攻撃にとても強い。',tip:'正面は弾かれやすい。横や後ろから攻めよう。角の突進は直線。'},
    hanayari:{stage:[2],role:'固定・遠距離型',desc:'地面に根を張った花のモンスター。花びらから鋭い棘を発射する。動けないが、遠くから撃ってくる。',tip:'棘は狙いが定まってから飛ぶ。射線から外れて近づけば、動けない花は怖くない。'},
    mahibana:{stage:[2],role:'固定・麻痺型',desc:'花粉を遠くまで飛ばす植物。吸い込むと一定時間麻痺する。ダメージはないが、動けなくなるのが厄介。',tip:'撃つ間隔は長め。花粉の弾が見えたら横へ避けよう。麻痺したら連打で抜け出す。'},
    field_rat:{stage:[1],role:'高速・群れ型',desc:'草原の小さなネズミの群れ。体は弱いが素早く、まとまって襲いかかってくる。',tip:'一匹ずつ囲まれないよう、群れを背にして戦おう。一撃で倒せることが多い。'},
    wild_boar:{stage:[1],role:'突進型',desc:'草原にすむ小さなイノシシ。噛みつきはせず、少し離れた場所から一直線に突進してくる。',tip:'突進は直線だけ。帯が見えたら横へ避けて、止まったところを攻撃。'},
    boar:{stage:[1],role:'ボス',desc:'勢いよく突進し、地面を掘り返して土塊を飛ばす大型のイノシシ。',tip:'突進は直線で速い。掘り返しの後は土塊が飛ぶので、円の外へ。'},
    meadow_bull:{stage:[1],role:'ボス',desc:'草原の主。角で突き、薙ぎ払い、足で大地を踏み鳴らす。',tip:'突進は直線。突進の後は大きな隙がある。踏みつけの円の外へ逃げよう。'},
    wolf:{stage:[2],role:'ボス',desc:'森の最奥に棲みつく古い狼。噛みつき・突進・地面への叩きつけで襲いかかる。',tip:'叩きつけの円は大きい。弱ると怒り、叩きつけの周りにも衝撃が走る。'},
    poison_frog:{stage:[3],role:'跳躍攻撃型',desc:'沼の毒を含んだ蛙。大きく跳ねて飛びかかってくるほか、離れると毒の玉を吐く。毒の玉の威力は低いが、当たると必ず毒になる。',tip:'跳ねる直前に体が沈むので、その瞬間に横へ避けよう。'},
    leech:{stage:[3],role:'近接吸血型',desc:'泥の中から這い出す吸血ヒル。ぬめりを残しながら追いかけてくる。',tip:'囲まれると逃げにくい。数を減らしてから戦おう。'},
    carnivore_plant:{stage:[3],role:'範囲妨害型',desc:'地面に根を張る食虫の花。近づくと毒の霧を吐く。',tip:'霧の範囲は広い。遠くから倒すのがおすすめ。'},
    bloater:{stage:[3],role:'範囲攻撃型',desc:'毒袋を膨らませた魔物。着地の衝撃で周囲に毒をまき散らす。',tip:'膨らんでいる間は近づかない。'},
    swamp_croc:{stage:[3],role:'防御型',desc:'硬い鱗で正面を守る沼のワニ。正面からの攻撃はほとんど通らない。',tip:'横か後ろに回り込もう。'},
    parasite:{stage:[3],role:'追尾・移動妨害型',desc:'腐った木に取り付く寄生体。浮かびながら近づき、触れた者の足を鈍らせる。',tip:'ふわふわ追ってくる。逃げるより倒すほうが早い。'},
    gale_bird:{stage:[1],role:'ボス',desc:'草原の空を支配する巨大な鳥。とても素早く、急降下や羽根の投げつけで攻めてくるが、一撃は軽い。',tip:'急降下のあとは少しスキがある。羽根は扇状に飛ぶので横へよけよう。'},
    rock_lizard:{stage:[1],role:'ボス',desc:'岩のような鱗に覆われた大蜥蜴。噛みつき・尻尾の振り回し・岩の吐き出しを使い分ける。',tip:'尻尾の振り回しは足元の円。円が見えたらすぐ離れよう。'},
    stag_beetle:{stage:[2],role:'ボス',desc:'古森に棲む巨大なクワガタ。大顎のある正面からの攻撃はほとんど弾かれてしまう。向きを変えるのは遅い。',tip:'横や後ろへ回り込んで攻めよう。罠にかかったりスタンしている間は、正面からでも攻撃が通る。'},
    cave_bat:{stage:[5],role:'雑魚',desc:'洞窟の天井に張りつく小さなコウモリ。素早く飛び回り、上空から急降下して襲いかかる。',tip:'急降下の前に影が見える。直線から外れて、降りてきたところを叩こう。'},
    rock_shell:{stage:[5],role:'雑魚',desc:'岩のような鱗に覆われたトカゲ。正面からの攻撃にとても強く、体当たりを仕掛けてくる。',tip:'正面は硬い。横や後ろに回り込もう。'},
    cave_spider:{stage:[5],role:'雑魚',desc:'鍾乳石の陰に巣を張る蜘蛛。糸を吐いて動きを鈍らせる。',tip:'糸に当たると足が遅くなる。巣の近くへは深入りしない。'},
    crystal_slime:{stage:[5],role:'雑魚',desc:'結晶をまとったスライム。体当たりのほかに、結晶の破片を飛ばしてくる。',tip:'破片は直線で飛ぶ。少し離れて、揺れたら横へ。'},
    mole:{stage:[5],role:'ボス',desc:'結晶を食べて育った大きな土竜。地面に潜り、プレイヤーの足元から飛び出して攻撃する。',tip:'潜っている間は攻撃が届かない。飛び出した後に隙がある。'},
    centipede:{stage:[5],role:'ボス',desc:'細長い体の大百足。体を振るって薙ぎ払い、炎の弾を吐く。',tip:'炎の弾は火属性。ひるんだ隙に頭を狙おう。'},
    grados:{stage:[5],role:'ボス',desc:'結晶と鉱石で出来た地底の王。とても大きく動きは遅いが、一撃が重い。物理攻撃にはとても硬い。',tip:'属性の攻撃がよく効く。叩きつけの後は隙が大きい。'},
    fire_wyvern:{stage:[6],role:'雑魚',desc:'熱気の中を飛ぶ小型の飛竜。扇状の火炎ブレスを吐き、直線に滑空して突っ込んでくる。',tip:'ブレスは扇の形。扇の外へ回り込もう。'},
    magma_beetle:{stage:[6],role:'雑魚',desc:'体内に爆熱を溜めた甲虫。近づくと赤く光り、しばらくして爆発する。',tip:'赤く光ったら円の外へ。爆発後は消える。'},
    molten_beast:{stage:[6],role:'雑魚',desc:'溶けた鉄の体を持つ魔獣。直線に突進し、通った跡に熔鉄の炎を残す。',tip:'突進の前に向きが見える。跡の炎には触れないこと。'},
    scorpion:{stage:[6],role:'雑魚',desc:'火口に住む大きな蠍。尾の突き刺しと、前方の薙ぎ払いを使う。',tip:'突き刺しは細い扇。薙ぎ払いの後は少し隙がある。'},
    lava_giant:{stage:[6],role:'ボス',desc:'火口の底で眠っていた溶岩の巨人。叩きつけ・岩投げ・溶岩の亀裂で攻めてくる。',tip:'岩投げは着弾の円を予告する。亀裂は直線の帯。'},
    volcano_dragon:{stage:[6],role:'ボス',desc:'炎獄竜ヴォルカノス。扇状の火炎ブレスと溶岩弾を使い、弱ると溶岩の噴出を起こす。',tip:'噴出の地点は事前に円で示される。ブレスの扇の外へ。'},
    felgnas:{stage:[6],role:'ボス',desc:'熔鉄をまとった魔獣フェルグナス。直線の突進を最大3回続け、熱波と熔鉄の地面を生む。',tip:'突進中は方向を変えない。次の突進の予告を見て横へ。'},
    ice_beetle:{stage:[7],role:'雑魚',desc:'氷晶の外殻を持つ甲虫。周囲に氷の破片を飛ばす。',tip:'破片は円の外へ広がる。外殻が硬いので、横から攻めよう。'},
    snow_owl:{stage:[7],role:'遠距離攻撃型',desc:'吹雪の中を飛ぶフクロウ。氷の弾を放ち、弱ると複数方向へ撃つ。',tip:'狙いの線が見えたら横へ。弱ったら扇状の弾に注意。'},
    ice_seal:{stage:[7],role:'直線突進型',desc:'身体を丸めて滑る、凍てついたアザラシ。突進の方向を先に示す。',tip:'突進は直線。壁に当たると少し隙ができる。'},
    ice_mantis:{stage:[7],role:'近接攻撃型',desc:'氷の刃を持つカマキリ。前方の斬撃と、十字の斬撃を使う。',tip:'十字の斬撃は四方向。斜めに避けると安全。'},
    snow_fox:{stage:[7],role:'高速撹乱型',desc:'素早く周囲を回る雪色のキツネ。距離を取ってから飛びかかり、遠くでは氷の破片を飛ばす。',tip:'飛びかかりの方向が先に見える。飛びかかりの後は少し離れる。'},
    snow_monkey:{stage:[7],role:'近接攻撃型',desc:'雪山に住む小型の猿。素早く近づき、引っかきや小さな飛びかかりをする。',tip:'一体ずつなら楽に倒せる。剛猿が呼ぶ個体は数に上限がある。'},
    ice_deer:{stage:[7],role:'ボス',desc:'氷の大角を持つ大鹿。角を構えての突進、扇状の氷の破片、地面からの氷柱を使う。',tip:'氷柱は足元に予告される。突進の直線から外れよう。'},
    frost_wyvern:{stage:[7],role:'ボス',desc:'雪山に住む大型の氷竜。冷気のブレス、氷の弾、広範囲の氷柱を使う。',tip:'ブレスは扇形。弾は直線。氷柱の予告が出たら離れる。'},
    ice_ape:{stage:[7],role:'ボス',desc:'雪山の主である巨大な猿。叩きつけ・突進・氷の破片を使い、弱ると小猿を呼ぶ。',tip:'呼び出しの予備動作の間に、先に小猿を減らそう。'},
    forest_rabbit:{stage:[2],role:'ボス',desc:'古森に棲む白い大兎。とても素早く跳ね回り、突進や耳の薙ぎ払いを使う。綿毛の弾は弱い。',tip:'突進の前には足をためる。跳ねた先を読んで、横へ回り込もう。'},
    hydra:{stage:[3],role:'ボス',desc:'沼の中心に棲む多頭の竜。三つの首で薙ぎ払い、毒の吐息を放つ。',tip:'首の薙ぎ払いは扇形。毒の沼には入らないこと。'},
    venomKing:{stage:[3],role:'ボス',desc:'毒蟲の王。子蟲を呼び、毒の沼を作り、重い前脚で叩きつける。',tip:'子蟲は早めに倒すと楽になる。'},
    mireGiant:{stage:[3],role:'ボス',desc:'腐敗した沼の巨人。大きな腕で叩き、泥を投げ、沼を広げる。',tip:'叩きつけの後は大きな隙がある。その隙に攻めよう。'},
    water_lizard:{stage:[4],role:'跳躍攻撃型',desc:'川辺を素早く走る水棲トカゲ。水に入ると急に加速して飛びかかる。',tip:'直線で突っ込んでくる。横に避けて背後を取ろう。'},
    jellyfish:{stage:[4],role:'低速・妨害型',desc:'ふわふわ漂う泡沫クラゲ。触れると体がにぶくなる。',tip:'触れなければ怖くない。ゆっくり近づいて倒そう。'},
    piranha:{stage:[4],role:'高速近接型',desc:'群れで襲いかかる川牙ピラニア。動きが速く、歯が鋭い。',tip:'数で囲まれないよう、岩を背にすると安全。'},
    crab:{stage:[4],role:'防御型',desc:'滝の裏で守りを固める甲殻獣。正面からの攻撃はほとんど弾く。',tip:'横や後ろから攻めるか、重い攻撃で殻を割ろう。'},
    eel:{stage:[4],role:'高速突進型',desc:'雷を蓄えたウナギ。水から飛び出すように突進し、近くで電撃を走らせる。',tip:'突進の直線から外れること。'},
    water_spirit:{stage:[4],role:'遠距離攻撃型',desc:'水の中に漂う精霊。水の矢を放ち、距離を保とうとする。',tip:'矢は遅めなので、狙いを外して近づこう。'},
    aquarios:{stage:[4],role:'ボス',desc:'滝つぼに棲む蒼い海竜。尾の薙ぎ払い、水の弾、突進、ピラニアの召喚を使う。',tip:'突進は直線。水の弾は扇状に広がるので、間をすり抜けよう。'},
    turtle:{stage:[4],role:'ボス',desc:'滝の水を背負う大きな亀。重い叩きつけ、水の弾、尾の薙ぎ払い、滝守の甲殻獣を呼ぶ。',tip:'叩きつけの後に大きな隙がある。'},
    thunderEel:{stage:[4],role:'ボス',desc:'雷を纏う大きなウナギ。素早い突進と雷の叩きつけ、雷電ウナギを呼ぶ。',tip:'突進の前に体が光る。光ったら直線から離れよう。'},
    giantWorm:{stage:[4],role:'ボス',desc:'ゴムのような体の大きなミミズ。泥に潜んで不意に飛び出し、体をしならせて薙ぎ払う。雷には強い。',tip:'地中に潜ったら足元に注意。雷の攻撃は効きにくい。'},
    hobgoblin:{stage:[8],role:'近接攻撃型',desc:'ゴブリンより大柄で打たれ強い。墓所の回廊や詰所に現れる。',tip:'一撃が重い。振りかぶりを見てから回避しよう。'},
    sniper:{stage:[8],role:'遠距離攻撃型',desc:'遠くから素早い矢を放つスケルトン。',tip:'矢が速いので、狙いが固まる前に射線から外れよう。'},
    skeleton:{stage:[8],role:'近接攻撃型',desc:'剣を手にした骸骨の兵士。複数で現れ、動ける場所を狭めてくる。',tip:'囲まれないよう、通路に引き込んで1体ずつ相手にしよう。'},
    wisp:{stage:[8],role:'追尾・移動妨害型',desc:'墓地をさまよう霊。ふわふわと追いかけてきて、触れた者の動きを鈍らせる。',tip:'鈍足中は回避が遅れがち。ほかの魔物と一緒のときは先に倒そう。'},
    zombie:{stage:[8],role:'高耐久型',desc:'墓所を守り続けるゾンビ。動きは遅いが打たれ強く、攻撃してものけぞらない。',tip:'狭い通路をふさがれると厄介。広い場所で戦うか、罠や爆弾を使おう。'},
    cursed_knight:{stage:[8],role:'強敵・重攻撃型',desc:'呪いに囚われた騎士。大剣で広い範囲を薙ぎ払い、鋭い突きも放つ。',tip:'攻撃の後に大きな隙がある。範囲の外へ逃げて、振り終わりを狙おう。'},
    shaman:{stage:[8],role:'支援型',desc:'周りの魔物を呪術で強化し、倒れた魔物をよみがえらせる。',tip:'詠唱中に攻撃を当てると中断できる。最優先で倒そう。'},
    black_wolf:{stage:[8],role:'ボス',desc:'古狼の群れを率いた黒い狼。古狼より速く、力も強い。',tip:'動きは古狼と同じ。罠や閃光玉でスキを作ろう。'},
    bone_dragon:{stage:[8],role:'ボス',desc:'地下墓地に封印されていた巨大な骨の竜。霊魂弾・薙ぎ払い・咆哮に加え、骸骨兵を呼び出す。',tip:'霊魂弾は追いかけてくるが、回避で抜けられる。呼ばれた骸骨兵は竜を倒すと崩れる。'},
  },

const PAD_NAMES={

/** 操作の割り当て（既定）。pad＝コントローラーのボタン番号、kb＝キー（Mouse0＝左クリック） */
const DEFAULT_BINDS={pad:{attack:5,skill:7,guard:6,dodge:0,sheathe:3,heal:4,cycle:2},kb:{attack:'Mouse0',guard:'KeyG',dodge:'Space',skill:'KeyQ',sheathe:'KeyF',heal:'KeyE',cycle:'KeyR'}};

/** いまの割り当て（設定に保存したものを既定に上書き） */
function getBinds(){const b=(App.settings().binds)||{};return {pad:Object.assign({},DEFAULT_BINDS.pad,b.pad||{}),kb:Object.assign({},DEFAULT_BINDS.kb,b.kb||{})};}
/** キーの表示名 */
function keyLabel(c){
  if(!c)return '−';
  if(c==='Mouse0')return '左クリック';if(c==='Mouse2')return '右クリック';
  if(c==='Escape')return 'Esc';if(c==='Space')return 'Space';
  if(c.startsWith('Key'))return c.slice(3);
  if(c.startsWith('Digit'))return c.slice(5);
  if(c.startsWith('Arrow'))return {ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→'}[c]||c;
  return c;
}
/** 表示するコントローラーの種類（設定の選択、自動なら接続中の機器から） */
function padTypeNow(){const v=App.settings().padLabel||'auto';return v==='auto'?detectPadType():v;}
/** 接続中のコントローラーの種類（見つからなければ Xbox 式） */
function detectPadType(){
  try{
    const pads=(navigator.getGamepads&&navigator.getGamepads())||[];
    for(const g of pads){if(!g||!g.id)continue;const id=g.id.toLowerCase();
      if(/playstation|dualshock|dualsense|sony|wireless controller/.test(id))return 'ps';
      if(/nintendo|switch|pro controller|joy-con/.test(id))return 'switch';
      return 'xbox';}
  }catch(e){}
  return 'xbox';
}

const HELP_BASIC=[

};
const Items={
  /** 上限（maxR）までのレア度から抽選する（製作の装飾品はレア以下） */
  rollRarityMax(boost=1,maxR=99){
    return weightedPick(DATA.rarities.map((r,i)=>({w:i>maxR?0:r.dropW*Math.pow(boost,i),v:i})));
  },
  rollRarity(boost=1,minR=0){
    return weightedPick(DATA.rarities.map((r,i)=>({w:i<minR?0:r.dropW*Math.pow(boost,i),v:i})));
  },
  /** 武器・防具を作る。レア度の概念はなく、性能は基本値のまま（付加ステータス・特殊効果は付かない）。手紙は別（createLetter） */
  createEquipment(baseId){
    if(DATA.equipment[baseId].slot==='charm')return Items.createLetter(DATA.equipment[baseId].letter);
    const base=DATA.equipment[baseId];
    const it={kind:'equip',uid:null,baseId,slot:base.slot,rarity:0,atk:0,def:0,crit:0,affixes:[],slots:[],effects:[]};
    if(base.slot==='weapon'){it.atk=base.atk;it.crit=base.crit||0;}
    else it.def=Math.max(1,base.def);
    it.slots=new Array(Items.slotCount(baseId,0)).fill(null);
    return it;
  },
  /** 付与の抽選：玉の段階（1〜3）ごとの手紙のスキル表から、防具に付くスキルポイントを決める（手紙と同じ仕組み） */
  rollEnchant(tier){
    const T=DATA.enchantTiers[clamp(tier,1,3)-1],skills={};
    const pickSkill=()=>weightedPick(Object.keys(T.pool).filter(k=>!skills[k]&&DATA.armorSkills[k]).map(k=>({w:T.pool[k],v:k})));
    skills[pickSkill()]=randInt(T.pts[0],T.pts[1]);
    if(RNG.next()<T.two){const k=pickSkill();if(k)skills[k]=randInt(T.pts2[0],T.pts2[1]);}
    return skills;
  },
  /** 手紙を作る：レア度ごとの「付きやすいスキル」から1〜2種、ポイントもレア度ごとの範囲で決まる */
  createLetter(tier){
    tier=clamp(tier|0,0,4);const L=DATA.letters[tier],skills={};
    const pickSkill=()=>weightedPick(Object.keys(L.pool).filter(k=>!skills[k]&&DATA.armorSkills[k]).map(k=>({w:L.pool[k],v:k})));
    skills[pickSkill()]=randInt(L.pts[0],L.pts[1]);
    if(RNG.next()<L.two){const k=pickSkill();if(k)skills[k]=randInt(L.pts2[0],L.pts2[1]);}
    const ns=weightedPick(L.slotW.map((w,i)=>({w,v:i})));
    return {kind:'equip',uid:null,baseId:'letter_'+tier,slot:'charm',rarity:tier,atk:0,def:0,crit:0,affixes:[],effects:[],slots:new Array(ns).fill(null),skills};
  },
  lootStage:1, // 今探索しているステージ（手紙のレア度の上限に使う。出撃のときに App が入れる）
  /** 手紙のレア度：上限（cap）より上は出ない。上限までは普段のレア度の出やすさのまま */
  rollLetterTier(boost,cap){return weightedPick(DATA.rarities.map((r,i)=>({w:i>cap?0:r.dropW*Math.pow(boost,i),v:i})));},
  /** 今のルールで持てるスロット数（手紙は作ったときの数のまま） */
  maxSlots(it){return it.slot==='charm'?Math.min(2,it.slots.length):Items.slotCount(it.baseId,it.rarity);},
  createDeco(decoId,rarity){return {kind:'deco',uid:null,decoId,rarity};},
  decoValue(d){return DATA.decoPts[d.rarity]||1;},
  decoText(d){const dd=DATA.decorations[d.decoId],sk=DATA.armorSkills[dd.skill];return (sk?sk.name:dd.skill)+' +'+Items.decoValue(d)+'pt';},
  /** 装備の装飾品スロット数：装備ごとの slots（序盤の装備は0）＋エピック以上で+1（最大3） */
  slotCount(baseId,rarity){const b=DATA.equipment[baseId];const n=(b&&b.slots)||0;return Math.min(3,n+(n>0&&rarity>=3?1:0));},
  rollLoot(tableId,rareBonus){
    const t=DATA.dropTables[tableId],out=[];
    if(!t)return out;
    { // 手紙：宝箱・中ボス・ボスの報酬から（レア度は報酬の良さ rarityBoost で上がりやすくなる）
      const isBoss=Object.values(DATA.enemies).some(e=>e.boss&&e.drops===tableId),ch=DATA.letterDrops[tableId]??(isBoss?DATA.letterDrops.boss:0);
      if(ch>0&&RNG.next()<ch*(1+(rareBonus||0)/100))out.push({type:'equip',item:Items.createLetter(Items.rollLetterTier(Math.pow(t.rarityBoost||1,0.6),DATA.letterCap(Items.lootStage||1)))});
    }
    if(t.one){ // 素材は1つだけ（落ちないこともある）
      const mats=t.rolls.filter(r=>r.type==='mat'&&(!r.stage||(Items.lootStage||1)>=r.stage));
      if(mats.length&&RNG.next()<Math.min(1,t.one*(1+(rareBonus||0)/100))){
        const r=weightedPick(mats.map(m=>({w:m.chance,v:m})));out.push({type:'mat',id:r.id,n:1});
      }
    }
    for(const r of t.rolls){
      if(t.one&&r.type==='mat')continue;
      const ch=r.chance<1&&rareBonus?Math.min(1,r.chance*(1+rareBonus/100)):r.chance; // レア素材率アップ（防具スキル）
      if(r.stage&&(Items.lootStage||1)<r.stage)continue; // ステージ条件（付与の玉は5以降）
      if(RNG.next()>=ch)continue;
      if(r.type==='mat')out.push({type:'mat',id:r.id,n:randInt(r.min||1,r.max||1)});
      else if(r.type==='equip')out.push({type:'equip',item:Items.createEquipment(pick(DATA.equipPools[r.pool]),Items.rollRarity(t.rarityBoost))});
      else if(r.type==='deco')out.push({type:'deco',item:Items.createDeco(pick(Object.keys(DATA.decorations)),Items.rollRarity(t.rarityBoost))});
      else if(r.type==='item')out.push({type:'item',id:r.id,n:randInt(r.min||1,r.max||1)});

function bossOnlyMats(){

function computeStats(profile,override,who){
  const P=CONFIG.player,ch=charOf(profile,who||0);
  const s={maxHp:P.baseHp,atk:P.baseAtk,def:P.baseDef,
    crit:P.baseCrit,critDmg:P.baseCritDmg,moveSpd:0,atkSpd:0,dodgeIframe:P.baseDodgeIframe,drainChance:0,
    effects:{},weaponType:'sword',weaponName:'素手',weaponRarity:0,decoCapped:[],
    atkPct:0,dodgeCdMult:1,itemDelayAdj:0,sets:[],
    // 防具スキルで変わる値（スキルが無ければ効果なし）
    weakCrit:0,bossDmgPct:0,minionDmgPct:0,dmgCut:0,knockRes:0,poisonRes:0,statusRes:0,healPct:0,regen:0,elem:null,elemPct:0,reviveCut:0,elemRes:{fire:0,water:0,thunder:0,ice:0,mei:0},
    dodgeDistPct:0,chargeSpdPct:0,itemPowerPct:0,gatherBonus:0,rareBonus:0,skillPts:{},skillList:[]};
  const decoPts={},wearing={},armor=[];
  for(const slot of SLOTS){
    const hasOv=!!override&&Object.prototype.hasOwnProperty.call(override,slot);
    let item=hasOv?override[slot]:Profile.getItem(profile,ch.equipped[slot]);
    if(!item&&!hasOv&&slot==='weapon'&&who===1)item=P2_STARTER_SWORD;
    if(!item)continue;
    const base=DATA.equipment[item.baseId];if(!base)continue;
    s.atk+=item.atk||0;s.def+=item.def||0;s.crit+=item.crit||0;
    if(base.fixed)for(const f of base.fixed)s[f.stat]+=f.v;
    for(const a of item.affixes){const d=DATA.affixes[a.id];if(d)s[d.stat]+=a.v;}
    for(const ef of item.effects)if(DATA.effects[ef])s.effects[ef]=true;
    for(const du of item.slots){
      if(!du)continue;
      const d=Profile.getDeco(profile,du);if(!d)continue;
      const dd=DATA.decorations[d.decoId];if(!dd||!DATA.armorSkills[dd.skill])continue;
      decoPts[dd.skill]=(decoPts[dd.skill]||0)+Items.decoValue(d);
    }
    wearing[slot]=item.baseId;
    if(slot==='weapon'){s.weaponType=base.wtype;s.weaponName=base.name;s.weaponRarity=item.rarity;
      if(base.el)s.elem={k:base.el.k,v:Math.round(base.el.v*DATA.rarities[item.rarity].statMult)}; // 武器の属性
      if(base.st)s.inflict=base.st;} // 武器の状態異常（命中時に確率で付与）
    else{const sr=DATA.seriesRes[item.baseId==='fang_king'?'fang':item.baseId.split('_')[0]];if(sr)for(const k in sr)s.elemRes[k]+=sr[k];armor.push(item);} // 防具の属性耐性
  }
  s.look=Object.assign({},wearing); // 見た目（部位→装備ID）。描画とオンラインの表示に使う
  // 重ね着：設定した部位は、装備していなくても設定した見た目を出す（未設定の部位は装備中の見た目）
  const cos=ch.costume||{};for(const sl of SLOTS)if(cos[sl])s.look[sl]=cos[sl];
  // 防具スキル（ポイントの合算 → 発動判定 → 効果の適用）
  s.skillPts=armorSkillPoints(armor);
  for(const k in decoPts)s.skillPts[k]=(s.skillPts[k]||0)+decoPts[k]; // 装飾品のポイント
  s.skillList=armorSkillLevels(s.skillPts);
  applyArmorSkills(s,s.skillList);
  // 防具シリーズの一式効果（スキルポイントとは別の仕組み）。tiers があれば装備数に応じて段階的に
  for(const id in DATA.armorSets){
    const set=DATA.armorSets[id],n=Object.keys(set.pieces).filter(sl=>wearing[sl]===set.pieces[sl]).length,need=set.need||Object.keys(set.pieces).length;
    if(set.tiers){
      const on=set.tiers.filter(t=>n>=t.count);
      if(n>0)s.sets.push({id,name:set.name,bonus:on.length?on[on.length-1].bonus:set.tiers[0].bonus,desc:set.tiers.map(t=>t.count+'部位：'+t.desc).join('／'),count:n,need:set.tiers[0].count,active:on.length>0});
      for(const t of on)t.apply(s);
      continue;
    }
    if(n>0)s.sets.push({id,name:set.name,bonus:set.bonus,desc:set.desc,count:n,need,active:n>=need});
    if(n>=need)set.apply(s);
  }
  const wt=DATA.weaponTypes[s.weaponType];
  s.atk*=1+s.atkPct/100;
  if(s.effects.critup)s.critDmg+=30;
  s.crit=clamp(s.crit,0,100);
  s.maxHp=Math.round(s.maxHp);s.atk=Math.round(s.atk);s.def=Math.round(s.def);
  s.speed=P.baseSpeed*(1+s.moveSpd/100)*wt.move;                         // 抜刀中
  s.sheathSpeed=P.baseSpeed*(1+s.moveSpd/100)*DATA.weaponTypes.sword.move; // 納刀中は片手剣と同じ速さ
  s.sheatheTime=wt.sheathe||0.5;
  s.attackInterval=wt.interval/(1+s.atkSpd/100);
  s.range=wt.range;s.arc=wt.arc;s.activeTime=wt.active;s.power=wt.power;s.swingTime=wt.swing||0.22;s.tip=wt.tip||null;
  s.dodgeCd=P.dodgeCd*(s.effects.gale?0.7:1)*s.dodgeCdMult;
  s.skill=wt.skill||null;
  s.skillCd=s.skill?DATA.skills[s.skill].cd*(s.effects.skillcd?0.75:1):0;
  s.ws=wt.ws||null;if(s.ws)s.skillCd=DATA.weaponSkills[s.ws].cd*(s.effects.skillcd?0.75:1);
  s.itemDelayAdj+=(wt.itemDelay||0);
  s.itemDelay=Math.max(P.minItemDelay,DATA.consumables.potion.delay+s.itemDelayAdj); // 表示用（回復薬の発動時間）
  s.perfectAtk=wt.perfect?wt.perfect.atkUp:0;
  s.healMult=(s.effects.medic?1.4:1)*(1+s.healPct/100);
  s.potionHeal=Math.round(s.maxHp*DATA.consumables.potion.effect.ratio*s.healMult);
  applyPet(s,profile,who);
  return s;
}

/* ---------- 防具スキル ----------
   ① ポイントの合算：装備中の防具（頭・胴・腕・腰・脚）の skills を足す
   ② 発動の判定：per（初期10）ポイントごとに1段階、最大はスキルごとの max
   ③ 効果の適用：発動した段階の効果量でスキルの apply を呼ぶ
   どれもプロフィールとキャラ（1P/2P・オンラインの各参加者）ごとの computeStats の中で計算するので、プレイヤーごとに独立している */
function armorSkillPoints(items){
  const pts={};
  for(const it of items){
    const b=DATA.equipment[it.baseId];if(!b)continue;
    const sk=it.skills||b.skills; // 手紙は1枚ごとのスキル（it.skills）
    if(sk)for(const k in sk)if(DATA.armorSkills[k])pts[k]=(pts[k]||0)+sk[k];
    const en=it.enchant&&it.enchant.skills; // 付与のスキル
    if(en)for(const k in en)if(DATA.armorSkills[k])pts[k]=(pts[k]||0)+en[k];
  }
  return pts;
}
function armorSkillLevels(pts){
  const out=[];
  for(const k in pts){
    const d=DATA.armorSkills[k],per=d.per||CONFIG.skillPoints.per,max=d.max||1,p=Math.max(0,pts[k]);
    const level=Math.min(max,Math.floor(p/per));

  }

function applyArmorSkills(s,list){
  for(const x of list){if(x.level<=0)continue;const d=DATA.armorSkills[x.id];d.apply(s,d.vals[x.level-1],x.level);}

        const it=Items.createEquipment(id,0);
