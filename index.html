        Profile.addItem(p,it);
      }
      p.stoneGiven=true;changed=true;
    }
    if(!p.shurikenGiven){ // 鉄の手裏剣：石の武器をもらい済みのデータにも一度だけ渡す
      if(!p.items.some(i=>i.baseId==='iron_shuriken')){
        const it=Items.createEquipment('iron_shuriken',0);
        it.atk=DATA.equipment.iron_shuriken.atk;it.crit=DATA.equipment.iron_shuriken.crit;it.affixes=[];it.effects=[];it.slots=[];
        Profile.addItem(p,it);
      }
      p.shurikenGiven=true;changed=true;
    }
    return changed;
  },
  giveStarterWeapon(p,who){
    const sw=Items.createEquipment('iron_sword',0);
    sw.atk=10;sw.crit=5;sw.affixes=[];sw.effects=[];sw.slots=[];
    Profile.addItem(p,sw);charOf(p,who||0).equipped.weapon=sw.uid;
  },
  giveStarterCloth(p,who){
    const cloth=Items.createEquipment('cloth',0);
    cloth.def=3;cloth.affixes=[];cloth.effects=[];cloth.slots=[];
    Profile.addItem(p,cloth);charOf(p,who||0).equipped.body=cloth.uid;
  },
  /** そのアイテムを装備しているキャラ番号（0=1P,1=2P）。誰も装備していなければ -1 */
  equippedBy(p,uid){
    if(!uid)return -1;
    for(let who=0;who<CHAR_ALL;who++){const c=charOf(p,who);if(c&&SLOTS.some(s=>c.equipped[s]===uid))return who;}
    return -1;
  },
  addItem(p,it){it.uid='e'+(p.nextUid++);p.items.push(it);return it;},
  addDeco(p,d){d.uid='d'+(p.nextUid++);p.decos.push(d);return d;},
  getItem(p,uid){if(!uid)return null;for(const i of p.items)if(i.uid===uid)return i;return null;},
  getDeco(p,uid){if(!uid)return null;for(const d of p.decos)if(d.uid===uid)return d;return null;},
  /** スロット数を今のルール（装備ごとの slots）に合わせる。はみ出した装飾品は外れて手元に残る */
  fitSlots(it,used){
    const n=Items.maxSlots(it),keep=it.slots.filter(u=>u).slice(0,n);
    if(used)for(const u of it.slots)if(u&&!keep.includes(u))used.delete(u);
    it.slots=keep.concat(new Array(n-keep.length).fill(null));
  },
  decoOwner(p,uid){for(const i of p.items)if(i.slots.includes(uid))return i;return null;},
  isEquipped(p,uid){return Profile.equippedBy(p,uid)>=0;},
  removeItem(p,uid){
    for(let who=0;who<CHAR_ALL;who++){const eq=charOf(p,who).equipped;for(const s of SLOTS)if(eq[s]===uid)eq[s]=null;}
    p.items=p.items.filter(i=>i.uid!==uid);
  },
  attachDeco(p,itemUid,idx,decoUid){
    const it=Profile.getItem(p,itemUid);
    if(!it||idx<0||idx>=it.slots.length)return false;
    if(decoUid){
      if(!Profile.getDeco(p,decoUid))return false;
      const owner=Profile.decoOwner(p,decoUid);
      if(owner){const i=owner.slots.indexOf(decoUid);if(i>=0)owner.slots[i]=null;}
    }
    it.slots[idx]=decoUid||null;
    return true;
  },
  hasMats(p,cost){for(const k in cost)if((p.materials[k]||0)<cost[k])return false;return true;},
  spendMats(p,cost){for(const k in cost){p.materials[k]-=cost[k];if(p.materials[k]<=0)delete p.materials[k];}},
};

const Save={
  KEY:'kourou_dungeon_save',VERSION:16,
  available:true,
  save(p){
    if(!this.available)return false;
    try{
      localStorage.setItem(this.KEY,JSON.stringify({version:this.VERSION,savedAt:Date.now(),data:p}));
      return true;
    }catch(e){
      console.warn('セーブ失敗',e);
      UI.notify('セーブに失敗しました（ストレージ容量またはブラウザ設定を確認してください）','#ff6060',5);
      return false;
    }
  },
  load(){
    let raw=null;
    try{raw=localStorage.getItem(this.KEY);}
    catch(e){this.available=false;return {profile:Profile.create(),warning:'ブラウザのストレージにアクセスできないため、セーブは無効です。'};}
    if(!raw)return {profile:Profile.create(),fresh:true};
    try{
      const obj=JSON.parse(raw);
      if(!obj||typeof obj!=='object'||!obj.data||typeof obj.data!=='object')throw new Error('形式が不正です');
      const v=obj.version|0;
      if(v>this.VERSION)throw new Error('より新しいバージョンのセーブデータです');
      return {profile:this.sanitize(this.migrate(obj.data,v))};
    }catch(e){
      try{localStorage.setItem(this.KEY+'_backup',raw);}catch(_){}
      return {profile:Profile.create(),warning:'セーブデータの読み込みに失敗しました（'+e.message+'）。元データを「'+this.KEY+'_backup」に退避し、新しいデータで開始します。'};
    }
  },
  /** バージョン間の移行処理。仕様変更時は migrations[旧バージョン] を追加する */
  migrate(data,v){
    const migrations={
      15:d=>d, // 15 → 16：ペットの見た目（最高レア）を9種に作り直し（旧い見た目は外れる）
      14:d=>d, // 14 → 15：コイン・ペット・強化素材を追加（無ければ sanitize で0）
      13:d=>d, // 13 → 14：仲間（companions）を追加。無ければ sanitize で既定の役割と初期装備を支給
      0:d=>d, // version無しの旧形式 → 1
      1:d=>{d.p2=null;return d;}, // 1 → 2：2Pキャラを追加（sanitizeで初期装備を支給）
      2:d=>{d.guests={};return d;}, // 2 → 3：オンライン参加者のデータ置き場を追加
      3:d=>d, // 3 → 4：レベル・経験値を廃止（sanitize で読み捨てる）
      4:d=>{d.progress={stage:1,done:{}};d.gold=d.gold||0;return d;}, // 4 → 5：依頼の進行とゴールド
      5:d=>{delete d.guests;return d;}, // 5 → 6：オンラインは持ち寄り式に（ホストに預けていた参加者データは不要）
      6:d=>{d.bag={potion:d.potions|0};delete d.potions;return d;}, // 6 → 7：持ち物を複数種類に
      7:d=>{if(d.progress)d.progress.stage=(d.progress.stage|0)+1;return d;}, // 7 → 8：ステージ1に草原を追加（森林は2、墓地は3）
      8:d=>{if(d.progress&&(d.progress.stage|0)>=3)d.progress.stage+=1;return d;}, // 8 → 9：沼地を3番に追加（墓地は4番へ）
      9:d=>{if(d.progress&&(d.progress.stage|0)>=4)d.progress.stage+=1;return d;}, // 9 → 10：水辺を4番に追加（墓地は5番へ）
      10:d=>d, // 10 → 11：晶石の大洞窟を6番に追加
      11:d=>{if(d.progress){const st=d.progress.stage|0;if(st>=6)d.progress.stage=8;else if(st===5)d.progress.stage=5;}return d;}, // 11 → 12：晶石の大洞窟を5番、火山を6番、氷雪を7番、墓地を8番へ
      12:d=>{for(const it of (d.items||[]))if(it&&typeof it.baseId==='string')it.baseId=it.baseId.replace(/_whip$/,'_lance');return d;}, // 12 → 13：鞭をランスに置き換え（持っている鞭はランスに）
    };
    while(v<this.VERSION){if(migrations[v])data=migrations[v](data);v++;}
    return data;
  },
  /** 読み込んだデータを検証し、不正な値を補正する */
  sanitize(d){
    const p=Profile.blank();
    p.bag=emptyBag();
    p.stoneGiven=!!d.stoneGiven;p.shurikenGiven=!!d.shurikenGiven;
    p.shopOnce=(d.shopOnce&&typeof d.shopOnce==='object')?Object.assign({},d.shopOnce):{};
    const legacySwords=d.swordDedup===undefined; // 古いデータだけ、増えた鉄の剣の掃除を1度やる（以降は外した剣を消さない）
    p.swordDedup=true;
    const srcBag=(d.bag&&typeof d.bag==='object')?d.bag:{potion:d.potions|0};
    for(const id of ITEM_ORDER)p.bag[id]=clamp(srcBag[id]|0,0,DATA.consumables[id].max);
    p.gold=Math.max(0,d.gold|0);
    if(d.progress&&typeof d.progress==='object'){
      p.progress.stage=clamp(d.progress.stage|0||1,1,maxStageId());
      if(d.progress.done&&typeof d.progress.done==='object')for(const id in d.progress.done)if(DATA.quests.some(q=>q.id===id))p.progress.done[id]=Math.max(0,d.progress.done[id]|0);
    }
    if(d.settings&&typeof d.settings==='object')for(const k in p.settings){
      if(typeof p.settings[k]==='boolean'&&typeof d.settings[k]==='boolean')p.settings[k]=d.settings[k];
      else if(typeof p.settings[k]==='number'&&typeof d.settings[k]==='number'&&isFinite(d.settings[k])){
        const rg=k==='hudScale'?[CONFIG.hud.min,CONFIG.hud.max]:k==='touchSize'?[0.6,1.5]:k==='mapZoom'?[0.7,1.6]:[0,1]; // 音量は 0〜1
        p.settings[k]=clamp(d.settings[k],rg[0],rg[1]);
      }
    }
    if(d.bestiary&&typeof d.bestiary==='object')for(const k in d.bestiary){const n=d.bestiary[k]|0;if(DATA.enemies[k]&&n>0)p.bestiary[k]=Math.min(n,9999999);}
    if(d.stats&&typeof d.stats==='object')for(const k in p.stats)p.stats[k]=Math.max(0,d.stats[k]|0);
    if(d.materials&&typeof d.materials==='object')for(const k in d.materials){const n=d.materials[k]|0;if(DATA.materials[k]&&n>0)p.materials[k]=n;}
    if(d.matSeen&&typeof d.matSeen==='object'){p.matSeen=p.matSeen||{};for(const k in d.matSeen)if(DATA.materials[k])p.matSeen[k]=1;}
    const decoIds=new Set(),uidNums=[];
    const noteUid=u=>{const n=parseInt(String(u).slice(1),10);if(!isNaN(n))uidNums.push(n);};
    if(Array.isArray(d.decos))for(const x of d.decos){
      if(!x||!DATA.decorations[x.decoId]||typeof x.uid!=='string'||decoIds.has(x.uid))continue;
      p.decos.push({kind:'deco',uid:x.uid,decoId:x.decoId,rarity:clamp(x.rarity|0,0,4)});decoIds.add(x.uid);noteUid(x.uid);
    }
    const itemIds=new Set(),usedDecos=new Set();
    if(Array.isArray(d.items))for(const x of d.items){
      if(!x||!DATA.equipment[x.baseId]||typeof x.uid!=='string'||itemIds.has(x.uid))continue;
      const base=DATA.equipment[x.baseId];
      const it={kind:'equip',uid:x.uid,baseId:x.baseId,slot:base.slot,rarity:base.slot==='charm'?clamp(x.rarity|0,0,4):0,
        atk:Math.max(0,Number(x.atk)||0),def:Math.max(0,Number(x.def)||0),crit:Math.max(0,Number(x.crit)||0),reinforce:clamp(x.reinforce|0,0,5),
        affixes:Array.isArray(x.affixes)?x.affixes.filter(a=>a&&DATA.affixes[a.id]&&typeof a.v==='number').map(a=>({id:a.id,v:a.v})):[],
        effects:Array.isArray(x.effects)?x.effects.filter(e=>DATA.effects[e]):[],
        slots:Array.isArray(x.slots)?x.slots.slice(0,3).map(u=>{if(u&&decoIds.has(u)&&!usedDecos.has(u)){usedDecos.add(u);return u;}return null;}):[]};
      if(base.slot==='charm'){it.skills={};if(x.skills&&typeof x.skills==='object')for(const k in x.skills)if(DATA.armorSkills[k])it.skills[k]=clamp(x.skills[k]|0,1,15);it.def=0;}
      if(base.slot!=='charm'&&base.slot!=='weapon'&&x.enchant&&typeof x.enchant==='object'){const sk={};if(x.enchant.skills&&typeof x.enchant.skills==='object')for(const k in x.enchant.skills)if(DATA.armorSkills[k])sk[k]=clamp(x.enchant.skills[k]|0,1,15);if(Object.keys(sk).length)it.enchant={t:clamp(x.enchant.t|0,1,3),skills:sk};}
      Profile.fitSlots(it,usedDecos);
      p.items.push(it);itemIds.add(it.uid);noteUid(it.uid);
    }
    p.nextUid=Math.max(d.nextUid|0,uidNums.length?Math.max(...uidNums)+1:1,1);
    // 仲間：役割（ヒーラー・タンク・アタッカーから2つ、重複なし）と装備を読み込む。古いデータには初期装備を一度だけ渡す
    const cmpSrc=Array.isArray(d.companions)?d.companions:[];
    const roles=Companion.normalizeRoles(cmpSrc);
    p.companions=roles.map(role=>({role,equipped:emptyEquip()}));
    p.compGiven=!!d.compGiven;
    for(let i=0;i<COMP_COUNT;i++)charOf(p,CHAR_COUNT+i).costume=costumeOf(cmpSrc[i]&&cmpSrc[i].costume);
    for(let i=0;i<COMP_COUNT;i++){
      const eq=charOf(p,CHAR_COUNT+i).equipped,src=cmpSrc[i]&&cmpSrc[i].equipped;
      if(src&&typeof src==='object')for(const s of SLOTS){
        const it=Profile.getItem(p,src[s]);
        eq[s]=(it&&it.slot===s&&!Profile.isEquipped(p,it.uid))?it.uid:null;
      }
    }
    const p2src=(d.p2&&typeof d.p2==='object')?d.p2:null;
    const srcEquip=[d.equipped,p2src?p2src.equipped:null];
    const srcCos=[d.costume,p2src?p2src.costume:null];
    for(let who=0;who<CHAR_COUNT;who++)charOf(p,who).costume=costumeOf(srcCos[who]);
    for(let who=0;who<CHAR_COUNT;who++){
      const eq=charOf(p,who).equipped,src=srcEquip[who];
      if(src&&typeof src==='object')for(const s of SLOTS){
        const it=Profile.getItem(p,src[s]);
        // 同じアイテムを2人が同時に装備しないよう、先に装備している方を優先
        eq[s]=(it&&it.slot===s&&!Profile.isEquipped(p,it.uid))?it.uid:null;
      }
      if(!eq.weapon){
        const w=p.items.find(i=>i.slot==='weapon'&&!Profile.isEquipped(p,i.uid));
        if(w)eq.weapon=w.uid;
        else{if(who===0)Profile.giveStarterWeapon(p,who);if(!p2src&&who===1)Profile.giveStarterCloth(p,who);}
      }
    }
    // 石の剣は最初に装備している1本だけ。古いデータで増えた余分な石の剣（持ち物に残っているもの）は取り除く
    if(legacySwords)p.items=p.items.filter(i=>!(i.baseId==='iron_sword'&&Profile.equippedBy(p,i.uid)<0));
    if(p.p2&&p.p2.equipped&&!Profile.getItem(p,p.p2.equipped.weapon))p.p2.equipped.weapon=null;
    Profile.grantCompanionStarter(p);
    // コイン・ペット
    p.coins=Math.max(0,d.coins|0);p.petEssence=Math.max(0,d.petEssence|0);p.coinGiftGiven=!!d.coinGiftGiven;
    if(d.giftsGot&&typeof d.giftsGot==='object')for(const k in d.giftsGot)if(d.giftsGot[k])p.giftsGot[k]=true;
    p.pets={};
    if(d.pets&&typeof d.pets==='object')for(const id in d.pets)if(PETS.some(x=>x.id===id))p.pets[id]={level:clamp((d.pets[id]&&d.pets[id].level)|0,1,PET_MAX)};
    const eqPet=d.equipped&&d.equipped.pet;
    p.equipped.pet=(eqPet&&p.pets[eqPet])?eqPet:null;
    p.looks={};
    if(d.looks&&typeof d.looks==='object')for(const id in d.looks){
      if(!LOOKS.some(x=>x.id===id))continue;
      const v=d.looks[id];
      // 旧データは true（基本色のみ）。新しいデータは持っている色の番号の配列
      const arr=v===true?[0]:Array.isArray(v)?[...new Set(v.map(x=>x|0))].filter(x=>x>=0&&x<LOOK_VARIANTS.length).sort():[];
      if(arr.length)p.looks[id]=arr;
    }
    p.gachaN=Math.max(0,d.gachaN|0);
    const lk=d.equipped&&d.equipped.look,lv=(d.equipped&&d.equipped.lookV)|0;
    const owned=lk?(p.looks[lk]||[]):[];
    p.equipped.look=owned.length?lk:null;
    p.equipped.lookV=p.equipped.look?(owned.includes(lv)?lv:owned[0]):0;
    return p;
  },
  reset(){try{localStorage.removeItem(this.KEY);}catch(e){}},
};

/* ===================== 5. ワールド（ゲームロジック） ===================== */
function isWall(map,tx,ty){if(tx<0||ty<0||tx>=map.W||ty>=map.H)return true;const v=map.tiles[ty*map.W+tx];return v!==0&&v!==TILE_PUDDLE;}
function circleHitsWall(map,x,y,r){
  const x0=Math.floor((x-r)/TILE),x1=Math.floor((x+r)/TILE),y0=Math.floor((y-r)/TILE),y1=Math.floor((y+r)/TILE);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    if(!isWall(map,tx,ty))continue;
    const cx=clamp(x,tx*TILE,tx*TILE+TILE),cy=clamp(y,ty*TILE,ty*TILE+TILE);
    const dx=x-cx,dy=y-cy;
    if(dx*dx+dy*dy<r*r-0.01)return true;
  }
  return false;
}
/** 壁と衝突しながら移動（軸ごとに判定して壁沿いに滑る）。ぶつかったら true */
/** スタート部屋：敵（プレイヤー以外）は入れない。プレイヤーは入れる */
function inStartRoom(map,x,y,r){
  const R=map.rooms&&map.rooms.start;if(!R)return false;
  const x0=Math.floor((x-r)/TILE),x1=Math.floor((x+r)/TILE),y0=Math.floor((y-r)/TILE),y1=Math.floor((y+r)/TILE);
  return x1>=R[0]&&x0<=R[2]&&y1>=R[1]&&y0<=R[3];
}
/** そのエンティティがここへは進めないか（壁、または敵にとってのスタート部屋） */
function cannotEnter(map,e,x,y){
  if(circleHitsWall(map,x,y,e.r))return true;
  if(e.type!=='player')return inStartRoom(map,x,y,e.r); // 敵はスタート部屋に入れない
  // 最初の部屋から出たあとは、プレイヤーも外から部屋へは戻れない（中で動くのは自由）
  return !!map.startLocked&&inStartRoom(map,x,y,e.r)&&!inStartRoom(map,e.x,e.y,e.r);
}
function moveEntity(map,e,dx,dy){
  let blocked=false;
  const maxStep=Math.max(2,e.r*0.5);
  const steps=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/maxStep));
  const sx=dx/steps,sy=dy/steps;
  for(let i=0;i<steps;i++){
    if(sx!==0){
      if(!cannotEnter(map,e,e.x+sx,e.y))e.x+=sx;
      else if(!(sy===0&&cornerNudge(map,e,sx,0)))blocked=true;
    }
    if(sy!==0){
      if(!cannotEnter(map,e,e.x,e.y+sy))e.y+=sy;
      else if(!(sx===0&&cornerNudge(map,e,0,sy)))blocked=true;
    }
  }
  return blocked;
}
/** 角の補正：まっすぐ進もうとして壁の角にわずかに引っかかったとき、
    少しだけ横にずらせば通れるなら、横へ滑らせて角を回り込ませる */
function cornerNudge(map,e,sx,sy){
  const maxN=Math.ceil(e.r*0.65),step=Math.max(Math.abs(sx),Math.abs(sy));
  for(let n=1;n<=maxN;n++){
    for(const s of [-1,1]){
      const nx=sy!==0?s*n:0,ny=sx!==0?s*n:0;
      if(!cannotEnter(map,e,e.x+sx+nx,e.y+sy+ny)){
        const mv=Math.min(step,n);
        const ox=Math.sign(nx)*mv,oy=Math.sign(ny)*mv;
        if(!cannotEnter(map,e,e.x+ox,e.y+oy)){e.x+=ox;e.y+=oy;return true;}
      }
    }
  }
  return false;
}
/** 視界をさえぎるのは壁（1）と閉じた扉（3）だけ。木・岩・柱・墓石・木箱の向こうは見える（描画の視野用） */
function blocksSight(map,tx,ty){if(tx<0||ty<0||tx>=map.W||ty>=map.H)return true;const v=map.tiles[ty*map.W+tx];return v===1||v===3;}
function sightLine(map,x0,y0,x1,y1){
  const dx=x1-x0,dy=y1-y0,n=Math.ceil(Math.hypot(dx,dy)/8);
  for(let i=1;i<n;i++){const t=i/n;if(blocksSight(map,Math.floor((x0+dx*t)/TILE),Math.floor((y0+dy*t)/TILE)))return false;}
  return true;
}
function lineOfSight(map,x0,y0,x1,y1){
  const dx=x1-x0,dy=y1-y0,n=Math.ceil(Math.hypot(dx,dy)/8);
  for(let i=1;i<n;i++){const t=i/n;if(isWall(map,Math.floor((x0+dx*t)/TILE),Math.floor((y0+dy*t)/TILE)))return false;}
  return true;
}
function reachableCount(map,sx,sy){
  const seen=new Uint8Array(map.W*map.H),q=[sy*map.W+sx];seen[q[0]]=1;let n=0;
  while(q.length){
    const i=q.pop();n++;
    const x=i%map.W,y=(i/map.W)|0;
    for(const [nx,ny] of [[x+1,y],[x-1,y],[x,y+1],[x,y-1]]){
      if(isWall(map,nx,ny))continue;const j=ny*map.W+nx;if(seen[j])continue;seen[j]=1;q.push(j);
    }
  }
  return n;
}

/** ダンジョン生成：部屋と通路は固定レイアウト（確実に攻略可能）、木箱と敵・宝箱の配置は毎回変化 */
function buildDungeon(){
  const W=90,H=40;
  const map={W,H,tiles:new Uint8Array(W*H).fill(1),version:1,rooms:{},doorTiles:[[59,17],[59,18],[59,19]],doorClosed:false};
  const set=(x,y,v)=>{if(x>=0&&y>=0&&x<W&&y<H)map.tiles[y*W+x]=v;};
  const rect=(x1,y1,x2,y2,v)=>{for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)set(x,y,v);};
  const hc=(y,x1,x2)=>rect(Math.min(x1,x2),y-1,Math.max(x1,x2),y+1,0);
  const vc=(x,y1,y2)=>rect(x-1,Math.min(y1,y2),x+1,Math.max(y1,y2),0);
  map.rooms={start:[2,13,13,23],north:[20,3,33,15],south:[20,21,33,33],hub:[40,11,53,25],boss:[61,6,86,32]};
  for(const k in map.rooms){const r=map.rooms[k];rect(r[0],r[1],r[2],r[3],0);}
  hc(18,7,17);vc(17,9,27);hc(9,17,26);hc(27,17,26);hc(9,26,37);hc(27,26,37);vc(37,9,27);hc(18,37,62);
  // 柱（固定の障害物）
  for(const [x,y] of [[43,14],[49,14],[43,21],[49,21],[66,10],[80,10],[66,27],[80,27],[29,12],[22,30],[30,23]])rect(x,y,x+1,y+1,1);
  // 木箱（ランダムな障害物）。通路を塞がないよう到達可能性を検証
  let floor=reachableCount(map,6,18);
  for(const k of ['north','south','hub']){
    const r=map.rooms[k];let placed=0;
    for(let tries=0;tries<40&&placed<randInt(2,4);tries++){
      const x=randInt(r[0]+2,r[2]-2),y=randInt(r[1]+2,r[3]-2);
      let ok=true;
      for(let yy=y-1;yy<=y+1&&ok;yy++)for(let xx=x-1;xx<=x+1;xx++)if(isWall(map,xx,yy)){ok=false;break;}
      if(!ok)continue;
      set(x,y,2);
      const n=reachableCount(map,6,18);
      if(n===floor-1){floor=n;placed++;}else set(x,y,0);
    }
  }
  return map;
}
function randomFloor(map,room,margin){
  for(let i=0;i<80;i++){
    const tx=randInt(room[0]+margin,room[2]-margin),ty=randInt(room[1]+margin,room[3]-margin);
    const x=(tx+0.5)*TILE,y=(ty+0.5)*TILE;
    if(!circleHitsWall(map,x,y,18))return {x:x+rand(-5,5),y:y+rand(-5,5)};
  }
  return null;
}

/* ---------- ステージ用のマップ生成（部屋を毎回組み合わせてつなぐ） ----------
   4列×3段のマス目に部屋を置き、左端のスタートから右端のボス部屋まで必ず1本の道を通す。
   道から外れた寄り道の部屋（行き止まり）や、道の部屋どうしをつなぐ近道もランダムに作る。
   ボス部屋への入口は1か所だけ（全員が入ると閉じる扉）。 */
const MAPGEN={cellW:22,cellH:14,cols:6,rows:4,bossW:40,bossH:34}; // bossW・bossH：ボス部屋の広さ（マス）
// 障害物のタイル番号（どれも壁と同じく通れない・視線や矢を遮る）
const TILE_OBS={tree:4,rock:5,pillar:6,tomb:7};
// 水溜まり（通れるが、踏むと移動が遅くなる）。layouts の puddle:[最少,最多] で部屋ごとに置く
const TILE_PUDDLE=8,PUDDLE_SLOW=0.7;
// ステージ別の見た目（layouts の theme）。wall：壁の描き方、speck：床の模様
const THEME_PAL={
  meadow:{wall:'blob',base:'#2c5626',blobs:['#3c7434','#4a8640','#25491f'],lip:'#4a3a22',lipDark:'#2f2514',floor:['#6fa84c','#7ab356'],speck:'flower'},
  swamp:{wall:'block',base:'#2d3a2a',blobs:['#3a4c35','#48603f'],mortar:'#222c1f',moss:'#5f8a45',lip:'#2a2a16',lipDark:'#181a0c',floor:['#4c4a2c','#55522f'],speck:'mud'},
  river:{wall:'block',base:'#33475c',blobs:['#44607a','#3b5470'],mortar:'#25364a',lip:'#2b3e52',lipDark:'#17232f',floor:['#6f8f9a','#78969f'],speck:'pebble'},
  crystal:{wall:'crystal',base:'#241c40',blobs:['#33285a','#2c2350'],glow:'#8ae6ff',lip:'#3a2e66',lipDark:'#1a1430',floor:['#241c3c','#2a2146'],speck:'sparkle'},
  volcano:{wall:'basalt',base:'#1c1614',blobs:['#2b211d','#32261f'],glow:'#ff6a2a',lip:'#3a1a10',lipDark:'#160a06',floor:['#3a2a26','#41302a'],speck:'lava'},
  snow:{wall:'ice',base:'#9cc4da',blobs:['#b6daee','#8fb8d0'],lip:'#7fa6bd',lipDark:'#4f7790',floor:['#e6f0f7','#dce8f1'],speck:'frost'},
};
function buildStageMap(L){
  const G=MAPGEN,W=1+G.cols*G.cellW+G.bossW+1,H=1+G.rows*G.cellH+1;
  const map={W,H,tiles:new Uint8Array(W*H).fill(1),version:1,rooms:{},roomList:[],theme:L.theme,doorTiles:[],doorClosed:false,corridors:[],gatherSpots:[]};
  const set=(x,y,v)=>{if(x>0&&y>0&&x<W-1&&y<H-1)map.tiles[y*W+x]=v;};
  const rect=(x1,y1,x2,y2,v)=>{for(let y=y1;y<=y2;y++)for(let x=x1;x<=x2;x++)set(x,y,v);};
  const hc=(y,x1,x2)=>rect(Math.min(x1,x2),y-1,Math.max(x1,x2),y+1,0);
  const vc=(x,y1,y2)=>rect(x-1,Math.min(y1,y2),x+1,Math.max(y1,y2),0);
  // 1) スタートから右へ進む道。2列目以降は、同じ列で上下に1回ずれることもある
  const key=(c,r)=>c*10+r,nodes=new Map(),links=[];
  let c=0,r=randInt(0,G.rows-1),vert=0;
  const path=[{c,r}];nodes.set(key(c,r),{c,r,kind:'start'});
  for(;;){
    const opts=[],atEnd=c===G.cols-1;
    if(c>=1&&vert===0)for(const dr of [-1,1]){const nr=r+dr;if(nr>=0&&nr<G.rows&&!nodes.has(key(c,nr)))opts.push({c,r:nr});}
    let nx=null;
    if(opts.length&&RNG.next()<(atEnd?0.35:0.45)){nx=pick(opts);vert++;}
    else if(!atEnd){nx={c:c+1,r};vert=0;}
    if(!nx)break;
    links.push([key(c,r),key(nx.c,nx.r)]);
    c=nx.c;r=nx.r;path.push(nx);nodes.set(key(c,r),{c,r,kind:'main'});
  }
  // 2) 寄り道の部屋（行き止まり）
  const sideWant=randInt(3,5);let sides=0;
  for(const n of shuffle(path.slice(1))){
    if(sides>=sideWant)break;
    const cand=[[1,0],[-1,0],[0,1],[0,-1]].map(([dc,dr])=>({c:n.c+dc,r:n.r+dr}))
      .filter(q=>q.c>=0&&q.c<G.cols&&q.r>=0&&q.r<G.rows&&!nodes.has(key(q.c,q.r)));
    if(!cand.length)continue;
    const s=pick(cand);nodes.set(key(s.c,s.r),{c:s.c,r:s.r,kind:'side'});links.push([key(n.c,n.r),key(s.c,s.r)]);sides++;
  }
  // 3) 近道：となり合う道の部屋どうしを、ときどき余分につなぐ（寄り道の部屋は行き止まりのまま）
  const linked=(a,b)=>links.some(([x,y])=>(x===a&&y===b)||(x===b&&y===a));
  for(const a of nodes.values())for(const b of nodes.values()){
    const ka=key(a.c,a.r),kb=key(b.c,b.r);
    if(a.kind==='side'||b.kind==='side'||ka>=kb||Math.abs(a.c-b.c)+Math.abs(a.r-b.r)!==1||linked(ka,kb))continue;
    if(RNG.next()<0.45)links.push([ka,kb]);
  }
  // 4) 部屋の大きさと位置（マス目の中でずらす）
  for(const n of nodes.values()){
    const ox=1+n.c*G.cellW,oy=1+n.r*G.cellH,st=n.kind==='start';
    const w=st?randInt(9,11):randInt(12,G.cellW-4),hh=st?randInt(8,9):randInt(8,G.cellH-3);
    const x1=ox+randInt(1,G.cellW-w-2),y1=oy+randInt(1,G.cellH-hh-1);
    n.rect=[x1,y1,x1+w-1,y1+hh-1];rect(n.rect[0],n.rect[1],n.rect[2],n.rect[3],0);
  }
  const bx1=1+G.cols*G.cellW+3,bx2=W-3,by1=Math.floor(H/2)-Math.floor(G.bossH/2),by2=by1+G.bossH;
  rect(bx1,by1,bx2,by2,0);
  // 5) 通路（幅3マス）。重なりがあればまっすぐ、無ければL字に曲げる
  // 道の太さは2〜4マスでばらつかせる（wd＝中心線から上下・左右にどれだけ広がるか）
  const cw=()=>{const u=RNG.next();return u<0.3?[0,1]:u<0.85?[1,1]:[1,2];};
  const hc2=(y,x1,x2,wd)=>rect(Math.min(x1,x2),y-wd[0],Math.max(x1,x2),y+wd[1],0);
  const vc2=(x,y1,y2,wd)=>rect(x-wd[0],Math.min(y1,y2),x+wd[1],Math.max(y1,y2),0);
  const connect=(A,B)=>{
    if(A.c>B.c||A.r>B.r)[A,B]=[B,A];
    const a=A.rect,b=B.rect,wd=cw();
    // ときどき道の途中に、少し開けた広場
    const plaza=(x,y)=>{if(RNG.next()<0.12)rect(x-2,y-2,x+2,y+2,0);};
    if(A.r===B.r){
      const lo=Math.max(a[1],b[1])+1,hi=Math.min(a[3],b[3])-1,gap=b[0]-a[2];
      if(hi>=lo&&gap>=8&&hi-lo>=2&&RNG.next()<0.3){ // 横につながる道を一度ジグザグに曲げる
        const y1=randInt(lo,hi),y2=randInt(lo,hi),mx=randInt(a[2]+3,b[0]-3),my=Math.round((y1+y2)/2);
        hc2(y1,a[2],mx,wd);vc2(mx,y1,y2,wd);hc2(y2,mx,b[0],wd);map.corridors.push({x:mx,y:my});plaza(mx,my);
      }else if(hi>=lo){const y=randInt(lo,hi),mx=Math.round((a[2]+b[0])/2);hc2(y,a[2],b[0],wd);map.corridors.push({x:mx,y});plaza(mx,y);}
      else{const mx=Math.floor((a[2]+b[0])/2),ya=randInt(a[1]+1,a[3]-1),yb=randInt(b[1]+1,b[3]-1);hc2(ya,a[2],mx,wd);vc2(mx,ya,yb,wd);hc2(yb,mx,b[0],wd);map.corridors.push({x:mx,y:Math.round((ya+yb)/2)});}
    }else{
      const lo=Math.max(a[0],b[0])+1,hi=Math.min(a[2],b[2])-1,gap=b[1]-a[3];
      if(hi>=lo&&gap>=8&&hi-lo>=2&&RNG.next()<0.3){ // 縦につながる道を一度ジグザグに曲げる
        const x1=randInt(lo,hi),x2=randInt(lo,hi),my=randInt(a[3]+3,b[1]-3),mx=Math.round((x1+x2)/2);
        vc2(x1,a[3],my,wd);hc2(my,x1,x2,wd);vc2(x2,my,b[1],wd);map.corridors.push({x:mx,y:my});plaza(mx,my);
      }else if(hi>=lo){const x=randInt(lo,hi),my=Math.round((a[3]+b[1])/2);vc2(x,a[3],b[1],wd);map.corridors.push({x,y:my});plaza(x,my);}
      else{const my=Math.floor((a[3]+b[1])/2),xa=randInt(a[0]+1,a[2]-1),xb=randInt(b[0]+1,b[2]-1);vc2(xa,a[3],my,wd);hc2(my,xa,xb,wd);vc2(xb,my,b[1],wd);map.corridors.push({x:Math.round((xa+xb)/2),y:my});}
    }
  };
  for(const [ka,kb] of links)connect(nodes.get(ka),nodes.get(kb));
  // ボス部屋への入口（道の最後の部屋から）。扉のタイルを記録する
  const last=nodes.get(key(path[path.length-1].c,path[path.length-1].r)),a=last.rect,dy=randInt(by1+4,by2-4);
  if(dy-1>=a[1]&&dy+1<=a[3])hc(dy,a[2],bx1);
  else{const mx=bx1-3,ya=randInt(a[1]+1,a[3]-1);hc(ya,a[2],mx);vc(mx,ya,dy);hc(dy,mx,bx1);}
  map.doorTiles=[[bx1-1,dy-1],[bx1-1,dy],[bx1-1,dy+1]];
  // 6) 部屋の種類を割り当てる
  const mains=shuffle(L.main.slice()),sideDefs=shuffle(L.side.slice());let mi=0,si=0;
  for(const n of nodes.values()){
    const def=n.kind==='start'?L.start:n.kind==='side'?(si<sideDefs.length?sideDefs[si++]:mains[mi++%mains.length]):mains[mi++%mains.length];
    map.roomList.push({kind:n.kind,def,rect:n.rect});
  }
  const bossRect=[bx1,by1,bx2,by2];
  map.roomList.push({kind:'boss',def:L.boss,rect:bossRect});
  const sr=nodes.get(key(path[0].c,path[0].r)).rect;
  map.rooms={start:sr,boss:bossRect};
  map.start={x:((sr[0]+sr[2])/2+0.5)*TILE,y:((sr[1]+sr[3])/2+0.5)*TILE};
  map.bossX1=bx1;map.bossSpot={x:((bx1+bx2)/2+0.5)*TILE,y:((by1+by2)/2+0.5)*TILE};
  // 7) 障害物（木・岩・柱・墓石）。道をふさがないよう、置くたびにスタートからの到達範囲を確かめる
  const sx=Math.floor((sr[0]+sr[2])/2),sy=Math.floor((sr[1]+sr[3])/2);
  let floor=reachableCount(map,sx,sy);
  const tryPlace=(cells,v)=>{
    const inCells=(x,y)=>cells.some(q=>q[0]===x&&q[1]===y);
    for(const [x,y] of cells)for(let ddy=-2;ddy<=2;ddy++)for(let ddx=-2;ddx<=2;ddx++){
      const xx=x+ddx,yy=y+ddy;if(!inCells(xx,yy)&&isWall(map,xx,yy))return false;if(isWall(map,x,y))return false;}
    for(const [x,y] of cells)map.tiles[y*W+x]=v;
    const n=reachableCount(map,sx,sy);
    if(n===floor-cells.length){floor=n;return true;}
    for(const [x,y] of cells)map.tiles[y*W+x]=0;
    return false;
  };
  for(const rm of map.roomList){
    if(rm.kind==='start')continue; // スタート地点には置かない（全員が出現する場所）
    const R=rm.rect,style=rm.def.obstacle||L.obstacle,boss=rm.kind==='boss',few=false;
    const rx=()=>randInt(R[0]+2,R[2]-2),ry=()=>randInt(R[1]+2,R[3]-2);
    if(style==='tombs'&&!boss){
      const rows=randInt(1,2);
      for(let k=0;k<rows;k++){const y=ry();for(let x=R[0]+2+randInt(0,1);x<=R[2]-2;x+=3)if(RNG.next()<0.8)tryPlace([[x,y]],TILE_OBS.tomb);}
      continue;
    }
    if(style==='pillars'){
      const want=boss?4:few?1:randInt(2,3);
      if(boss){ // ボス部屋は四隅寄りに柱を立てる（突進がぶつかる）
        const cx1=R[0]+5,cx2=R[2]-6,cy1=R[1]+5,cy2=R[3]-6;
        for(const [x,y] of [[cx1,cy1],[cx2,cy1],[cx1,cy2],[cx2,cy2]])tryPlace([[x,y],[x+1,y],[x,y+1],[x+1,y+1]],TILE_OBS.pillar);
      }else for(let t=0,n=0;t<30&&n<want;t++){const x=rx(),y=ry();if(x+1>R[2]-2||y+1>R[3]-2)continue;if(tryPlace([[x,y],[x+1,y],[x,y+1],[x+1,y+1]],TILE_OBS.pillar))n++;}
      continue;
    }
    const v=style==='rocks'?TILE_OBS.rock:TILE_OBS.tree;
    const want=boss?4:few?2:randInt(3,6);
    if(boss){
      const cx1=R[0]+5,cx2=R[2]-5,cy1=R[1]+5,cy2=R[3]-5;
      for(const [x,y] of [[cx1,cy1],[cx2,cy1],[cx1,cy2],[cx2,cy2]])tryPlace([[x,y]],v);
    }else for(let t=0,n=0;t<40&&n<want;t++)if(tryPlace([[rx(),ry()]],v))n++;
  }
  // 7b) 水溜まり（道はふさがない。スタートとボス部屋以外の部屋に、小さな池をいくつか置く）
  if(L.puddle){
    for(const rm of map.roomList){
      if(rm.kind!=='main'&&rm.kind!=='side')continue;
      const n=randInt(L.puddle[0],L.puddle[1]);
      for(let i=0;i<n;i++){
        const p=randomFloor(map,rm.rect,3);if(!p)continue;
        const cx=Math.floor(p.x/TILE),cy=Math.floor(p.y/TILE),sz=randInt(2,3);
        for(let dy=0;dy<sz;dy++)for(let dx=0;dx<sz;dx++){
          const x=cx+dx,y=cy+dy;
          if(x<=0||y<=0||x>=W-1||y>=H-1||map.tiles[y*W+x]!==0)continue;
          if(dx===sz-1&&dy===sz-1&&RNG.next()<0.5)continue; // 角は欠けることがある（まるい池に見せる）
          map.tiles[y*W+x]=TILE_PUDDLE;
        }
      }
    }
  }
  // 8) 採取ポイント
  for(const rm of map.roomList){
    if(!rm.def.gather)continue;
    const n=randInt(rm.def.gather[0],rm.def.gather[1]);
    for(let i=0;i<n;i++){const p=randomFloor(map,rm.rect,2);if(p)map.gatherSpots.push({x:p.x,y:p.y,kind:pick(['wood','herb','mush'])});}
    if(rm.def.ore){ // 鉱石の採取ポイント（蒼晶鉱・黒鉄鉱のどちらか）を、普通の採取とは別に置く
      const k=randInt(rm.def.ore[0],rm.def.ore[1]);
      for(let i=0;i<k;i++){const p=randomFloor(map,rm.rect,2);if(p)map.gatherSpots.push({x:p.x,y:p.y,kind:pick(['ore_a','ore_b'])});}
    }
  }
  return map;
}
function emit(w,ev){w.events.push(ev);}

function questById(id){if(id==='training')return TRAINING_QUEST;return DATA.quests.find(q=>q.id===id)||DATA.quests[0];}
/* 訓練場：ステージ1の草原で、倒れないカカシと戦う。報酬なし・時間制限なし。持ち物は一時的なもの、装備は出るときに戻す */
const TRAINING_QUEST={id:'training',stage:1,explore:true,training:true,boss:'scarecrow',name:'訓練場',desc:'倒れないカカシで装備と技を試せる。報酬はなし。',goal:{type:'explore'},reward:{}};
DATA.enemies.scarecrow={name:'カカシ',ai:'pattern',look:'scarecrow',hp:50000,atk:14,def:2,r:34,speed:80,color:'#c8a060',boss:true,stunMax:0,stunTime:0,pattern:DATA.enemies.hermit_crab.pattern};
const TRAIN_TICK_SEC=5;
function trainBag(){const b=emptyBag();for(const id of ITEM_ORDER)b[id]=99;return b;}
/* 訓練場の毎ステップ処理：カカシは倒れず与ダメージを数える。プレイヤーは倒れても、その場で立て直す */
function trainingTick(w,dt){
  for(const e of w.enemies)if(e.type==='scarecrow'){
    w.trainDmg=(w.trainDmg||0)+Math.max(0,e.maxHp-e.hp);e.hp=e.maxHp;e.dead=false;
    const prev=Math.floor((w.time-dt)/TRAIN_TICK_SEC),now=Math.floor(w.time/TRAIN_TICK_SEC);
    if(now!==prev)emit(w,{type:'status',x:e.x,y:e.y-e.r-30,text:'合計 '+(w.trainDmg||0),color:'#ffd23a'});
  }
  for(const id in w.players){const q=w.players[id];if(q.ai)continue;
    if(q.dead){q.dead=false;q.out=false;q.downT=0;q.revive=0;}
    if(q.hp<=1)q.hp=q.stats.maxHp;
  }
}
function stageById(id){return DATA.stages.find(s=>s.id===id)||DATA.stages[0];}
function maxStageId(){return Math.max(...DATA.stages.map(s=>s.id));}
/** ステージに出てくる魔物（ボスを除く）の一覧 */
function stageRoster(stage){
  const L=stage.layout&&DATA.layouts[stage.layout];
  if(!L)return [stage.enemySet.melee,stage.enemySet.ranged];
  const out=[];
  for(const rm of [...L.main,...L.side,L.boss])for(const [t] of (rm.spawn||[]))if(!out.includes(t))out.push(t);
  for(const t of L.wander||[])if(!out.includes(t))out.push(t);
  return out;
}
/** 人数に応じた依頼の目標数（討伐依頼だけ人数で増える） */
/** 討伐依頼の対象をまとめたもの（例：キノコか虫）。単独の魔物の種類ではなく、いくつかの種類を数える */
const QUEST_GROUPS={mushbug:{name:'キノコか虫',types:['mushroom','beetle']}};
function questTypeMatch(g,t){if(g.target==='any')return true;const grp=QUEST_GROUPS[g.target];return grp?grp.types.includes(t):g.target===t;}
function questNeed(g,np){
  if(g.type!=='kill')return g.count;
  return Math.round(g.count*CONFIG.killQuota[clamp(np||1,1,5)-1]);
}
/** 依頼の文章。討伐数は人数で増えるので、実際の目標数に合わせて書き換える */
function questDesc(q,np){
  if(q.goal.type!=='kill')return q.desc;
  return q.desc.replace(q.goal.count+'体',questNeed(q.goal,np)+'体');
}
/** いま話題にしている人数（オンラインならロビーの人数、ひとりなら1） */
function partySize(){return (typeof Net!=='undefined'&&Net.role)?Math.max(1,Net.lobbyList().length):1;}
/** 依頼の目標を文章にする */
function questGoalText(g,np){
  np=np||partySize();
  if(g.type==='kill')return (g.target==='any'?'魔物':(QUEST_GROUPS[g.target]?QUEST_GROUPS[g.target].name:DATA.enemies[g.target].name))+'を'+questNeed(g,np)+'体討伐';
  if(g.type==='chest')return '宝箱を'+g.count+'個開ける';
  if(g.type==='explore')return '自由に探索（いつでも帰れる）';
  return 'ボスを討伐';
}
/** 依頼の受注条件：ステージが解放されていること。緊急依頼は同じステージの通常の依頼をすべて達成していること */
const QuestRules={
  stage(p){return clamp((p.progress&&p.progress.stage)||1,1,maxStageId());},
  done(p,id){return (p.progress&&p.progress.done[id])||0;},
  /** 雑魚の依頼：そのステージの討伐依頼（緊急・強敵・探索以外） */
  minions(stage){return DATA.quests.filter(q=>q.stage===stage&&q.goal&&q.goal.type==='kill'&&!q.urgent&&!q.explore);},
  minionsDone(p,stage){return this.minions(stage).filter(q=>this.done(p,q.id)>0).length;},
  /** 雑魚の依頼を2つ達成すると、強敵ボスに挑める */
  minionsOpen(p,stage){return this.minionsDone(p,stage)>=2;},
  /** 強敵（緊急以外のボス依頼）。雑魚の依頼を2つ達成すると挑める */
  strong(q){return q.goal.type==='boss'&&!q.urgent;},
  /** 緊急依頼は、そのステージの強敵ボスをすべて倒すと出る */
  urgentOpen(p,stage){const st=DATA.quests.filter(q=>q.stage===stage&&this.strong(q));return st.length>0&&st.every(q=>this.done(p,q.id)>0);},
  available(p,q){
    if(q.stage>this.stage(p))return false;
    if(q.urgent)return this.urgentOpen(p,q.stage);
    if(this.strong(q)&&!this.minionsOpen(p,q.stage))return false;
    if(!q.after)return true;
    // 前提が緊急ボスの強敵は、雑魚の依頼をすべて達成すれば出る（緊急の達成は待たない）
    const pre=questById(q.after);
    if(pre&&pre.urgent)return this.minionsOpen(p,q.stage)||this.done(p,q.after)>0;
    return this.done(p,q.after)>0;
  },
  rewardText(q){
    const r=q.reward,parts=[];
    if(r.gold)parts.push(`<span style="color:#ffd23a">${r.gold}G</span>`);
    for(const k in (r.mats||{}))parts.push(`${DATA.materials[k].name}×${r.mats[k]}`);
    if(r.decos)parts.push(`<span style="color:#c06bff">装飾品×${r.decos}</span>`);
    if(q.goal.type==='boss')parts.push('ボスの素材（個別抽選）');
    if(q.goal.type==='boss')parts.push('手紙×'+(r.letters??1));else if((r.letters??1)>0)parts.push('手紙×'+(r.letters??1));
    if(q.explore)parts.push('なし（倒したボスの素材は持ち帰れる）');
    return parts.join('、');
  },
};
/** 依頼（opts.quest）に合わせてダンジョンを作る */
/** 訓練場の広場（ボスの部屋だけ）。周りは壁、中は床 */
function buildArenaMap(){
  const W=30,H=20,tiles=new Uint8Array(W*H).fill(1);
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)tiles[y*W+x]=0;
  return {W,H,tiles,version:1,rooms:{},roomList:[],theme:'meadow',doorTiles:[],doorClosed:false,corridors:[],gatherSpots:[],
    start:{x:6.5*TILE,y:10*TILE},bossX1:14,bossSpot:{x:19*TILE,y:10*TILE}};
}
function createWorld(opts){
  const quest=opts.quest||DATA.quests[0],stage=stageById(quest.stage),np=Math.max(1,opts.players||1);
  const goal=quest.goal;
  // ステージに部屋構成（layout）があれば毎回組み合わせるマップ、無ければ従来の固定マップ
  const L=stage.layout&&DATA.layouts[stage.layout];
  // 訓練場は、ボスの部屋だけの広場（ほかの部屋・雑魚・宝箱はなし）
  const TR=!!quest.training;
  const map=TR?buildArenaMap():L?buildStageMap(L):buildDungeon();
  if(!L&&!TR)Object.assign(map,{theme:'cave',start:{x:6.5*TILE,y:18.5*TILE},bossX1:61,bossSpot:{x:74*TILE,y:19.5*TILE}});
  const w={time:0,map,nextId:1,hazards:[],gathers:[],corpses:[],players:{},enemies:[],projectiles:[],attacks:[],telegraphs:[],drops:[],chests:[],events:[],
    playerCount:np,leash:opts.leash||0,stageId:stage.id,questId:quest.id,placed:[],
    // 人数が増えるほど敵のHPを増やす（2人で1.5倍）
    diff:{hp:stage.hp*(1+CONFIG.coop.hpPerExtraPlayer*(np-1)),atk:stage.atk,level:stage.id},
    flow:null,flowTimer:0,
    quest:{title:quest.name,goal,progress:0,need:goal.type==='boss'?1:goal.type==='explore'?0:questNeed(goal,np),done:false,
      killed:0,total:0,chests:0,chestsTotal:0,boss:(goal.type==='boss'||goal.type==='explore')?'unseen':'none',bossType:(goal.type==='boss'||goal.type==='explore')?(quest.boss||stage.enemySet.boss):null},
    status:'playing',clearTimer:-1,deadTimer:-1,bossId:null,playerStart:{x:map.start.x,y:map.start.y}};
  if(TR){const b=spawnEnemy(w,w.quest.bossType,map.bossSpot.x,map.bossSpot.y);w.bossId=b.id;}
  else if(L)populateLayout(w,stage,quest,L);else populate(w,stage,quest);
  if(stage.layout==='volcano')placeMagma(w);
  if(stage.layout==='swamp')placeToxPools(w);
  w.narrowVision=stage.layout==='crystal'; // 洞窟は常に視界が少し狭い
  if(stage.layout==='snow')w.blizzard={on:false,t:rand(20,30)};
  return w;
}
/** 部屋構成のあるステージ：部屋の種類ごとに魔物・宝箱・採取ポイントを置く */
/** 配置する魔物の数：数の範囲（a〜b）にCONFIG.spawnRateをかける。端数は確率で切り上げ・切り下げ */
const spawnCount=(a,b)=>Math.floor(randInt(a,b)*CONFIG.spawnRate+RNG.next());
/** 雑魚の群れ：一か所に最低3体。主の種類が多めで、ほかは同じ部屋の魔物から混ざる */
function spawnPack(w,m,rect,types,main,count,elite){
  const c=randomFloor(m,rect,2);if(!c)return elite;
  for(let i=0;i<count;i++){
    const t=(i===0||RNG.next()<0.7)?main:pick(types);
    let x=c.x,y=c.y;
    if(i>0){const a=rand(0,TAU),r=rand(14,40),tx=c.x+Math.cos(a)*r,ty=c.y+Math.sin(a)*r;if(!circleHitsWall(m,tx,ty,10)){x=tx;y=ty;}}
    spawnEnemy(w,t,x,y,{elite:elite-->0});
  }
  return elite;
}
/** 雑魚を、中心の周りに固まって置く（呼び出し側で2体以上を指定する）。主の種類が多めで、ほかは types から混ざる */
function spawnHerd(w,m,x,y,types,main,n){
  for(let i=0;i<n;i++){
    let tx=x,ty=y;
    if(i>0){const a=rand(0,TAU),r=rand(14,40),cx=x+Math.cos(a)*r,cy=y+Math.sin(a)*r;if(!circleHitsWall(m,cx,cy,10)){tx=cx;ty=cy;}}
    spawnEnemy(w,(i===0||RNG.next()<0.7)?main:pick(types),tx,ty);
  }
}
function populateLayout(w,stage,quest,L){
  const m=w.map,goal=quest.goal,S=stage.enemySet,dens=stage.density??1;
  const rooms=m.roomList.filter(rm=>rm.kind!=='start'&&!(rm.kind==='boss'&&(goal.type==='boss'||goal.type==='explore')));
  // 枠雑魚（部屋の配置枠から出る雑魚）は、1つのフロアで合計3体まで。中ボスとその取り巻きは別扱いで数えない
  let slotBudget=CONFIG.slotRegularCap;
  for(const rm of rooms){
    let elite=rm.def.elite||0;
    const types=(rm.def.spawn||[]).map(s=>s[0]);
    // 枠ごとに、1割半の確率で群れ（残りの上限まで）
    for(const [t,a,b] of (rm.def.spawn||[])){
      if(slotBudget<=0)break;
      if(RNG.next()<0.15*dens){
        const size=Math.min(randInt(3,4),slotBudget); // 雑魚は必ず2体以上で湧く（残りの上限が1体なら湧かせない）
        if(size>=2){
          const before=w.enemies.length;
          elite=spawnPack(w,m,rm.rect,types,t,size,elite);
          slotBudget-=w.enemies.length-before;
        }
      }
    }
  }
  // 中ボス：道の部屋のどこかに、その部屋の魔物の大きい版。取り巻きの雑魚も一緒に湧く
  const mains=shuffle(rooms.filter(rm=>rm.kind==='main'));
  for(let i=0,placed=0,n=randInt(CONFIG.midBoss.count[0],CONFIG.midBoss.count[1]);i<mains.length&&placed<n;i++){
    const types=(mains[i].def.spawn||[]).map(s=>s[0]).filter(t=>!CONFIG.midBoss.exclude.includes(t));
    const p=types.length&&(randomFloor(m,mains[i].rect,3)||randomFloor(m,mains[i].rect,2));
    if(p){
      spawnEnemy(w,pick(types),p.x,p.y,{mid:true});placed++;
      const escort=2;
      for(let k=0;k<escort;k++){const a=rand(0,TAU),r=rand(40,70),tx=p.x+Math.cos(a)*r,ty=p.y+Math.sin(a)*r;
        spawnEnemy(w,RNG.next()<0.7?types[0]:pick(types),circleHitsWall(m,tx,ty,10)?p.x:tx,circleHitsWall(m,tx,ty,10)?p.y:ty);}
    }
  }
  // 通路をうろつく魔物
  for(const c of shuffle(m.corridors.slice()).slice(0,Math.floor(spawnCount(1,2)*dens+RNG.next()))){
    const x=(c.x+0.5)*TILE,y=(c.y+0.5)*TILE;
    if(!circleHitsWall(m,x,y,14)&&!inStartRoom(m,x,y,14))spawnHerd(w,m,x,y,L.wander,pick(L.wander),randInt(2,3));
  }
  // 討伐依頼は、目標数より少し多く対象が出るようにする（必ず達成できるように）
  if(goal.type==='kill'){
    const match=e=>!e.boss&&questTypeMatch(goal,e.type);
    const want=questNeed(goal,w.playerCount)+2,grp=QUEST_GROUPS[goal.target];
    for(let guard=0;w.enemies.filter(match).length<want&&guard<60;guard++){const type=grp?pick(grp.types):(goal.target==='any'?S.melee:goal.target);const p=randomFloor(m,pick(rooms).rect,2);if(p)spawnHerd(w,m,p.x,p.y,[type],type,2);}
  }
  // 宝箱：「必ず置く」部屋から先に、残りは道や寄り道の部屋へ。出現は確率制（宝箱の依頼に必要な数だけは必ず置く）
  const need=goal.type==='chest'?goal.count:0,nChests=Math.max(need,Math.random()<CONFIG.chestChance?1:0),order=[];
  for(const rm of m.roomList)for(let i=0;i<(rm.def.chest||0);i++)order.push(rm);
  order.push(...shuffle(m.roomList.filter(rm=>rm.kind==='main'||rm.kind==='side')));
  for(const rm of shuffle(order)){
    if(w.chests.length>=nChests)break;
    const p=randomFloor(m,rm.rect,1);if(p)w.chests.push({id:w.nextId++,x:p.x,y:p.y,opened:false,table:stage.chest});
  }
  for(const g of m.gatherSpots)w.gathers.push({id:w.nextId++,x:g.x,y:g.y,kind:g.kind,used:false,table:'gather_'+g.kind});
  if(goal.type==='boss'||goal.type==='explore'){const boss=spawnEnemy(w,w.quest.bossType,m.bossSpot.x,m.bossSpot.y,quest.urgent?{urgentStage:quest.stage}:{});w.bossId=boss.id;} // 自由探索にも主がいる（倒しても探索は続く）
  w.quest.total=w.enemies.filter(e=>!e.boss).length;
  w.quest.chestsTotal=w.chests.length;
}
/** 依頼の目標が進んだとき。達成したら少し間を置いてクエストクリア */
function questProgress(w,n){
  const q=w.quest;if(q.done)return;
  q.progress=Math.min(q.need,q.progress+n);
  emit(w,{type:'questProgress',progress:q.progress,need:q.need});
  if(q.progress>=q.need){q.done=true;w.clearTimer=2.4;emit(w,{type:'questComplete'});}
}
/** 緊急依頼のボス：同じステージのほかのボスより強くする（HP・攻撃・防御が、ほかのボスの最大値の1.15倍以上になるように掛ける倍率） */
const URGENT_MARGIN=1.15;
function urgentBossBoost(type,stageNo){
  const d=DATA.enemies[type],st=DATA.stages[stageNo-1],one={hp:1,atk:1,def:1};
  if(!d||!st)return one;
  const ids=new Set(DATA.quests.filter(q=>q.stage===stageNo&&q.boss).map(q=>q.boss));
  if(st.enemySet&&st.enemySet.boss)ids.add(st.enemySet.boss);
  ids.delete(type);
  let mh=0,ma=0,md=0;
  for(const id of ids){const o=DATA.enemies[id];if(!o)continue;mh=Math.max(mh,o.hp);ma=Math.max(ma,o.atk);md=Math.max(md,o.def||0);}
  const f=(need,own)=>own>0?Math.max(1,need*URGENT_MARGIN/own):1;
  return {hp:f(mh,d.hp),atk:f(ma,d.atk),def:md>0?f(md,d.def||0):1};
}
function spawnEnemy(w,type,x,y,opt){
  opt=opt||{};
  const d=DATA.enemies[type],E=CONFIG.elite,M=CONFIG.midBoss,mid=!!opt.mid&&!d.boss,el=!!opt.elite&&!d.boss&&!mid;
  const ub=d.boss&&opt.urgentStage?urgentBossBoost(type,opt.urgentStage):{hp:1,atk:1,def:1};
  // 1人プレイのボスは体力1.5倍（仲間がいても1人プレイ扱い。訓練場のカカシは除く）
  const soloMul=(w.playerCount||1)===1&&!(w.quest&&w.quest.training)?1.5:1;
  const partyMul=d.boss?(CONFIG.bossHpByParty[Math.max(1,Math.min(5,w.playerCount||1))]||1)*CONFIG.bossBoost.hp*soloMul:1;
  const mult=d.boss?partyMul:CONFIG.minionHp*(el?E.hp:mid?M.hp:1);
  const hp=Math.round(d.hp*ub.hp*w.diff.hp*mult),atk=d.atk*ub.atk*w.diff.atk*(el?E.atk:mid?M.atk:1)*(d.boss?CONFIG.bossBoost.atk:CONFIG.minionBoost.atk)*CONFIG.enemyAtkMult;
  const e={id:w.nextId++,type,x,y,r:el?Math.round(d.r*E.size):mid?Math.round(d.r*M.size):d.boss?Math.round(d.r*CONFIG.bossScale.size):d.r,hp,maxHp:hp,atk,armor:d.def*ub.def,mid,
    speed:d.speed,state:d.boss?'sleep':'idle',timer:0,cd:rand(0.3,1.2),cd2:rand(0.5,1.5),cd3:rand(1,2),stun:0,facing:rand(0,TAU),atkAngle:0,aggro:false,hurt:0,kx:0,ky:0,
    dead:false,boss:!!d.boss,phase:1,cds:{bite:0,charge:2,slam:3,sweep:1.5,roar:4,orb:2,summon:5},action:null,hitSet:null,chargeLeft:0,chargeChain:0,
    anim:rand(0,10),strafeDir:RNG.next()<0.5?1:-1,strafeT:rand(1,2),aimTime:d.aimTime||0.8,stunPts:0,stunMax:d.stunMax||0,
    elite:el,summoned:!!opt.summoned,bossMinion:opt.bossMinion||null,revived:!!opt.revived,baseAtk:atk,baseSpeed:d.speed,empowerT:0,z:0};
  w.enemies.push(e);return e;
}
function populate(w,stage,quest){
  const R=w.map.rooms,m=w.map,S=stage.enemySet,goal=quest.goal;
  const M=S.melee,A=S.ranged;
  const groups=[
    ['north',()=>new Array(randInt(4,6)).fill(M)],
    ['south',()=>[...new Array(randInt(2,3)).fill(A),...new Array(randInt(1,2)).fill(M)]],
    ['hub',()=>[...new Array(randInt(2,3)).fill(A),...new Array(randInt(3,4)).fill(M)]],
  ];
  // ボス討伐以外の依頼では、最深部の部屋にも魔物の群れがいる
  if(goal.type!=='boss')groups.push(['boss',()=>[...new Array(randInt(3,4)).fill(M),...new Array(2).fill(A)]]);
  for(const [room,fn] of groups)for(const t of fn()){const p=randomFloor(m,R[room],2);if(p)spawnEnemy(w,t,p.x,p.y);}
  const amb=shuffle([[17,13],[17,23],[37,14],[37,22],[55,18],[30,9],[30,27]]).slice(0,randInt(2,4));
  for(const [tx,ty] of amb)spawnEnemy(w,RNG.next()<0.3?A:M,(tx+0.5)*TILE,(ty+0.5)*TILE);
  // 討伐依頼は、目標数より少し多く対象が出るようにする（必ず達成できるように）
  if(goal.type==='kill'){
    const match=e=>!e.boss&&questTypeMatch(goal,e.type);
    const want=questNeed(goal,w.playerCount)+2,grp=QUEST_GROUPS[goal.target];
    const rooms=goal.type!=='boss'?['north','south','hub','boss']:['north','south','hub'];
    for(let guard=0;w.enemies.filter(match).length<want&&guard<40;guard++){
      const type=grp?pick(grp.types):(goal.target==='any'?M:goal.target);
      const p=randomFloor(m,R[pick(rooms)],2);if(p)spawnEnemy(w,type,p.x,p.y);
    }
  }
  const need=goal.type==='chest'?goal.count:0,nChests=Math.max(need,Math.random()<CONFIG.chestChance?1:0);
  const chestSpots=shuffle([[3,14],[12,22],[21,4],[32,4],[21,32],[32,32],[41,12],[52,24],[52,12],[41,24],[64,8],[84,30]]);
  for(const [tx,ty] of chestSpots){
    if(w.chests.length>=nChests)break;
    if(isWall(m,tx,ty))continue;
    w.chests.push({id:w.nextId++,x:(tx+0.5)*TILE,y:(ty+0.5)*TILE,opened:false,table:stage.chest});
  }
  if(goal.type==='boss'){const boss=spawnEnemy(w,S.boss,74*TILE,19.5*TILE);w.bossId=boss.id;}
  w.quest.total=w.enemies.filter(e=>!e.boss).length;
  w.quest.chestsTotal=w.chests.length;
}

/** 装備変更時にステータスを差し替える（HP割合ではなく減少量を維持） */
function setPlayerStats(w,id,st){
  const p=w.players[id];if(!p)return;
  const old=p.stats.maxHp;p.stats=st;
  if(st.maxHp>old)p.hp+=st.maxHp-old;
  p.hp=Math.min(p.hp,st.maxHp);
  if(!p.dead&&p.hp<1)p.hp=1;
}
function nearestPlayer(w,e){
  let best=null,bd=Infinity;
  for(const id in w.players){const p=w.players[id];if(p.dead)continue;const d=(p.x-e.x)**2+(p.y-e.y)**2;if(d<bd){bd=d;best=p;}}

}

      // ノックバックは武器ごと（大剣・ハンマーだけ）。片手剣・太刀・双剣は吹き飛ばさない
      if(DATA.weaponTypes[s.weaponType]&&DATA.weaponTypes[s.weaponType].knockback){const a=Math.atan2(e.y-p.y,e.x-p.x),k=src.skill?260:170;e.kx=Math.cos(a)*k;e.ky=Math.sin(a)*k;}
    }
  }
  // ハンマー：ボスの頭（向いている方向の前側）に当たるとスタン値がたまる
  const wt=DATA.weaponTypes[s.weaponType];let head=false;
  if(wt&&wt.stun&&e.stunMax>0&&!e.dead&&e.state!=='stunned'&&e.state!=='sleep'){
    head=part?!!part.head:frontal;
    if(head){
      e.stunPts+=wt.stun.base*(src.stunMult||1)*(wsActive(p,'gouwan')?2:1);
      if(e.stunPts>=e.stunMax){
        e.stunPts=0;e.stunMax=Math.round(e.stunMax*1.5); // モンハン式：スタンするたびに次は取りにくくなる
        e.state='stunned';e.timer=DATA.enemies[e.type].stunTime||4;e.action=null;
        w.telegraphs=w.telegraphs.filter(t=>t.owner!==e.id);
        emit(w,{type:'bossStun',x:e.x,y:e.y,name:DATA.enemies[e.type].name});
      }
    }
  }
  emit(w,{type:'damage',target:'enemy',x:hp_&&part?hp_.x:e.x,y:hp_&&part?hp_.y-hp_.r:e.y-e.r,amount:dmg,crit,skill:!!src.skill,head,guard:guarded,weak:weakPart&&!guarded,arrowWeak:weakPart&&!!src.arrow,el:elHit?elHit.k:null,elEff:elHit?(elHit.m>=1.5?2:elHit.m>1?1:elHit.m<1?-1:0):0});
  if(s.drainChance>0&&RNG.next()*100<s.drainChance&&p.hp<s.maxHp){
    const h=Math.max(2,Math.round(s.maxHp*0.03));p.hp=Math.min(s.maxHp,p.hp+h);
    emit(w,{type:'heal',x:p.x,y:p.y-20,amount:h,drain:true});
  }
  if(e.boss&&e.state==='sleep')triggerBoss(w);
  if(e.hp<=0)killEnemy(w,e);
}
/** 矢の状態異常を付ける（ボスは効きにくい） */
/** ボスの耐性：同じ種類の状態異常・閃光を受けるたびに効き目が縮む（0.75倍ずつ、下限0.25倍）。ボスごとに数えるので次の戦いではリセット */
function bossResFactor(e,k){if(!e.boss)return 1;const n=(e.resCount||{})[k]||0;return Math.max(0.25,Math.pow(0.75,n));}
function bossResHit(e,k){if(!e.boss)return;e.resCount=e.resCount||{};e.resCount[k]=(e.resCount[k]||0)+1;}
function applyStatus(w,e,status){
  if(e.dead)return;
  const boss=!!e.boss,f=bossResFactor(e,status);
  bossResHit(e,status);
  if(status==='poison'){e.poisonT=(boss?4:6)*f;e.poisonTick=1;e.poisonDmg=Math.max(4,Math.round(e.maxHp*(boss?0.012:0.03)));emit(w,{type:'status',x:e.x,y:e.y-e.r,text:'毒',color:'#a8e040'});}
  else if(status==='paralysis'){e.trapT=(boss?2.2:4)*f;e.trapKind='para';emit(w,{type:'status',x:e.x,y:e.y-e.r,text:'麻痺',color:'#ffe040'});}
  else if(status==='sleep'){e.sleepT=(boss?4:7)*f;emit(w,{type:'status',x:e.x,y:e.y-e.r,text:'睡眠',color:'#b898ff'});}
  else if(status==='slow'){e.slowT=(boss?2.5:5)*f;emit(w,{type:'status',x:e.x,y:e.y-e.r,text:'鈍足',color:'#9ad8ff'});}
}
function killEnemy(w,e){
  e.dead=true;e.hp=0;
  const d=DATA.enemies[e.type];
  // 報酬はアプリ側（オンラインではホスト）が kill イベントを受けて各プレイヤーに直接渡す
  // 召喚された魔物は報酬なし。強化された魔物は追加で抽選
  emit(w,{type:'kill',x:e.x,y:e.y,enemy:e.type,color:d.color,boss:e.boss,table:e.summoned?null:d.drops,elite:e.elite,mid:e.mid,summoned:e.summoned});
  const g=w.quest.goal;
  if(e.boss){
    w.quest.boss='defeated';
    if(g.type==='boss')questProgress(w,1);
    w.telegraphs=[];w.projectiles=w.projectiles.filter(pr=>pr.owner!=='enemy');w.hazards=[];
    // ボスが呼び出した魔物は崩れ去る
    for(const o of w.enemies)if(o.summoned&&!o.dead){o.dead=true;o.hp=0;emit(w,{type:'kill',x:o.x,y:o.y,enemy:o.type,color:DATA.enemies[o.type].color,boss:false,table:null,summoned:true,noCount:true});}
    emit(w,{type:'bossDefeated',x:e.x,y:e.y,name:d.name});
  }else{
    // 呪術師がよみがえらせられるよう、亡骸を覚えておく（復活した魔物・召喚・呪術師自身は除く）
    if(!e.summoned&&!e.revived&&!e.mid&&d.ai!=='shaman'){w.corpses.push({x:e.x,y:e.y,type:e.type,elite:e.elite,t:w.time,used:false});if(w.corpses.length>30)w.corpses.shift();}
    if(!e.summoned)w.quest.killed++;
    w.telegraphs=w.telegraphs.filter(t=>t.owner!==e.id);
    if(g.type==='kill'&&questTypeMatch(g,e.type))questProgress(w,1);
  }
}
function spawnDrop(w,x,y,loot){
  const a=rand(0,TAU),sp=rand(60,150);
  w.drops.push({id:w.nextId++,x,y,r:6,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,loot,t:0});
}

/* ---------- プレイヤー ---------- */
const EMPTY_INPUT={mx:0,my:0,attack:false,guard:false,dodge:false,skill:false,heal:false,sheathe:false};
/** 仲間AI。仲間の入力はここで作る（プレイヤー入力と同じ形）。
    協力プレイでも「その仲間を誰が操作するか」を差し替えるだけで使えるよう、world.players の id 単位で動かす。 */
const Companion={
  isId(pid){return typeof pid==='string'&&/^c\d+$/.test(pid);},
  idOf(i){return 'c'+i;},
  /** 役割は固定（COMP_FIXED_ROLES）。保存データの役割は使わない */
  normalizeRoles(){return COMP_FIXED_ROLES.slice(0,COMP_COUNT);},
  /** 出撃時に仲間を生成する */
  spawn(w,profile){
    for(let i=0;i<COMP_COUNT;i++){
      const who=CHAR_COUNT+i,role=COMP_FIXED_ROLES[i];
      const pl=addPlayer(w,Companion.idOf(i),computeStats(profile,null,who),Object.assign({},COMP_KIT[role]));
      pl.info={name:COMP_ROLE_NAME[role]};
      pl.ai={who,role,revives:COMP_REVIVES,reviveT:-1};
    }
  },
  /** 倒れた仲間の自動復活（毎ステップ） */
  tick(w,dt){
    for(const p of Object.values(w.players)){
      if(!p.ai||!p.dead||p.out||p.ai.reviveT<0)continue;
      p.ai.reviveT-=dt;
      if(p.ai.reviveT<=0){
        p.ai.revives--;p.ai.reviveT=-1;
        p.dead=false;p.revive=0;p.downT=0;
        p.hp=Math.max(1,Math.round(p.stats.maxHp*CONFIG.coop.reviveHpRatio));
        p.hitInv=1.5;p.dodgeTime=0;p.swing=0;
        emit(w,{type:'revive',pid:p.id,by:'auto',x:p.x,y:p.y});
      }
    }
  },
  /** 仲間の入力を決める */
  decide(w,p){
    const I={mx:0,my:0,attack:false,guard:false,dodge:false,skill:false,heal:false,sheathe:false};
    if(p.dead)return I;
    const all=Object.values(w.players);
    const leader=all.find(q=>!q.ai&&!q.dead)||all.find(q=>!q.ai)||p;
    const foes=(w.enemies||[]).filter(e=>!e.dead&&e.hp>0);
    const toward=(tx,ty,stop)=>{const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);return d<=stop?{mx:0,my:0}:{mx:dx/d,my:dy/d};};
    const role=p.ai.role;
    const R={healer:{reach:80,leash:260,follow:110},tank:{reach:70,leash:300,follow:90},attacker:{reach:75,leash:460,follow:130}}[role];
    // 1) 危険な攻撃からは避ける（タンクは受け止める）
    const threat=(w.telegraphs||[]).find(t=>t.dmg>0&&t.t<t.total&&inTelegraph(t,p.x,p.y,p.r));
    if(threat&&role!=='tank'&&p.dodgeCd<=0){
      const dx=p.x-threat.x,dy=p.y-threat.y,d=Math.hypot(dx,dy)||1;
      I.dodge=true;I.mx=dx/d;I.my=dy/d;return I;
    }
    // タンク：危ない攻撃は受け止める（ガードボタンを押し続ける）
    if(threat&&role==='tank'){I.guard=true;I.aim=Math.atan2(threat.y-p.y,threat.x-p.x);return I;}
    // 2) 倒れた人間がいれば助け起こしに行く（重なって止まると助け起こせる）
    const downed=all.find(q=>!q.ai&&q.dead&&!q.out);
    const nearFoe=foes.find(e=>Math.hypot(e.x-p.x,e.y-p.y)<R.reach*2);
    if(downed&&!nearFoe){
      const d=Math.hypot(downed.x-p.x,downed.y-p.y);
      if(d>CONFIG.coop.reviveRadius*0.5)return {...I,...toward(downed.x,downed.y,CONFIG.coop.reviveRadius*0.5)};
      return I;
    }
    // 3) 回復：ヒーラーは傷ついた味方を、タンクは自分か味方が危ないときに回復薬を使う
    const needHeal=role==='healer'
      ?all.some(q=>!q.dead&&q.hp<q.stats.maxHp*0.5)
      :role==='tank'&&all.some(q=>!q.dead&&q.hp<q.stats.maxHp*(q===p?0.5:0.35));
    if(needHeal&&!p.using&&p.potionCd<=0){
      const pickId=['heal_all','good_potion','potion'].find(id=>(p.bag[id]||0)>0);
      if(pickId){I.pick=ITEM_ORDER.indexOf(pickId);I.heal=true;return I;}
    }
    const hurtNow=all.some(q=>!q.dead&&q.hp<q.stats.maxHp*0.5);
    // 4) 戦闘：指揮者の近くの敵を狙う
    let foe=null,fd=1e9;
    for(const e of foes){
      const d=Math.hypot(e.x-p.x,e.y-p.y);
      if(Math.hypot(e.x-leader.x,e.y-leader.y)<=R.leash&&d<fd){fd=d;foe=e;}
    }
    if(foe){
      I.aim=Math.atan2(foe.y-p.y,foe.x-p.x);
      if(fd<=R.reach){I.attack=true;return I;}
      // ヒーラーは時々だけ攻撃する（味方が傷ついていない時、数秒おきに少しの間だけ）
      if(role==='healer'&&!hurtNow&&fd<=R.reach*1.6&&((w.time||0)%5)<1.5){I.attack=true;return I;}
      if(role==='tank'){const m=toward(foe.x,foe.y,R.reach*0.8);I.mx=m.mx;I.my=m.my;return I;}
      if(role==='attacker'){const m=toward(foe.x,foe.y,R.reach*0.8);I.mx=m.mx;I.my=m.my;return I;}
      // ヒーラーは敵の近くまで行かず、指揮者の近くで待つ
    }
    // 5) 指揮者について行く
    const ld=Math.hypot(leader.x-p.x,leader.y-p.y);
    if(ld>R.follow){const m=toward(leader.x,leader.y,R.follow);I.mx=m.mx;I.my=m.my;}
    return I;
  },
};
// ガード（片手剣・大剣・ランス）：ガードボタンを押している間だけ。移動はかなり遅くなり、正面（前方120°）からのダメージは大きく減る
const GUARD_CFG={move:0.2};
/** 幽霊（復活できなくなった後）：普通の歩きより速く動けるが、壁は通れない。攻撃・アイテム・採取・被弾はない */
function updateSpirit(w,p,inp,dt){
  p.guarding=false;p.using=null;p.charging=false;p.charge=0;p.sheathing=null;
  let mx=inp.mx||0,my=inp.my||0;
  const len=Math.hypot(mx,my);
  p.moving=len>0;
  if(!p.moving)return;
  mx/=len;my/=len;
  const spd=p.stats.speed*CONFIG.coop.ghostSpeed;
  moveEntity(w.map,p,mx*spd*dt,my*spd*dt); // 壁にはぶつかる（生きているときと同じ判定）
  p.facing=Math.atan2(my,mx);p.walk+=dt*spd/28;
}
function updatePlayer(w,p,inp,dt){
  p.guarding=false;
  if(p.dead&&p.out){updateSpirit(w,p,inp,dt);return;}
  if(p.dead){p.using=null;p.charging=false;p.pendingHeals=null;return;}
  // 解毒薬の即時使用（状態異常の表示から押したとき）：麻痺・睡眠中でも使える
  if(inp.cure&&(p.bag.antidote||0)>0&&cureStatus(w,p)){p.bag.antidote--;emit(w,{type:'itemUsed',pid:p.id,item:'antidote'});}
  const s=p.stats,P=CONFIG.player,wt=DATA.weaponTypes[s.weaponType];
  p.atkTimer-=dt;p.swing-=dt;p.dodgeCd-=dt;p.dodgeInv-=dt;p.hitInv-=dt;p.skillCd-=dt;p.potionCd-=dt;p.hurt-=dt;p.buffT-=dt;if(p.ws){p.ws.t-=dt;if(p.ws.t<=0)p.ws=null;}
  // 回復薬・良い回復薬の後半分：使ってから1秒後に発動
  if(p.pendingHeals&&p.pendingHeals.length){for(const h of p.pendingHeals)h.t-=dt;const due=p.pendingHeals.filter(h=>h.t<=0);p.pendingHeals=p.pendingHeals.filter(h=>h.t>0);for(const h of due){p.hp=Math.min(p.stats.maxHp,p.hp+h.amt);emit(w,{type:'heal',x:p.x,y:p.y-20,amount:h.amt});}}
  if(p.slowT>0)p.slowT-=dt;if(p.poisoned>0)p.poisoned-=dt;
  if(p.curseT>0)p.curseT-=dt;if(p.paraImmune>0)p.paraImmune-=dt;if(p.sleepImmune>0)p.sleepImmune-=dt;
  if(p.poisonT>0){ // 毒：一定時間ごとに減る（HP1より下がらない）
    const d=DATA.playerStatus.poison;p.poisonT-=dt;p.poisonTick-=dt;
    if(p.poisonTick<=0){p.poisonTick+=d.tick;
      const dmg=Math.min(p.hp-1,Math.max(1,Math.round(s.maxHp*d.pct*(1-clamp(s.poisonRes||0,0,100)/100))));
      if(dmg>0){p.hp-=dmg;emit(w,{type:'damage',target:'player',pid:p.id,x:p.x,y:p.y-p.r,amount:dmg,crit:false,dot:true});}}
  }
  // 自動回復（防具スキル）：3秒ごとにまとめて回復
  if(s.regen>0){p.regenT=(p.regenT||0)+dt;if(p.regenT>=3){p.regenT-=3;if(p.hp<s.maxHp){const hl=Math.min(s.maxHp-p.hp,Math.round(s.regen*3));p.hp+=hl;emit(w,{type:'heal',x:p.x,y:p.y-20,amount:hl,drain:true});}}}
  for(const k in p.buffs){p.buffs[k].t-=dt;if(p.buffs[k].t<=0)delete p.buffs[k];}
  // 双剣の勢い：しばらく当てないと少しずつ下がる
  if(p.flow>0&&wt.flow){p.flowT-=dt;if(p.flowT<=0){p.flow--;p.flowT=wt.flow.decay;}}
  else if(!wt.flow)p.flow=0;
  // 持ち物の選択（切り替え・番号指定）はいつでもできる
  // 持っていない消耗品は選べない（切り替えは持っているものだけを順に回る）
  if(typeof inp.pick==='number'&&inp.pick>=0&&inp.pick<ITEM_ORDER.length){if((p.bag[ITEM_ORDER[inp.pick]]||0)>0)p.sel=inp.pick;}
  else if(inp.cycle&&ownedItemIds(p.bag).length){
    const N=ITEM_ORDER.length;let i=p.sel;
    for(let k=0;k<N;k++){i=(i+(inp.cycle<0?N-1:1))%N;if((p.bag[ITEM_ORDER[i]]||0)>0){p.sel=i;break;}}
  }
  // 選んでいたものを使い切ったら、持っている最初のものに移る
  if((p.bag[ITEM_ORDER[p.sel]]||0)<=0&&ownedItemIds(p.bag).length)p.sel=ITEM_ORDER.indexOf(ownedItemIds(p.bag)[0]);
  if(p.kx||p.ky){moveEntity(w.map,p,p.kx*dt,p.ky*dt);p.kx*=0.82;p.ky*=0.82;if(Math.abs(p.kx)+Math.abs(p.ky)<5)p.kx=p.ky=0;}
  if(p.sleepT>0){ // 睡眠：攻撃を受けるまで動けない
    p.sleepT-=dt;p.moving=false;p.charging=false;p.charge=0;
    if(p.sleepT<=0)p.sleepImmune=DATA.playerStatus.sleep.immune;
    return;
  }
  if(p.paraT>0){ // 麻痺：その場で動けない（向きも変えられない）
    p.paraT-=dt;p.moving=false;p.charging=false;p.charge=0;
    if(p.paraT<=0)p.paraImmune=DATA.playerStatus.paralysis.immune;
    return;
  }
  if(typeof inp.aim==='number')p.facing=inp.aim;
  if(p.dodgeTime>0){
    p.dodgeTime-=dt;
    const ds=P.dodgeSpeed*(1+(s.dodgeDistPct||0)/100)*(wsActive(p,'taunt')?1.3:1); // 回避距離アップ（防具スキル）のときだけ伸びる
    moveEntity(w.map,p,p.dodgeDir.x*ds*dt,p.dodgeDir.y*ds*dt);
    return;
  }
  // ガード：押している間だけ。抜刀していなければ抜く。攻撃・チャージ・アイテム使用中は構えられない
  if(inp.guard&&wt&&wt.guard&&!p.sheathing&&!p.charging&&!p.using){
    if(!p.drawn){p.drawn=true;emit(w,{type:'draw',pid:p.id,x:p.x,y:p.y});}
    p.guarding=p.swing<=0;
  }
  if(p.guarding)inp={...inp,attack:false};
  let mx=inp.mx||0,my=inp.my||0;
  const len=Math.hypot(mx,my);
  if(len>0){mx/=len;my/=len;} // 斜め移動でも速度は一定
  p.moving=len>0;
  if(p.moving){
    let k=1;
    if(p.sheathing)k=Math.min(k,P.sheatheWalk);
    if(p.swing>0)k=Math.min(k,0.6);
    if(p.charging&&wt.charge&&!wsActive(p,'gouwan'))k=Math.min(k,wt.charge.move);   // チャージ中はかなり遅く歩ける
    if(p.using)k=Math.min(k,P.itemWalk);                      // アイテム使用中はゆっくり歩ける
    if(p.guarding)k=Math.min(k,GUARD_CFG.move);                // ガード中はかなり遅い
    if(p.slowT>0)k*=p.slowMult||0.6;                           // 鈍足（迷い霊）
    if(w.map.tiles[Math.floor(p.y/TILE)*w.map.W+Math.floor(p.x/TILE)]===TILE_PUDDLE)k*=PUDDLE_SLOW; // 水溜まりの中：少し遅くなる
    if(w.blizzard&&w.blizzard.on)k*=0.92;                      // 吹雪：わずかに遅くなる（ほかの補正と掛け算で共存、終われば戻る）
    const spd=(p.drawn?s.speed:s.sheathSpeed)*k;
    moveEntity(w.map,p,mx*spd*dt,my*spd*dt);p.walk+=dt*spd/28;
  }
  // 回避：アイテム使用（消費なし）とチャージを中断する
  if(inp.dodge&&p.dodgeCd<=0){
    if(p.using){p.using=null;emit(w,{type:'itemCancel',pid:p.id,x:p.x,y:p.y-26});}
    p.charging=false;p.charge=0;p.sheathing=null; // 納刀動作も中断（抜刀したまま）
    p.dodgeDir=p.moving?{x:mx,y:my}:{x:Math.cos(p.facing),y:Math.sin(p.facing)};
    p.dodgeTime=P.dodgeTime;p.dodgeCd=s.dodgeCd-(wsActive(p,'kyodo')?0.3:0);
    p.dodgeInv=P.dodgeTime+s.dodgeIframe;
    p.dodgeStart=w.time;p.perfectThisDodge=false;
    emit(w,{type:'dodge',x:p.x,y:p.y,pid:p.id});
    return;
  }
  // アイテム使用中：時間がたったら効果が出る
  if(p.using){
    p.using.t+=dt;
    if(p.using.t>=p.using.total){
      const id=p.using.item;p.using=null;p.potionCd=P.potionCd;
      p.bag[id]=Math.max(0,(p.bag[id]||0)-1);
      applyItem(w,p,id);
      emit(w,{type:'itemUsed',pid:p.id,item:id});
    }
    return;
  }
  // 納刀動作中：時間がたったら武器をしまう（その間は攻撃できない）
  if(p.sheathing){
    p.sheathing.t+=dt;
    if(p.sheathing.t>=p.sheathing.total){p.sheathing=null;p.drawn=false;emit(w,{type:'sheathe',pid:p.id,x:p.x,y:p.y});}
  }else if(inp.sheathe&&p.drawn&&!p.charging&&p.swing<=0){
    p.sheathing={t:0,total:s.sheatheTime};
  }
  // 納刀中に攻撃ボタン：抜刀してそのまま攻撃（チャージ武器はチャージ開始）
  if(!p.drawn&&!p.sheathing&&inp.attack&&p.atkTimer<=0){p.drawn=true;emit(w,{type:'draw',pid:p.id,x:p.x,y:p.y});}
  // 攻撃：チャージできる武器は「押している間ためて、離したら振る」
  if(p.sheathing||!p.drawn){p.aiming=false;}
  else if(wt.holdFire){ // 手裏剣：攻撃を押している間は狙いながら、いつもの間隔（interval）で投げ続ける
    p.aiming=!!inp.attack;
    if(inp.attack&&p.atkTimer<=0)playerAttack(w,p,{});
  }
  else if(wt.charge){
    if(p.charging){
      if(inp.attack)p.charge+=dt*(1+(p.stats.chargeSpdPct||0)/100); // チャージ速度（防具スキル）
      else{
        const lv=chargeLevel(wt.charge,p.charge);
        p.charging=false;p.charge=0;
        playerAttack(w,p,{mult:lv?wt.charge.mult[lv-1]*(lv===3&&wsActive(p,'fudou')?1.2:1):1,stunMult:lv&&wt.charge.stunMult?wt.charge.stunMult[lv-1]:1,level:lv});
      }
    }else if(!inp.attack)p.chargeLock=false;
    else if(p.atkTimer<=0&&!p.chargeLock){p.charging=true;p.charge=0;}
  }else if(inp.attack&&p.atkTimer<=0)playerAttack(w,p,{});
  if(inp.skill&&p.skillCd<=0&&!p.charging){if(s.ws)activateWeaponSkill(w,p);else if(s.skill)playerSkill(w,p);}
  if(inp.heal&&!p.charging){
    const id=ITEM_ORDER[p.sel],c=DATA.consumables[id];
    if((p.bag[id]||0)<=0)emit(w,{type:'info',pid:p.id,text:c.name+'を持っていません'});
    else if(c.effect.type==='heal'&&!c.effect.radius&&p.hp>=s.maxHp&&!(p.poisonT>0)&&!(p.curseT>0))emit(w,{type:'info',pid:p.id,text:'体力は満タンです'});
    else if(c.effect.type==='place'&&c.effect.kind==='heal'&&(w.placed.some(o=>o.kind==='heal'&&o.owner===p.id&&!o.done)||(p.using&&p.using.item===id)))emit(w,{type:'info',pid:p.id,text:'癒しの香は効果が切れるまで置けません'});
    else if(p.potionCd<=0){
      p.using={item:id,t:0,total:Math.max(P.minItemDelay,c.delay+s.itemDelayAdj)};
      emit(w,{type:'itemStart',pid:p.id,x:p.x,y:p.y,item:id});
    }
  }
}
/** 解毒：毒・麻痺・睡眠・呪いを治す。治したら true */
function cureStatus(w,p){
  if(!(p.poisonT>0||p.curseT>0||p.paraT>0||p.sleepT>0))return false;
  p.poisonT=0;p.poisonTick=0;p.poisoned=0;p.curseT=0;p.paraT=0;p.sleepT=0;
  emit(w,{type:'status',pid:p.id,x:p.x,y:p.y-34,text:'解毒！',color:'#9ff0d0'});
  return true;
}
/** アイテムの効果を出す（範囲付きなら範囲内の生きている味方全員） */
function applyItem(w,p,id){
  const c=DATA.consumables[id],ef=c.effect,ip=1+(p.stats.itemPowerPct||0)/100;
  const radius=ef.radius&&ef.type!=='flash'?ef.radius*ip:ef.radius; // アイテム使用強化：角笛・香の範囲（閃光玉は対象外）
  const targets=radius?Object.values(w.players).filter(q=>!q.dead&&Math.hypot(q.x-p.x,q.y-p.y)<=radius):[p];
  if(radius)emit(w,{type:'itemArea',x:p.x,y:p.y,r:radius,color:c.color});
  for(const q of targets){
    if(ef.type==='heal'){
      const hl=Math.round(q.stats.maxHp*ef.ratio*(p.stats.healMult||1)*(wsActive(p,'medic')?1.5:1));
      // 回復薬・良い回復薬は半分をその場で、残り半分を1秒後に回復する
      const split=!radius&&(id==='potion'||id==='good_potion');
      const now=split?Math.floor(hl/2):hl;
      q.hp=Math.min(q.stats.maxHp,q.hp+now);
      emit(w,{type:'heal',x:q.x,y:q.y-20,amount:now});
      if(split&&hl-now>0)(q.pendingHeals=q.pendingHeals||[]).push({t:1,amt:hl-now});
      // 回復薬は状態異常を治さない（解毒薬の役目）。良い回復薬・癒しの香は治す
      if(id!=='potion'&&(q.poisonT>0||q.curseT>0)){q.poisonT=0;q.curseT=0;emit(w,{type:'status',pid:q.id,x:q.x,y:q.y-34,text:'状態異常が治った',color:'#7fe09a'});}
      // 片手剣の「医療の心得」中の回復薬：効果の半分を近くの味方（220の範囲）にも
      if(id==='potion'&&q===p&&wsActive(p,'medic')){const share=Math.round(hl/2);for(const id2 in w.players){const a=w.players[id2];if(a===p||a.dead||Math.hypot(a.x-p.x,a.y-p.y)>220)continue;a.hp=Math.min(a.stats.maxHp,a.hp+share);emit(w,{type:'heal',x:a.x,y:a.y-20,amount:share});}}
    }else if(ef.type==='cure'){
      cureStatus(w,p);
    }else if(ef.type==='coat'){
      q.coat={status:ef.status,shots:ef.shots};
      emit(w,{type:'info',pid:q.id,text:`${c.short}を装填（矢${ef.shots}本）`});
    }else if(ef.type==='buff'){
      q.buffs[ef.stat]={pct:ef.pct,t:ef.time*ip,total:ef.time*ip};
      emit(w,{type:'buff',pid:q.id,x:q.x,y:q.y-24,stat:ef.stat,pct:ef.pct,color:c.color});
    }
  }
  if(ef.type==='flash'){
    emit(w,{type:'flash',x:p.x,y:p.y,r:ef.radius});
    for(const e of w.enemies){
      if(e.dead||e.state==='sleep'||Math.hypot(e.x-p.x,e.y-p.y)>ef.radius||!lineOfSight(w.map,p.x,p.y,e.x,e.y))continue;
      e.blindT=(e.boss?ef.boss*bossResFactor(e,'flash'):ef.minion);bossResHit(e,'flash');e.wanderA=rand(0,TAU);
      cancelEnemyAction(w,e);
      emit(w,{type:'blinded',x:e.x,y:e.y-e.r-10});
    }
  }else if(ef.type==='place'){
    w.placed.push({id:w.nextId++,kind:ef.kind,item:id,x:p.x,y:p.y,t:0,r:ef.r,owner:p.id,done:false});
    emit(w,{type:'placed',kind:ef.kind,x:p.x,y:p.y});
  }
}
/** 敵の攻撃動作を取り消す（閃光・罠で動きを止めたとき） */
function cancelEnemyAction(w,e){
  w.telegraphs=w.telegraphs.filter(t=>t.owner!==e.id);
  const ai=DATA.enemies[e.type].ai;
  if(['windup','aim','charge','recover','dash','hop','rest','channel'].includes(e.state))e.state=e.boss?'chase':(ai==='archer'||ai==='shaman'?'move':'chase');
  e.action=null;e.z=0;e.cast=null;
}
/** 罠で動きを止める。ボスは同じ罠を何度も受けると効き目が短くなる */
function holdEnemy(w,e,sec,kind){
  if(e.boss){e.trapCount=(e.trapCount||0)+1;sec*=Math.pow(0.75,e.trapCount-1);}
  e.trapT=Math.max(e.trapT||0,sec);e.trapKind=kind;e.blindT=0;
  cancelEnemyAction(w,e);
  emit(w,{type:'trapped',kind,x:e.x,y:e.y,boss:e.boss,name:DATA.enemies[e.type].name,sec:Math.round(sec*10)/10});
}
/** 設置物（罠・爆弾）の処理 */
function updatePlaced(w,dt){
  for(const o of w.placed){
    o.t+=dt;
    const ef=DATA.consumables[o.item].effect;
    if(o.kind==='bomb'){
      if(o.t>=ef.fuse){
        o.done=true;
        emit(w,{type:'explode',x:o.x,y:o.y,r:ef.area});
        const owner=w.players[o.owner];
        for(const e of w.enemies){
          if(e.dead||Math.hypot(e.x-o.x,e.y-o.y)>ef.area+e.r)continue;
          const dmg=Math.round(ef.dmg*(0.9+0.6*(w.diff.level-1))*rand(0.95,1.05));
          e.hp-=dmg;e.hurt=0.2;e.aggro=true;
          emit(w,{type:'damage',target:'enemy',x:e.x,y:e.y-e.r,amount:dmg,crit:false});
          if(e.boss&&e.state==='sleep')triggerBoss(w);
          if(e.hp<=0)killEnemy(w,e);
        }
        for(const id in w.players){const q=w.players[id];const d=Math.hypot(q.x-o.x,q.y-o.y);
          if(!q.dead&&d<ef.area+q.r){const a=Math.atan2(q.y-o.y,q.x-o.x);q.kx=Math.cos(a)*420;q.ky=Math.sin(a)*420;q.charging=false;}}
      }
      continue;
    }
    // 癒しの香：10秒間、範囲の味方を1秒ごとに最大HPの10%回復（毒と呪いも治る）
    if(o.kind==='heal'){
      if(o.t>=ef.life){o.done=true;continue;}
      o.acc=(o.acc||0)+dt;
      while(o.acc>=1){
        o.acc-=1;
        const owner=w.players[o.owner],mul=owner?(owner.stats.healMult||1)*(wsActive(owner,'medic')?1.5:1):1;
        for(const id in w.players){const q=w.players[id];if(q.dead||Math.hypot(q.x-o.x,q.y-o.y)>=o.r)continue;
          // 癒しの香が重なっても、味方は1秒に1回分しか回復しない（効果は重ならない）
          if(q.incHealT!==undefined&&w.time-q.incHealT<0.95)continue;
          q.incHealT=w.time;
          const hl=Math.round(q.stats.maxHp*ef.rate*mul);
          q.hp=Math.min(q.stats.maxHp,q.hp+hl);
          emit(w,{type:'heal',x:q.x,y:q.y-20,amount:hl});
          if(q.poisonT>0||q.curseT>0){q.poisonT=0;q.curseT=0;emit(w,{type:'status',pid:q.id,x:q.x,y:q.y-34,text:'状態異常が治った',color:'#7fe09a'});}
        }
      }
      continue;
    }
    if(o.t<ef.arm)continue; // 設置してすぐは作動しない
    const victim=w.enemies.find(e=>!e.dead&&e.state!=='sleep'&&!(e.trapT>0)&&Math.hypot(e.x-o.x,e.y-o.y)<o.r+e.r*0.9); // 体が罠に重なったら作動
    if(!victim)continue;
    o.done=true;
    if(o.kind==='pit'){victim.x=o.x;victim.y=o.y;holdEnemy(w,victim,victim.boss?ef.boss:ef.minion,'pit');}
    else if(o.kind==='shock'){
      emit(w,{type:'shock',x:o.x,y:o.y,r:ef.area});
      for(const e of w.enemies)if(!e.dead&&e.state!=='sleep'&&Math.hypot(e.x-o.x,e.y-o.y)<ef.area+e.r)holdEnemy(w,e,e.boss?ef.boss:ef.minion,'shock');
    }
  }
  w.placed=w.placed.filter(o=>!o.done);
}
/** チャージ時間から段階を求める（0=ため無し）。最大は3段階で、溜めすぎても威力は変わらない */
function chargeLevel(c,t){
  let lv=0;for(let i=0;i<c.levels.length;i++)if(t>=c.levels[i])lv=i+1;
  return lv;
}
/** 弓：矢を1本撃つ（瓶を装填していれば、その状態異常を付ける） */
function fireArrow(w,p,opt){
  const s=p.stats,bw=DATA.weaponTypes[s.weaponType].bow,a=p.facing,lv=(opt&&opt.level)||0;
  const coat=p.coat&&p.coat.shots>0?p.coat:null;
  w.projectiles.push({id:w.nextId++,kind:'playerArrow',owner:'player',pid:p.id,x:p.x+Math.cos(a)*16,y:p.y+Math.sin(a)*16,
    vx:Math.cos(a)*bw.speed,vy:Math.sin(a)*bw.speed,angle:a,r:7,life:bw.life,hit:new Set(),status:coat?coat.status:null,mult:(opt&&opt.mult)||1});
  if(coat){coat.shots--;if(coat.shots<=0){p.coat=null;emit(w,{type:'info',pid:p.id,text:'瓶の中身がなくなった'});}}
  emit(w,{type:'swing',pid:p.id,combo:false,level:lv,x:p.x,y:p.y,w:s.weaponType});
}
/** 手裏剣の1枚を投げる（今の位置・向きから。飛ぶ距離は武器のリーチ range） */
function spawnShurikenShot(w,p,a,off,mult){
  const wt=DATA.weaponTypes[p.stats.weaponType],sh=wt.shuriken,nx=-Math.sin(a),ny=Math.cos(a);
  w.projectiles.push({id:w.nextId++,kind:'playerShuriken',owner:'player',pid:p.id,x:p.x+Math.cos(a)*16+nx*off,y:p.y+Math.sin(a)*16+ny*off,
    vx:Math.cos(a)*sh.speed,vy:Math.sin(a)*sh.speed,angle:a,r:7,life:wt.range/sh.speed,hit:new Set(),status:null,mult:mult||1});
}
/** 手裏剣：2枚を横にずらし、シュッ…シュッと少し間をあけて投げる（間隔は gap 秒）。飛ぶ距離は武器のリーチ（range） */
function fireShuriken(w,p,opt){
  const s=p.stats,wt=DATA.weaponTypes[s.weaponType],sh=wt.shuriken,a=p.facing;
  const mult=(opt&&opt.mult)||1;
  if(!w.pendingShots)w.pendingShots=[];
  for(let i=0;i<sh.shots;i++){
    const off=(i-(sh.shots-1)/2)*sh.side;
    if(i===0)spawnShurikenShot(w,p,a,off,mult);
    else w.pendingShots.push({t:i*(sh.gap||0),pid:p.id,a,off,mult});
  }
  emit(w,{type:'swing',pid:p.id,combo:false,level:0,x:p.x,y:p.y,w:s.weaponType});
}
function playerAttack(w,p,opt){
  const s=p.stats;
  p.atkTimer=s.attackInterval;
  p.swingTotal=Math.min(s.swingTime,s.attackInterval*0.9);p.swing=p.swingTotal;
  p.swingAngle=p.facing;p.swingDir=-p.swingDir;p.combo++;p.lastLevel=opt.level||0;
  if(DATA.weaponTypes[s.weaponType]&&DATA.weaponTypes[s.weaponType].bow){fireArrow(w,p,opt);return;}
  if(DATA.weaponTypes[s.weaponType]&&DATA.weaponTypes[s.weaponType].shuriken){fireShuriken(w,p,opt);return;}
  const third=!!s.effects.combo&&p.combo%3===0;
  w.attacks.push({id:w.nextId++,pid:p.id,angle:p.facing,range:s.range,arc:s.arc,life:s.activeTime,hit:new Set(),tip:s.tip,
    mult:(opt.mult||1)*(third?1.6:1),stunMult:opt.stunMult||1});
  emit(w,{type:'swing',pid:p.id,combo:third,level:opt.level||0,x:p.x,y:p.y,w:s.weaponType});
}
/** Qキーのスキル（武器種に skill が設定されているときだけ使える） */

function playerSkill(w,p){

function updateAttacks(w,dt){
  for(const a of w.attacks){
    const p=w.players[a.pid];a.life-=dt;
    if(!p||p.dead){a.life=0;continue;}
    for(const e of w.enemies){
      if(e.dead||a.hit.has(e.id))continue; // 同じ攻撃判定で同じ敵に多段ヒットしない
      const hit=meleePart(e,p,a);if(!hit)continue; // ボスは部位ごとの当たり判定（1回の攻撃で当たるのは1か所）
      const d=Math.hypot(hit.x-p.x,hit.y-p.y);
      if(!lineOfSight(w.map,p.x,p.y,hit.x,hit.y)&&!lineOfSight(w.map,p.x,p.y,e.x,e.y))continue; // 壁越しには当たらない
      a.hit.add(e.id);
      let mult=a.mult;
      if(a.tip){const f=clamp(Math.max(0,d-hit.r)/a.range,0,1);mult*=a.tip.min+(a.tip.max-a.tip.min)*f;} // ランス：先端ほど強い
      damageEnemy(w,p,e,mult,{stunMult:a.stunMult,hit});
      const fw=DATA.weaponTypes[p.stats.weaponType];
      if(fw&&fw.flow&&!a.flowed){a.flowed=true;const before=p.flow;p.flow=Math.min(fw.flow.max,p.flow+1);p.flowT=fw.flow.keep;
        if(p.flow===fw.flow.max&&before<fw.flow.max)emit(w,{type:'flowMax',pid:p.id,x:p.x,y:p.y-24});}
    }
  }
  w.attacks=w.attacks.filter(a=>a.life>0);
}

/* ---------- 敵 ---------- */
function alertNearby(w,e){for(const o of w.enemies)if(!o.boss&&!o.aggro&&Math.hypot(o.x-e.x,o.y-e.y)<220)o.aggro=true;}
/** 障害物にハマって動けなくなった敵を、近くの通れる場所へずらす。
    追いかけるべき相手が近くにいるのに、1.2秒ほとんど動けないときだけ働く（壁抜けしないよう、見通せる場所を優先） */
function unstickEnemy(w,e,dt){
  const MOVING={chase:1,move:1,orbit:1,retreat:1,pounce:1,dash:1};
  const moving=!e.state||!!MOVING[e.state];
  if(e._ux===undefined){e._ux=e.x;e._uy=e.y;e._ut=0;}
  const moved=Math.hypot(e.x-e._ux,e.y-e._uy);
  if(!moving||moved>4){e._ux=e.x;e._uy=e.y;e._ut=0;return;}
  let tgt=null,best=1e9;
  for(const p of Object.values(w.players)){if(p.dead)continue;const d=Math.hypot(p.x-e.x,p.y-e.y);if(d<best){best=d;tgt=p;}}
  if(!tgt||best>700||best<e.r+tgt.r+8){e._ut=0;e._ux=e.x;e._uy=e.y;return;}
  e._ut+=dt;
  if(e._ut<1.2)return;
  e._ut=0;e._ux=e.x;e._uy=e.y;
  let pick=null,pickScore=1e9,anyPick=null,anyScore=1e9;
  for(let R=28;R<=180&&!pick&&!anyPick;R+=38){
    for(let i=0;i<16;i++){
      const a=i/16*TAU,nx=e.x+Math.cos(a)*R,ny=e.y+Math.sin(a)*R;
      if(circleHitsWall(w.map,nx,ny,e.r))continue;
      const sc=Math.hypot(nx-tgt.x,ny-tgt.y);
      if(lineOfSight(w.map,e.x,e.y,nx,ny)){if(sc<pickScore){pickScore=sc;pick={x:nx,y:ny};}}
      else if(sc<anyScore){anyScore=sc;anyPick={x:nx,y:ny};}
    }
  }
  const to=pick||anyPick;
  if(to&&!cannotEnter(w.map,e,to.x,to.y)){e.x=to.x;e.y=to.y;}
}
/** 最初の部屋（スタート部屋）にいるあいだは、敵に見つからない。誰かが部屋から出たら以後ずっと解除 */
/** 敵から見つからないか（最初の部屋の隠密、または武器スキル「隠密」） */
function playerUnseen(w,p){return wsActive(p,'inmitsu')||playerHidden(w,p);}
function playerHidden(w,p){
  if(w.leftStart||!w.map.rooms||!w.map.rooms.start)return false;
  return inStartRoom(w.map,p.x,p.y,p.r);
}
function updateEnemy(w,e,dt){
  if(e.slowT>0){e.slowT-=dt;dt*=0.5;} // 鈍足：動きも攻撃の準備も半分の速さ
  e.anim+=dt;e.hurt-=dt;e.cd-=dt;e.cd2-=dt;e.cd3-=dt;e.stun-=dt;e.hitAccT=(e.hitAccT||0)-dt;
  // 呪術師の強化が切れたら元に戻す
  if(e.empowerT>0){e.empowerT-=dt;if(e.empowerT<=0){e.atk=e.baseAtk;e.speed=e.baseSpeed;}}
  if(e.kx||e.ky){moveEntity(w.map,e,e.kx*dt,e.ky*dt);e.kx*=0.82;e.ky*=0.82;if(Math.abs(e.kx)+Math.abs(e.ky)<5)e.kx=e.ky=0;}
  if(e.flinchT>0){e.flinchT-=dt;return;} // 怯み：少しの間、動きも攻撃も止まる
  // ボスが弱ってきたら知らせる（体力は見えないので、これが目安）
  if(e.boss&&!e.weakNoticed&&e.hp<=e.maxHp*0.2){e.weakNoticed=true;emit(w,{type:'bossWeak',x:e.x,y:e.y,name:DATA.enemies[e.type].name});}
  // 罠にかかっている間は動けない

/** 固定の遠距離型（動かない花）：狙いを定めて撃つ。花粉（ダメージなし）は麻痺だけ */

function updateArcher(w,e,p,d,dt){

    e.timer-=dt;
    if(e.timer>0.28)e.atkAngle=ang; // 発射直前は狙いを固定（見てから避けられる）

        vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:5,life:2,dmg:e.atk,angle:a,slow:DATA.enemies[e.type].web}); // 蜘蛛の糸は鈍足

function startCharge(w,e,ang,wind,chained){

const WOLF_MOVES=['bite','charge','slam'];

      }else if(d>150&&d<520&&e.cds.charge<=0&&lineOfSight(w.map,e.x,e.y,p.x,p.y)){

/** 技の並べ方で動くボス（沼地のボス）。使える技から順番に選ぶ。体力が半分で怒る */
function patternReady(w,e,mv,d,los){
  if(mv.below&&e.hp>e.maxHp*mv.below)return false; // HPがこの割合を下回ったときだけ使う
  switch(mv.k){
    case 'toss':return los&&d<700;
    case 'erupt':return d<520;
    case 'crack':return d>100&&d<520&&los;
    case 'sweep':return d<mv.r*0.9+e.r;
    case 'slam':return d<mv.r*0.8;
    case 'charge':return d>140&&d<480&&los;
    case 'shot':return los&&d>90&&d<650;
    case 'pool':return d<520;
    case 'burrow':return d<700;
    case 'swarm':return w.enemies.filter(x=>!x.dead&&x.type===mv.kind).length<(mv.max||4);
  }
  return false;
}

function updateBossPattern(w,e,p,dt){

    case 'charge':{
      const sp=(ph2?760:660)*dt,dmg=e.atk*((e.curMv&&e.curMv.dmg)||1.3);
      const blocked=moveEntity(w.map,e,Math.cos(e.atkAngle)*sp,Math.sin(e.atkAngle)*sp);
      e.chargeLeft-=sp;
      for(const id in w.players){const q=w.players[id];if(q.dead||e.hitSet.has(q.id))continue;
        if(Math.hypot(q.x-e.x,q.y-e.y)<e.r+q.r+4){e.hitSet.add(q.id);hitPlayer(w,q,dmg,e.x,e.y,e.type,e.curMv&&e.curMv.el,e.curMv&&e.curMv.st);}}
      if(blocked||e.chargeLeft<=0){
        if(blocked)emit(w,{type:'bump',x:e.x,y:e.y});
        e.state='recover';e.timer=(blocked?1.1:0.6)+BOSS_REST_OF(e);
      }
      break;
    }
    case 'recover':e.timer-=dt;if(e.timer<=0)e.state='chase';break;
    case 'burrow':{ // 地中に潜る：見えず、攻撃も届かない。終わると、プレイヤーの足元から飛び出して円で攻撃する
      e.timer-=dt;e.hidden=true;
      if(e.timer>0)break;
      const mv=e.curMv||{},R=mv.r||90;
      if(!cannotEnter(w.map,e,p.x,p.y)){e.x=p.x;e.y=p.y;}
      e.hidden=false;
      addTelegraph(w,{shape:'circle',x:e.x,y:e.y,r:R,total:0.5,dmg:e.atk*(mv.dmg||1.4),owner:e.id,el:mv.el,st:mv.st});
      emit(w,{type:'roarWave',x:e.x,y:e.y,r:R});
      e.state='recover';e.timer=(0.9)+BOSS_REST_OF(e);
      break;
    }
  }
}
/** 草原の暴角獣：角なぎ・突進・踏みつけ。体力が半分を切ると怒り、突進の間隔が短くなる */
function updateBull(w,e,p,dt){
  const ph2=e.phase===2,def=DATA.enemies[e.type],rc=ph2?0.7:1;
  if(e.cds.stomp===undefined)e.cds.stomp=2; // 踏みつけは初回の出し方を遅らせる
  for(const k in e.cds)e.cds[k]-=dt;
  if(e.state==='sleep')return;
  if(e.state==='stunned'){e.timer-=dt;if(e.timer<=0){e.state='recover';e.timer=0.3;}return;}
  if(e.phase===1&&e.hp<=e.maxHp*0.5&&e.state!=='charge'&&e.state!=='roar'){
    e.phase=2;e.state='roar';e.timer=1.0;e.speed=def.speed*1.2;
    w.telegraphs=w.telegraphs.filter(t=>t.owner!==e.id);
    emit(w,{type:'enrage',x:e.x,y:e.y,name:def.name});
    return;
  }
  const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy),ang=Math.atan2(dy,dx);
  switch(e.state){
    case 'roar':e.timer-=dt;if(e.timer<=0)e.state='chase';break;
    case 'chase':{
      e.facing=ang;
      const reach=e.r+p.r+40;
      if(d<reach+26&&e.cds.sweep<=0){ // 角なぎ：前方の扇形
        e.state='windup';e.action='sweep';e.timer=ph2?0.5:0.7;e.atkAngle=ang;
        addTelegraph(w,{shape:'sector',x:e.x,y:e.y,angle:ang,r:e.r+96,arc:Math.PI*0.9,total:e.timer,dmg:e.atk*1.1,owner:e.id});
      }else if(d>140&&d<480&&e.cds.charge<=0&&lineOfSight(w.map,e.x,e.y,p.x,p.y)){ // 突進
        startCharge(w,e,ang,ph2?0.55:0.8,false);
      }else if(d<220&&e.cds.stomp<=0){ // 踏みつけ：足元の円
        e.state='windup';e.action='stomp';e.timer=ph2?0.7:0.95;
        addTelegraph(w,{shape:'circle',x:e.x,y:e.y,r:120,total:e.timer,dmg:e.atk*1.2,owner:e.id});
      }else if(d>170)steerTo(w,e,p,e.speed,dt); // 近づきすぎず、突進の間合いを保つ
      else if(d<130)moveEntity(w.map,e,-Math.cos(ang)*e.speed*dt*0.6,-Math.sin(ang)*e.speed*dt*0.6);
      break;
    }
    case 'windup':
      e.timer-=dt;
      if(e.timer<=0){
        if(e.action==='charge'){e.state='charge';e.chargeLeft=440;e.hitSet=new Set();}
        else if(e.action==='stomp'){e.state='recover';e.timer=(0.6)+BOSS_REST_OF(e);e.cds.stomp=(ph2?3.5:5)*rc;emit(w,{type:'roarWave',x:e.x,y:e.y,r:120});}
        else{e.state='recover';e.timer=(0.55)+BOSS_REST_OF(e);e.cds.sweep=(ph2?2.4:3.4)*rc;moveEntity(w.map,e,Math.cos(e.atkAngle)*12,Math.sin(e.atkAngle)*12);}
      }
      break;
    case 'charge':{
      const sp=(ph2?760:660)*dt;
      const blocked=moveEntity(w.map,e,Math.cos(e.atkAngle)*sp,Math.sin(e.atkAngle)*sp);
      e.chargeLeft-=sp;
      for(const id in w.players){const q=w.players[id];if(q.dead||e.hitSet.has(q.id))continue;
        if(Math.hypot(q.x-e.x,q.y-e.y)<e.r+q.r+4){e.hitSet.add(q.id);hitPlayer(w,q,e.atk*1.4,e.x,e.y,e.type);}}
      if(blocked||e.chargeLeft<=0){
        if(blocked)emit(w,{type:'bump',x:e.x,y:e.y});
        e.state='recover';e.timer=(blocked?1.1:0.6)+BOSS_REST_OF(e);e.cds.charge=(ph2?3.4:5.2)*rc;
      }
      break;
    }
    case 'recover':e.timer-=dt;if(e.timer<=0)e.state='chase';break;
  }
}
/** 森狼：追いかけて、少し離れた位置から一直線に突進する。近ければ噛みつく */
function updateDasher(w,e,p,d,dt){

  if(e.state==='recover'){e.timer-=dt;if(e.timer<=0)e.state='chase';return;}
